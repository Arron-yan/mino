心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-21","title":"同一企业不同地点不同行业的项目可否设两套预案体系？","consult":"如一个企业有两个项目，位于不同地理位置，行业类型也不一致，可以有两套不同的预案体系吗？","reply":"已电话沟通解答。根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第十二条规定“生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案，并体现自救互救和先期处置等特点。”你单位应按照规定，结合企业实际特点，确定本企业的预案体系。原则上两个项目的应急预案都属于你企业预案体系的组成部分。","consultTime":"2025-11-13","replyTime":"2025-11-20","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-22","title":"机械企业涉及铸造是否需建立应急值班制度？","consult":"应急部领导您好！生产安全事故应急预案管理办法第三十三条  生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。企业预案包括综合预案、专项预案、现场处置方案。查阅企业资料，编制的应急演练计划只有专项和现场处置，是否可以专项演练内容包括综合预案，或只演练专项预案即符合要求。","reply":"已电话沟通解答。您好！依据《生产安全事故应急演练基本规范》（AQ/T9007-2019），应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的演练可相互组合。根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十三条针对预案演练的相关规定，是对演练频次的最低要求，请贵单位正确理解演练的定义，结合本单位的事故风险特点，统筹考虑确定各类预案演练的频次，灵活采用不同形式，安排不同演练内容，针对性开展应急预案演练，确保各项预案演练均符合规定并取得实效。如地方另有规定的请参照执行。","consultTime":"2024-03-25","replyTime":"2024-03-27","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-23","title":"城市轨道交通运营企业应急预案评审有何特殊要求？","consult":"您好，请问城市轨道交通运营企业编制的综合应急预案、专项应急预案、现场处置方案是否需要进行外部专家评审工作？谢谢。","reply":"已电话沟通解答。您好，《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）第二十一条规定“矿山、金属冶炼企业和易燃易爆物品、危险化学品的生产、经营（带储存设施的，下同）、储存、运输企业，以及使用危险化学品达到国家规定数量的化工企业、烟花爆竹生产、批发经营企业和中型规模以上的其他生产经营单位，应当对本单位编制的应急预案进行评审，并形成书面评审纪要。前款规定以外的其他生产经营单位可以根据自身需要，对本单位编制的应急预案进行论证。”请对照该条款，结合企业实际开展预案评审或论证。如所在地方或者行业主管部门另有规定的，请参照执行。","consultTime":"2024-11-13","replyTime":"2024-11-18","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-24","title":"专项应急预案演练次数如何规定？","consult":"您好，专项应急预案每年演练一次，现场处置方案每半年演练一次，公司有8个专项应急预案是否1年内要全部演练这8个专项应急预案，10个现场处置方案是否每半年全部演练一次，另，应急预案由总公司编制，下面有8个分厂，是否8个分厂都分别需要对这18个应急预案在规定时间内进行演练，这样分配下来基本上每个月会有2-3个演练。","reply":"《生产安全事故应急预案管理办法》（应急部令第2号）对应急预案的实施有明确规定，可根据《生产安全事故应急预案管理办法》及地方相关规定，结合企业实际风险特点开展不同形式应急预案的实施工作。","consultTime":"2023-02-22","replyTime":"2023-02-22","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-25","title":"应急预案中生产安全事故风险评估后的类型是否都需要编制专项和现场处置方案？","consult":"请问领导，关于应急预案中生产安全事故风险评估报告分析出来的多种事故风险类型，如机械、车辆、触电、灼烫、物体打击等十余种，举例：像灼烫只有一个罐体表面温度过高，且已经采取张贴警示标识等安全防护措施，经过分析以后判定事故发生的可能性极低，那么可以只纳入到综合应急预案吗，发生事故后采取综合应急预案内的处置措施进行处置，不在单独编制专项或者现场处置方案。","reply":"已电话沟通解答。您好，《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）第十二条规定“生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案，并体现自救互救和先期处置等特点。”贵单位应遵循以人为本、依法依规、符合实际、注重实效的原则，在事故风险辨识、评估和应急资源调查的基础上，结合实际编制应急预案即可。如地方另有规定的请参照执行。","consultTime":"2024-07-24","replyTime":"2024-07-26","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-26","title":"生产安全事故应急预案中辨识的风险是否都需编制对应的专项预案和现场处置方案？","consult":"公司在编制生产安全事故应急预案时，辨识出了坍塌和机械伤害的风险，针对坍塌和机械伤害风险在预案文本特种设备事故专项应急预案中以及综合预案中指明了处置措施，还需要单独编制坍塌和机械伤害专项预防或现场处置方案吗？","reply":"已电话沟通解答。你好，《特种设备安全监察条例》（国务院令第549号）第六十五条规定，特种设备使用单位应当制定事故应急专项预案，并定期进行事故应急演练。同时，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第十二条规定“生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案”。第十三条至十六条对生产经营单位不同类型的应急预案进行了详细阐述。请你单位根据企业实际确立本单位的应急预案体系，编制应急预案。","consultTime":"2024-03-21","replyTime":"2024-03-25","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-27","title":"应急预案中的组织指挥体系未变但附件更新，是否需要重新备案？","consult":"我单位应急预案是2021年编制，并到当地应急局备案，但2023年主要负责人及其他成员部分发生变更，除此之外无其他变化，2023年、2024年均做出修订，请问在对应急预案进行修订时，修订内容是否涉及2号令第37条所述内容，是否需要对应急预案进行重新备案呢？","reply":"您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十七条规定，应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照本办法规定的应急预案编制程序进行，并按照有关应急预案报备程序重新备案。实施上条规定，需准确把握“组织指挥体系与职责”等变更情形。理解把握这些变更情形，可参考应急预案评估相关标准中的内容。依据《生产经营单位生产安全事故应急预案评估指南》（AQ/T 9011-2019），应急组织机构与职责方面的评估内容，主要包括：生产经营单位组织体系是否发生变化、应急处置关键岗位应急职责是否调整、重点部门应急职责与分工是否重新划分等。依据上述规章和标准规定，你单位主要负责人及其他成员部分发生变更，若同时不涉及单位组织指挥体系变化、有关职责调整内容的，则不属于需要应急预案重新备案的情形。","consultTime":"2024-03-13","replyTime":"2024-03-15","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-28","title":"编制应急预案时是否必须列出编制依据？","consult":"根据GB29639-2020,企业在编制应急预案时需要收集适用的法律法规，国家标准，行业标准及地方性标准等，那么在编制预案时，是否需要添加编制依据这一单元，目前在检查中，有专家提出了编制的应急预案不需要体现编制依据。那么请教一下，如果加入了编制依据是否为不合格预案，或者不完善应急预案。","reply":"你好，目前《生产安全事故应急预案管理办法》（应急管理部令第2号）第八条规定生产安全事故应急预案的编制应符合有关法律、法规、规章和标准规定等基本要求。《生产经营单位生产安全事故应急预案编制导则》（GB/T 29639-2020）“4.3资料收集”中明确应急预案编制工作组应当收集适用的法律法规、部门规章、地方性法规和政府规章、技术标准既规范性文件等相关资料。两者均未明确说明预案内容需要包含编制依据。你单位应当遵循以人为本、依法依规、符合实际、注重实效原则编制生产安全事故应急预案。如地方另有规定的，请参照执行。","consultTime":"2023-11-11","replyTime":"2023-11-16","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-29","title":"已按旧导则编制且备案的预案，新导则实施后是否需要重新编制备案？","consult":"1. 新的应急预案编制导则GB/T29639-2020已经发布，将于2021年4月1日实施，请问在2020年上半年编制的应急预案按照GB/T29639--2013编制的，是否需要在2021年4月1日后重新编制。2. 危险化学品无储存经营单位，只从事票据业务，不参与危化品的装卸和运输环节。这样企业编制的预案需要不需要备案3. 以上两个问题，请领导答复需要还是不需要即可，不用明确标准依据，谢谢领导。","reply":"原则上不需要重新编制，企业可根据新导则的要求酌情进行适当的更新补充，可增加修订页等部分内容，或者在原预案发布3年内适当提前启动修订工作。","consultTime":"2021-01-16","replyTime":"2021-01-19","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-30","title":"组织架构调整可否跳过预案评估直接修订备案？","consult":"《生产安全事故应急预案管理办法》第三十五条应急预案编制单位应当建立应急预案定期评估制度，并对应急预案是否需要修订作出结论。 应当每三年进行一次应急预案评估。 第四十五条生产经营单位有下列情形之一的，可以处1万元以上3万元以下罚款：四未按照规定开展应急预案评估的； 请问，由于组织架构调整，是否可以不组织三年一次的应急预案评估，直接开展应急预案修订、评审、发布、备案等工作？","reply":"已电话沟通解答。对应急预案开展评估的目的是明确当前预案是否需要开展修订工作。根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十七条规定，应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照本办法规定的应急预案编制程序进行，并按照有关应急预案报备程序重新备案。若你单位因组织架构调整需要对预案进行修订，可直接开展修订工作。如地方另有规定的，请参照执行。","consultTime":"2025-09-17","replyTime":"2025-09-24","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-31","title":"政府编制应急预案时“广泛听取意见”如何落实？","consult":"领导，你好，《突发事件应急预案管理办法》国办发〔2024〕5号第二十二条规定：政府及其有关部门在应急预案编制过程中，应当广泛听取意见。这里的广泛听取意见主要是指听取哪些单位的意见？谢谢。","reply":"《突发事件应急预案管理办法》国办发〔2024〕5号第二十二条规定：政府及其有关部门在应急预案编制过程中，应当广泛听取意见。通常情况下，政府及其部门应急预案应当根据预案种类和实际工作需要，征求预案涉及到的本级有关部门、单位和下一级政府或其相关部门，以及其他相关方和专家等的意见。","consultTime":"2024-10-22","replyTime":"2024-10-24","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-32","title":"多个重大危险源是合并编制一个专项预案还是分别编制？","consult":"你好，我公司属于危险化学品生产企业，我们正在修订应急预案，我想咨询一下，重大危险源专项应急预案是几个重大危险源编制一个专项预案还是每个重大危险源编制一个专项预案。","reply":"已电话沟通解答。《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）规定生产经营单位应急预案分为综合应急预案、专项应急预案和现场处置方案。生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案。如所在行业和地方另有规定的请遵照规定执行。","consultTime":"2025-09-18","replyTime":"2025-09-25","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-33","title":"集团公司无实际经营业务，总部应急预案如何编制？","consult":"本集团公司下属有10多家子公司，并分布在各地市，多家子公司均为独立法人。所有实体业务开展全部在子公司，集团公司法人本身没有实际经营业务。 情况：全部子公司已根据所在行业情况全部独立编制了应急预案，备案。 问题：集团公司应急预案修订应该采取哪种思路？1.需包含所有子公司的风险事故内容 2.仅编制集团公司单独本身事故如办公室火灾事故，在集团预案中通过描述将集团预案与子公司预案相衔接。","reply":"您好。根据应急管理部规章《生产安全事故应急预案管理办法》第十二条规定，生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案，并体现自救互救和先期处置等特点。请你单位根据上述规定，结合相关标准规范和实际工作需要，建立本集团应急预案体系，开展集团公司应急预案修订工作。","consultTime":"2024-12-23","replyTime":"2024-12-27","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-34","title":"应急预案演练次数是否要求危险化学品企业企业每半年至少一次综合或者专项？","consult":"根据《生产安全事故应急预案管理办法》第三十三条规定，应急预案演练次数是否要求危险化学品企业企业每半年至少一次综合或者专项应急演练以及每半年至少一次现场处置方案演练，一年至少演练2次综合或专项，2次现场处置方案。","reply":"已电话沟通解答。应急演练可采用多种演练方法。依据《生产安全事故应急演练基本规范》，应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的演练可相互组合。组织现场处置方案演练，可灵活确定演练内容和形式，一次演练可安排多个现场处置方案演练内容。生产经营单位应根据本单位的事故风险特点，统筹考虑确定现场处置方案等各类预案演练的频次。","consultTime":"2025-09-28","replyTime":"2025-09-29","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-35","title":"危险化学品无储存经营企业（纯经营）是否可以只编制现场处置方案？","consult":"危险化学品无储存经营企业（纯经营），不设置存储或转运场所，通过有资质的运输公司从生产企业运输到使用经营企业，只负责调拨，从业人员一般不超10人。该类企业符合2020年《安全生产法》修正案第七十八条规定的经营企业，又符合《生产安全事故应急预案管理办法》 应急管理部令第2号第十五条规定的危险性小的生产经营单位。请问：该类是否可以只编制现场处置方案？","reply":"可以按照现场处置方案的编制要求和标准编制企业应急预案，备案参照危险化学品经营单位的要求进行管理。","consultTime":"2021-02-05","replyTime":"2021-02-05","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-36","title":"县、镇街人民政府应急预案应依据什么导则编制？","consult":"近期有关部门组织专家对县、镇街人民政府突发事件总体预案及安全生产类、自然灾害类等专项预案进行考核，要求按照《生产经营单位生产安全事故应急预案编制导则》GBT29639-2020进行编制。我们认为要求不正确，县、镇街人民政府不是生产经营单位，其以上预案编制依据应为《中华人民共和国突发事件应对法》、《突发事件应急预案管理办法》国办发〔2013〕101号文。请给予答复，谢谢！","reply":"《生产经营单位生产安全事故应急预案编制导则》（GBT29639－2020）适用范围为生产经营单位，县、镇街人民政府不是生产经营单位，相关应急预案编制不适用于该标准，应按有关法律法规规定和上级人民政府有关规定编制，并与相关预案做好衔接。","consultTime":"2021-09-10","replyTime":"2021-09-17","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-37","title":"县级应急管理局应牵头编制哪些应急预案？","consult":"县级应急管理局应牵头编制哪些应急预案，请列出预案具体名称？","reply":"根据国务院办公厅印发的《突发事件应急预案管理办法》规定，县级以上人民政府及其部门应急预案包括总体应急预案、专项应急预案、部门应急预案等，县级以上人民政府应急管理部门负责指导应急预案管理工作，综合协调应急预案衔接工作。据此，县级应急管理局应当根据本级党委和政府有关规定以及本部门职责范围，牵头编制本地区突发事件总体应急预案和地震、防汛抗旱、森林草原火灾、生产安全事故等专项应急预案，以及本级党委和政府授权编制的其他应急预案。","consultTime":"2025-04-16","replyTime":"2025-04-27","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-38","title":"双控体系中的风险清单是否可以代替应急预案编制前的风险评估报告？","consult":"您好，请问双控体系中有风险分级管控的内容风险清单，是否可以代替应急预案编制前的风险评估？","reply":"《生产安全事故应急预案管理办法》（应急管理部令第2号）第十条规定:“生产安全事故风险辨识、评估，是指针对不同事故种类及特点，识别存在的危险危害因素，分析事故可能产生的直接后果以及次生、衍生后果，评估各种后果的危害程度和影响范围，提出防范和控制事故风险措施的过程”。请根据你单位具体风险清单内容，结合办法条款内容及地方相关规定参照执行。","consultTime":"2023-04-13","replyTime":"2023-04-19","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-39","title":"生产安全事故应急预案以外的预案应该怎么备案？","consult":"除生产安全事故应急预案以外的预案应该怎么备案？如：《公共卫生突发事件专项应急预案》、《公司网络和信息安全专项应急预案》等。","reply":"生产安全事故应急预案以外的预案应该按照相关法律法规等规定，向有关主管部门备案。目前我国生产安全事故应急预案备案，主要依据《生产安全事故应急预案管理办法》。现行的《防震减灾法》《核安全法》《环境保护法》《固体废物污染环境防治法》《大气污染防治法》《水污染防治法》《传染病防治法》《食品安全法》《野生动物保护法》等对相关类型的应急预案备案提出了要求，也明确了相关部门开展应急预案备案的职责。同时，《突发事件应急预案管理办法》对各级各类应急预案备案也有明确规定，应急预案审批单位应当在应急预案印发后的20个工作日内依照下列规定向有关单位备案:地方人民政府总体应急预案报送上一级人民政府备案；地方人民政府专项应急预案抄送上一级人民政府有关主管部门备案；部门应急预案报送本级人民政府备案；涉及需要与所在地政府联合应急处置的中央单位应急预案，应当向所在地县级人民政府备案；法律、行政法规另有规定的从其规定。","consultTime":"2021-01-04","replyTime":"2021-02-23","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-40","title":"应急预案定期评估制度是否必须单独建章？","consult":"安监总局88号文第三十五条“应急预案编制单位应当建立应急预案定期评估制度，对预案内容的针对性和实用性进行分析，并对应急预案是否需要修订作出结论。”这里指的评估制度是指要单独建立《应急预案定期评估制度》，还是可以在其他制度中体现这项内容？比如我们公司制定了《应急预案管理制度》，在里面规定了应急预案的评估等工作，是否要单独再制定《应急预案定期评估制度》？","reply":"应急预案定期评估是应急预案管理工作的重要环节。通过评估，可以检验预案的针对性、实用性和可操作性，实现应急预案的动态优化和科学规范管理。《生产安全事故应急预案管理办法》（应急部令第2号）规定“应急预案编制单位应当建立应急预案定期评估制度”。请按照地方有关规定结合实际执行。","consultTime":"2023-02-16","replyTime":"2023-02-22","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-41","title":"多项预案的演练频次可否理解为总数达标即可？","consult":"《生产安全事故应急预案管理办法》第三十三条“生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练”。是否可以理解为：如果企业安全生产事故应急预案有5个专项应急预案和8个现场处置预案，全年组织不少于1次专项和2次现场处置预案演练即可？不用全部预案都演练？请用通俗易懂的语言解释。盼复。","reply":"你好，《生产安全事故应急预案管理办法》（应急部令第2号）第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。请正确理解演练的定义，综合预案、专项预案和现场处置方案的演练可以同时开展。企业应根据自身实际，结合地方有关规定，灵活采用桌面演练、实战演练、专项演练、综合演练等形式，有针对性的组织开展应急预案演练，提高应急处置能力。","consultTime":"2023-09-14","replyTime":"2023-09-18","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-42","title":"应急预案演练的次数具体是怎么规定的？","consult":"我是电力建设行业，咨询一下：举例我这里有10份专项应急预案，每半年进行一次专项应急预案演练是指，半年我至少演练一次，还是说每份专项应急预案至少演练一次？","reply":"您好！根据应急管理部规章《生产安全事故应急预案管理办法》第三十三条规定，生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或专项应急预案演练，每半年至少组织一次现场处置方案演练。这是对生产经营单位年度演练频次的最低要求。生产经营单位应结合《生产安全事故应急预案管理办法》和行业、地方的相关规定，根据本单位的事故风险特点确定演练频次，确保演练取得实效。","consultTime":"2025-01-02","replyTime":"2025-01-06","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-43","title":"地方应急办法的演练要求是否满足部令第2号第三十三条？","consult":"您好：《山东省生产安全事故应急办法》第十三条“高危和人员密集单位应当每半年至少组织1次综合或者专项应急预案演练，每2年对所有专项应急预案至少组织1次演练，每半年对所有现场处置方案至少组织1次演练。”该办法对应急预案演练的要求，能否满足《生产安全事故应急预案管理办法》第三十三条中对应急预案演练的要求？感谢回复！","reply":"你好，《生产安全事故应急预案管理办法》（应急部令第2号）第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最基本要求。如地方另有规定，请结合实际，参照地方有关规定执行。","consultTime":"2023-06-06","replyTime":"2023-06-12","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-44","title":"GB 6441-2025实施后原预案是否需要立即修订？","consult":"GB6441-2025实施后，现在企业做的应急预案里面所述的事故类型已经不符合标准所列了，但企业的组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容未发生变化，按照《生产安全事故应急预案管理办法》第三十六条第一款要求依据的法律、法规、规章、标准及上位预案中的有关规定发生重大变化的，应急预案应当及时修订并归档，那企业现在是否需要重新修订预案呢？","reply":"您好，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十六条规定了应当及时修订并归档的六种情形，第三十七条规定了应当按预案编制程序进行修订，并重新备案的情形。请对照相应内容结合企业预案实际开展评估，根据评估结论进行修订或备案。如地方另有规定的遵照执行。","consultTime":"2026-03-27","replyTime":"2026-03-31","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-45","title":"GB 6441-2025实施后，基于旧标准编写的预案是否需重编？","consult":"GB 6441-2025马上更新实施了，那么基于GBT 6441-1986编写的综合应急救援预案是否要重新编写？","reply":"您好，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十六条规定了应当及时修订并归档的六种情形，第三十七条规定了应当按预案编制程序进行修订，并重新备案的情形。请对照相应内容结合企业实际开展预案评估，根据评估结论进行修订或备案。如地方另有规定的遵照执行。","consultTime":"2026-03-18","replyTime":"2026-03-24","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-46","title":"应急预案修订期限是否改变？","consult":"今年4月1日执行的《生产经营单位生产安全事故应急预案编制导则》，针对预案修订年限是否改变，还是3年吗？","reply":"《生产安全事故应急预案管理办法》（应急管理部令第2号）第35条、36条、37条，对应急预案修订作了明确规定。","consultTime":"2021-03-16","replyTime":"2021-03-17","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-47","title":"生产经营单位应急预案的应急响应应由谁启动和结束？","consult":"请问生产经营单位在编制突发事件应急预案时，应急响应部分，应急预案的应该由谁启动和结束？","reply":"已电话沟通解答。您好，《突发事件应急预案管理办法》第十六条规定“单位应急预案侧重明确应急响应责任人、风险隐患监测、主要任务、信息报告、预警和应急响应、应急处置措施、人员疏散转移、应急资源调用等内容。”应急管理部规章《生产安全事故应急预案管理办法》第十三条明确综合应急预案应当规定应急组织机构及其职责、应急响应等内容；第十四条明确专项应急预案应当规定应急指挥机构与职责、处置程序和措施等内容。《生产安全事故应急预案管理办法》第五条规定生产经营单位主要负责人负责组织编制和实施本单位的应急预案，各分管负责人应当按照职责分工落实应急预案规定的职责。你单位应根据上述规定，结合企业实际，在预案中明确指挥机构及相关人员各自职责。","consultTime":"2024-12-04","replyTime":"2024-12-09","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-48","title":"应急预案是否要包含租赁企业？","consult":"应急的编制，需要包含租赁企业的危险分析和出现事故的应急处置措施吗？","reply":"已电话沟通解答。您好，《突发事件应急预案管理办法》第十六条规定单位应急预案侧重明确应急响应责任人、……应急处置措施……应急资源调用等内容。第二十一条明确编制应急预案应当依据有关法律、法规、规章和标准,紧密结合实际,在开展风险评估、资源调查、案例分析的基础上进行。《生产安全事故应急预案管理办法》第十条规定“编制应急预案前，编制单位应当进行事故风险辨识、评估和应急资源调查。”以上规章制度均对应急预案编制提出了明确要求。《生产经营单位生产安全事故应急预案编制导则》（GB/T29639-2020）也对预案内容进行了说明，请贵单位依据相关规定要求编制预案。","consultTime":"2024-04-07","replyTime":"2024-04-12","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-49","title":"应急预案演练的次数如何规定？","consult":"各位领导专家，我们是生产氧氮氩产品的一家三级重大危险源企业，在每年都应急演练次数中按照，应急部2号令的要求满足法律规定，请问我们是否需每年把辨识出的伤害事故都要演练一次。一个很现实的问题是，这个“每年一次”或“每半年一次”中的“一次”到底应该如何理解和实施。对此，主要有两种理解。第一种理解，是所有预案中的任意一个做了演练就算“一次”；第二种理解，是每个预案都要演练一次才算“一次”呢？","reply":"你好，《生产安全事故应急预案管理办法》（应急部令第2号）第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。请正确理解演练的定义，企业应根据自身实际，结合地方有关规定，灵活采用桌面演练、实战演练、专项演练、综合演练等形式，有针对性的组织开展应急预案演练，提高应急处置能力。","consultTime":"2023-08-30","replyTime":"2023-09-01","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-50","title":"应急预案演练是否需要全员参与？","consult":"请问应急预案演练是否需要公司全员参与，是否有明确的要求规定？","reply":"《生产安全事故应急预案管理办法》（应急管理部令第2号）第4章应急预案的实施第31条明确规定“生产经营单位应当组织开展本单位的应急预案、应急知识、自救互救和避险逃生技能的培训活动，使有关人员了解应急预案内容，熟悉应急职责、应急处置程序和措施。”第8条明确应急预案应该明确应急组织和人员的职责分工及具体落实措施，应该有明确、具体的应急程序和处置措施。而预案应急演练是针对可能发生的事故情景，依据应急预案而模拟开展的应急活动，其目的之一是为了发现应急预案存在的问题，完善相关单位和人员的工作职责，改进处置技术。你单位应该结合企业实际及应急预案内容，针对性开展演练。","consultTime":"2024-01-09","replyTime":"2024-01-11","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-51","title":"应急预案中“构成单位部门”是指预案小组还是公司部门？","consult":"生产经营单位应急预案应急组织机构及职责,明确应急组织形式可用图示及构成单位部门具体指的什么？是应急预案中设置的小组还是公司部门？","reply":"您好，生产经营单位生产安全事故应急预案中的应急组织机构一般指生产经营单位为应对突发事故建立的应急管理组织体系，包括但不限于应急指挥部、应急指挥部办公室、现场指挥部、综合协调组、抢险救援组、警戒疏散组、技术支持组、物资保障组、医疗救护组等。各工作组由相关部门人员组成。请你单位结合企业实际确定本单位的应急组织机构和职责。","consultTime":"2025-03-10","replyTime":"2025-03-13","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-52","title":"《应急预案情景构建方法》GBT49761-2025是否适用于企业应急预案编制？","consult":"最近颁布《应急预案情景构建方法》GBT49761-2025本年7月开始实施，请问在使用范围内是政府及其部门。请问生产经营单位应急预案编制是否适用，请明确。谢谢！","reply":"您好。GB/T 49761-2025《应急预案情景构建方法》在适用范围中明确了“其他组织开展应急预案编制情景构建活动参照使用”。生产经营单位可结合实际情况及自身能力，参考标准中提供的相关方法和流程开展应急预案编制工作。","consultTime":"2026-01-19","replyTime":"2026-02-04","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-53","title":"非高危企业是否必须编制综合预案和专项预案？","consult":"《生产经营单位生产安全事故应急预案编制导则》GB/T 29639-2020已经发布了，2021年4月起实行，企业应进行应急预案修编和重新备案工作，但是2020年《安全生产法》修正案第七十八条规定：本条第一款规定的其他生产经营单位应当制定本单位应急救援现场处置方案。请问：其他生产经营单位除了制定本单位应急救援现场处置方案外还需要编制综合应急预案和专项应急预案吗？如果只制定现场处置方案是否带需要备案？","reply":"《生产安全事故应急预案管理办法》（应急管理部令第2号）第十三条、第十四条、第十五条对生产经营单位编制综合应急预案、专项应急预案、现场处置方案作出了明确规定；第二十六条第一款明确了应急预案备案的生产经营单位范围，不是所有单位的应急预案都需要备案。","consultTime":"2020-12-26","replyTime":"2020-12-30","dept":"安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-54","title":"应急预案编制小组的组长，可以由主要负责人担任嘛？","consult":"请问，应急预案编制小组的组长，可以由主要负责人担任嘛？副组长由分管安全副组长担任嘛？如果不能，请问分别由什么岗位人员担任？","reply":"已电话沟通解答。《突发事件应急预案管理办法》第二十条规定“应急预案编制部门和单位根据需要组成应急预案编制工作小组，吸收有关部门和单位人员、有关专家及有应急处置工作经验的人员参加。编制工作小组组长由应急预案编制部门或单位有关负责人担任。”《生产安全事故应急预案管理办法》第九条规定“编制应急预案应当成立编制工作小组，由本单位有关负责人任组长，吸收与应急预案有关的职能部门和单位的人员，以及有现场处置经验的人员参加。”请你单位根据规定开展应急预案编制工作。","consultTime":"2024-06-19","replyTime":"2024-06-21","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-55","title":"应急预案编号和版本号如何编制？","consult":"我单位编制事故应急救援预案，在备案时告知编号和版本号不合格，我想知道国家有没有应急预案编号和版本号编制的规则，请举例说明怎么编辑。","reply":"目前，国家层面尚未对企业生产安全事故应急预案编号和版本号做统一规定，你单位可结合单位预案体系实际情况，根据地方有关规定进行统一编号。","consultTime":"2023-10-16","replyTime":"2023-10-23","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-56","title":"应急预案修订如何组织评估？","consult":"应急预案修订已经三年了，按照要求需要进行评估了。先咨询的问题 有两个，评估能自己单位组织开展么？评估的流程是什么？有没有相关的指导，感谢领导？","reply":"已电话沟通解答。您好，应急预案定期评估是应急预案管理工作的重要环节。通过评估，可以检验预案的针对性、实用性和可操作性，实现应急预案的动态优化和科学规范管理。应急管理部规章《生产安全事故应急预案管理办法》第三十五条规定“应急预案编制单位应当建立应急预案定期评估制度……应急预案评估可以邀请相关专业机构或者有关专家、有实际应急救援工作经验的人员参加，必要时可以委托安全生产技术服务机构实施。”。你单位可企业结合实际执行。此外，行业推荐性标准《生产经营单位生产安全事故应急预案评估指南》（YJ/T9011-2019）对应急预案评估的基本要求、工作程序和评估内容等进行了规定，你单位可在实际进行应急预案评估时参照执行。如地方另有规定的，请按照地方有关规定执行。","consultTime":"2025-10-28","replyTime":"2025-11-03","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-57","title":"施工现场编制综合应急预案及专项应急预案、现场处置方案是否需要进行预案评审工作？","consult":"您好，施工现场编制综合应急预案及专项应急预案、现场处置方案是否需要进行预案评审工作？","reply":"已电话沟通解答。您好，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第二十一条明确说明了哪些生产经营单位的应急预案需要组织评审或者根据自身需要进行论证。如你单位不符合该条第一款有关规定，则不需要进行评审，可根据自身需要对本单位应急预案进行论证。","consultTime":"2024-04-06","replyTime":"2024-04-11","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-58","title":"应急预案重新修订后需要再次评审吗？","consult":"根据《生产安全事故应急预案管理办法》第37条　应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照本办法规定的应急预案编制程序进行。问题：假设应急预案在2021年新修订并发布实施，在2024年重新评估后需要修订，请问修订后需要重新评审吗？","reply":"已电话沟通解答。您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十七条规定，生产经营单位修订应急预案，涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，应当参照预案编制程序进行。若应急预案涉及上述内容变更且在编制过程中进行过评审，则修订工作需要重新评审。","consultTime":"2024-05-26","replyTime":"2024-05-31","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-59","title":"预案评估后不需修订的，是否还需重新编制和备案？","consult":"2号令中对应急预案及其备案登记的有效期并没有作出规定，则综合2号令第35、36、37条内容，提出下列疑问，请给予解答：1.经过每三年一次的评估后，应急预案不需修订的，是否可沿用原应急预案，是否要重新编制、公布，是否要重新进行备案；2.经过每三年一次的评估后，应急预案需修订但修订内容不涉及第37条所规定相关内容的，应急预案修订后，是否需重新进行备案。","reply":"您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》有关规定，生产经营单位对应急预案组织评估后，如评估结论明确为不需要修订的可不进行修订，仍沿用原预案，原预案不需重新编制、公布、备案；如预案修订不涉及《生产安全事故应急预案管理办法》第三十七条规定内容的，无需重新备案。关于预案评估、修订及备案等内容，如单位所在地方和相关行业另有明确规定的，请遵照执行。","consultTime":"2024-02-05","replyTime":"2024-02-18","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-60","title":"想咨询EPC总承办项目的应急预案备案问题，是建设单位还是总承办单位？","consult":"我单位成立了子公司投资一个风电建设项目，子公司人员只有几个人。项目是实行EPC总承包的，目前项目进场施工有一百余号人。根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第二十六条没有电力建设行业相关单位，省、自治区、直辖市人民政府也没有具体说明。想咨询这个风电建设施工的应急预案是由EPC总承包编制并备案，还是由建设单位编制并备案呢？","reply":"已电话沟通解答。您好！《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）第十二条规定，生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案。不论是建设单位还是施工单位，只要是生产经营单位均应结合单位实际对照相应条款编制本单位的生产安全事故应急预案。所在地方和行业主管部门另有规定的，请按照地方有关规定执行。","consultTime":"2024-11-13","replyTime":"2024-11-18","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-61","title":"有限空间作业需要建立专项应急预案吗？是必须的吗？","consult":"我司在安全生产过程中涉及作业人员有限空间作业，请问需要编制有限空间专项应急预案吗？还是只要有有限空间现场处置方案即可？根据《生产安全事故应急预案管理办法》第十四条 对于某一种或种或者多种类型的事故风险，生产经营单位可以编制相应的专项应急预案。这里的可以属于强制还是非强制的呢？","reply":"已电话沟通解答。您好！现就您咨询的两个问题答复如下：1）应急管理部规章《生产安全事故应急预案管理办法》第十二条规定：“生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案，并体现自救互救和先期处置等特点。”请你单位根据地方和行业有关规定，结合单位实际确定编制相应类型的应急预案。如你单位为工贸企业，还需参考《工贸企业有限空间作业安全规定》（应急管理部令第13号）相关要求。2）《生产安全事故应急预案管理办法》第十四条规定了专项应急预案的相关内容，是否编制专项应急预案，需生产经营单位结合本单位实际确定。","consultTime":"2024-12-12","replyTime":"2024-12-13","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-62","title":"木板厂应急预案是否必需专家论证签字，是否必须备案？","consult":"1. 木板厂的应急预案是否一定要求邀请专家论证签字，可否企业自主决定是否邀请专家论证签字？2. 木板产的应急预案是否必须网上备案？可否企业自主决定是否备案？","reply":"你好，《生产安全事故应急预案管理办法》第二十一条明确说明了哪些生产经营单位的应急预案需要组织评审或者根据需要进行论证。如你单位不符合第一款有关规定，则不需要进行评审，可根据自身需要对本单位应急预案进行论证。第二十六条对重点生产经营单位应急预案备案要求做了明确规定，请根据企业实际情况，对照具体内容，结合地方有关规定参照执行。","consultTime":"2025-10-15","replyTime":"2025-10-22","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-63","title":"国家专项应急预案文号如何查询？","consult":"因工作需要，需查询《国家处置铁路行车事故应急预案》发文机关及发文文号、时间等信息，现政府网站查询仅显示为“新华社北京1月22日电”，恳请提供此预案正式发文文号和查询地址，十分感谢。","reply":"根据《政府信息公开条例》第十条规定，行政机关制作的政府信息，由制作该政府信息的行政机关负责公开。考虑到国家对应急预案实行分类管理，《国家处置铁路行车事故应急预案》由国家铁路部门负责制定，相关信息的公开请联系国家铁路部门。","consultTime":"2022-05-11","replyTime":"2022-05-18","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-64","title":"是否每年需要对所有事故类型的专项预案分别开展演练？","consult":"企业应急预案专项预案中有一项其他事故伤害专项应急预案中公司涉及触电、灼烫、物体打击、机械伤害、车辆伤害、高处坠落、淹溺事故处置，每年两次演练必须覆盖上述所有事故类型吗？","reply":"已电话沟通解答。您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十三条对预案演练进行了规定。《生产安全事故应急演练基本规范》（AQ/T9007-2019）明确应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的演练可相互组合。组织专项预案演练，可灵活确定演练内容和形式，一次演练可安排多个场景演练内容。请贵单位正确理解演练的定义，结合本单位的事故风险特点，灵活采用不同形式，针对性开展应急预案演练，确保各项预案演练均符合规定并切实取得实效。如地方另有规定的请参照执行。","consultTime":"2024-04-19","replyTime":"2024-04-23","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-65","title":"法定代表人变更应急预案是否需要从新备案？","consult":"您好，我单位属于危险化学品生产企业，应急预案与2024年4月28日完成备案，现在单位法定代表人发生变化，法定代表人不是主要负责人主要负责人及组织体系、应急处置岗位及职责分工都未发生变化，只是备案表上法定代表人发生变化，这种应急预案还需要重新备案吗？谢谢！","reply":"您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十七条规定，应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照本办法规定的应急预案编制程序进行，并按照有关应急预案报备程序重新备案。依据上述规章，你单位法定代表人发生变更，在同时不涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更内容的，则不属于需要应急预案重新备案的情形。请你单位结合实际参照执行，如地方另有规定的，请按照地方有关规定执行。","consultTime":"2025-03-02","replyTime":"2025-03-05","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-66","title":"有多个现场处置方案，是每个每半年演练一次还是总共一次？","consult":"依据《生产安全事故应急预案管理办法》第三十三条 每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。这里的“每半年”理解有点歧义，一种理解是“每个处置方案都要每半年至少演练一次”、一种理解是“处置方案每半年有一次演练即可”。比如企业有20个处置方案，一种理解是每半年演练20次，全年要40次，另一种理解是每半年至少1次，全年2次。请明确，盼回复，谢谢！","reply":"您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十三条规定，生产经营单位每半年至少组织一次现场处置方案演练。这是对现场处置方案演练频次的最低要求，每个现场处置方案的演练频次都是每半年至少组织一次。应急演练可采用多种演练方法。依据《生产安全事故应急演练基本规范》（AQ/T9007-2019），应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的演练可相互组合。组织现场处置方案演练，可灵活确定演练内容和形式，一次演练可安排多个现场处置方案演练内容。生产经营单位应根据本单位的事故风险特点，统筹考虑确定现场处置方案等各类预案演练的频次。","consultTime":"2024-01-03","replyTime":"2024-01-10","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-67","title":"应急预案演练计划每半年至少演练一次是指总量还是每个？","consult":"根据《生产安全事故应急预案管理办法》第三十三条 生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。我想问下：我公司现有18个现场处置方案，“每半年至少组织一次现场处置方案演练”是指半年至少开展其中一项一次现场处置方案，还是每半年18项现场处置方案都需要演练一次，希望告知法规允许条件下的最少次数。谢谢。","reply":"已电话沟通解答。您好，应急管理部规章《生产安全事故应急预案管理办法》第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。依据《生产安全事故应急演练基本规范》（YJ/T9007-2019），应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的预案演练可相互组合。你单位应正确理解演练的定义，按照规定结合自身实际，灵活采用不同形式，有针对性的组织开展应急预案演练，确保演练取得实效。如地方另有规定的，请参照执行。","consultTime":"2025-11-03","replyTime":"2025-11-10","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-68","title":"应急预案演练计划每半年至少演练一次是指总量还是每个？","consult":"您好！《生产安全事故应急预案管理办法》第三十三条 生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。请问该条款应当如何解读，如企业《生产安全事故应急预案》中有13个现场处置方案，是需要每个处置方案每年开展2次，总共开展26次现场处置方案演练吗？还是从13个现场处置方案中抽取，每年开展2次现场处置方案演练？谢谢！","reply":"已电话沟通解答。您好，应急管理部规章《生产安全事故应急预案管理办法》第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。依据《生产安全事故应急演练基本规范》（YJ/T 9007-2019），应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的预案演练可相互组合。你单位应正确理解演练的定义，按照规定结合自身实际，灵活采用不同形式，有针对性的组织开展应急预案演练，确保演练取得实效。如地方另有规定的，请参照执行。","consultTime":"2025-11-04","replyTime":"2025-11-11","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-69","title":"《生产安全事故应急预案管理办法》对备案有效期有无规定？","consult":"第九条 编制应急预案应当成立编制工作小组，由本单位有关负责人任组长，吸收与应急预案有关的职能部门和单位的人员，以及有现场处置经验的人员参加。1. 本单位有关负责人指哪些人？包括安全总监、安环部部长、安全科长吗？2. 只有安环部员工为组员对否？是否需要有关的多个部门人员为组员？","reply":"1. 本单位有关负责人通常指单位领导班子成员层次的负责人，也可由略低于领导班子成员的专项业务负责人担任组长。2. 预案编制小组成员应当根据企业实际确定，通常是与应急预案内容相关联的部门人员参加，如生产、经营、物流等部门。","consultTime":"2021-02-23","replyTime":"2021-02-25","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-70","title":"新版预案编制导则中事故风险评价应使用什么方法？","consult":"新版应急预案编制导则附录A事故风险评估报告编制大纲，“A.3要求进行事故风险评价，描述生产经营单位事故风险的类别和风险等级”，应该用什么方法确定风险等级？新版应急预案编制还可以参考国家安全生产应急救援指挥中心《2017年度企业生产安全事故应急预案范本》吗？新版应急预案编制事故风险评估报告还可以参考其中的事故风险分析评估内容吗？","reply":"风险等级如何确定请咨询有关安全服务机构或专家；《2017年度企业生产安全事故应急预案范本》供同类型企业参考借鉴。","consultTime":"2021-03-04","replyTime":"2021-03-23","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-71","title":"生产经营单位应当向政府部门报送的应急演练及队伍建设情况具体包括那些内容？","consult":"《生产安全事故应急条例》第八条和第十二条规定一些生产经营单位应当将本单位的生产安全应急救援预案演练情况和应急队伍建设情况报送负有安全监管职责的部门，请问具体需要报送哪些内容？应当向哪些部门报送？另外，第十二条要求将应急队伍建设情况向社会公布，哪些公布方式符合要求，应当公布哪些内容？","reply":"应急救援预案演练情况具体报送内容请咨询生产经营单位所在地县级以上人民政府负有安全生产监督管理职责的部门。报送部门为对企业所属行业负有安全生产监督管理职责的相关部门。《生产安全事故应急条例》第十二条对应急救援队伍建立情况的报送内容、时限、程序和方式等具体事项未作出明确规定。救援队伍建立情况的报送内容及向社会公布内容等具体事宜由各地有关部门根据当地实际情况做出规定。","consultTime":"2021-08-15","replyTime":"2021-09-22","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-72","title":"应急预案编制导则（GBT 29639）2013版与2020版如何衔接？","consult":"《生产经营单位生产安全事故应急预案编制导则》GBT 29639-2020于2021年4月1日实施，请问现在编制的话是执行现行标准GBT 29639-2013还是2020版本呀？如果现在按照2020版本编制评审，明年实施后还需要重新备案吗？","reply":"《生产经营单位生产安全事故应急预案编制导则》GBT 29639-2020发布后，到2021年4月1日这段时间处于过渡期内，新旧两个版本都可以执行，目前编制应急预案建议按照2020版执行。有关应急预案备案的规定，请参照《生产安全事故应急预案管理办法》（应急管理部令第2号）执行。","consultTime":"2020-12-25","replyTime":"2020-12-30","dept":"安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-73","title":"预案未到期是否需要重新编制？","consult":"1. 生产经营单位生产安全事故应急预案编制导则4月1日起实施，企业预案未到期是否需要重新编制，还是待应急预案到期再根据新的导则编制预案。2. 应急预案管理办法要求在法律法规标准变化后修订预案，是指这些法规或规范有相关条款变化就要修订，还是有较大变化的时候修订。","reply":"原则上不需要重新编制，可根据新导则的要求酌情进行适当的更新补充，可增加修订页等部分内容，或者按照《生产安全事故应急预案管理办法》第35条规定，在修订时再按照新导则进行相应调整。","consultTime":"2021-03-16","replyTime":"2021-03-17","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-74","title":"有17项专项预案，是至少组织1次演练还是需17次？","consult":"您好：在《生产安全事故应急预案管理办法》第三十三条中明确：“每年至少组织一次综合应急预案演练或专项应急预案演练，每半年至少组织一次现场处置方案演练。”我们单位目前有1项综合应急预案、17项专项应急预案、4项现场处置方案，那么请问我们单位2025年需要至少组织1次综合应急预案演练或专项应急预案演练，还是需要至少组织每项应急预案演练1次，共计18次演练呢？","reply":"您好！根据应急管理部规章《生产安全事故应急预案管理办法》第三十三条规定，生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或专项应急预案演练，每半年至少组织一次现场处置方案演练。这是对生产经营单位年度演练频次的最低要求。生产经营单位应结合《生产安全事故应急预案管理办法》和行业、地方的相关规定，根据本单位的事故风险特点确定演练频次，确保演练取得实效。","consultTime":"2025-01-08","replyTime":"2025-01-09","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-75","title":"应急预案应该如何组织编制？","consult":"一个40万KW海上风电场项目，建设单位在建设期采用平行发包建设模式，应急预案应该如何组织编制？是以下哪种或是其它？① 建设单位编制项目综合应急预案，施工单位、监理单位、设计单位项目部编制专项应急预案、现场处置方案；②　建设单位编制项目综合应急预案、专项应急预案，施工单位项目部编制现场处置方案；建设单位、施工单位、监理单位、设计单位项目部均需要编制综合应急预案、专项应急预案、现场处置方案。","reply":"您好！《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）第十二条规定，生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案。不论是建设单位还是施工单位，只要是生产经营单位均应结合单位实际对照相应条款编制本单位的生产安全事故应急预案。","consultTime":"2024-09-11","replyTime":"2024-09-14","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-76","title":"综合、专项等任何一种应急预案，是否都要在编制前进行风险评估？","consult":"您好，根据《生产经营单位是餐券事故应急预案编制导则》GBT29639-2020要求，应？急预案编制程序中要开展风险评估。想问下是否任何一种应急预案都需要在编制前进行风险评估呢？","reply":"您好，《突发事件应急预案管理办法》第二十一条明确规定“编制应急预案应当依据有关法律、法规、规章和标准，紧密结合实际，在开展风险评估、资源调查、案例分析的基础上进行。”你单位应根据要求按程序开展应急预案编制相关工作。此外，《生产经营单位生产安全事故应急预案编制导则》（GB/T 29639-2020）是推荐性标准，该标准适用于生产经营单位生产安全事故应急预案编制工作。你单位可结合实际参照该标准有关风险评估的要求开展评估，如地方另有规定的请参照地方规定执行。","consultTime":"2025-02-17","replyTime":"2025-02-21","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-77","title":"综合应急预案是否需要每年进行一次演练？","consult":"应急管理部领导您好。根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十三条规定“每年至少组织一次综合应急预案演练或者专项应急预案演练”。如果企业制定了一项综合应急预案、多项专项应急预案，并每年只演练一项综合、专项应急预案，可否满足法规对演练频次要求？","reply":"您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十三条，生产经营单位每年至少组织一次综合应急预案演练或者专项应急预案演练，这是对演练频次的最低要求。应急演练可采用多种演练方法。依据《生产安全事故应急演练基本规范》（AQ/T9007-2019），应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的演练可相互组合。综上，如果企业制定了一项综合应急预案、多项专项应急预案，应当根据本单位的事故风险特点，统筹考虑、灵活安排演练的内容、形式及频次，确保演练取得实效。","consultTime":"2024-06-02","replyTime":"2024-06-07","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-78","title":"编制了某类事故的专项应急预案后，是否必须还要对此类事故编制现场处置方案？","consult":"请问下，企业编制了火灾事故的专项应急预案后，是否必须还要编制火灾事故的现场处置方案？假设某企业只有火灾和触电两种危险有害因素，已对火灾编制了专项应急预案，对触电编制了现场处置方案，只要是专项预案加现场处置预案包含了企业所有的危险因素本企业只有火灾和触电就好？还是对于这个企业编制了火灾事故的专项应急预案后，还必须要编制火灾事故的现场处置方案？","reply":"《生产安全事故应急预案管理办法》（应急部令第2号）第十二条明确规定“生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案”。第十三条至第十七条进行了具体说明。你单位可结合地方有关规定参照执行。","consultTime":"2023-03-14","replyTime":"2023-03-21","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-79","title":"酒店综合应急预案应依据GBT 29639还是GBT 38315编制？","consult":"酒店行业的综合应急预案是要依据《生产经营单位生产安全事故应急预案编制导则》GBT 29639-2020确定的框架结构编制，还是依据《社会单位灭火和应急疏散预案编制及实施导则》GBT 38315-2019确定的框架结构进行编制？或者是二者结合进行编制？","reply":"已电话沟通解答。您好，《生产经营单位生产安全事故应急预案编制导则》和《社会单位灭火和应急疏散预案编制及实施导则》均为推荐性标准，前者规定了生产经营单位生产安全事故应急预案的编制程序、体系构成、主要内容以及附件信息，可作为生产经营单位应急预案编制的依据和指南。后者明确了社会单位灭火和应急疏散预案编制和演练的具体要求。请结合企业实际确定的预案体系，参照《突发事件应急预案管理办法》《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）以及地方有关规定编制你单位应急预案。","consultTime":"2025-10-22","replyTime":"2025-10-29","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-80","title":"基于旧标准备案的预案，新标准实施后是否需重新修订备案？","consult":"2026年初基于GBT 6441-1986编写并备案的综合应急救援预案是否要根据即将实施的GB 6441-2025进行重新修订与备案工作？","reply":"您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第十六条、第三十六条、第三十七条分别规定了更新预案附件信息的情形、应当及时修订并归档的情形及应当按预案编制程序进行修订并重新备案的情形。你单位应结合实际，对《生产安全事故分类与编码》（GB 6441-2025）的实施是否影响你单位应急预案及影响哪些内容进行评估，作出预案是否需修订的结论。如地方另有规定的，依据地方规定执行。","consultTime":"2026-04-23","replyTime":"2026-04-28","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-81","title":"有10个现场处置方案，应每个每年演练2次还是总共2次？","consult":"您好！《生产安全事故应急预案管理办法》第三十三条 生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。 请问该条款应当如何解读，如企业《生产安全事故应急预案》中有10个现场处置方案，是需要每个处置方案每年开展2次，总共开展20次现场处置方案演练吗？还是从10个现场处置方案中抽取，每年开展2次现场处置方案演练？谢谢！","reply":"已电话沟通解答。您好，应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的演练可相互组合。组织现场处置方案演练，可灵活确定演练内容和形式，一次演练可安排多个现场处置方案演练内容。生产经营单位应根据本单位的事故风险特点，统筹考虑确定现场处置方案等各类预案演练的频次。","consultTime":"2025-12-02","replyTime":"2025-12-08","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-82","title":"综合应急预案、专项应急预案、现场处置方案可以公司内部评审吗？","consult":"综合应急预案、专项应急预案、现场处置方案可以公司内部评审吗？还是一定要外部专家评审？谢谢！","reply":"已电话沟通解答。您好，应急预案评审不区分内审和外审，但《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）第二十二条规定“参加应急预案评审的人员应当包括有关安全生产及应急管理方面的专家。评审人员与所评审应急预案的生产经营单位有利害关系的，应当回避。”你单位组织评审的专家符合相关要求即可。","consultTime":"2024-09-06","replyTime":"2024-09-11","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-83","title":"高危行业应急演练一年至少开展几次？","consult":"法规要求，生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。而专项预案演练往往包含有现场处置方案演练内容，那是否可以理解为：企业每年只需开展一次综合应急预案演练或者专项应急预案演练，和一次现场处置方案演练？企业上半年开展了一次专项演练就相当于上半年完成了一次专项和现场处置演练？","reply":"你好，《生产安全事故应急预案管理办法》（应急部令第2号）第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。如地方另有规定的，请参照执行。另外，请正确理解演练的定义，综合预案、专项预案和现场处置方案的演练有桌面推演、实战演练、专项演练、综合演练等多种形式，既可以单独组织，也可以同时开展。企业应根据自身实际，灵活采用不同形式，有针对性的组织开展应急预案演练，提高应急处置能力。","consultTime":"2023-11-13","replyTime":"2023-11-16","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-84","title":"应急预案评审应该如何组织？","consult":"1.应急预案评审分不分内审和外审？是否可以用应急预案评审代替评估？2.对于各类检查提出的应急预案小问题，不涉及《管理办法》第三十六条需要修订的情形，每次都要修订还是可一年集中修订一次；小的修订后需不需要组织评审；小的修订后需要重新由主要负责人批准下发吗；小修后应急预案封皮上颁布日期是写最初颁布的日期还是写最新修订的日期？3.承包商项目部的应急预案由项目部审批，还是本公司主要负责人审批？","reply":"1.应急预案评审不区分内审和外审，但参加应急预案评审的人员应当包括有关安全生产及应急管理方面的专家。预案评审无法代替评估，预案评审为公布、备案前的程序，评审或者论证注重基本要素的完整性、组织体系的合理性、应急处置程序和措施的针对性、应急保障措施的可行性、应急预案的衔接性等内容。预案评估为预案实施阶段的内容，主要在预案演练或者实施后，对预案内容的针对性和实用性进行分析，并对应急预案是否需要修订作出结论。2.《生产安全事故应急预案管理办法》（应急管理部令第2号）第36、37条对预案修订及重新备案进行了明确规定，请根据预案内容修订情况，结合地方有关规定进行修订或备案。3.《生产安全事故应急预案管理办法》（应急管理部令第2号）第24条明确规定“生产经营单位的应急预案经评审或者论证后，由本单位主要负责人签署，向本单位从业人员公布，并及时发放到本单位有关部门、岗位和相关应急救援队伍。”请结合企业实际执行。","consultTime":"2023-10-13","replyTime":"2023-10-19","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-85","title":"关于贵部2号令第二十一条第一款所述“中型规模以上企业”划分标准的疑惑？","consult":"“中型规模以上企业”的划分标准，可否理解为同时满足《统计上大中小微型企业划分办法2017》中“中型工业企业300≤人数＜1000且2千万≤年营业额＜4亿”和“规模以上工业企业年主营业务收入2000万元及以上”。这样理解带来一个问题，大型人数≥1000且营业额≥4亿的其他qiye，不满足“中型规模以上”，不须按照第二十一条第进行编制的预案进行专家评审，只需要论证？不合常理啊望解惑。","reply":"已电话沟通解答。您好，《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）第二十一条规定“……中型规模以上的其他生产经营单位，应当对本单位编制的应急预案进行评审，并形成书面评审纪要。”此处的“中型规模以上”是指根据工信部牵头制定的《中小企业划型标准规定》和国家统计局印发的《统计上大中小微型企业划分办法（2017）》有关要求界定的中型及以上企业。以工业行业举例，是指人数≥300人且营业收入≥2000万的企业。请贵单位根据相关界定标准对企业进行划型，并按照《生产安全事故应急预案管理办法》相关要求编制生产安全事故应急预案。","consultTime":"2024-07-29","replyTime":"2024-07-29","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-86","title":"因人员变更修订预案需要重新评审和备案吗？","consult":"我是粮食仓储企业的，请问由于主要负责人变更、部分员工离职或调岗而修订的应急预案，需要重新评审、备案吗？","reply":"您好！您咨询的问题主要涉及应急预案重新备案等有关规定。根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十七条规定，应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照本办法规定的应急预案编制程序进行，并按照有关应急预案报备程序重新备案。实施上条规定，需准确把握“组织指挥体系与职责”等变更情形。理解把握这些变更情形，可参考应急预案评估相关标准中的内容。依据《生产经营单位生产安全事故应急预案评估指南》（AQ/T 9011-2019），应急组织机构与职责方面的评估内容，主要包括：生产经营单位组织体系是否发生变化、应急处置关键岗位应急职责是否调整、重点部门应急职责与分工是否重新划分等。依据上述规章和标准规定，你单位主要负责人变更、部分员工离职或调岗，若同时不涉及单位组织指挥体系变化、有关职责调整内容的，则不属于需要应急预案重新备案的情形。","consultTime":"2024-01-18","replyTime":"2024-01-25","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-87","title":"生产安全事故应急预案的应急预案评审意见表是否有模板？专家签字后是否需要盖章？","consult":"请问生产安全事故应急预案的应急预案评审意见表是否有模板？专家签字后是否需要盖章？","reply":"已电话沟通解答。您好，《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）并未明确生产经营单位应急预案评审意见表模板，请结合企业实际，根据地方有关规定执行即可。","consultTime":"2024-08-09","replyTime":"2024-08-13","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-88","title":"预案附件中的应急资源调查清单和批准页有无模板要求？","consult":"我公司正在进行生产安全事故应急预案的编修工作，请问应急资源调查清单、应急预案评审和批准页落款日期这三者的时间间隔是否有相关规定。比如：做完应急资源调查和评审，多长时间必须批准发布？","reply":"已电话沟通解答。您好，《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）并未明确应急资源调查清单、应急预案评审和批准页落款日期三者的时间间隔，请结合企业实际情况，参照地方有关规定，按程序执行即可。","consultTime":"2024-08-09","replyTime":"2024-08-13","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-89","title":"海上风电建设方应急预案应向哪个部门备案？","consult":"你好，我现在任职企业是海上风电的建设方，我们的应急预案如果需要备案，是备案到那个部门呢？","reply":"已电话沟通解答。您好，《生产安全事故应急预案管理办法》（应急管理部令第2号）第二十六条第三款规定“本款前述单位以外的其他生产经营单位应急预案的备案，由省、自治区、直辖市人民政府负有安全生产监督管理职责的部门确定。”请你单位结合企业实际，根据地方有关规定执行生产安全事故应急预案的备案。","consultTime":"2024-11-11","replyTime":"2024-11-18","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-90","title":"特种设备事故预案可否作为专项预案编入综合预案备案？","consult":"在部分涉及特种设备使用企业在进行生产安全事故应急预案备案中，将特种设备事故应急预案做为专项预案编入事故综合预案一起备案是否合适？请给与指导。","reply":"你好，《特种设备安全监察条例》（国务院令第549号）第六十五条规定：“特种设备安全监督管理部门应当制定特种设备应急预案。特种设备使用单位应当制定事故应急专项预案，并定期进行事故应急演练”。同时，《生产安全事故应急预案管理办法》（应急管理部令第2号）第五条规定：“生产经营单位主要负责人负责组织编制和实施本单位的应急预案”，第六条规定：“生产经营单位应急预案分为综合应急预案、专项应急预案和现场处置方案”。根据上述规定，特种设备使用单位制定特种设备事故专项应急预案，并通过编入单位综合应急预案的形式纳入单位应急预案体系，符合国家有关法规、规章规定。请根据《生产安全事故应急预案管理办法》以及企业所在地方有关应急预案备案的规定，结合企业实际，进行应急预案备案工作。","consultTime":"2023-12-27","replyTime":"2023-12-28","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-91","title":"单位名称等发生变化时应急预案是否还需要重新修订、外审和备案吗？","consult":"我单位是新名字叫新能源事业部电力分公司，成立于2024年6月，是按照一个机构两个牌子，一套领导班子的运行模式，由新能源事业部和电力公司重组整合成立，原名字XX有限公司电力分公司实体和公章仍然有效，主要负责人发生了变更，应急组织机构和职责、风险、应急资源等等均未发生改变，这种情况是否应急预案还需要重新修订、外审和备案吗？","reply":"已电话沟通解答。根据应急管理部规章《生产安全事故应急预案管理办法》第三十七条规定，应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照应急预案编制程序进行，并重新备案。你单位发生名称变更等情形，应当及时修订应急预案；并请结合实际变更情况，对应急预案修订是否涉及第三十七条规定的内容变更情形进行评估、作出结论。若不涉及第三十七条规定的内容变更情形，则无需重新备案。所在地方另有规定的，请按照地方有关规定执行。","consultTime":"2024-10-12","replyTime":"2024-10-16","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-92","title":"企业主要负责人发生变化，应急预案是否需要进行重新备案？","consult":"危化品生产、经营企业主要负责人发生变化，应急预案应进行重新修订，请问是不是需要到应急管理局再进行重新备案？","reply":"《生产安全事故应急预案管理办法》（应急管理部令第2号）第36条规定了应急预案修订的条件，第37条规定了重新备案的要求，请对照规定执行。","consultTime":"2021-02-03","replyTime":"2021-02-05","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-93","title":"公司法人发生变化，安全生产应急预案需要重新备案吗？","consult":"公司法人发生变化，安全生产应急预案需要重新备案吗？","reply":"已电话沟通解答。您好，根据应急管理部规章《生产安全事故应急预案管理办法》第三十七条规定，应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照应急预案编制程序进行，并重新备案。你单位发生法人变更等情形，应当及时修订应急预案，并请结合实际变更情况，对应急预案修订是否涉及第三十七条规定的内容变更情形进行评估、作出结论。若不涉及第三十七条规定的内容变更情形，则无需重新备案。所在地方另有规定的，请按照地方有关规定执行。","consultTime":"2024-11-13","replyTime":"2024-11-18","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-94","title":"GB6441-2025实施后重新修订的预案是否需要重新备案？","consult":"GB6441-2025生产安全事故分类与编码即将实施，依据《生产安全事故应急预案管理办法》第三十六条，企业需重新修订应急预案，修订好的预案还需重新备案吗》？","reply":"已电话沟通解答。您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十七条规定“应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照本办法规定的应急预案编制程序进行，并按照有关应急预案报备程序重新备案。”      你单位应结合实际，对应急预案修订内容是否涉及第三十七条规定的情形进行评估、作出结论。若涉及，则需重新备案。","consultTime":"2026-01-23","replyTime":"2026-01-29","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-95","title":"已经修改好重新打印了是否还要去应急管理局重新备案，或换之前已经备案好的应急预案？","consult":"应急预案已经备案好了，风险评估辨识出构成重大危险源，但是公司内审发现结论处写错未构成重大危险源。现已修改好重新打印了，还需要去应急管理局把已经备案提交的纸质预案换新吗，已经重新修改文字描述错误。","reply":"您好。你单位出现重大危险源评估结论错误情形，应当及时修订应急预案。请按照应急管理部规章《生产安全事故应急预案管理办法》以及所在地方应急管理部门的有关规定和要求进行备案。","consultTime":"2024-12-25","replyTime":"2024-12-27","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-96","title":"企业备案的综合、专项和现场处置预案是否每一项都需要在年度内开展一次演练？","consult":"请问企业备案的综合、专项和现场处置预案是否每一项都需要在年度内开展一次演练？","reply":"已电话沟通解答。您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十三条规定，生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或专项应急预案演练，每半年至少组织一次现场处置方案演练。这是对生产经营单位年度演练频次的最低要求。生产经营单位应结合《生产安全事故应急预案管理办法》和行业、地方的相关规定，根据本单位的事故风险特点确定演练频次，确保演练取得实效。","consultTime":"2024-06-26","replyTime":"2024-07-02","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-97","title":"生产含低浓度酒精的消毒产品是否需要应急预案备案？","consult":"微小企业拟在生产消毒产品的过程中添加酒精浓度小于50的相关产品，是否需要办理安全生产事故应急预案的备案？","reply":"《生产安全事故应急预案管理办法》（应急部令第2号）第二十六条对重点生产经营单位应急预案备案要求做了明确规定。第三十六条对应及时修订并归档应急预案的六种情形做了明确规定。第三十七条对应急预案修订涉及哪些内容变更需要重新备案的做了明确规定。请根据企业实际情况，对照具体内容，结合地方有关规定参照执行。","consultTime":"2023-03-14","replyTime":"2023-03-20","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-98","title":"新标准实施后，按旧标准备案且未到期的应急预案是否需要提前修订？","consult":"企业生产工艺、产品、设备以及各方面人员都没有变化，应急预案到期还需要重新修订和备案吗？","reply":"已电话沟通解答。您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十五条规定“应急预案编制单位应当建立应急预案定期评估制度，对预案内容的针对性和实用性进行分析，并对应急预案是否需要修订作出结论。”你单位应组织预案评估，如评估结论明确为不需要修订的可不进行修订。关于预案评估可参照《生产经营单位生产安全事故应急预案评估指南》（YJ/T 9011-2019）有关内容执行。如单位所在地方和相关行业另有明确规定的，请遵照执行。","consultTime":"2025-11-21","replyTime":"2025-11-27","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-99","title":"部分房屋拆除导致风险源减少，应急预案是否需要重新备案？","consult":"您好，我公司属于小微文化公司，于2023年6专家评审进行了应急预案备案，今年涉及两项变更，法人变更，但公司主要消防应急负责人未发生变化，另有部分房屋拆除，锅炉拆除，故原应急预案中的锅炉爆炸，天然气中毒等两项风险源减少，其他未变的情况下，是否需要重新备案。","reply":"已电话沟通解答。根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十七条规定，应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照本办法规定的应急预案编制程序进行，并按照有关应急预案报备程序重新备案。你单位危险源和事故风险减少，涉及到主要处置措施等内容变更，需要重新备案。","consultTime":"2024-10-10","replyTime":"2024-10-14","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-100","title":"应急预案里面所述的事故类型已经不符合标准所列了，那是否需要立即重新修订预案呢？","consult":"GB6441-2025实施后，现在企业做的应急预案里面所述的事故类型已经不符合标准所列了，那是否需要立即重新修订预案呢？还是可以等待原预案到规定的修订期限时再做？","reply":"您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十六规定了应急预案应及时修订并归档的六种情形，第三十七条规定了应按照预案编制程序进行修订工作的情形，请你单位结合实际进行修订。","consultTime":"2026-03-04","replyTime":"2026-03-09","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-101","title":"事故后未进行预案总结评估是否适用罚则？","consult":"《生产安全事故应急预案管理办法》第四十条“生产安全事故应急处置和应急救援结束后，事故发生单位应当对应急预案实施情况进行总结评估”这里的”总结评估\"是针对事故的处置进行总结评估，还是需要按照《应急预案评估指南》AQT 9011-2019对预案进行评估。事故发生后未对预案实施情况进行总结评估，是否适用于《预案管理办法》第四十五条”未按照规定开展应急预案评估的“进行处罚。谢谢。","reply":"已电话沟通解答。您好，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》有关规定，生产安全事故应急预案的评估有定期评估、预案演练评估、事故应急处置和应急救援结束后的总结评估，评估的重点各有不同，但目的均是为了分析预案内容的针对性和实用性，进而更好的修订完善应急预案，确保在应对生产安全事故时能够迅速有效处置。请贵单位按照要求，根据应急预案的不同实施情形，及时进行应急预案评估。《生产经营单位生产安全事故应急预案评估指南》AQ/T9011-2019为行业推荐性标准，规范了应急预案评估的基本要求、工作程序和评估内容，可在实际进行应急预案评估时参照执行。如地方另有规定的，请按照地方有关规定执行。","consultTime":"2024-09-19","replyTime":"2024-09-24","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-102","title":"国办发〔2013〕101号中各类预案的审批单位分别指哪些？","consult":"请问国办发的《突发事件应急预案管理办法》国办发[2013]101号中所指的地方政府总体预案及专项预案、部门预案，以及企事业单位、基层组织应急预案的“应急预案审批单位”分别都指哪些部门和单位？","reply":"根据《突发事件应急预案管理办法》（国办发〔2013〕101号）第十九条规定，地方各级人民政府总体应急预案应当经本级人民政府常务会议审议，以本级人民政府名义印发；专项应急预案应当经本级人民政府审批，必要时经本级人民政府常务会议或专题会议审议，以本级人民政府办公厅(室)名义印发；部门应急预案应当经部门有关会议审议，以部门名义印发，必要时，可以由本级人民政府办公厅(室)转发。单位和基层组织应急预案须经本单位或基层组织主要负责人或分管负责人签发，审批方式根据实际情况确定。","consultTime":"2022-01-06","replyTime":"2022-01-12","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-103","title":"生产经营单位开展应急预案演练时，是否必须由法人参加？且法人必须当总指挥么？","consult":"领导您好，请问电厂在组织开展应急预案演练时，法人是否必须参加？是否必须由法人当总指挥么？","reply":"已电话沟通解答。你好，《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）第4章应急预案的实施第31条明确规定“生产经营单位应当组织开展本单位的应急预案、应急知识、自救互救和避险逃生技能的培训活动，使有关人员了解应急预案内容，熟悉应急职责、应急处置程序和措施。”第8条明确应急预案应该明确应急组织和人员的职责分工及具体落实措施，应该有明确、具体的应急程序和处置措施。而预案应急演练是针对可能发生的事故情景，依据应急预案而模拟开展的应急活动，其目的之一是为了发现应急预案存在的问题，完善相关单位和人员的工作职责，改进处置技术。你单位应该结合企业实际及应急预案内容，确定参与演练的人员。","consultTime":"2025-10-20","replyTime":"2025-10-22","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-104","title":"镇街道、村社区是否必须制定总体应急预案？","consult":"请问镇街道、村社区是否必须制定总体应急预案？镇街道总体应急预案印发程序是怎么样，需要镇党委会议研究后发文还是不需要？","reply":"按照《国家突发事件总体应急预案》《突发事件应急预案管理办法》等有关规定，乡镇可编制总体应急预案，按程序报本级党委和政府审批，以本级党委和政府名义印发。街道参照执行。村（社区）应当编制应急预案，但不需要单独制定总体应急预案。乡镇（街道）、村（社区）应急预案形式、要素和内容可结合实际灵活确定，力求简明实用。","consultTime":"2025-06-05","replyTime":"2025-06-10","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"5-01","title":"有多种特种设备的企业，每种设备都要单独做应急演练吗？","consult":"企业含有多个类型的特种设备，如压力容器、压力管道、起重机和电梯等等，每种类型特种设备每年都要做应急演练吗？","reply":"已电话沟通解答。你好，依据《生产安全事故应急演练基本规范》，应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的演练可相互组合。组织现场处置方案演练，可结合实际灵活安排演练内容和形式。","consultTime":"2025-10-09","replyTime":"2025-10-14","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-02","title":"应急演练总指挥应由谁担任？","consult":"您好领导，安全生产法第21条规定“主要负责人组织制定并实施本单位的生产安全事故应急救援预案”，第25条规定“安全生产管理人员组织或者参与本单位应急救援演练”。请问应急预案演练的总指挥是否必须由矿长担任，分管副矿长是否可以担任演练总指挥。","reply":"您好，根据《中华人民共和国安全生产法》第二十一条、第二十二条、第二十五条有关规定，生产经营单位的主要负责人、安全生产管理机构负责人及安全生产管理人员、其他负有安全生产职责的相关人员，均可组织或参与本单位的应急预案演练。请结合预案演练内容及地方有关规定执行。","consultTime":"2026-04-23","replyTime":"2026-04-28","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":true},{"id":"5-03","title":"一般工商贸企业需要建立应急救援队伍吗？","consult":"您好，请问一般工商贸企业需要建立应急救援队伍吗？需要每个月进行一次训练吗？在哪款条文里可以找到？谢谢。","reply":"《安全生产法》第七十九条规定，国家加强生产安全事故应急能力建设，在重点行业、领域建立应急救援基地和应急救援队伍，鼓励生产经营单位和其他社会力量建立应急救援队伍。《生产安全事故应急条例》第十条规定，易燃易爆物品、危险化学品等危险物品的生产、经营、储存、运输单位，矿山、金属冶炼、城市轨道交通运营、建筑施工单位，以及宾馆、商场、娱乐场所、旅游景区等人员密集场所经营单位，应当建立应急救援队伍；其中，小型企业或者微型企业等规模较小的生产经营单位，可以不建立应急救援队伍，但应当指定兼职的应急救援人员，并且可以与邻近的应急救援队伍签订应急救援协议。工业园区、开发区等产业聚集区域内的生产经营单位，可以联合建立应急救援队伍。第十一条规定，应急救援队伍建立单位或者兼职应急救援人员所在单位应当按照国家有关规定对应急救援人员进行培训；应急救援人员经培训合格后，方可参加应急救援工作。应急救援队伍应当定期组织训练。","consultTime":"2024-01-04","replyTime":"2024-01-11","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-04","title":"企业或个人运送救援物资车辆怎么在网站申请备案？","consult":"企业或个人运送救援物资车辆怎么在网站申请备案，想免除高速费用，具体步骤请指导，谢谢。是选择临时队伍入驻吗？第一项灾害事件只有福建事件测试事件，应该怎么操作，谢谢。","reply":"您好，按照《跨省执行抢险救灾任务车辆免费通行服务保障规程（试行）》有关要求，“根据灾害事故救援救灾实际需要，应急管理部门组织或同意前往灾区执行抢险救灾任务的运输救援装备和物资的车辆（以下简称任务车辆）”，可以享受高速免费通行政策，任务车辆“不包括经营性物流运输、集体和个人自行开展志愿服务的非任务车辆”。据此，原则上企业和个人无法通过灾害应急救援救助平台申请享受任务车辆高速免费通行政策。感谢您对应急管理工作的关注和支持！","consultTime":"2023-12-28","replyTime":"2024-01-03","dept":"救援协调和预案管理局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-05","title":"“中国国际救援中心集团有限公司西北应急救援总队”是否合法注册，社会救援队伍如何辨别？","consult":"贵部好，本人近期在互联网上发现有一团体以“中国国际救援中心集团有限公司西北应急救援总队”名称在甘肃兰州及周边进行活动，该团体自称系公益性质社会应急救援力量，并参与过积石山地震等灾害救援工作。贵部可否告知该团体是否确系注册在案的社会应急救援力量？","reply":"您好！经与甘肃省应急管理厅核实，“中国国际救援中心集团有限公司西北应急救援总队”没有在民政部门依法登记，也未以应急管理部门为业务主管单位或者行业主管部门，不属于注册在案的社会应急力量。感谢对社会应急力量建设工作的关注和支持。","consultTime":"2025-09-19","replyTime":"2025-09-25","dept":"救援协调和预案管理局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-06","title":"社会救援队伍的业务主管单位是否必须是应急管理部门？","consult":"尊敬的部领导：我们这里社会救援队伍注册时，民政部门指定应急管理部门必须为其业务主管单位。民政部门相关条例要求，业务主管单位要对所主管社会组织的思想政治工作、党的建设、财务和人事管理等事项切实负起管理责任。   我查询了各级应急管理部门的相关材料，没有找到应急管理部门必须对社会救援力量进行业务管理的依据。请问部领导，社会救援力量的主管单位是否必须是应急管理部门？有没有相关依据？","reply":"您好！根据应急管理部、中央文明办、民政部、共青团中央联合印发《关于进一步推进社会应急力量健康发展的意见》（应急〔2022〕110号）要求，“民政部门会同应急管理部门依法依规做好有关防灾减灾救灾社会组织的登记管理工作；应急管理部门履行业务主管单位或者行业管理部门职责，按照符合登记标准条件、符合本地区防灾减灾救灾需要的原则，规范工作程序，完善审查标准，支持相关社会组织依法成立。”感谢您对应急管理工作的支持。","consultTime":"2023-03-17","replyTime":"2023-03-29","dept":"救援协调和预案管理局","chapter":"非煤矿山安全","hasLocalRef":true},{"id":"5-07","title":"国家对培育和规范社会应急救援队伍建设有哪些指导意见和政策？","consult":"自应急管理部成立来，成立了一些社会志愿者应急救援队伍，国家目前对这些社会组织由民政部登记备案，但应急救援队伍设计很多专业性技能和专业设备的使用，应急部是否制定了社会性应急救援队伍的名称使用，能力评定，介入范围，指挥调动，协同训练等一系列的规范指导要求？","reply":"您好，《社会应急力量救援队伍建设规范》已于近日完成了面向社会公开征求意见工作，请登录网站了解详情。感谢您对应急管理工作的支持。网址如下：https://www.mem.gov.cn/gk/zfxxgkpt/fdzdgknr/202111/t20211111_402599.shtml。","consultTime":"2021-11-02","replyTime":"2021-11-05","dept":"救援协调和预案管理局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-08","title":"民间救援队和志愿者队伍由哪个部门统一管理和注册登记？","consult":"建议对民间救援队、志愿者做出一个统一综合管理系统，包括人员队伍登记，应急事件登记，指派调度、通行证，并对人员做出分类医疗救援、应急通讯等。","reply":"您好！目前我们已开发应用“社会应急力量救援协调系统”（https://htgl-llgl.mem.gov.cn），在各级民政部门依法登记，以应急管理部门为业务主管单位或行业管理部门的，从事防灾减灾救灾的社会组织，可通过系统注册，录入队伍专业类型、人员基本信息、参与救援事件等，经应急管理部门审核后入驻该系统，可实现救援行动协调、通行服务保障等功能。   感谢对社会应急力量建设工作的关注和支持。","consultTime":"2026-05-19","replyTime":"2026-05-22","dept":"救援协调和预案管理局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-09","title":"社会救援队伍应去哪个政府部门寻找业务主管单位？","consult":"我们于2019年注册成立应急救援促进中心，因民政局提出民政的救援救灾业务移交应急管理局，并要求我们变更业务主管单位，在办理的过程中应急局称“只给名称叫做救援队的做业务主管单位”随后我们提出申请变更了名称将“应急救援促进中心”变更为救援队，但是现在又提出要提供应急局做业务主管单位的依据，我们找不到任何依据，现在民政局和应急局都不给做业务主管单位，我们该怎么办？","reply":"目前，救援救灾领域的公益慈善类社会服务机构可按照《民办非企业单位登记管理暂行条例》在民政部门按规定进行登记。同时，根据应急管理部、中央文明办、民政部、共青团中央联合印发的《关于进一步推进社会应急力量健康发展的意见》（应急〔2022〕110号）要求，“民政部门会同应急管理部门依法依规做好有关防灾减灾救灾社会组织的登记管理工作；应急管理部门履行业务主管单位或者行业管理部门职责，按照符合登记标准条件、符合本地区防灾减灾救灾需要的原则，规范工作程序，完善审查标准，支持相关社会组织依法成立。”据此，应急管理部门原则上应当作为符合相关条件社会救援队伍的业务主管单位。为妥善解决您提出的诉求，已协调属地应急管理部门处理你队业务主管单位变更事宜。感谢您对应急管理工作的支持！","consultTime":"2024-05-07","replyTime":"2024-05-09","dept":"救援协调局","chapter":"非煤矿山安全","hasLocalRef":true},{"id":"5-10","title":"国家级应急救援队伍目前的建设进展和布局情况如何？","consult":"请问：目前我国国家级救援队每个专业及数量分别是什么情况？另外在北京、河北、天津的国家级和地方级专业救援队专业及数量情况？","reply":"国家安全生产应急救援队伍（简称国家专业队）是由应急管理部牵头规划，在重点行业领域依托国有企业和有关单位建设的专业应急救援队伍。国家安全生产应急救援中心具体负责统一协调指挥国家专业队。现有国家专业队113支。其中，矿山救援队49支，危化救援队41支，隧道救援队6支，油气救援队10支，专业支撑保障队7支。目前，北京有国家专业队6支，其中，矿山救援队1支，危化救援队1支，专业支撑保障队4支；天津有国家专业队2支，其中，危化救援队1支，油气救援队1支；河北有国家专业队4支，其中，矿山救援队2支，危化救援队1支，油气救援队1支。其他问题已与留言网民通过电话进行了具体沟通。","consultTime":"2024-02-05","replyTime":"2024-02-07","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-11","title":"GB 30077-2023中危化品单位类别如何划分？","consult":"您好：2024年9月1日实施的《危险化学品单位应急救援物资配备要求》GB30077-2023，标准中在附录A通过从业人数、营业收入和危险化学品重大危险源级别划分危险化学品单位类别，但是标注4解释了“企业规模按从业人员、营业收入划分不一致的,按最低等级确定”。我单位从业人数在300人以下，但是营业收入40000万元以上，到底应该划分为第三类危险化学品单位还是第二类危险化学品单位？","reply":"根据附录A，从业人数在300人以下和营业额4000万元以上分别属于企业规模的最低等级和最高等级，根据表A.1中“注4：表中企业规模按从业人员、营业收入划分不一致的，按最低等级确定。”可知，该企业可按照“从业人数在300人以下”确定企业规模。","consultTime":"2024-03-04","replyTime":"2024-03-07","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-12","title":"如何加入区域性应急物资生产保障基地，申请条件和流程是什么？","consult":"《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》第三篇、第八章、第二节提出：提升产业链供应链现代化水平。“实施应急产品生产能力储备工程，建设区域性应急物资生产保障基地”。想请教一下，“区域性应急物资生产保障基地”的认定和命名是否由贵部负责，如果不是，应该咨询哪个部委？有无相关政策意见。谢谢。","reply":"根据部门职责，区域性应急物资生产保障基地的认定和命名不属于应急管理部事权范围，建议咨询国家发展和改革委员会。","consultTime":"2021-04-26","replyTime":"2021-04-29","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-13","title":"喷漆房属于有限空间吗？","consult":"你好，领导。根据《工贸企业有限空间参考目录》内部含有喷漆房，但是我们公司内喷漆房有良好的排风系统，有货物进出大门，应急物品配备齐全，有应急演练记录，人员需要进入进行日常作业。要是将其纳入有限空间作业，我们每天都要审批有限空间作业许可证，浪费很多安全管理的时间。请问这个应该纳入有限空间的管理范畴吗？我个人认为参考目录中所提到的喷漆房应该是高毒、通风较差、机械手操作的较为密闭的喷漆场所吧？","reply":"感谢留言。按标准规范设计建造的喷漆房不属于有限空间。","consultTime":"2022-05-11","replyTime":"2022-05-18","dept":"安全执法和工贸监管局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-14","title":"应急物资储备品种目前有哪些？","consult":"请问应急物资储备品种目前有哪些？对地方政府应急物资储备种类及数量有没有文件要求？","reply":"已电话与留言人沟通，对各地根据本地区灾害事故特点、风险程度有针对性储备相应物资的有关情况进行了答复。","consultTime":"2022-04-18","replyTime":"2022-04-20","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":true},{"id":"5-15","title":"车间每层是否都需按GB-30077配备一套应急物资？","consult":"危险化学品单位如果有一个车间2层、一个罐区、一个仓库等，厂区不大，是不是车间每层、每个区域多要按GB30077表1要求配备一套应急救援物资？还是全厂配备一套就行？","reply":"首先需按照 GB-30077《危险化学品单位应急救援物资配备要求》(下称标准)中表A.1确定该厂属于第几类危险化学品单位，若属于第三类可按照该标准第7.3.3准许将作业场所物资作为抢险救援物资配置。GB-30077《危险化学品单位应急救援物资配备要求》表1中指的作业场所为生产区或生产区中的一个车间(见该标准第3.4)，每个车间至少配备符合表1的物资,且需满足该标准第4章“配备原则”要求。","consultTime":"2025-02-24","replyTime":"2025-02-28","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-16","title":"是否有应急物资储备库建设相关标准？","consult":"您好，我想咨询一下，是否有应急物资储备库建设相关标准？救灾仓库抗震设防是否设置为重点设防类。","reply":"《应急物资生产商参考名录（2020版）》收录了近年承担过各级采购任务以及参与过救灾应急、救灾捐赠和防灾减灾宣传等公益事业的企业，供各级在物资应急采购储备工作中参考。具体当地企业情况及招标要求，请向发标单位咨询。","consultTime":"2022-06-02","replyTime":"2022-06-02","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":true},{"id":"5-17","title":"应急救灾物资品种具体是哪些？","consult":"目前，应急管理部管理的中央应急物资品种包括24大类198个品种，想了解198个品种具体是哪些？","reply":"目前，应急管理部管理的中央应急物资品种包括国家森林草原防灭火物资5大类45个品种、中央防汛抗旱物资5大类66个品种、安全生产应急救援物资4大类17个品种、消防救援队伍应急物资5大类37个品种、森林消防队伍应急物资2大类12个品种、中央救灾物资3大类21个品种。根据应急物资保障工作面临的新形势、新任务、新要求，我们将及时调整确定物资品类品种并按照政府采购要求以公开招标方式予以补充。","consultTime":"2022-01-07","replyTime":"2022-01-09","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-18","title":"2018-2020年紧急调拨帐篷、衣被等数据如何获取？","consult":"您好，请问2018-2020年全年的紧急调拨帐篷、紧急调拨衣被、紧急调拨睡袋等数据是否有统计？可以以什么方式获取。目前应急物资保障规划及需求计划是否公开，学术研究使用。","reply":"已与本人电话沟通并答复相关内容，本人回复无意见。","consultTime":"2021-03-13","replyTime":"2021-03-17","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-19","title":"关于应急物资是否有统一的储备年限要求和管理规章？","consult":"您好，我想咨询一下，关于应急物资是否有统一的储备年限要求和管理规章？","reply":"已电话与留言人沟通解答其相关问题，留言人无不同意见。","consultTime":"2022-04-19","replyTime":"2022-04-20","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-20","title":"平台是否有全国应急物资储量量和储备地点的具体数据如何获得以上数据？","consult":"您好，我是在校博士生，做关于应急物资储备方向的研究，请问1是否有最新应急物资储备分类和明细；2应急资源管理平台是否有全国应急物资储量量和储备地点的具体数据，如何获得以上数据。","reply":"目前，应急管理部管理的中央应急物资品种包括国家森林草原防灭火物资、中央防汛抗旱物资、安全生产应急救援物资、消防救援队伍应急物资、森林消防队伍应急物资和中央救灾物资。根据应急物资保障工作面临的新形势、新任务、新要求，我们将及时调整确定物资品类品种并按照政府采购要求以公开招标方式予以补充。","consultTime":"2021-10-19","replyTime":"2021-10-25","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-21","title":"洪涝灾害应急物资储备清单是否公开？","consult":"您好，我是一名在校研究生，因研究需要想咨询几个问题：1.需要我国洪涝灾害应急物资储备的清单，请问是否方便公布？2.应急物资储备的储存期限和分配方式是怎样的？","reply":"目前，应急管理部管理的中央应急物资品种包括中央防汛抗旱物资5大类66个品种、中央救灾物资3大类21个品种。根据应急物资保障工作面临的新形势、新任务、新要求，我们将及时调整确定物资品类品种并按照政府采购要求以公开招标方式予以补充。应急物资种类较多，不同品种物资使用性能、原材料、加工工艺、存储自然环境等均存在差异，因此目前暂无统一的储备年限要求。目前，应急管理部正在配合国家粮食和物资储备局、财政部等相关部门修改完善《中央防汛抗旱物资储备管理办法》和《中央救灾物资储备管理办法》等应急物资管理规章制度。","consultTime":"2021-12-15","replyTime":"2021-12-20","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-22","title":"应急物资是否有年度折旧率，如有应如何计算？","consult":"你好我想咨询一下：每个城市都会采购应急物资和应急救援装备，而且应急物资种类繁多，应急物资应当属于国有资产，那么每年是否有折旧率呢如果有，折旧率应该怎么计算呢？","reply":"请参阅《政府会计准则第6号——政府储备物资》等会计准则及会计制度。","consultTime":"2022-01-10","replyTime":"2022-01-11","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-23","title":"应急物资由哪个部门管理？如何理解“中风险地区”“二级响应所需物资”？","consult":"1. 根据应急部门和粮储部门的职责分工，应急物资的储备和日常管理由粮储部门负责，当前中央应急物资6大项是否均由粮储部门储备管理，还是部分救灾物资由粮储部门负责？有哪几大类物资移交至粮储部门进行储备？2. 《国家防灾减灾救灾委员会办公室关于进一步加强应急抢险救灾物资保障体系和能力建设的指导意见》国防减灾办发〔2024〕13号中提到“中风险地区”“二级响应所需物资”，怎么确定自己所在地区属中风险还是中风险以下？二级响应所需物资的种类、数量等标准在哪里查询？3、应急物资的轮换、报废等是否有明确的管理办法？","reply":"1.根据《深化党和国家机构改革方案》《中央应急抢险救灾物资储备管理暂行办法》（国粮应急规〔2023〕24号）等，生活救助类和防汛抗旱类中央应急抢险救灾物资由国家粮食和物资储备局负责收储、轮换和日常管理工作。2.可通过《第一次全国自然灾害综合风险普查公报》查看所在地区是否属于“中风险地区”。应急抢险救灾物资储备种类可参考《国家防灾减灾救灾委员会办公室关于进一步加强应急抢险救灾物资保障体系和能力建设的指导意见》（国防减救灾办〔2024〕13号）附件1“地方各级应急物资储备指导目录”相关内容，保障数量参考本地区2级响应标准，相关标准见相应的本地预案。3.应急抢险救灾物资轮换、报废参照《中央应急抢险救灾物资储备管理暂行办法》（国粮应急规〔2023〕24号）有关规定，结合本地区储备管理部门具体管理办法。","consultTime":"2026-01-09","replyTime":"2026-01-15","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":true},{"id":"5-24","title":"有较大危险因素的场所设施和设备如何定义？","consult":"应急管理部6号令第27条第一项中的有较大危险因素的场所设施和设备如何定义？","reply":"感谢您的留言。工贸企业参照《工贸行业较大危险因素辨识及防范指导手册》执行。该文件在应急管理部官方网站(https://www.mem.gov.cn/gk/gwgg/201604/t20160401_241496.shtml)可下载。","consultTime":"2022-02-21","replyTime":"2022-02-28","dept":"安全执法和工贸监管局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-25","title":"专家要求告知牌标注风险等级和应急装备，是否必须整改？","consult":"企业按照应急管理部《有限空间作业安全指导手册》附录2“有限空间作业安全告知牌示例”，制作并现场设置了安全告知牌。但是有专家在检查时提出“告知牌上未标注风险等级或未载明应急装备、器材”等等类似问题，企业必须按照专家提出的问题进行整改吗？今天这个专家说告知牌应该这样做、明天另一个专家说那样做，有些地方又出台了地方标准，这样改来改去、企业负担太大了，企业该如何做？","reply":"感谢您的留言。《有限空间作业安全指导手册》附录2 有限空间作业场所安全警示标志和安全告知牌，供参考。目前法律法规对其内容尚无规定，企业应根据自身实际情况设置。","consultTime":"2021-11-02","replyTime":"2021-11-09","dept":"安全执法和工贸监管局","chapter":"非煤矿山安全","hasLocalRef":true},{"id":"5-26","title":"有限空间作业，多少人进入就配备多少空气呼吸器或自救器，还是2个以上就可以？","consult":"有限空间作业，多少人进入就配备多少空气呼吸器或自救器，还是2个以上就可以？没有找到统一的规范标注按要求！","reply":"感谢您的留言。工贸企业应根据有限空间存在的安全风险、作业类型、作业人数，以及一旦发生事故后的应急处置措施，决定作业现场配备应急物资装备的种类和数量。","consultTime":"2022-03-03","replyTime":"2022-03-10","dept":"安全执法和工贸监管局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-27","title":"涉粉尘企业的中央除尘系统是否属于安全设备？","consult":"涉粉尘企业一般都会安装中央除尘系统，基层应急管理部门执法人员在检查涉粉尘企业的过程中，对于涉粉尘企业的中央除尘系统是否属于安全设备存在争议。","reply":"感谢您的留言。中央除尘系统不属于安全设备。根据《工贸企业粉尘防爆安全规定》（应急管理部令第6号）第十七条，粉尘防爆相关的泄爆、隔爆、抑爆、惰化、锁气卸灰、除杂、监测、报警、火花探测消除等是安全设备。","consultTime":"2021-11-18","replyTime":"2021-11-25","dept":"安全执法和工贸监管局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-28","title":"应急物资应多久检查一次、多久更新一次，有无明确规定？","consult":"请问应急物资应多久检查一次，多久进行更新一次，谢谢！","reply":"应急物资品类众多，应参照同类别常规物资储备时间确定检查和更新周期。根据应急物资有关管理办法，其中救灾类物资一年检查一般不少于两次，根据相应物资的推荐储备年限，超过年限的经质检机构抽样检测后决定报废、继续存储或更新。","consultTime":"2022-11-16","replyTime":"2022-11-22","dept":"救灾和物资保障司","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-29","title":"企业应急救援领导小组成员值班是否满足24小时应急值班要求？","consult":"生产安全事故应急条例第十四条规定“规模较大、危险性较高的易燃易爆物品、危险化学品等危险物品的生产、经营、储存、运输单位应当成立应急处置技术组，实行24小时应急值班。”请问这个是必须应急处置技术组成员值班吗，企业应急救援领导小组成员值班能不能满足此项要求。","reply":"之所以要求应急处置技术组实行24小时应急值班，主要是考虑危险物品种类繁多、理化性质各异，应急处置技术、方案和措施等存在较大差异，应急救援队伍开展应急救援时，需要有专门的技术人员为其提供专业指导和智能支持，以便正确有效处置险情或者事故，降低次生、衍生事故发生的风险。","consultTime":"2021-01-31","replyTime":"2021-02-01","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-30","title":"基层或企事业应急响应是否必须分四级？","consult":"根据《突发事件应对法》第三条、第七条，事件分四级、应急响应也分四级，这是对国家和县级以上人民政府的要求还是对所有层面的要求？对于基层单位或者企事业单位，“应急预案”中必须对事件分为四级吗？“应急响应”也必须分四级吗？","reply":"根据《突发事件应对法》第三条规定，突发事件一般分为特别重大、重大、较大和一般四级，分级标准由国务院或者国务院确定的部门制定，一般在国家专项预案和部门预案中体现。根据《突发事件应对法》第七十一条规定，突发事件的应急响应级别分为一级、二级、三级和四级，一级为最高级别。该条适用于县级以上人民政府及其有关部门应急预案，并未对基层单位或者企事业单位应急预案提出明确规定。","consultTime":"2024-11-29","replyTime":"2024-12-03","dept":"救援协调和预案管理局","chapter":"非煤矿山安全","hasLocalRef":true},{"id":"5-31","title":"生产安全事故应急条例第十四条，如何理解应急值班？","consult":"生产安全事故应急条例第十四条，如何理解应急值班？管道企业机关设置调度中心专人24小时值班值守，企业下设多个管理处，管理处负责管理所辖管道和场站，基层场站设置专人24小时值班值守，管理处不具有独立法人资格管理处机关不设置在生产现场，机关是否还需设置专门值班室24小时值班？安排人员24小时携带值班电话，晚间带机回家应急，是否可以？","reply":"根据《生产安全事故应急条例》第十四条相关规定，危险物品的生产、经营、储存、运输单位以及矿山、金属冶炼、城市轨道交通运营、建筑施工单位应当建立值班制度，配备应急值班人员。管理处机关虽然不在生产现场，但是在生产安全事故发生时能够起到总体组织调度作用，能够快速组织救援力量，统筹调度资源开展先期处置，及时向政府及有关部门报告事故险情等。因此按照法条相关规定及立法本意，管理处机关需要实行24小时应急值班。","consultTime":"2021-08-20","replyTime":"2021-09-22","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-32","title":"编制现场应急处置方案需要论证吗？","consult":"请教一下，企业针对现场危险因素编制现场应急处置方案需要组织专家评审论证吗？","reply":"是否组织专家评审论证由企业根据实际情况自主决定，如果企业对编制的现场应急处置方案心里没底，可以组织专家评审论证。","consultTime":"2021-01-15","replyTime":"2021-01-19","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-33","title":"三级公司的应急演练的组织人应该是哪个职务？","consult":"三级公司的应急演练的组织人应该是哪个职务？","reply":"你好，《中华人民共和国安全生产法》第二十一条规定，生产经营单位的主要负责人履行的职责之一是“组织制定并实施本单位的生产安全事故应急救援预案”；第五条规定，“其他负责人对职责范围内的安全生产工作负责”；第二十五条规定，生产经营单位的安全生产管理机构以及安全生产管理人员履行的职责之一是“组织或者参加本单位应急救援演练”。根据上述规定，生产经营单位的主要负责人、负责安全生产工作的其他负责人、安全生产管理机构负责人以及安全生产管理人员，均可组织本单位的应急演练。请结合公司实际以及公司所在地方的有关规定，确定应急演练的组织人。","consultTime":"2023-12-24","replyTime":"2023-12-25","dept":"国家安全生产应急救援中心","chapter":"非煤矿山安全","hasLocalRef":true},{"id":"5-34","title":"社会力量抢险救灾吗要以组织的名义进行报名吗？","consult":"社会力量抢险救灾吗要以组织的名义进行报名吗？高校研究生如何参与？","reply":"应急管理部门欢迎社会力量和应急志愿者投身防灾减灾救灾工作，参与各类灾害事故救援。考虑到灾害事故普遍具有一定危险性，救援人员需要具备一定的专业技能和救援经验，我们提倡广大应急志愿者通过加入相关机构、社会应急力量组织等参与抢险救灾活动，普通应急志愿者可以承担危险性较低的抢险救灾辅助工作。具体可与本地应急管理部门或相关应急救援组织取得联系。","consultTime":"2020-10-10","replyTime":"2020-10-15","dept":"救援协调和预案管理局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"5-35","title":"加入社会救援服务机构的条件是什么？","consult":"想问一下加入社会救援服务机构的条件是什么？","reply":"应急管理部门欢迎应急志愿者投身防灾减灾救灾工作，参与各类灾害事故救援和应急志愿服务。考虑到应急救援普遍具有一定危险性，我们建议加入社会应急力量前，应首先具备一定的专业技能和救援经验，普通应急志愿者可以承担危险性较低的抢险救灾辅助工作。感谢您对应急管理工作的支持。","consultTime":"2022-03-27","replyTime":"2022-04-01","dept":"救援协调局","chapter":"非煤矿山安全","hasLocalRef":false},{"id":"6-01","title":"493号令第九条“负有安全生产监督管理职责的有关部门”具体指哪些部门？","consult":"第九条中所规定的“负有安全生产监督管理职责的有关部门”是指哪些部门？请予明示并文字回复为感！","reply":"《安全生产法》第九条规定：国务院安全生产监督管理部门依照本法，对全国安全生产工作实施综合监督管理；县级以上地方各级人民政府安全生产监督管理部门依照本法，对本行政区域内安全生产工作实施综合监督管理。 国务院有关部门依照本法和其他有关法律、行政法规的规定，在各自的职责范围内对有关行业、领域的安全生产工作实施监督管理；县级以上地方各级人民政府有关部门依照本法和其他有关法律、法规的规定，在各自的职责范围内对有关行业、领域的安全生产工作实施监督管理。 安全生产监督管理部门和对有关行业、领域的安全生产工作实施监督管理的部门，统称负有安全生产监督管理职责的部门。","consultTime":"2020-11-17","replyTime":"2020-12-02","dept":"安全生产应急救援中心","chapter":"工贸行业安全","hasLocalRef":true},{"id":"6-02","title":"事故批复被复议，是否可以根据批复意见进行立案处罚？","consult":"2021年3月3日，区应急局已将“区政府事故报告批复”及“事故报告”送达事故责任单位。对“区政府事故报告批复”事故单位向市政府提出行政复议。在此情况下，区应急局是否可以按批复意见对事故单位进行立案处罚，而不必等待复议结果？","reply":"《行政复议法》第二十一条规定：“行政复议期间具体行政行为不停止执行；但是，有下列情形之一的，可以停止执行：（一）被申请人认为需要停止执行的；（二）行政复议机关认为需要停止执行的；（三）申请人申请停止执行，行政复议机关认为其要求合理，决定停止执行的；（四）法律规定停止执行的。”","consultTime":"2021-03-24","replyTime":"2021-07-29","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-03","title":"县应急管理局是否拥有一般安全生产事故组织调查的权利？","consult":"泾阳县管网县应急管理局主要职责http:www.snjgyang.gov.cngkbmzn79875.htm第十三依法组织指导全县范围内生产安全事故调查处理，监督事故查处和责任迫究整改措施落实情况。组织开展自然灾害类突发事件的调查评估工作.生产安全事故报告和调查处理条例一般事故由县级人民政府负责调查.县应急管理局是否拥有事故组织调查的权利？","reply":"《生产安全事故报告和调查处理条例》（国务院令第493号）第十九条　特别重大事故由国务院或者国务院授权有关部门组织事故调查组进行调查。重大事故、较大事故、一般事故分别由事故发生地省级人民政府、设区的市级人民政府、县级人民政府负责调查。省级人民政府、设区的市级人民政府、县级人民政府可以直接组织事故调查组进行调查，也可以授权或者委托有关部门组织事故调查组进行调查。未造成人员伤亡的一般事故，县级人民政府也可以委托事故发生单位组织事故调查组进行调查。第二十九条　事故调查组应当自事故发生之日起60日内提交事故调查报告；特殊情况下，经负责事故调查的人民政府批准，提交事故调查报告的期限可以适当延长，但延长的期限最长不超过60日。第三十四条　事故处理的情况由负责事故调查的人民政府或者其授权的有关部门、机构向社会公布，依法应当保密的除外。","consultTime":"2021-09-07","replyTime":"2021-09-22","dept":"调查评估和统计司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-04","title":"太原景区冰雕馆火灾（13人死亡）事故调查报告如何查阅获取？","consult":"麻烦咨询下太原一景区冰雕馆发生火灾，死亡13人的事故调查报告，谢谢。","reply":"按照《生产安全事故报告和调查处理条例》中第十九条的规定，山西太原台骀山景区“10·1”重大火灾事故由山西省人民政府负责调查,山西省已经成立了由应急管理厅主要负责人为组长的事故调查组进行调查处理。请咨询山西省应急管理厅。","consultTime":"2021-06-26","replyTime":"2021-06-28","dept":"调查评估和统计司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-05","title":"生产安全事故报告和调查处理条例是否有效？","consult":"生产安全事故报告和调查处理条例现在有效版本是那个，怎么下载确认？","reply":"根据《立法法》第七十一条第二款规定，在国务院公报上刊载的行政法规文本为标准文本。请至国务院网站“国务院政策文件库”下载《生产安全事故报告和调查处理条例》。","consultTime":"2021-06-01","replyTime":"2021-07-21","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-06","title":"发生轻伤事故是否需要上报？未报是否构成瞒报？","consult":"生产经营单位从业人员在生产经营过程中发生事故造成轻伤，生产经营单位是否应按相关规定对事故情况进行上报？如未按规定进行上报，是否构成瞒报？是否应按相关规定对其瞒报行为进行处罚？","reply":"按照《生产安全事故报告和调查处理条例》规定，生产经营单位发生生产安全事故应当依照法定时限及时报告有关部门，谎报、瞒报事故的依法予以处罚。如您发现相关违法行为，请按照该法规规定的事故调查处理权限，向有关政府或部门反映举报。","consultTime":"2021-09-29","replyTime":"2021-09-29","dept":"调查评估和统计司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-07","title":"个体经济组织发生一般伤亡事故怎么调查处理以及适用什么法律条文？","consult":"我市近二十年没有审批农民自建房了，部分农民自建房将要进行维修，假如某房主请了两名个体工匠在编修房屋过程中，其中一名工匠从屋顶上摔下来了，发生死亡一人的一般生产安全事故。请问调查组该如何做？","reply":"您提出的问题要考虑事故具体情况和情节。如实际并未发生，仅做理论探讨，建议请学习研究事故调查处理有关法规制度规定。","consultTime":"2021-10-09","replyTime":"2021-10-13","dept":"调查评估和统计司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-08","title":"生产安全事故有什么具体规定，怎么处理？","consult":"我的问题如下：1.事故类别2.统计指标3.有关事故处理的行业有哪些？","reply":"所有行业发生的生产安全事故按照相关规定均应进行事故调查处理。","consultTime":"2020-09-28","replyTime":"2020-10-29","dept":"调查评估和统计司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-09","title":"生产安全事故立案调查的条件及时间要求？","consult":"您好，我想咨询企业发生生产安全事故一死两伤后安监部门的立案调查条件及立案调查后需要多少时间出具调查结论，又需要多少时间可以将调查结论公示在应急管理网？","reply":"按照《安全生产法》《生产安全事故报告和调查处理条例》等法律法规规定，生产安全事故发生后，各级人民政府必须按照事故等级和管辖权限，依法开展事故调查，特别重大事故由国务院或者国务院授权有关部门组织事故调查组进行调查。重大事故、较大事故、一般事故分别由事故发生地省级人民政府、设区的市级人民政府、县级人民政府负责调查。事故调查组应当自事故发生之日起60日内提交事故调查报告;特殊情况下，经负责事故调查的人民政府批准，提交事故调查报告的期限可以适当延长，但延长的期限最长不超过60日。重大事故、较大事故、一般事故，负责事故调查的人民政府应当自收到事故调查报告之日起15日内做出批复；特别重大事故，30日内做出批复，特殊情况下，批复时间可以适当延长，但延长的时间最长不超过30日。事故处理的情况由负责事故调查的人民政府或者其授权的有关部门、机构向社会公布，依法应当保密的除外。","consultTime":"2021-07-20","replyTime":"2021-07-23","dept":"调查评估和统计司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-10","title":"发生较大安全生产事故后，生产负责人被判缓刑，还能在原单位继续任职吗？","consult":"某企业发生一起因违章动火导致爆炸的安全事故，致三人死亡，当地依法追究了相关责任人，其中生产负责人被判三年有期徒刑缓刑四年，请问该人员能否继续在该企业担任职务从事生产领导工作？","reply":"依照现行《中华人民共和国安全生产法》第九十一条规定，生产经营单位的主要负责人未履行本法规定的安全生产管理职责的，责令限期改正；逾期未改正的，处二万元以上五万元以下的罚款，责令生产经营单位停产停业整顿。生产经营单位的主要负责人有前款违法行为，导致发生生产安全事故的，给予撤职处分；构成犯罪的，依照刑法有关规定追究刑事责任。生产经营单位的主要负责人依照前款规定受刑事处罚或者撤职处分的，自刑罚执行完毕或者受处分之日起，五年内不得担任任何生产经营单位的主要负责人；对重大、特别重大生产安全事故负有责任的，终身不得担任本行业生产经营单位的主要负责人。依法被追究刑事责任的管理人员能否继续在该企业担任职务从事生产领导工作需要结合实际具体分析，依法处理。","consultTime":"2021-04-10","replyTime":"2021-07-29","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":true},{"id":"6-11","title":"工贸行业有限空间不能界定是否作业场所是否需要设置安全警示标志，处罚依据是什么？","consult":"在平时执法中，发现工贸行业有限空间未设置安全警示标志如深2.5m地下蓄水池。《工贸企业有限空间作业安全管理与监督暂行规定》第十九条“”工贸企业有限空间作业还应当符合下列要求：二设置明显的安全警示标志和警示说明；”第四章法律责任一未在有限空间作业场所设置明显的安全警示标志的；表述的都是有限空间正在作业或者确定需要作业。而有限空间事故也并非进入作业时发生,如不慎坠入。如处罚，依据是什么？","reply":"感谢您的留言。依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号），企业应在有限空间作业场所设置明显的安全警示标志。","consultTime":"2021-09-02","replyTime":"2021-09-09","dept":"安全执法和工贸监管局","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-12","title":"《生产安全事故罚款处罚规定（试行）》是否还有效力？","consult":"《生产安全事故罚款处罚规定（试行）》自2015年5月1日起施行，五年过去了，是否还具有法律效力？","reply":"《生产安全事故罚款处罚规定（试行）》是现行有效的部门规章。","consultTime":"2021-02-25","replyTime":"2021-07-29","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-13","title":"监理单位是否属于安法中的生产经营单位？事故是否适用第109条？","consult":"请问工程监理单位属于安法中的生产经营单位吗？建设工程发生事故，是否适用安法第109条对监理单位进行处罚？","reply":"《安全生产法》第二条规定，“在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法”。依照本条规定，《安全生产法》适用的主体范围，是指一切合法或者非法从事生产经营活动的企业、事业单位和个体经济组织以及其他组织，不论其性质如何规模大小，只要是在中华人民共和国领域内从事生产经营活动，都应遵守《安全生产法》的各项规定。","consultTime":"2021-06-10","replyTime":"2021-07-21","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-14","title":"租赁仓库储存危化品发生事故，承租方有无安全监管责任？","consult":"我单位想租赁一个仓库存放危险化学品，该仓库符合法律法规的要求，按照规定签署合同和安全协议，如果因为我方人员操作失误发生事故 请教承租方是否也有一定责任以及承租方是否有对租赁费安全监管的义务   谢谢？","reply":"您好，根据《安全生产法》第四十九条，生产经营项目、场所发包或者出租给其他单位的，生产经营单位应当与承包单位、承租单位签订专门的安全生产管理协议，或者在承包合同、租赁合同中约定各自的安全生产管理职责；生产经营单位对承包单位、承租单位的安全生产工作统一协调、管理，定期进行安全检查，发现安全问题的，应当及时督促整改。感谢留言。","consultTime":"2022-02-25","replyTime":"2022-02-28","dept":"危化监管二司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-15","title":"政府对主要负责人的个人罚款是否计入事故直接经济损失？","consult":"请问在事故中，政府对主要负责人进行个人的罚款，这个罚款算做事故的直接经济损失吗？","reply":"关于生产安全事故直接经济损失范围，请对照《企业职工伤亡事故经济损失统计标准(GB 6721-1986)》计算。","consultTime":"2021-10-13","replyTime":"2021-10-18","dept":"调查评估和统计司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-16","title":"《工贸行业较大危险因素辨识及防范指导手册》能否作为安全生产行政处罚的法律依据？","consult":"《工贸行业较大危险因素辨识及防范指导手册》能否作为处罚依据？","reply":"感谢您的留言。该文件不作为执法处罚依据。","consultTime":"2022-03-21","replyTime":"2022-03-28","dept":"安全执法和工贸监管局","chapter":"工贸行业安全","hasLocalRef":false,"_annotation":"【注释】①指导手册本身不含强制性条款，不能直接作为行政处罚的法律依据——这是依法行政的基本要求（“法无明文规定不可罚”）。②工贸行业安全生产行政处罚的合法依据应为：《安全生产法》及其配套行政法规、应急管理部部门规章（如《工贸企业重大事故隐患判定标准》）、强制性国家标准（GB系列）。③手册的作用在于帮助执法人员和企业识别较大危险因素，是监管的技术参考工具而非执法依据。执法时应当引用上述法律法规和强制性标准的具体条款作为处罚依据。④2023年应急管理部发布的《工贸企业重大事故隐患判定标准》（应急管理部令第10号）是目前工贸行业执法检查的核心依据之一。\n【依据】《安全生产法》；《工贸企业重大事故隐患判定标准》（应急管理部令第10号，2023年）"},{"id":"6-17","title":"《安法》和《行政处罚办法》第四十五条中“其他有关人员”指哪些人？","consult":"关于《安全生产法和安全生产违法行为行政处罚办法》第四十五条请求解读，其他有关人员具体都包含哪些人员？","reply":"您好！《安全生产违法行为行政处罚办法》第四十五条规定的“其他人员”是指生产经营单位除主要负责人以外的其他从事生产经营活动各项工作的所有人员，包括管理人员、技术人员和各岗位的工人，也包括临时聘用的人员和被派遣劳动者。","consultTime":"2021-05-19","replyTime":"2021-07-21","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-18","title":"行政处罚办案期限是否包含立案当日？届满遇节假日是否顺延？","consult":"《安全生产违法行为行政处罚办法》规定了办案期限为从立案之日起30日内，请问此处的30日期限是否包含立案当日，如果届满当天遇到休息日或法定节假日，是否顺延至休息日或节假日结束后的第一个工作日？假设在国庆假期前一天发现违法行为，是否就只能在发现当天完成立案？","reply":"您好！《行政处罚法》未对行政处罚涉及的期间作出规定，实践中参照《民法典》《公安机关办理行政案件程序规定》《市场监督管理行政处罚程序暂行规定》等相关规定，按照年、月、日计算期间的，开始的当日不计入，自下一日开始计算，期间最后一日是法定休假日的，以法定休假日结束的次日为期间的最后一日。","consultTime":"2021-05-07","replyTime":"2021-07-21","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-19","title":"对责令停产停业整顿的企业，在案卷中是否还需下达责令限期整改文书？","consult":"安全生产执法和工贸安全监督管理局领导：你们好，我想咨询下关于执法案卷制作的一些问题。我们在执法检查中发现某企业违法行为较多，认为企业不具备安全生产条件，根据我省安全生产条例，决定给予其责令停产停业整顿的行政处罚。那么，在案卷中是否要对其下达责令限期整改文书？结案是以企业已经停产停业作为结案还是企业复查整改验收合格结案？","reply":"感谢您的留言。责令停产停业整顿作为行政处罚的种类之一，应按照《行政处罚法》和《安全生产违法行为行政处罚办法》的有关规定履行相关程序，并规范制作文书，做好案卷归档。","consultTime":"2021-05-25","replyTime":"2021-05-31","dept":"安全执法和工贸监管局","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-20","title":"半身式安全带是否仍可使用？与全身式安全带的适用范围有何区别？","consult":"您好，我们是一家机械企业，有时会存在登高作业维修的情况，我们登高作业的高度是2米到10米的距离，有的地方会使用梯子，有的地方会使用脚手架，有的地方会使用登高车，我想咨询下，这种登高的情况国家有没有要求，我是使用半身式安全带还是使用全身式安全带，如果要求使用全身式或者半身式安全带，我使用半身式或者全身式安全带，安全生产执法时会不会对我们进行处罚。谢谢！","reply":"感谢您的留言。机械行业企业的维修作业可参照相关行业高处作业安全标准要求执行；另外，中机安协制定的《机械制造企业安全生产标准化考核评级规范》的团体标准中“表F.12”规定了高处作业安全要点。","consultTime":"2020-12-15","replyTime":"2020-12-22","dept":"安全执法和工贸监管局","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-21","title":"未经许可经营危化品已移送刑事追究，是否还需行政处罚？","consult":"根据举报，查获一起未经许可擅自经营油漆、稀释剂等危险化学品，将5吨左右危险化学品存放在家中，周围全是居民房。根据《刑法》修正案十一，该行为构成危险作业罪，应移送公安机关查处，追究刑事责任。但对该行为是否还要依据《危险化学品管理条例》再给予行政处罚，没收违法经营的危险化学品以及违法所得？如果给予行政处罚是否构成一罪两罚？","reply":"《中华人民共和国行政处罚法》第二十七条规定，“违法行为涉嫌犯罪的，行政机关应当及时将案件移送司法机关，依法追究刑事责任。对依法不需要追究刑事责任或者免予刑事处罚，但应当给予行政处罚的，司法机关应当及时将案件移送有关行政机关。行政处罚实施机关与司法机关之间应当加强协调配合，建立健全案件移送制度，加强证据材料移交、接收衔接，完善案件处理信息通报机制”。第三十五条规定：“违法行为构成犯罪，人民法院判处拘役或者有期徒刑时，行政机关已经给予当事人行政拘留的，应当依法折抵相应刑期。违法行为构成犯罪，人民法院判处罚金时，行政已经给予当事人罚款的，应当折抵相应罚金；行政机关尚未给予当事人罚款的，不再给予罚款。”2019年，应急管理部、公安部、最高人民法院、最高人民检察院联合印发《安全生产行政执法与刑事司法衔接工作办法》，有关行政机关应当按照法律和上述文件的规定办理行政执法与刑事司法衔接工作。","consultTime":"2021-03-25","replyTime":"2021-07-29","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-22","title":"基层应急管理综合行政执法改革何时落实？","consult":"目前我县正在进行应急管理综合行政执法队伍改革，中省市改革文件明确规定要在两年内消化不同身份性质的执法人员，但目前县级层面行政执法队伍性质为事业，这与逐渐消化不同身份性质有所冲突，请问部里对此如何看待？","reply":"感谢您的留言。在综合行政执法改革过程中，针对各类执法队伍编制身份问题，中编办明确执法队伍不同性质编制目前保持现状，暂不改变，待中央统一明确政策意见后，逐步加以规范。应急部将按照中央统一安排，持续推动地方各级应急管理部门加强执法队伍建设。","consultTime":"2021-07-07","replyTime":"2021-07-13","dept":"安全执法和工贸监管局","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-23","title":"安全生产领域违法行为法律责任部分的罚款幅度中的“以下”包含本数吗？处罚怎样具体实施？","consult":"1.安全生产领域违法行为法律责任部分的罚款幅度中的“以下”包含本数吗？2.《危险化学品安全管理条例》第80条“生产、储存、使用危险化学品的单位有下列情形之一的，由安全生产监督管理部门责令改正，处5万元以上10万元以下的罚款；···”“有下列情形之一的，处5-10万“如何理解：若是同时违反多项如何处罚？是每一项在5-10万间分别裁量，再合并处罚？还是即使违反多项的，也总体在5-10万元间处罚？","reply":"1.法律、行政法规、部门规章中对本法律文件中出现的“以下”有规定的，依照其规定执行；没有规定的，参考《立法技术规范》（试行）（一）的规定：24.规范年龄、期限、尺度、重量等数量关系，涉及以上、以下、以内、不满、超过的规定时，“以上、以下、以内”均含本数，“不满、超过”均不含本数。2.《中华人民共和国行政处罚法》第二十九条规定:“对当事人的同一个违法行为，不得给予两次以上罚款的行政处罚。同一个违法行为违反多个法律规范应当给予罚款处罚的，按照罚款数额高的规定处罚”。如何处罚，应根据实际情况，考量是否是同一个违法行为。","consultTime":"2021-03-27","replyTime":"2021-07-29","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":true},{"id":"6-24","title":"《安全生产行政处罚自由裁量标准的通知》安监总政法〔2010〕137号是否仍在使用？","consult":"《国家安全监管总局关于印发安全生产行政处罚自由裁量标准的通知》安监总政法〔2010〕137号文件是否仍在使用，是否有更新的安全生产行政处罚自由裁量标准颁布并实施。","reply":"您好，感谢您对应急管理工作的关注。《国家安全监管总局关于印发安全生产行政处罚自由裁量标准的通知》安监总政法〔2010〕137号文件仍在使用，没有新的安全生产行政处罚自由裁量标准颁布实施。","consultTime":"2022-05-17","replyTime":"2022-05-18","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-25","title":"安全生产行政处罚自由裁量标准（2018版）正式实行了吗？","consult":"请问一下《安全生产行政处罚自由裁量标准（2018版）》正式实行了吗？在网站无法搜到相关正式发布的信息，在此求证，谢谢。","reply":"您好，《安全生产行政处罚自由裁量标准（2018版）》未颁布实施。","consultTime":"2021-03-10","replyTime":"2021-07-29","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-26","title":"市级应急部门能否直接对县级非应急管辖企业执法？","consult":"市应急部门执法机构是否有权对旗县市非应急部门管辖的企业进行安全生产执法。例如市应急局执法部门对旗县市房地产企业、公路交通施工企业等直接进行执法。我的观点是市应急部门执法机构仅对直接监管的行业有执法职能，但可以参与安委办组织的对非应急部门监管的其它行业主管部门及部分企业进行监督检查抽查，而非执法检查。不知理解是否有误。请给与解答，谢谢。","reply":"按照《安全生产法》第九条之规定，各有关部门在各自的职责范围内对有关行业、领域的安全生产工作实施监督管理。各级应急管理部门应按照分类分级执法原则，分别对执法管辖权限范围内生产经营单位开展执法活动。各级应急管理部门可结合实际履行综合监督管理职责，参与相应安委会办公室组织的各类监督检查。","consultTime":"2021-04-06","replyTime":"2021-04-12","dept":"安全执法和工贸监管局","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-27","title":"推荐性标准（GB/T类）的法律效力如何？企业可否选择性执行？与强制性标准有何区别？","consult":"1. 推荐性标准的法律效力？2. 推荐性标准，企业是否可以选择性执行？3. 若选择执行GB/T标准（比如GB/T12801-2008&lt;生产过程安全卫生要求总则&gt;），执行过程中出现不符合项，是否有处罚整改的效力依据？","reply":"《中华人民共和国标准化法》第二条第三款规定：“强制性标准必须执行。国家鼓励采用推荐性标准。”企业公开声明执行的推荐性标准具有法律效力。对于违反强制性标准、公开声明执行的推荐性标准的行为应当依法给予行政处罚。","consultTime":"2021-05-06","replyTime":"2021-06-28","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-28","title":"部级和省级举报奖励办法中排除条款是否一致？","consult":"请问贵部2018年《安全生产领域举报奖励办法》第七条“具有安全生产管理、监管、监察职责的工作人员及其近亲属或其授意他人的举报不在奖励之列”和我省安全生产举报奖励办法中“依法承担安全生产监管职责的单位、组织和个人在其工作职责范围内发现的安全生产重大事故隐患和非法违法行为，不属于本办法奖励范围”，这两个条款表达意思是否一致？","reply":"按照《安全生产领域举报奖励办法》第二条、第五条有关规定，该《办法》适用于重大事故隐患和安全生产违法行为的举报奖励。其他负有安全生产监督管理职责的部门对所监管行业领域的安全生产举报奖励另有规定的，依照其规定。重大事故隐患是指危害和整改难度较大，应当全部或者局部停产停业，并经过一定时间整改治理方能排除的隐患，或者因外部因素影响致使生产经营单位自身难以排除的隐患。举报事项需经当地安全监管职责的部门核查是否属于重大事故隐患或安全违法行为，经核查属实的，应给予举报人现金奖励。但按照该《办法》第七条规定，具有安全生产管理、监管、监察职责的工作人员及其近亲属或其授意他人的举报不在奖励之列。","consultTime":"2024-09-28","replyTime":"2024-09-30","dept":"规划财务司","chapter":"工贸行业安全","hasLocalRef":true},{"id":"6-29","title":"生产经营单位被责令停产停业整顿是否属于严重失信行为？","consult":"依据国家发展改革委办公厅《关于进一步完善“信用中国”网站及地方信用门户网站行政处罚信息信用修复机制的通知》发改办财金〔2019〕527号关于对涉及特定严重失信行为的行政处罚信息严格按最长公示期限予以公示的规定，其中涉及安全生产领域被处以责令停产停业的行政处罚信息。信用中国据此文件表示被责令停产停业整顿亦属于严重失信行为。请问生产经营单位被责令停产停业整顿是否属于严重失信行为吗？","reply":"目前是否将生产经营单位纳入安全生产领域联合惩戒黑名单按照《对安全生产领域失信行为开展联合惩戒的实施办法》（安监总办〔2017〕49号）进行管理，49号文中第二条第五项规定：“被责令停产停业整顿，仍然从事生产经营建设活动的”纳入安全生产领域失信联合惩戒黑名单。其他情况或问题请向“信用中国”网站询问。","consultTime":"2021-09-03","replyTime":"2021-09-06","dept":"调查评估和统计司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-30","title":"《安全生产行政处罚自由裁量标准（2018版）》是否已经执行了？","consult":"《安全生产行政处罚自由裁量标准（2018版）》是否已经执行了？","reply":"《安全生产行政处罚自由裁量标准（2018版）》未印发。","consultTime":"2021-04-28","replyTime":"2021-07-21","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-31","title":"安全生产法第一百零九条所称“以上”“以下”包含本数吗？","consult":"安全生产法第一百零九条所称“以上”“以下”包含本数吗？","reply":"法律法规规章已有规定的，按照相关规定执行。如果没有规定，按照以下规定执行：《立法技术规范》（试行）（一）规定：24.规范年龄、期限、尺度、重量等数量关系，涉及以上、以下、以内、不满、超过的规定时，“以上、以下、以内”均含本数，“不满、超过”均不含本数。","consultTime":"2021-01-06","replyTime":"2021-07-29","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":true},{"id":"6-32","title":"市县两级一线执法人员该如何界定？","consult":"《应急管理部关于加强应急管理综合行政执法用车保障工作的通知》应急〔2021〕50号中，“一、统一执法用车保障标准一保障目标”中提到“每5名在编在职的一线执法人员至少保障1辆执法用车”，其中市县两级一线执法人员该如何界定？","reply":"一线执法人员主要是指取得行政执法证件且直接赴生产经营单位开展行政执法工作的在编在职人员。各级应急管理部门内设机构和综合行政执法队伍根据职责规定开展一线执法工作的人员，均属一线执法人员。","consultTime":"2021-11-17","replyTime":"2021-11-17","dept":"安全执法和工贸监管局","chapter":"工贸行业安全","hasLocalRef":false},{"id":"6-33","title":"举报安全生产违法行为获得的奖金是否需要缴个税？","consult":"请问按照《安全生产领域举报奖励办法》（原安监总财〔2018〕19号），对市民举报安全生产重大事故隐患和违法行为进行奖励，市民需不需要上交个人所得税？依据是什么？","reply":"《财政部国家税务总局关于个人所得税若干政策问题的通知》（财税字〔1994〕20号）中第二条第四项规定，“个人举报、协查各种违法、犯罪行为而获得的奖金暂免征收个人所得税  ”，您咨询的具体问题还请向当地税务部门咨询。","consultTime":"2021-03-09","replyTime":"2021-03-12","dept":"调查评估和统计司","chapter":"工贸行业安全","hasLocalRef":true},{"id":"6-34","title":"镇区（工业园区）属地责任怎么定性？","consult":"安全生产属地责任，到镇区一级到底应该承担哪些责任？企业因为重大隐患被停电停产，现提出复产，是否需要镇区出初审意见？镇区无任何行政许可执法权利，怎么出初审意见？《安全生产法》、《江苏省安全生产条例》、《盐城市安全生产条例》都规定是协助上级人民政府有关部门履行安全生产监督管理职责，协助是到底履行哪些职责？","reply":"《安全生产法》第八条规定，乡、镇人民政府以及街道办事处、开发区管理机构等地方人民政府的派出机关应当按照职责，加强对本行政区域内生产经营单位安全生产状况的监督检查，协助上级人民政府有关部门依法履行安全生产监督管理职责。本乡、镇人民政府到底履行哪些职责，要看其上级人民政府及其相关部门具体赋予其什么职责。","consultTime":"2021-04-21","replyTime":"2021-07-21","dept":"政策法规司","chapter":"工贸行业安全","hasLocalRef":true},{"id":"6-35","title":"非法储存危化品如何定义？安法第一百条自由裁量如何适用？","consult":"非法储存危险化学品的定义什么？对于《中华人民共和国安全生产法》第一百条的自由裁量是什么？","reply":"您好，未经依法批准擅自生产、经营、运输、储存、使用危险物品或者处置废弃危险物品的行为在实践中表现形式多种多样，情况十分复杂，应根据危险物品种类不同、违法行为性质不同等，在行政处罚和刑事处罚中合法合理行使自由裁量权。","consultTime":"2022-04-14","replyTime":"2022-04-17","dept":"危化监管二司","chapter":"工贸行业安全","hasLocalRef":false},{"id":"7-01","title":"食用级二氧化碳、酒精无仓储贸易是否需要办理危化品经营许可证？如何办理？","consult":"您好，我想请问一下，做食用级二氧化碳、食用级酒精贸易，属于无生产、无仓储的经营是否需要办理危化品经营许可证？如需办理，无仓储经营是否在国家办理目录内？怎么办理？","reply":"您好，危险化学品无仓储经营许可请查阅《危险化学品经营许可证管理办法》，具体办理请咨询属地应急管理部门，感谢留言。","consultTime":"2022-04-11","replyTime":"2022-04-14","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-02","title":"产品是否需要办理危险化学品经营许可？","consult":"有一产品为混合物，危险性类别涉及危险化学品分类原则的为气溶胶类别1，闪点大于70℃，所含主要成分均为列入《目录》的危险化学品，并且主要成分质量比或体积比之和小于70。请问：1.该产品是否需要办理危险化学品经营许可？2.如果需要办理，该产品是否属于2828类？","reply":"您好，对于主要成分均为列入《目录》的危险化学品，并且主要成分质量比或体积比之和小于70%的混合物或危险特性尚未确定的化学品，生产或进口企业应根据《化学品物理危险性鉴定与分类管理办法》（国家安全监管总局令第60号）及其他相关规定进行鉴定分类，经过鉴定分类属于危险化学品确定原则的，应根据《危险化学品登记管理办法》（国家安全监管总局令第53号）进行危险化学品登记，不需要办理相关安全行政许可手续。感谢您的留言。","consultTime":"2022-03-31","replyTime":"2022-04-01","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-03","title":"外贸企业出口危化品目录内商品（非剧毒非易制毒），是否需申领危化品经营许可证？","consult":"你好，从事各种货物进出口贸易的企业，当采购并出口涉及到《危险化学品目录》中的商品非剧毒、非制毒、非制爆品种时，在出口贸易经营操作过程当中，货物质量和危包由主管海关部门进行法定检验，运输由具有危险品承运资质的单位负责，仓储由起运港口管理部门等监管。这种情况下，按照《危险品安全管理条例》第八章附则中的第九十八条规定，请问：我们外贸企业是否还需要申领《危险化学品经营许可证》？谢谢！","reply":"您好，根据《危险化学品经营许可证管理办法》，从事危化品对外贸易的企业，除“依法取得港口经营许可证的港口经营人在港区内从事危险化学品仓储经营的”情形之外，均应办理危险化学品经营许可证。感谢留言。","consultTime":"2022-08-03","replyTime":"2022-08-07","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-04","title":"已取得安全生产许可证的石油化工企业，外购生产用危化原辅料是否需办理危化品使用及经营许可证？","consult":"您好！想咨询一个问题，作为石油化工企业已经依法取得了安全生产许可证，但因生产需要，外购大量的危化品如氨气、原油等原辅料。请问是否还需要办理危化品使用许可证和经营许可证？盼回复！谢谢！","reply":"感谢您的留言，按照《危险化学品安全使用许可证实施办法》（原国家安全生产监管总局令第57号）、《危险化学品经营许可证管理办法》（原国家安全生产监管总局令第55号）有关规定，此种情况下不需要办理危险化学品使用许可证和经营许可证。","consultTime":"2021-09-22","replyTime":"2021-09-23","dept":"危化监管一司","chapter":"消防安全","hasLocalRef":false},{"id":"7-05","title":"天然气长输管道企业仅代输天然气不买卖，是否属于危化品经营活动？需办经营许可证？","consult":"《危险化学品经营许可证管理办法》中规定“在中华人民共和国境内从事列入《危险化学品目录》的危险化学品的经营包括仓储经营活动，适用本办法”。目前，有些天然气长输管道不从事天然气的买卖，只是代输天然气，收取管输费，像这种情况是否属于危险化学品的经营活动，是否需要办理危化品经营许可证？","reply":"根据《国家安全监管总局办公厅关于油气输送管道安全监管有关问题的复函》（安监总厅管三函〔2016〕84号），天然气长输管道企业应依照《危险化学品经营许可证管理办法》（国家安全生产监督管理总局令第55号）有关规定，办理危险化学品经营许可证。","consultTime":"2022-04-18","replyTime":"2022-05-18","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-06","title":"汽油、柴油票据经营是否需要办理危化品经营许可证？","consult":"领导，您好！目前多家贸易票据经营企业申请办理“汽油、柴油”的危险化学品经营许可，需要明确一下。一是，贸易票据经营企业是否可以办理《危险化学品经营许可证》？二是，是否可以给贸易票据经营企业办理“汽油、柴油”的《危险化学品经营许可证》？三是，如果可以，该证应该是由哪一级部门颁发？省级、市级或者是县级？","reply":"您好，根据《危险化学品经营许可证管理办法》，票据经营企业由县级发证机关审批、颁发，没有设立县级发证机关的，其经营许可证由市级发证机关审批、颁发。具体许可范围请咨询属地发证机关，感谢留言。","consultTime":"2022-07-06","replyTime":"2022-07-09","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-07","title":"互联网加油团购平台是否需要办理危险化学品经营许可证？","consult":"领导您好，我是一名基层应急管理部门工作人员，近期出现了一些移动互联网加油团购平台，其本身不储存汽油柴油，用户在其在线平台上购买油品后，平台再从加油站购买油品仍存于加油站油罐内，用户到达加油站后评手机购买凭证直接加油。请问该平台是否需要办理危险化学品经营许可证？如需办理，是否需要平台先取得商务部门颁发的成品油零售许可证，以及是否按照无仓储类型办理？","reply":"《危险化学品安全管理条例》国家对危险化学品经营实行许可制度。未经许可，任何单位和个人不得经营危险化学品。","consultTime":"2022-01-17","replyTime":"2022-01-20","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-08","title":"关于民用小包装危化品是否需办理危品经营许可？","consult":"经查2022年1月4日贵部对《咨询医⽤酒精销售是否需要取得危化品经营许可证》问题的回复中指出根据《危险化学品安全管理条例》《危险化学品经营许可证管理办法》等有关规定，⽇⽤化学品和医药⽤品⽆需办理危险化学品经营许可证。请问只是单纯储存民用小包装危险化学品乳香油，cas号8016-36-2，列入危化品目录，15ml瓶也是民用小包装危化品，是否不需要办理危险化学品经营许可证？仓库只需乙类消防验收？","reply":"您好，《安全生产法》修订后，我部也启动了《危险化学品经营许可证管理办法》的修订，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。具体涉及办理许可、消防验收问题请咨询属地应急管理部门，感谢留言。","consultTime":"2022-04-01","replyTime":"2022-04-04","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-09","title":"关于瓶装氧、氮、氩、二氧化碳及其混合气充装项目是否为化工建设项目的咨询函？","consult":"瓶装工业气体充装项目工艺为：购买成品的液态氧、氮、氩、二氧化碳，分别储存于不同的低温液体贮槽内，通过低温液体泵加压，经汽化器与空气中的热能进行热交换变成常温气体充入气瓶至规定压力。充装过程仅为单纯物理混合分装，未运用化学方法改变物质组成、结构和合成新物质，充装过程不产生废水、废渣。按照规定仅办理《危险化学品经营许可证》带储存经营和《气瓶充装许可证》。特此咨询该建设项目是否为化工建设项目？","reply":"您好，该瓶装工业气体充装项目属于危险化学品建设项目，适用《危险化学品建设项目安全监督管理办法》。感谢留言。","consultTime":"2022-05-09","replyTime":"2022-05-12","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-10","title":"气体分装企业是否需要办理危化品经营许可证？","consult":"我公司是氧气、氮气、氩气、二氧化碳、丙烷及液化石油气的分装私营企业。是否需要办理经营许可证以及是否需要试生产环节？","reply":"您好，购买危险化学品进行分装、充装或者加入非危险化学品的溶剂进行稀释，然后销售的，需要办理危险化学品经营许可证，城镇燃气经营活动不适用《危险化学品经营许可证管理办法》，试生产请按照《危险化学品建设项目安全监督管理办法》要求开展。感谢留言。","consultTime":"2022-07-28","replyTime":"2022-08-01","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-11","title":"生产该指甲油时是否需办理《危险化学品经营许可证》以及《安全生产许可证》？","consult":"您好，商品：指甲油 4ml瓶，海关编码：3304300001，经鉴定属于三类危险品，属于2828项危险化学品，我司是化妆品生产企业，拥有《化妆品生产许可证》，生产该指甲油时，是否需办理《危险化学品经营许可证》以及《安全生产许可证》？","reply":"您好，《安全生产法》修订后，我部也启动了《危险化学品经营许可证管理办法》的修订，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品，感谢留言。","consultTime":"2022-07-04","replyTime":"2022-07-08","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-12","title":"在办理加油站许可时，是否按带有储存设施经营对待？","consult":"《加油站作业安全规范》征求意见稿编制说明：六、标准性质建议“加油站为带储存设施的危险化学品经营单位，油品易燃易爆...”。《危险化学品经营许可证管理办法》第三十七第二款“本办法所称储存设施，是指按照《危险化学品重大危险源辨识》GB18218确定，储存的危险化学品数量构成重大危险源的设施。” 那我们在办理加油站的许可时，是按带有储存设施经营，还是按不带有储存设施经营？谢谢。","reply":"您好，按照现行《危险化学品经营许可证管理办法》（国家安全监管总局令第55号）有关要求，不构成重大危险源的带储存设施的危化品经营企业的经营方式为“不带有储存设施经营”。近期，修正后的《安全生产法》实施后，我们正组织对有关配套部门规章进行修正，感谢留言。","consultTime":"2022-04-12","replyTime":"2022-04-16","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-13","title":"医用酒精销售是否需要取得危险化学品经营许可证？","consult":"销售75%的医用酒精，主要销售单位在药店、医院、卫生主管部门，未取得危险化学药品经营许可证，请问一下销售75%的医用酒精是否应该办理危险化学品经营许可证？","reply":"您好，《安全生产法》修订后，我部启动了相应部门规章的修订工作，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。感谢您的留言。","consultTime":"2022-03-18","replyTime":"2022-03-22","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-14","title":"危化品目录中第2828项，是单指闪点闭杯闪点≤60℃的液体吗？","consult":"危化品目录中第2828项，是单指闪点闭杯闪点≤60℃的液体吗？固体混合物的闪点≤60℃，是否归属于目录第2828项？闪点≤60℃的易燃固体混合物是否需要办理危化品经营许可？","reply":"您好，《危险化学品目录》第2828项仅适用于易燃液体，对于不在目录中的固体混合物，应该根据《化学品物理危险性鉴定与分类管理办法》（国家安全监管总局60号令）及其他相关规定进行鉴定分类，如果经鉴定分类属于危险化学品的，应该根据《危险化学品登记管理办法》（国家安全监管总局令第53号）进行危险化学品登记，按照危险化学品进行管理，但不需要办理相关安全行政许可手续。感谢留言。","consultTime":"2022-05-30","replyTime":"2022-06-03","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-15","title":"有经营许可证但无生产许可证，出口危化品如何办理包装性能检验？","consult":"现在我司准备通过IBC吨桶出口一批货物，我司有经营许可证但没有生产许可证，海关告知没办法办理《出入境货物包装性能检验结果单》和《出境危险货物运输包装使用鉴定结果单》。但是我查了《危险化学品安全管理条例》2013年修正本，并没有找到明确的条款。故希望您们可以帮忙解答下，谢谢了！","reply":"按照《危险化学品安全管理条例》有关规定，请咨询海关部门。","consultTime":"2021-08-10","replyTime":"2021-08-13","dept":"危化监管一司","chapter":"消防安全","hasLocalRef":false},{"id":"7-16","title":"无储存经营危化品企业是否需要编制应急预案并备案？","consult":"危险化学品无储存经营单位，只从事票据业务，不参与危化品的装卸和运输环节，无储存经营单位有无必要编制应急预案，如需编制主要针对哪些事故进行编制。另外，《危险化学品经营许可证管理办法》中规定，申请经营许可证时应提交应急预案备案登记表，而《生产经营单位应急预案管理办法》中只规定带储存经营危化品单位需备案，无储存经营未做具体规定，这样无储存经营单位应急预案需要备案吗？","reply":"《生产安全事故应急条例》第五条第二款对生产经营单位编制应急救援预案作出了明确规定：生产经营单位应当针对本单位可能发生的生产安全事故的特点和危害，进行风险辨识和评估，制定相应的生产安全事故应急救援预案，并向本单位从业人员公布。","consultTime":"2020-10-13","replyTime":"2020-12-02","dept":"安全生产应急救援中心","chapter":"消防安全","hasLocalRef":false},{"id":"7-17","title":"无储存经营危险化学品，是否需取得危险化学品经营许可证？","consult":"1.无储存经营危险化学品，是否需取得危险化学品经营许可证？2.如需取得危化品经营许可，需按照何种法律法规申请《危险化学品经营许可证管理办法》原总局55号令中未规定无库存经营的条件？","reply":"您好，请依据《危险化学品经营许可证管理办法》有关规定办理。感谢您的留言。","consultTime":"2022-02-15","replyTime":"2022-02-18","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-18","title":"危化品目录中未注明浓度的品种（如硫酸），任何浓度是否都需办理经营许可证？","consult":"危险化学品仓储经营范围，参照执行危险化学品目录，目录中所列条目如硫酸、硝酸，这类没有明确浓度的品名，如何确定是否需要办理经营许可证？还是不论浓度多少都需要办理经营许可证？","reply":"您好，根据《危险化学品目录（2015版）实施指南（试行）》，主要成分均为列入《目录》的危险化学品，并且主要成分质量比或体积比之和不小于70%的混合物（经鉴定不属于危险化学品确定原则的除外），可视其为危险化学品并按危险化学品进行管理，安全监管部门在办理相关安全行政许可时，应注明混合物的商品名称及其主要成分含量。感谢留言。","consultTime":"2022-05-26","replyTime":"2022-05-31","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-19","title":"租用他人甲类仓库储存经营危化品，应申请哪类经营许可证？","consult":"领导您好，有两个问题咨询：1.危险化学品经营许可证分三个类别，请问租用其他单位符合安全及消防要求的甲类仓库储存经营的危险化学品，是申请危险化学品经营许可证不带储存设施这个类别吗？2.危险化学品储存设施不带储存设施，办公地址场所是否可以选择写字楼？不会在办公地址存放任何化学品。非常感谢！","reply":"您好，根据55号令要求，应根据储存经营危化品类别、规模等情况办理相应类别危险化学品经营许可证；写字楼可以作为注册地址，作为经营场所应满足相关标准规定。感谢留言。","consultTime":"2022-06-10","replyTime":"2022-06-13","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-20","title":"原油长输管道企业如何办理危化品经营许可证？办理流程是什么？","consult":"原油长输管道企业如何办理危险化学品经营许可证？目前查找相关国家文件并没有明确说明相关办理方法及流程。","reply":"油气长输管道企业办理危险化学品经营许可证，应依照《危险化学品经营许可证管理办法》（国家安全生产监督管理总局令第55号）有关规定执行。","consultTime":"2022-01-11","replyTime":"20
