地方政府要求按非煤矿山建设项目安全设施设计专篇编写，共14章。目前应该参照哪个规定执行，是执行8章还是14章？请予以回复。谢谢。","reply":"陆上石油天然气建设项目安全设施设计专篇编写执行《国家安全监管总局关于印发陆上石油天然气建设项目安全设施设计专篇编写指导书的通知》（安监总管一〔2008〕7号）。","consultTime":"2022-01-19","replyTime":"2022-01-25","dept":"危险化学品安全监督管理二司","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-11","title":"高危企业是否综合预案、所有专项预案及现场处置方案均需每半年至少演练一次？","consult":"《生产安全事故应急预案管理办法》第三十三条第二款规定；“危险化学品生产、经营、储存、运输单位，矿山、金属冶炼等经营单位，应当至少每半年组织一次生产安全事故应急预案演练”。是否是要求高危企业的综合应急预案、所有专项应急预案及所有现场处置方案，均需要每半年至少组织一次？","reply":"已电话沟通解答。您好，应急管理部规章《生产安全事故应急预案管理办法》第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。依据《生产安全事故应急演练基本规范》（AQ/T9007-2019），应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的预案演练可相互组合。如地方另有规定的，请参照执行。","consultTime":"2024-12-02","replyTime":"2024-12-06","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-12","title":"铸造熔炼炉冷却水系统未配温度流量报警是否属重大隐患？","consult":"您好，2017版重大隐患判定标准，机械行业，铸造熔炼炉冷却水系统未配置温度、进出水流量检测报警装置；疑来自《炼钢安全规程》指为电弧炉，10.1.8规定：应配置出水温度与进出水流量差检测、报警装置。2021工贸行业重大生产安全事故隐患判定标准征求意见稿，机械行业，铸造用熔炼精炼炉冷却水系统未规范设置温度、流量监测报警装置。中频无心感应炉现已满足2021版要求。","reply":"感谢您的留言。2021工贸行业重大生产安全事故隐患判定标准目前为征求意见稿，不是有效文件，中频炉需要配置进出水流量监测报警装置。","consultTime":"2022-04-24","replyTime":"2022-04-29","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-13","title":"24版中级安全工程师教材《金属冶炼安全》第107页是否有内容错误？","consult":"3.群体煤气中毒事件的预防于应急序号2这段与“钢八条”中的第二条相违背。","reply":"您好！感谢您对注册安全工程师工作的关注！根据《中华人民共和国行政许可法》第五十四条，应急管理部不得指定中级注册安全工程师职业资格考试教材或者其他助考材料，且从未指定所谓官方备考使用材料。 中级注册安全工程师职业资格考试试题，依据《中级注册安全工程师职业资格考试大纲》（应急厅〔2019〕43号，参考网址：https://www.mem.gov.cn/gk/tzgg/tz/201905/t20190505_257190.shtml）命制，建议您对照考试大纲备考。","consultTime":"2024-06-26","replyTime":"2024-07-03","dept":"人事司","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-14","title":"GB30871是否适用于冶金工贸行业？","consult":"请问GB30871中规定的大大作业管理要求及作业票的填写，是否可是用于冶金工贸行业的范围？如不可以，那么冶金工贸行业涉及的危险作业管理应该参照什么标准执行？谢谢！","reply":"感谢您的留言。GB 30871-2014明确该标准不适用冶金工贸行业。目前，冶金工贸行业针对危险作业管理未编制专门安全生产标准。生产经营单位可根据企业内部关于危险作业所涉及危险有害因素辨识结果，制定安全管理规章制度、规程，也可将GB 30871-2014，相关适用条款融入本单位安全管理体系执行。","consultTime":"2021-10-28","replyTime":"2021-11-04","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-15","title":"一般多大规模的铸造企业按金属冶炼管理？","consult":"您好，我单位是一个小型铸造企业，中频炉产能30公斤左右，员工10人左右。铸造企业应按金属冶炼企业管理，按照原国家安监总局91号《冶金企业和有色金属企业安全生产规定》第三条规定的金属冶炼，是指冶金企业和有色金属企业从事达到国家规定规模体量的高温熔融金属及熔渣以下统称高温熔融金属的生产活动。我想咨询一下像我们这样的小规模铸造企业也需要按金属冶炼企业管理吗？一般多大规模的铸造企业按金属冶炼管理？","reply":"感谢您的留言。原国家安全监管总局确定的金属冶炼目录是从管控安全风险的角度，把冶炼过程中存在高温熔融金属(含熔渣)爆炸、喷溅、泄漏等安全风险、易造成群死群伤事故的相关生产工艺纳入金属冶炼安全监管范围。该目录与国民经济分类无直接关系。目前铸造企业均属于金属冶炼企业，尚无规模区别。","consultTime":"2022-03-22","replyTime":"2022-03-29","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-16","title":"中频炉铸铁是否属于冶金？","consult":"铸造行业在国民经济行业划分从制造业门类“31黑色金属冶炼和压延加工业”大类和“32有色金属冶炼和压延加工业”大类中调整到“33金属制品业”大类，在此大类下增设“3391黑色金属铸造”和“3392有色金属铸造”两个小类，新标准将于2017年10月1日正式实施。中频炉铸铁是否属于GBT4754—2017中的3391黑色金属铸造？当地专家说我们是冶金行业，我想问一下，我们是安全生产法中的冶金行业？","reply":"感谢您的留言。依据《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号），机械铸造企业属于金属冶炼企业。","consultTime":"2021-10-21","replyTime":"2021-10-28","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-17","title":"八大工贸行业的安全生产主管部门是应急管理部门吗？","consult":"领导您好，冶金、有色、建材、机械、轻工、纺织、烟草、商贸等工贸行业的安全生产主管部门是应急管理部门吗？望回复。","reply":"感谢您的留言。根据《中共中央办公厅 国务院办公厅关于调整应急管理部职责机构编制的通知》规定，应急管理部安全生产执法和工贸安全监督管理局承担冶金、有色、建材、机械、轻工、纺织、烟草、商贸等工贸行业安全生产基础和执法工作；拟订相关行业安全生产规程、标准，指导和监督相关行业生产经营单位安全生产标准化、安全预防控制体系建设等工作，依法监督检查其贯彻落实安全生产法律法规和标准情况。","consultTime":"2021-08-23","replyTime":"2021-08-30","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-18","title":"关于C33金属制品业包含的黑色金属铸造、有色金属铸造企业的行业监管分类？","consult":"根据《国民经济行业分类》,黑色金属铸造、有色金属铸造属于C33金属制品业，不属于《金属冶炼目录2015年版》的C31黑色金属冶炼、压延加工工业、C32有色金属冶炼、压延加工工业，不属于《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准试行》的C31冶金行业，但黑色金属铸造、有色金属铸造生产中涉及中频电炉等设备，涉及熔融的铁水浇筑等工艺，此类行业的安全设施设计是否应按金属冶炼行业一样报经？","reply":"感谢您的留言。原国家安全监管总局确定的金属冶炼目录是从管控安全风险的角度，把冶炼过程中存在高温熔融金属(含熔渣)爆炸、喷溅、泄漏等安全风险、易造成群死群伤事故的相关生产工艺纳入金属冶炼安全监管范围。该目录与国民经济分类无直接关系。","consultTime":"2022-02-12","replyTime":"2022-02-18","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-19","title":"关于《工贸企业有限空间作业安全管理与监督暂行规定》的适用范围？","consult":"《工贸企业有限空间作业安全管理与监督暂行规定》第一条 明确该规定适用于：冶金、有色、建材、机械、轻工、纺织、烟草、商贸企业以下统称工贸企业。第二条工贸企业有限空间作业的安全管理与监督，适用本规定。请问其他企业如：交通运输、建筑安装、物业维保等企业的有限空间作业安全管理是否也适用该规定？谢谢！","reply":"感谢您的留言。除冶金、有色、建材、机械、轻工、纺织、烟草、商贸企业以外的其他企业的有限空间作业安全管理均不适用《工贸企业有限空间作业安全管理与监督暂行规定》（安监总局令59号）。","consultTime":"2021-12-19","replyTime":"2021-12-24","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-20","title":"企业编制的应急预案是否需要外部专家来评审？","consult":"我公司是一家带有黑色金属熔融的机械企业，企业编制的应急预案是否需要外部专家来评审？","reply":"已电话沟通解答。您好，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第二十二条规定“参加应急预案评审的人员应当包括有关安全生产及应急管理方面的专家。评审人员与所评审应急预案的生产经营单位有利害关系的，应当回避。”你单位组织评审的专家符合相关要求即可。","consultTime":"2024-04-01","replyTime":"2024-04-09","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-21","title":"关于工矿商贸行业管理范围的界定？","consult":"请问应急管理部门所说的工矿商贸行业的具体涵盖行业有哪些，是仅指《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准（试行）》中涉及的八大行业吗？","reply":"感谢您的留言。工贸企业是指《关于修订&lt;冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准（试行）&gt;的通知》（应急厅〔2019〕17号），矿山和危化企业另有界定。","consultTime":"2021-03-04","replyTime":"2021-03-08","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-22","title":"关于铸造企业与冶金企业的划分标准？","consult":"国家安全生产监督管理总局令91号中“机械铸造企业中金属冶炼活动的安全生产和监督管理参照本规定执行”请问机械铸造是属于冶金行业吗生产活动中，有熔炼ADC12铝锭。请问有什么文件可以判定自己隶属行业？","reply":"感谢您的留言。按照《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准试行》（应急厅〔2019〕17号）和《国民经济行业分类》（GB/T 4754-2017），机械铸造企业不属于冶金企业。按照《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号），机械铸造企业属于金属冶炼企业。","consultTime":"2021-08-21","replyTime":"2021-08-27","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-23","title":"锂电池制造属于机械行业还是轻工行业？","consult":"根据《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准试行》“384电池制造”划分到机械行业又属于轻工行业，请问安全监管分类中锂电池制造属于机械行业还是轻工行业？还是两种行业均包含锂电池制造？","reply":"感谢您的留言。根据《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准试行》（应急厅〔2019〕17号），“384电池制造”属于轻工行业。","consultTime":"2021-08-08","replyTime":"2021-08-16","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-24","title":"金属冶炼企业应急预案演练每年至少几次？","consult":"根据《生产安全事故应急预案管理办法》第三十三条规定，应急预案演练次数是否要求高危企业如金属冶炼企业每半年至少一次综合或者专项应急演练以及每半年至少一次现场处置方案演练，一年至少演练2次综合或专项，2次现场处置方案？","reply":"已电话沟通解答。您好，《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。如地方另有规定的，请参照执行。另外，请正确理解演练的定义，综合预案、专项预案和现场处置方案的演练有桌面推演、实战演练、专项演练、综合演练等多种形式，既可以单独组织，也可以同时开展。企业应根据自身实际，灵活采用不同形式，有针对性的组织开展应急预案演练，提高应急处置能力。","consultTime":"2024-11-13","replyTime":"2024-11-18","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-25","title":"高炉区域一氧化碳报警仪是否需要集中监控？","consult":"冶金炼铁企业高炉区域固定式一氧化碳报警仪是否需要集中监控？有无相应的标准？请明示。","reply":"感谢您的留言。高炉区域固定式一氧化碳报警仪需要集中监控。《炼铁安全规程》（AQ2002-2018）第6.9条规定：煤气危险区域，包括高炉风口（及以上）平台、热风炉操作平台、喷煤干燥炉、TRT、除尘器卸灰平台等易产生煤气泄漏而人员作业频率较高的区域，应设固定式一氧化碳监测报警装置。《工作场所有毒气体检测报警装置设置规范》（GBZ/T233-2009）第3.1.1条规定，有毒气体检测报警装置由探测器和报警控制组成；第3.1.4条规定，报警控制器，指接收并处理探测器输出信号，具有显示、报警或控制功能的电气仪表；第6.4.5条规定，报警控制器宜独立于生产工艺控制仪表，配置在有人员值守的位置。","consultTime":"2021-06-13","replyTime":"2021-06-18","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-26","title":"机械企业涉及铸造生产，是否需要按照《生产安全事故应急条例》建立应急值班制度？","consult":"我公司是机械生产企业，仅有一台电炉用于铝制零部件的铸造生产，请问是否需要按照《生产安全事故应急条例》第十四条第二项“下列单位应当建立应急值班制度，配备应急值班人员：二危险物品的生产、经营、储存、运输单位以及矿山、金属冶炼、城市轨道交通运营、建筑施工单位；”执行值班？","reply":"您好，留言收悉。《生产安全事故应急条例》要求金属冶炼单位应当建立应急值班制度，配备应急值班人员。《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号）界定了金属冶炼单位的范围，如果您公司属于《通知》中明确的金属冶炼单位，应按照《条例》要求，应当建立应急值班制度，配备应急值班人员。","consultTime":"2026-01-12","replyTime":"2026-01-14","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-27","title":"机械铸造企业属于金属冶炼行业吗？","consult":"你好，我是一家机械铸造厂的安全员，我们厂被应急局划分为金属冶炼企业管理，我在网上也没查到金属冶炼企业范围是什么，所以请问领导什么样的厂子属于金属冶炼企业？我们厂有电炉冶炼工艺？","reply":"感谢您的留言。目前按照《关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号）界定金属冶炼企业。","consultTime":"2021-03-04","replyTime":"2021-03-08","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-28","title":"汽车零配件生产企业含中频炉熔融金属工艺是否属于金属冶炼行业？","consult":"汽车零配件生产企业，生产工艺中采用中频炉熔融铁或铝，生产汽车刹车片等产品，根据《国民经济行业分类》2017版属于汽车制造业36中的汽车零部件及配件制造367。根据《国家安全监管总局关于印发金属冶炼目录2015版的通知》，汽车制造业不属于金属冶炼企业。请问这类企业项目安全“三同时”应该按照一般工贸行业还是冶金行业来处理？","reply":"感谢您的留言。原国家安全监管总局确定的金属冶炼目录是从管控安全风险的角度，把冶炼过程中存在高温熔融金属(含熔渣)爆炸、喷溅、泄漏等安全风险、易造成群死群伤事故的相关生产工艺纳入金属冶炼安全监管范围。该目录与国民经济分类无直接关系。汽车零配件生产工艺中涉及高温熔融金属熔炼、浇铸等作业的建设项目要按金属冶炼相关要求开展安全设施“三同时”工作，其他不涉及高温熔融金属作业的建设项目按机械行业要求开展安全设施“三同时”工作。","consultTime":"2022-03-21","replyTime":"2022-03-28","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-29","title":"金属冶炼企业安全管理人员完成注安48学时继续教育后，是否仍需参加16学时年度再培训？","consult":"《注册安全工程师管理规定》第23条：注册安全工程师在注册周期内应当参加继续教育，时间累计不得少于48学时。《生产经营单位安全培训规定》第9条第二款：金属冶炼生产经营单位安全生产管理人员每年再培训时间不得少于16学时。我是金属冶炼行业的安全管理人员和注册安全工程师，2023年度参加了48课时的注册安全工程师金属冶炼行业的继续教育，是否还需要参加金属冶炼行业的安全管理人员今年度16学时的再培训？","reply":"《安全生产法》第二十八条规定，生产经营单位应当对从业人员进行安全生产教育和培训，保证从业人员具备必要的安全生产知识，熟悉有关的安全生产规章制度和安全操作规程， 掌握本岗位的安全操作技能，了解事故应急处理措施，知悉自身在安全生产方面的权利和义务。第五十八条规定，从业人员应当接受安全生产教育和培训，掌握本职工作所需的安全生产知识，提高安全生产技能，增强事故预防和应急处理能力。《注册安全工程师职业资格制度规定》（应急〔2019〕8号）第三十一条规定，取得注册安全工程师注册证书的人员，应当按照国家专业技术人员继续教育的有关规定接受继续教育，更新专业知识，提高业务水平。《注册安全工程师管理规定》第二十三条规定，注册安全工程师在注册周期内应当参加继续教育，时间累计不得少于48学时。有关注册安全工程师参加金属冶炼行业安全生产管理人员培训的具体要求，建议咨询所在地应急管理部门。咨询时间：2023-08-30        回复时间：2023-09-07    回复单位：人事司","consultTime":"","replyTime":"","dept":"","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-30","title":"热镀锌企业属于金属冶炼企业吗？","consult":"热镀锌工艺涉及高温熔融液态锌，是否应属于金属冶炼企业？在百度文库中查到一篇文章显示， 山东省冶金工业总公司2017年6月21日就有关金属冶炼企业界定问题请示国家安监总局四司，得到的答复是：热镀锌、热镀锡企业，因融化金属的锌锅、锡锅相对固定，风险较小，不列入金属冶炼企业。但在应急部官网上未查到相内容，因工作中遇到同样的问题，恳请予以指导！","reply":"感谢您的留言。目前按照《关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号）界定金属冶炼企业，涉及高温熔融液态锌属于金属冶炼企业。","consultTime":"2021-02-18","replyTime":"2021-02-24","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-31","title":"生产经营单位的生产工艺包含热镀锌工艺，是否属于金属冶炼企业？是否需要全员投保安责险？","consult":"您好，我所在单位是生产热镀锌钢板的企业，生产工艺中包含热镀锌工艺，近期县应急局召开安责险推进会议上认为我单位属于金属冶炼企业，应全员投保安责险。实际上我企业全部400多名员工中，涉及到熔融金属的岗位只有不到15人，请问我所在的企业是否属于金属冶炼企业？是否需要全员投保安责险？","reply":"感谢您的留言。根据《金属冶炼目录(2015版)》（安监总管四〔2015〕124号），热镀锌工艺属于金属冶炼目录企业。","consultTime":"2021-12-01","replyTime":"2021-12-08","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-32","title":"稀土冶炼属于《安全生产法》中所说的金属冶炼吗？","consult":"稀土元素大都能够通过冶炼工艺形成稀土金属，但是在金属冶炼的定义中又没有涵盖稀土冶炼，问了一些地方上的专家，也都说不清楚。","reply":"感谢您的留言。按照《金属冶炼目录（2015版）》，稀土冶炼不属于金属冶炼。","consultTime":"2021-10-08","replyTime":"2021-10-11","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-33","title":"石英石提炼结晶硅是属于金属冶炼吗？是应急部门管吗？","consult":"请问石英石提炼结晶硅是属于金属冶炼吗？是应急部门管吗？","reply":"感谢您的留言。按照《金属冶炼目录（2015版）》，石英石提炼结晶硅不属于金属冶炼。硅冶炼按照国民经济分类属于有色行业，属于应急部门管理。","consultTime":"2021-10-29","replyTime":"2021-11-05","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-34","title":"铸造企业到底是不是金属冶炼企业？","consult":"关于铸造企业到底是不是金属冶炼企业，一些地市应急局答复都是要求我们自己查看相关规定，但不给予明确答复。按《国民经济行业分类》GBT 4754-2017和应急管理部重新修订的《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准试行》〔2019〕17号规定,铸造行业为金属制品业,属于机械行业。那么是否可以明确铸造企业确实不属于金属冶炼企业？在日常安全管理中是否可不依照金属冶炼企业？","reply":"感谢您的留言。依据《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号），机械铸造企业属于金属冶炼企业。","consultTime":"2021-10-14","replyTime":"2021-10-21","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-35","title":"铸造企业属于冶金行业还是机械行业？","consult":"你好，根据《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准》冶金行业主要包括：31黑色金属冶炼和压延加工业大类所包含的全部企业。机械行业包括：33金属制品业等。按照《国民经济行业分类按第1号修改单修订》，3391黑色金属铸造应属于机械行业。但是根据《关于印发金属冶炼目录2015版的通知》，c3130黑色金属铸造属于金属冶炼。这里产生了矛盾，应执行哪个标准？望解答为盼。","reply":"感谢您的留言。执行《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准》和《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号）。","consultTime":"2021-06-09","replyTime":"2021-06-16","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-36","title":"安全生产法中金属冶炼企业是否包含铸造企业？行业分类冲突、小型厂安管配置、项目三同时如何执行？","consult":"《安全生产法》所指金属冶炼企业是否包含铸造企业，《金属冶炼目录》包含铸造，是根据《国民经济行业分类》GBT 4754确定，后者已经更新，铸造属339类金属制品，按照《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准试行》应急厅〔2019〕17号属于机械行业，该怎样界定？现实中有些铸造工艺的企业规模很小，10几个人的小厂，是否配备专职安全管理人员？是否进行建设项目审批？已建成的怎么办？","reply":"感谢您的留言。依据《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号），涉及高温熔融金属作业的铸造企业按照金属冶炼企业管理，需要配备专职安全管理人员，按照《建设项目安全设施“三同时”监督管理办法 》（国家安全监管总局令第 36 号）中关于金属冶炼企业的要求开展安全设施“三同时”工作。","consultTime":"2021-06-14","replyTime":"2021-06-21","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-37","title":"金属铸造是否应纳入金属冶炼范畴管理？","consult":"看到网上几例答复，关于金属铸造是否属于金属冶炼范畴的答复，个人觉得2017年的国民经济分类已经将金属铸造纳入了机械制造类别，而且这是国家标准，而总局2015年的文件是引用的以前的标准，当时金属铸造是纳入金属冶炼范畴的，现在国家标准已经修订了，那么总局的这个文件也就失去指导性意义了，或者应该及时对文件进行修订。我已经就安全生产方面的问题留言过好多次了，贵部一次也没有答复过我，不晓得是不是无法答复？","reply":"感谢您的留言。《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号）文件有效，冶炼过程中存在高温熔融金属(含熔渣)爆炸、喷溅、泄漏等安全风险、易造成群死群伤事故的相关生产工艺纳入金属冶炼安全监管范围。金属铸造企业属于金属冶炼企业。","consultTime":"2021-11-04","replyTime":"2021-11-11","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-38","title":"金属铸造企业是否应该按照冶金行业履行三同时手续？","consult":"请问金属铸造企业带电炉熔炼工艺，主要产品为各种金属铸件，这样的项目安全三同时是按照冶金行业进行，还是按照一般工贸项目进行，企业自行组织安全设施设计审查就可以？","reply":"感谢您的留言。依据《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号），涉及高温熔融金属作业的铸造企业按照金属冶炼企业管理，按照《建设项目安全设施“三同时”监督管理办法 》（国家安全监管总局令第 36 号）中关于金属冶炼企业的要求开展安全设施“三同时”工作。","consultTime":"2021-06-08","replyTime":"2021-06-15","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-39","title":"炼活动外的其他生产作业活动如：车床加工、设备组装等是否也要参照冶金企业进行管理？","consult":"根据《冶金企业和有色金属企业安全生产规定》第二条冶金企业和有色金属企业以下统称企业的安全生产含职业健康，下同和监督管理，适用本规定。机械铸造企业中金属冶炼活动的安全生产和监督管理参照本规定执行。那么，请问：机械铸造企业中除金属冶炼活动外的其他生产作业活动如：车床加工、设备组装等是否也要参照冶金企业进行管理？机械铸造企业的车工三级安全教育培训是按照72学时还是24学时？","reply":"感谢您的留言。《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号）文件有效，冶炼过程中存在高温熔融金属(含熔渣)爆炸、喷溅、泄漏等安全风险、易造成群死群伤事故的相关生产工艺纳入金属冶炼安全监管范围。金属铸造企业属于金属冶炼企业。","consultTime":"2021-11-29","replyTime":"2021-12-06","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-40","title":"构成重大危险源的冶金企业是否还需每三年做安全现状评价？","consult":"钢铁冶金企业生产过程中生产使用煤气和液氧，除了构成重大危险源的需要做安全评估报告，还需不需要每三年做一次全厂的安全现状评价报告？","reply":"感谢您的留言。目前国家层面对此没有相关要求。地方有规定的，从其规定。","consultTime":"2021-11-12","replyTime":"2021-11-18","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-41","title":"铸造业安全评价是按冶金业还是机械加工业评价？","consult":"铸造业安全评价是按冶金业还是机械加工业评价？","reply":"感谢留言。机械铸造企业属于金属冶炼企业，机械铸造企业安全评价按照《建设项目安全设施“三同时”监督管理办法》中对金属冶炼建设项目的要求执行。","consultTime":"2022-07-12","replyTime":"2022-07-17","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-42","title":"铸造企业是按机械行业履行三同时手续，还是按照冶金企业履行三同时手续？","consult":"请问铸造企业是按机械行业履行三同时手续，还是按照冶金企业履行三同时手续？","reply":"感谢您的留言。依据《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号），涉及高温熔融金属作业的铸造企业按照金属冶炼企业管理，按照《建设项目安全设施“三同时”监督管理办法 》（国家安全监管总局令第 36 号）中关于金属冶炼企业的要求开展安全设施“三同时”工作。","consultTime":"2021-07-08","replyTime":"2021-07-15","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-43","title":"铸造企业用的铸造起重机必须使用带固定龙门钩的铸造起重机吗？","consult":"AQ70112018中要求炼钢企业的铸造起重机要使用带固定龙门钩的铸造起重机，作为一个铸造厂的铸造起重机是否也必须采用固定龙门钩的铸造起重机？","reply":"感谢您的留言。目前，尚无标准要求铸造厂的铸造起重机采用固定龙门钩的铸造起重机。如你单位为生产企业，可根据工艺和安全统筹考虑是否使用此类铸造起重机。","consultTime":"2021-07-11","replyTime":"2021-07-19","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-44","title":"铸造到底算冶金行业还是机械行业？","consult":"领导你好，厂子里有一台1吨的中频电炉化铁水浇铸成哑铃片，这个公司属于黑色金属铸造还是金属制品业？尤其是现在山东省要求金属冶炼企业必须设置安全总监，这种公司属于金属冶炼吗？","reply":"感谢您的留言。依据《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号），机械铸造企业属于金属冶炼企业。","consultTime":"2021-10-11","replyTime":"2021-10-18","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-45","title":"金属铸造是否属于金属冶炼？应归机械行业还是冶金行业监管？","consult":"前期应急管理部回复：根据《国家安全监管总局关于印发金属冶炼目录2015版的通知》安监总管四〔2015〕124号金属铸造属于金属冶炼；而根据现行《国民经济行业分类》GBT4754—2017，黑色金属铸造3391属于金属制品业。根据《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准试行》应急厅〔2019〕17号，33金属制品业属于机械行业；这两个文件都比《通知》新，为什么不按新文件执行？","reply":"感谢您的留言。《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号）文件有效，冶炼过程中存在高温熔融金属(含熔渣)爆炸、喷溅、泄漏等安全风险、易造成群死群伤事故的相关生产工艺纳入金属冶炼安全监管范围。金属铸造企业属于金属冶炼企业。","consultTime":"2021-11-03","replyTime":"2021-11-10","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-46","title":"阀门铸造企业是否属于冶金企业？","consult":"请问阀门铸造企业是否属于冶金企业？是否适用《建设项目安全设施“三同时”监督管理办法》？阀门铸造建设项目是否需要做三同时？是否需要参照新安法冶金企业进行管理？","reply":"感谢您的留言。依据《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号），涉及高温熔融金属作业的铸造企业按照金属冶炼企业管理，按照《建设项目安全设施“三同时”监督管理办法 》（国家安全监管总局令第 36 号）中关于金属冶炼企业的要求开展安全设施“三同时”工作。","consultTime":"2021-08-26","replyTime":"2021-09-01","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-47","title":"铝活塞制造业是否属于高危行业？","consult":"铝活塞制造行业属于高危行业吗？金属冶炼应不包括金属铸造，根据安监总管四〔2015〕124号文，如属于高危行业，与上位法是否有冲突？","reply":"感谢您的留言。原国家安全监管总局确定的金属冶炼目录是从管控安全风险的角度，把冶炼过程中存在高温熔融金属(含熔渣)爆炸、喷溅、泄漏等安全风险、易造成群死群伤事故的相关生产工艺纳入金属冶炼安全监管范围,铸造企业存在上述风险，归入金属冶炼企业与上位法没有冲突。","consultTime":"2022-04-20","replyTime":"2022-04-25","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-48","title":"黑色金属铸造机械铸造耐磨厂企业监管分类？","consult":"《金属冶炼目录》2015版定义为C3130黑色金属铸造；《国民经济行业分类》2017版C3130钢压延加工，C3391黑色金属铸造；根据安全监管分类标准明细表，C3130为冶金，C3391为机械。请问机械铸造企业涉及金属熔融、浇铸；中频炉是根据C3391还是根据C3130？谢谢。《金属冶炼目录》中黑色金属铸造与《国民经济行业分类》中黑色金属铸造以及其注释有区别吗？谢谢。","reply":"感谢您的留言。按照《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号），机械铸造企业属于金属冶炼企业。","consultTime":"2021-08-12","replyTime":"2021-08-19","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-49","title":"黑色金属铸造项目是否按机械行业中的金属制品业进行安全设施验收和监管？","consult":"根据现行2017版《国民经济行业分类》GBT4754—2017，黑色金属铸造3391属于金属制品业，不再属于冶金行业。根据《冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准试行》应急厅〔2019〕17号，33金属制品业属于机械行业，冶金行业主要包括：31黑色金属冶炼和压延加工业大类所包含的全部企业。请问：黑色金属铸造项目是否按机械行业中金属制品业进行安全设施验收和监管？","reply":"感谢您的留言。按照《国家安全监管总局关于印发金属冶炼目录（2015版）的通知》（安监总管四〔2015〕124号）规定，金属铸造企业属于金属冶炼企业，按照金属冶炼企业履行建设项目“三同时”相关手续。","consultTime":"2021-10-08","replyTime":"2021-10-15","dept":"安全执法和工贸监管局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-50","title":"危化品输送管道管理规定第2条为何将\"安全管理\"修改为\"安全保护\"，如何解读？","consult":"2015年修订的《危险化学品输送管道安全管理规定》，将原43号令中的第2条“不适用于原油、天然气、煤层气和城镇燃气管道的安全管理。”修改为“原油、成品油、天然气、煤层气、煤制气长输管道安全保护和城镇燃气管道的安全管理，不适用本规定。”为什么将石油天然气管道及附属设施的安全管理改为了安全保护，为什么这么修改？如何解读？","reply":"我国境内输送石油、天然气的管道的保护工作，适用于《中华人民共和国石油天然气管道保护法》，因此相关法规规章中的有关表述统一规范为“石油天然气管道保护”。","consultTime":"2021-11-03","replyTime":"2021-11-08","dept":"危化监管二司","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-51","title":"想询问应急预案备案是由业主方甲方备案，还是由施工方乙方备案呢？","consult":"你好，遇到一个实际情况，想咨询一下具体政策。生产经营单位生产安全事故应急预案的备案。是由业主方甲方，还是由施工方乙方去相关的应急管理局备案呢？比如说：甲方在某地有煤层气勘探项目进行招标，乙方中标，承担了勘探施工任务。那么去当地应急管理局备案的相关方，是业主方甲方，还是施工方乙方呢？谢谢答疑解惑。","reply":"已电话沟通解答。您好，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第二十六条明确规定了不同行业领域生产经营单位的应急预案备案途径。根据您的举例，不论是甲方还是乙方均应对照条款去相关单位备案本单位的生产安全事故应急预案。请贵单位结合企业实际进行备案。如地方另有具体规定的，请参照执行。","consultTime":"2024-03-25","replyTime":"2024-03-26","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-52","title":"举报重大安全隐患问题有奖励吗？","consult":"我朋友不会网上反映问题，让我代问一下省重点工程天然气管道偷工减料，不照图施工，让数千万元地衣治理工程成了豆腐渣工程，翻山越占的管线设计用石头水泥或混灏一上浇注，私自改为黄土掩埋，一遇雨季，黄土石流向下游冲去，存在重大安全隐患，人家手里有该线路图纸，原讲好让他施工，后又说和领导讲好了，不需要照图施工了，这笔钱装进了谁的口袋？","reply":"有文件正式规定举报奖励办法，《国家安全监管总局财政部关于印发《安全生产领域举报奖励办法》的通知》（安监总财〔2018〕19号）中规定：举报人举报的重大事故隐患和安全生产违法行为，属于生产经营单位和负有安全监管职责的部门没有发现，或者虽然发现但未按有关规定依法处理，经核查属实的，给予举报人现金奖励。第十一条经调查属实的，受理举报的负有安全监管职责的部门应当按下列规定对有功的实名举报人给予现金奖励：（一）对举报重大事故隐患、违法生产经营建设的，奖励金额按照行政处罚金额的15%计算，最低奖励3000元，最高不超过30万元。","consultTime":"2021-03-01","replyTime":"2021-03-02","dept":"调查评估和统计司","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-53","title":"使用撬装设备进行油气田零散气回收是否需要办理许可证件？","consult":"您好，我公司想把本市内的边远气田内井口的零散天然气回收后，集中到一个地方用撬装设备进行脱硫、压缩为CNG、LNG，再进入国家管网或者售卖，使用撬装设备进行脱硫、压缩为CNG、LNG是否需要按照“三同时”进行安全条件和设施设计审查，进入国家管网或经营售卖是否需要办理危险化学品相关许可？边缘气田交通不便、没有管网线路、气量也一般？","reply":"1.根据《危险化学品建设项目安全监督管理办法》（国家安全生产监督管理总局令第45号），新建、改建、扩建危险化学品生产、储存的建设项目以及伴有危险化学品产生的化工建设项目需进行安全审查。具体事宜请咨询当地省级应急管理部门。2.根据《危险化学品经营许可证管理办法》（国家安全生产监督管理总局令第55号），经营危险化学品的企业，应当依照本办法取得危险化学品经营许可证。具体事宜请咨询当地市级应急管理部门。","consultTime":"2022-08-02","replyTime":"2022-09-15","dept":"危险化学品安全监督管理二司","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-54","title":"化工园区内氢气公共输送管道是否为危险化学品建设项目？","consult":"应急管理部：我司是化工园区的国有平台建设公司，我司拟在园区内建设一条公共的氢气输送管道，管道铺设在园区公共管廊上，为园区内需要氢气的企业提供公共服务。该管道总长度为3420米，起始端在园区内一家产氢企业的界区外1米处，末端为各需要氢气企业界区外1米处。请问，该氢气输送管道的建设项目是否为危险化学品建设项目？另外该氢气输送管道是否为危险化学品长输管道？","reply":"根据《关于大型化工装置高度危险化工装置和长输管道界定标准问题的复函》第三条“《危险化学品建设项目安全监督管理办法》所称危险化学品长输管道，是指穿越厂区外公共区域的危险化学品输送管道”。根据《危险化学品输送管道安全管理规定》第三十八条“本规定所称公共区域是指厂区（包括化工园区、工业园区）以外的区域”，第九条“危险化学品输送管道的新建、改建和扩建的安全监督管理适用《危险化学品建设项目安全监督管理办法》的规定。”因此贵单位拟建管道不属于危险化学品长输管道。考虑氢气危险性具有易燃易爆，容易造成材料氢脆等特点，氢气管道应按照危险化学品建设项目进行管理。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-01-19","replyTime":"2022-01-24","dept":"危化监管一司","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-55","title":"LNG储罐重大危险源计算是按最大容积还是按充装系数折算实际储存量？","consult":"您好！GB18218-2018第4.2.2条中规定：危险化学品储罐以及其他容器、设备或仓储区的危险化学品的实际存在量按设计最大量确定。GBT 18442.3-2019第13.2　b充装易燃、易爆介质的深冷容器，额定充满率应不大于90；GB50160-20082018年版6.3.9 液化烃、液氨等储罐的储存系数不应大于0.9。请问液化天然气LNG储罐按最大容积来计算实际储存量合适吗？","reply":"感谢您的留言。请咨询标准编制单位。","consultTime":"2021-10-10","replyTime":"2021-10-12","dept":"危化监管一司","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-56","title":"城镇燃气管道建设项目是否需要进行安全预评价？","consult":"PN25 DN400燃气管道，属于《城镇燃气管理条例》范畴，应不适用于原国家安全生产监督管理总局36号令《建设项目安全设施“三同时”监督管理暂行办法》不属于长输管道输送危险化学品建设项目，现咨询可否不进行安全预评价？","reply":"原国家安全生产监督管理总局77号令《建设项目安全设施“三同时”监督管理办法》对36号令《建设项目安全设施“三同时”监督管理暂行办法》进行修订，其中第七条规定：非煤矿矿山建设项目，生产、储存危险化学品（包括使用长输管道输送危险化学品）的建设项目，生产、储存烟花爆竹的建设项目，金属冶炼建设项目，使用危险化学品从事生产并且使用量达到规定数量的化工建设项目（属于危险化学品生产的除外）等，在进行可行性研究时，生产经营单位应当按照国家规定，进行安全预评价。","consultTime":"2021-09-03","replyTime":"2021-09-08","dept":"安全生产综合协调司","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-57","title":"跨县天然气长输管道安全三同时工作是否需要市级应急管理部门进行安全条件审查同意？","consult":"请问跨县天然气长输管道安全三同时工作是否需要市级应急管理部门进行安全条件审查同意？","reply":"根据《危险化学品建设项目安全监督管理办法》（国家安全生产监督管理总局令第45号），油气长输管道建设单位应当在建设项目开始初步设计前，向相应的应急管理部门申请建设项目安全条件审查。其中，国务院审批（核准、备案）的以及跨省、自治区、直辖市的建设项目的安全审查由应急管理部负责实施；其他建设项目的安全审查由省级应急管理部门确定并公布负责实施的部门。具体事宜请咨询当地省级应急管理部门。","consultTime":"2022-07-06","replyTime":"2022-07-29","dept":"危化二司","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-58","title":"GB55009-2021实施后是否还需执行GB50028相关条款？","consult":"《燃气工程项目规范》GB55009-2021附录中废止现行的《城镇燃气设计规范》GB50028-2006的6.5.52.3.4.请问：1.如废止的是强制性条文，那么在今后的设计与验收，生产经营单位是不是可以不执行《城镇燃气设计规范》GB50028-20066.5.52.3.4相关的要求了？2.如整条被废止，那么今后应参照哪部规范或者标准进行设计、验收、检查？","reply":"感谢您的提问，《燃气工程项目规范》和《城镇燃气设计规范》均由住房城乡建设部负责解释，建议向住房城乡建设部或标准起草单位咨询。","consultTime":"2022-07-19","replyTime":"2022-07-25","dept":"安全生产综合协调司","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-59","title":"《矿山救护培训管理暂行规定》目前是否仍然有效？","consult":"原国家安监总局关于印发《矿山救护培训管理暂行规定》的通知现在是否有效？","reply":"文件内容已不适应当前矿山救护培训管理工作，请参照《矿山救护规程》《矿山救援培训大纲及考核规范》执行。","consultTime":"2022-05-13","replyTime":"2022-05-16","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-60","title":"应急救援职业资格管理办法的施行和矿山兼职救护队培训相关吗？","consult":"矿山救援规程第三十三条矿山救援队应急救援人员的培训时间应当符合下列规定：四兼职矿山救援队应急救援人员的岗位培训不少于45天180学时，每年至少复训一次，每次不少于14天60学时。9月1日施行的应急救援职业资格管理办法煤矿兼职救护队也按这个执行吗？是不是就不用参加培训了？","reply":"煤矿兼职救护队属于兼职矿山救援队伍范畴，须严格遵照《矿山救援规程》执行。《应急救援员职业资格管理办法(试行)》关于煤矿兼职救护队培训的相关要求，请咨询具体承担应急救援员职业技能考核鉴定的相关单位。","consultTime":"2026-04-26","replyTime":"2026-04-28","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-61","title":"我单位作为施工方是否需要重新编制应急预案而后经专家评审后备案？","consult":"我单位总承包一地下矿山的开拓、采切工程，业主方已编制含有我单位人员的应急预案并经专家评审通过后在属地应急管理局进行了备案，我单位作为施工方，是否需要重新编制应急预案而后经专家评审后备案？","reply":"《生产安全事故应急预案管理办法》（应急部令第2号）规定“生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案，并体现自救互救和先期处置等特点。”请结合地方有关规定开展预案的编制、评审、公布、备案等工作。","consultTime":"2023-02-16","replyTime":"2023-02-22","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-62","title":"公司是否必须建立兼职救护队？","consult":"根据《矿山救援规程》2024版第五条煤矿建立兼职矿山救援队的要求。本人所在集团公司已建立专职矿山救援队，下属多家煤矿年产量60-90万吨，专职矿山救援队到下属多家煤矿的实际行车时间均为30分钟以内，集团下属多家煤矿是否必须分别设立兼职矿山救援队？","reply":"感谢您对矿山应急救援队伍建设的关注和支持。矿山开采属于高危行业。《安全生产法》《突发事件应对法》《矿山安全法》《生产安全事故应急条例》《煤矿安全生产条例》等法律法规均对矿山企业建立矿山救援队提出明确要求。《矿山救援规程》规定“所有矿山都应当有矿山救援队为其服务。”明确要求“规模较小、不具备建立专职矿山救援队条件的，应当建立兼职矿山救援队，并与邻近的专职矿山救援队签订应急救援协议。”原则上，如果矿山企业已建立专职矿山救援队，且专职矿山救援队至服务矿山的行车时间不超过30分钟，未再要求必须设立兼职矿山救援队。","consultTime":"2025-02-18","replyTime":"2025-02-24","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-63","title":"大型露天煤矿是否必须建立专职矿山救护队？","consult":"《矿山救护规程》第五条规定“矿山企业应当建立专职矿山救援队；规模较小、不具备建立专职矿山救援队条件的，应当建立兼职矿山救援队，并与临近的专职矿山救援队签订应急救援协议。”想请问大型露天煤矿是否必须要建立专职矿山救护队？如果与符合条件的专职矿山救护队签订协议并建立本单位兼职救护队是否可以？","reply":"已电话沟通解答。感谢您对矿山应急救援队伍建设的关注和支持。矿山开采属于高危行业。《安全生产法》第八十二条、《突发事件应对法》第三十九条、《矿山安全法》第三十一条、《生产安全事故应急条例》第十条、《煤矿安全生产条例》第二十九条等法律法规均对矿山企业建立专职矿山救援队提出明确要求。依据上述法律法规，结合当前矿山安全生产形势依然严峻的实际，原则上大型露天煤矿应当建立专职矿山救援队。","consultTime":"2024-12-20","replyTime":"2024-12-23","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-64","title":"国家对应急救援队伍的建设的政策支持是什么？","consult":"请问国家对应急救援队伍的建设的政策支持是什么，国家现有的应急救援队伍有哪些，矿山应急救援队伍有哪些，甘肃省现有的应急救援队伍有哪些，矿山应急救援队伍有哪些？","reply":"已电话沟通解答。一是国家专业队有关政策支持情况。国家专业队由应急管理部与队伍属地人民政府、依托单位三方采取联合的方式进行建设和管理。国家安全生产应急救援中心承担国家专业队的检查、调研、评估和验收等具体工作。二是国家专业队基本情况。目前有113支国家专业队，其中国家矿山救援队伍有49支；甘肃省有3支国家专业队，具体情况详见国家安全生产应急救援中心网站专业队伍版块。三是地方应急救援队伍情况。请其联系当地有关部门详细了解。","consultTime":"2024-11-27","replyTime":"2024-12-03","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":true},{"id":"10-01","title":"疏散通道被占用，应由消防部门还是应急部门查处？","consult":"对于企业生产经营场所和员工宿舍的疏散通道和安全出口被占用、堵塞、锁闭的违法行为，应当由消防部门依照《中华人民共和国消防法》第十六条和第六十条规定进行查处，还是由应急管理部门依照《中华人民共和国安全生产法》第四十二条和第一百零五条进行查处？","reply":"消防救援机构和负有安全生产监督管理职责的部门，按照《中华人民共和国消防法》和《中华人民共和国安全生产法》的规定，在法定职责范围内实施对相关违法行为的行政处罚。谢谢！","consultTime":"2022-01-17","replyTime":"2022-01-18","dept":"消防救援局","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-02","title":"十二类车辆在运输过程中发生道路交通事故，适用《安全生产法》是否与道交法等存在矛盾？","consult":"尊敬的领导，安全生产法第二条规定在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法；有关法律、行政法规对消防安全和道路交通安全、铁路交通安全、水上交通安全、民用航空安全以及核与辐射安全、特种设备安全另有规定的，适用其规定。那么十二类车辆在运输过程中发生道路交通事故运用安法是否矛盾？","reply":"您好，安全生产法已经明确，适用行业法律规定。","consultTime":"2020-11-19","replyTime":"2020-12-09","dept":"调查评估和统计司","chapter":"安全培训与宣传教育","hasLocalRef":false,"_annotation":"【注释】①《安全生产法》（2021修订）第二条明确规定：“有关法律、行政法规对消防安全和道路交通安全、铁路交通安全、水上交通安全、民用航空安全以及核与辐射安全、特种设备安全另有规定的，适用其规定。”这是“特别法优于一般法”原则的体现。②道路交通事故的处理优先适用《道路交通安全法》及其实施条例；《安全生产法》仅在道路交通安全法律未作规定或涉及生产经营单位安全生产管理责任时补充适用。③对于生产经营单位（如运输企业）因安全管理不到位导致交通事故的，应急管理部门仍可依据《安全生产法》追究其安全生产主体责任（如未履行安全培训、隐患排查等职责）。④实务中，交通事故调查由公安交管部门主导，但若事故暴露出企业系统性安全管理问题，应急管理部门可同时介入查处。\n【依据】《安全生产法》（2021修订）第2条；《道路交通安全法》"},{"id":"10-03","title":"安全出口设门禁但无紧急释放按钮是否合规？","consult":"尊敬的领导您好，我想咨询一个关于安全出口法规方面的规定：如果楼梯间的常闭安全出口设置了门禁需有权限的人刷卡才能释放门禁，但是却未设置应急释放按钮用于紧急情况，逃生人员按下按钮就可以释放门禁，从而打开安全出口的防火门，而是将门禁与消防系统联动，在发生紧急情况时，通过系统联动或消防控制室值班人员远程释放。请问这样的安全出口门禁设置符合我国现行安全法规的要求吗？谢谢！","reply":"国家标准《建筑设计防火规范》（GB 50016-2014）第6.4.11条第4款规定：人员密集场所内平时需要控制人员随意出入的疏散门和设置门禁系统的住宅、宿舍、公寓建筑的外门，应保证火灾时不需使用钥匙等任何工具即能从内部易于打开，并应在显著位置设置具有使用提示的标识。谢谢！","consultTime":"2021-10-25","replyTime":"2021-10-28","dept":"消防救援局","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-04","title":"消防技术服务机构跨省开展检测、评估、维护保养业务需要办理什么手续？","consult":"消防技术服务机构跨省开展检测、评估、维护保养业务需要办理什么手续？谢谢。","reply":"《社会消防技术服务管理规定》（应急管理部令第7号）取消了跨省、自治区、直辖市执业限制。谢谢！","consultTime":"2022-01-17","replyTime":"2022-01-19","dept":"消防救援局","chapter":"安全培训与宣传教育","hasLocalRef":true},{"id":"10-05","title":"是否能明确消防安全评估公司具体应配置软件？","consult":"请问，是否能明确消防安全评估公司具体应配置软件？《从业条件》第九页附表3中，描述“评估需要软件包括而不仅限于：人员疏散能力模拟分析软件、烟气流动模拟分析软件CFD、结构安全计算软件等”，配备数量为“2”，单位为“套”。该描述是指，每个评估机构应包含2套软件，每套软件包含但不限于三个软件，换言之至少在用软件为236个；或者是三种软件中有两种，满足评估要求即可。请明示。","reply":"具体请参照《单位消防安全评估》（XF-T3005-2020），谢谢！","consultTime":"2021-12-29","replyTime":"2021-12-31","dept":"消防救援局","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-06","title":"一般机械加工企业距离消防队不足4公里，是否仍需签订应急救援协议？","consult":"一般机械加工企业编制应急预案，附近没有救援能力企业或单位，距离县消防救援大队不足4公里，需要签订应急救援协议或救援备忘录吗？","reply":"您好，留言收悉。《安全生产法》《生产安全事故应急条例》等法律法规未明确要求机械加工企业建立应急救援组织或应急救援队伍，指定兼职的应急救援人员，及与邻近的应急救援队伍签订应急救援协议。机械加工企业应当针对本企业可能发生的生产安全事故的特点和危害，按照《生产安全事故应急预案管理办法》要求，在开展事故风险辨识、评估和应急资源调查的基础上，编制相应的生产安全事故应急救援预案。","consultTime":"2025-12-18","replyTime":"2025-12-25","dept":"国家安全生产应急救援中心","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-07","title":"消防器材，灭火器生产需要到那里办理手续？","consult":"请问消防器材，灭火器生产需要到那里办理手续。属于许可还是备案？","reply":"目前在消防产品市场准入方面，公共场所、住宅使用的火灾报警产品、灭火器、避难逃生产品继续实施强制性产品认证，其他消防产品实行自愿性产品认证。新研制的尚未制定国家标准、行业标准的消防产品实施消防产品鉴定制度。经国家认证认可监督管理委员会的授权与核准，依法开展消防产品强制性认证的机构有2家，即应急管理部消防产品合格评定中心、应急管理部天津消防研究所。您可以和这两个机构联系，了解如何进行强制性认证。谢谢您的留言！","consultTime":"2021-06-08","replyTime":"2021-06-10","dept":"消防救援局","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-08","title":"人员密集场所的普通企业应急预案需要向应急管理局备案吗？","consult":"本公司生产塑料瓶，属于普通企业，但是人员较多且集中在生产车间，属于人员密集场所。本公司已经依据GBT 29639-2020编制生产安全事故应急预案并组织3位市应急管理专家库的专家评审通过。按照《生产安全事故应急预案管理办法》第二十六条的要求，是否还需要向应急管理局备案？如需要备案，我司会马上安排人员去应急局备案。","reply":"您好。应急管理部规章《生产安全事故应急预案管理办法》第二十六条规定：“易燃易爆物品、危险化学品等危险物品的生产、经营、储存、运输单位，矿山、金属冶炼、城市轨道交通运营、建筑施工单位，以及宾馆、商场、娱乐场所、旅游景区等人员密集场所经营单位，应当在应急预案公布之日起20个工作日内，按照分级属地原则，向县级以上人民政府应急管理部门和其他负有安全生产监督管理职责的部门进行备案，并依法向社会公布。”你单位应根据规定在应急预案公布后及时进行备案。","consultTime":"2024-12-23","replyTime":"2024-12-27","dept":"国家安全生产应急救援中心","chapter":"安全培训与宣传教育","hasLocalRef":true},{"id":"10-09","title":"住宅小区是否是人员密集场所？","consult":"住宅小区是否是人员密集场所？","reply":"不是。《中华人民共和国消防法》规定，人员密集场所，是指公众聚集场所，医院的门诊楼、病房楼，学校的教学楼、图书馆、食堂和集体宿舍，养老院，福利院，托儿所，幼儿园，公共图书馆的阅览室，公共展览馆、博物馆的展示厅，劳动密集型企业的生产加工车间和员工集体宿舍，旅游、宗教活动场所等。谢谢！","consultTime":"2022-02-24","replyTime":"2022-02-25","dept":"消防救援局","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-10","title":"住宅的底商算消防中的人员密集场所吗？","consult":"住宅的底商算消防中的人员密集场所吗？","reply":"人员密集场所，是指公众聚集场所，医院的门诊楼、病房楼，学校的教学楼、图书馆、食堂和集体宿舍，养老院，福利院，托儿所，幼儿园，公共图书馆的阅览室，公共展览馆、博物馆的展示厅，劳动密集型企业的生产加工车间和员工集体宿舍，旅游、宗教活动场所等。凡在上述范围内的场所均属于人员密集场所，谢谢！","consultTime":"2022-07-14","replyTime":"2022-07-15","dept":"消防救援局","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-11","title":"民用地下室消防设计应以《建筑设计防火规范》还是《人民防空工程设计防火规范》为依据？","consult":"在设计中经常有地下室商业、办公、仓库等功能空间，以及地下室汽车库内设置一些设备用房的情况。但《建筑设计防火规范》对地下室这块消防疏散、房间面积大小限定并未十分明确。而《人民防空工程设计防火规范》对这一部分内容有所阐述。是否在平时设计时应以《人民防空工程设计防火规范》作为对上述内容的设计依据。还是《以建筑设计防火规范》为设计依据？","reply":"根据《中华人民共和国消防法》（2021年4月29日修正），建设工程消防设计审核和消防验收职责现由住房和城乡建设部门承担，相关问题请向住房和城乡建设部门咨询。谢谢！","consultTime":"2022-02-27","replyTime":"2022-02-28","dept":"消防救援局","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-12","title":"现场处置方案\"每半年至少一次\"演练，是按间隔6个月还是在下半年任意时间均可？","consult":"根据《生产安全事故应急预案管理办法》第三十三条，“生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。”每半年至少组织一次现场处置方案的演练。例如2024年1月份组织了消防逃生现场处置方案的演练，那么下一次演练是要按照半年的间隔在7月份组织，还是只要是在下半年的任意月份组织一次就可以？","reply":"已电话沟通解答。您好，应急管理部规章《生产安全事故应急预案管理办法》第三十三条规定是对演练频次的最低要求。“每半年至少组织一次”，一般理解为上、下半年各组织一次，不理解为两次演练的间隔时间为6个月。   请你单位结合自身实际，提前制定演练计划，灵活采用不同形式，有针对性地组织开展应急预案演练，提高应急处置能力。","consultTime":"2024-11-27","replyTime":"2024-12-04","dept":"国家安全生产应急救援中心","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-13","title":"生产经营单位《有限空间作业安全指导手册》能否作为执法依据？","consult":"重庆没有关于生产经营单位有限空间安全管理的地标，针对地灾治理施工项目行业主管为规划自然资源中人工挖孔桩作业，按照《有限空间作业安全指导手册》应急厅函〔2020〕299号即可划为有限空间作业，应急口要求从安全生产监督执法方面入手，对人工挖孔桩有限空间作业执法，《手册》是否可以作为执法依据？或者有别的法规等文件作为依据？","reply":"感谢您的留言。《有限空间作业安全指导手册》不作为应急管理部门执法依据。","consultTime":"2022-02-10","replyTime":"2022-02-17","dept":"安全执法和工贸监管局","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-14","title":"安法第一百条中\"不具备安全生产条件\"如何认定？","consult":"《安全生产法》第一百条中明确生产经营单位将生产经营项目、场地发包或出租给不具备安全生产条件的单位或个人的将受到行政处罚，但在实际工作中如何界定是否存在安全生产条件存在困难，承租企业存在重大生产安全事故隐患判定标准中的重大事故隐患是否可以认定为不具备安全生产条件？","reply":"全国人大常委会法工委与应急管理部共同编写的《中华人民共和国安全生产法释义》一书对此问题有所解释。“不具备安全生产条件”是指不具备本法和有关法律、行政法规和国家标准或者行业标准规定的安全生产条件。","consultTime":"2021-04-07","replyTime":"2021-07-29","dept":"政策法规司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-15","title":"危化品生产企业承包商一级安全教育记录保存时间是否有明确法规规定？","consult":"请问，危险化学品生产企业承包商一级安全教育记录的保存时间是否有明确规定？如有，是哪部法律法规？谢谢！","reply":"国家安全监管总局、工业和信息化部《关于危险化学品企业贯彻落实〈国务院关于进一步加强企业安全生产工作的通知〉的实施意见》（安监总管三〔2010〕186号）要求对进入企业的承包商进行全员安全教育。为保证安全教育工作的可追溯性，承包商入厂一级安全教育记录应保存一定的期限。具体要求可咨询属地应急管理部门。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-16","replyTime":"2022-02-21","dept":"危化监管一司","chapter":"安全培训与宣传教育","hasLocalRef":true},{"id":"10-16","title":"45号令是否适用于危化品长输管道建设项目？","consult":"请问海岛上油库及海岛码头通往陆地的海底输油管道的建设工程的安全监管，是否适用《危险化学品建设项目安全监督管理办法45号令》？","reply":"根据《危险化学品建设项目安全监督管理办法》（原国家安监总局令第45号）第二条“中华人民共和国境内新建、改建、扩建危险化学品生产、储存的建设项目以及伴有危险化学品产生的化工建设项目（包括危险化学品长输管道建设项目，以下统称建设项目），其安全管理及其监督管理，适用本办法。危险化学品的勘探、开采及其辅助的储存，原油和天然气勘探、开采及其辅助的储存、海上输送，城镇燃气的输送及储存等建设项目，不适用本办法。”的规定，海岛上的油库及其辅助的输送等建设项目适用于该办法，海岛上的原油和天然气勘探、开采及其辅助的储存、海上输送等建设项目不适用于该办法。","consultTime":"2021-12-26","replyTime":"2021-12-31","dept":"危化监管二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-17","title":"《工贸企业有限空间作业安全管理与监督暂行规定》是否适用于市政管网施工单位处罚？","consult":"《工贸企业有限空间作业安全管理与监督暂行规定》第二条规定，工贸企业有限空间作业的安全管理与监督，适用本规定。但在城市市政管网领域经常有施工单位存在有限空间作业违法行为，甚至会发生安全事故。请问，该规章是否适用于市政管网领域有限空间作业违法行为进行处罚的依据？谢谢！","reply":"《工贸企业有限空间作业安全管理与监督暂行规定》适用于冶金、有色、建材、机械、轻工、纺织、烟草、商贸企业有限空间作业的安全管理与监督。","consultTime":"2021-04-29","replyTime":"2021-07-21","dept":"政策法规司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-18","title":"现在应急预案因为变更项目经理要修订那些内容？","consult":"仍处于施工阶段的建筑施工项目，变更了项目经理，其他人员任命也稍有变动，应急预案在2021年10月颁布。现在应急预案因为变更项目经理要修订那些内容？需要评审及备案吗？限定时间是多长？参与修订的人员有那些？要做什么记录归档？","reply":"一、请根据《生产安全事故应急预案管理办法》（应急部令第2号）第十六条“生产经营单位应急预案应当包括向上级应急管理机构报告的内容、应急组织机构和人员的联系方式、应急物资储备清单等附件信息。附件信息发生变化时，应当及时更新，确保准确有效。”判断你单位应急预案的附件是否需要更新以及需要更新哪些内容；请根据你单位的生产安全事故应急预案是否存在第三十六条描述的6种情形来判断是否需要修订。二、关于预案编制修订的人员、是否需要评审及备案等相关要求，请分别参照《生产安全事故应急预案管理办法》（应急部令第2号）第二章、第三章相关条款内容执行。三、如地方对建筑施工企业生产安全事故应急预案另有规定的，请参照执行。","consultTime":"2023-02-28","replyTime":"2023-03-01","dept":"国家安全生产应急救援中心","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-19","title":"履行与中国海洋石油总公司签订的合同区块石油合同时是否需要办理安全生产许可证？","consult":"智慧石油与中海油签订了石油合同渤海0531、0917及南海北部湾2204、2205合同区，根据合同约定，勘探阶段智慧石油需完成合同约定的探井钻探作业义务工作量。智慧石油作为投资者，负责前期综合研究、井位部署及勘探规划等工作，探井钻探作业工作采取项目承包方式，通过招投标方式选择国内具备资质的钻探作业服务商包括中海油、中油海及中石化完成。特向贵司咨询智慧石油是否需要办理安全生产许可证？","reply":"依据《应急管理部办公厅关于石油天然气企业安全生产许可的复函》（应急厅函〔2021〕244号）规定，从事陆上采油（气）、海上采油（气）、钻井、物探、测井、录井、井下作业、油建、管道储运、海油工程活动，应依法取得相应范围的石油天然气企业安全生产许可证。","consultTime":"2023-04-24","replyTime":"2023-07-07","dept":"危险化学品安全监督管理二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-20","title":"涉及危险化学品的建设项目多大规模需要做三同时？","consult":"如果企业准备进行技改，在原有工艺流程基础上，新增1个塔及附属系统冷凝罐、泵、管线或者新增一些设备设施替代原有的部分简单工艺，需要做三同时吗？还是公司内部做个技改审批，设计单位出图、施工单位施工，公司自己检查安全条件合格就可以？谢谢。","reply":"根据《危险化学品建设项目安全监督管理办法》第四十条，对于规模较小、危险程度较低和工艺路线简单的建设项目，安全生产监督管理部门可以适当简化建设项目安全审查的程序和内容。具体情况建议咨询属地应急管理部门。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-04","replyTime":"2022-03-09","dept":"危化监管一司","chapter":"安全培训与宣传教育","hasLocalRef":true},{"id":"10-21","title":"央企项目部承包商的应急预案是否需要向项目所在地县级以上应急管理部门备案？","consult":"你好，公司是中央企业，总部在北京，分公司在四川，下设建设项目部，实施项目化管理，涉及区域包括四川重庆贵州等地，项目部编制了生产安全事故应急预案，在重庆市应急管理局进行了备案，项目部的承包商也编制了应急处置方案，承包商作业周期有的可能不到半年，是否需要将应急预案和演练情况报所在地县级以上地方人民政府负有安全生产监督管理职责的部门？","reply":"《生产安全事故应急预案管理办法》（应急部令第2号）第二十六条明确“建筑施工单位应当在应急预案公布之日起20个工作日内，按照分级属地原则，向县级以上人民政府应急管理部门和其他负有安全生产监督管理职责的部门进行备案”，并对不同类型企业预案备案进行了细化说明。第三十三条对生产经营单位的应急预案演练进行了规定。你公司承包商作为生产经营单位应对照相应条款，结合属地政府有关规定，依法依规开展预案备案及实施。","consultTime":"2023-03-28","replyTime":"2023-03-29","dept":"国家安全生产应急救援中心","chapter":"安全培训与宣传教育","hasLocalRef":true},{"id":"10-22","title":"生产安全事故应急演练的内容有具体规定吗？","consult":"专家好，生产安全事故应急演练的内容在法律法规中有具体的规定吗，比如说建筑施工行业，常见的一般有高坠、触电、物体打击、机械损害、坍塌、有限空间作业等方面的演练，那么防汛演练属于生产安全事故应急演练范围吗？谢谢！","reply":"已电话沟通解答。关于应急演练工作，《突发事件应对法》《安全生产法》《生产安全事故应急条例》《生产安全事故应急预案管理办法》《突发事件应急预案管理办法》等法律法规、部门规章和相关文件中都有规定，请按照规定执行；具体演练内容需结合实际确定。防汛演练有很多种，演练目的、演练内容、组织主体、组织形式等各不相同。但暴雨洪涝等汛情极易引发各类次生事故灾害，生产经营单位应根据实际开展相应的应急演练。","consultTime":"2024-01-25","replyTime":"2024-02-01","dept":"国家安全生产应急救援中心","chapter":"安全培训与宣传教育","hasLocalRef":true},{"id":"10-23","title":"针对施工企业的一个施工项目应该编制综合应急预案还是现场处置方案？","consult":"根据《生产经营单位生产安全事故应急预案编制导则》GBT29639-2020，综合应急预案、专项应急预案、现场处置方案内容与要求不同，实施过程中常存在困惑，请指教。另塔吊等起重设备的安、拆是否编制的是专项应急预案？","reply":"《生产安全事故应急预案管理办法》第六条规定“综合应急预案，是指生产经营单位为应对各种生产安全事故而制定的综合性工作方案，是本单位应对生产安全事故的总体工作程序、措施和应急预案体系的总纲。专项应急预案，是为应对某一种或者多种类型生产安全事故，或者针对重要生产设施、重大危险源、重大活动防止生产安全事故而制定的专项性工作方案。现场处置方案，是根据不同生产安全事故类型，针对具体场所、装置或者设施所制定的应急处置措施。”原则上，生产经营单位风险种类多、可能发生多种类型事故的，应当编制综合应急预案。对于某一种或者多种类型的事故风险，可以编制相应的专项应急预案，或将专项应急预案并入综合应急预案。对于危险性较大的场所、装置或者设施，应当编制现场处置方案。你单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，确立本单位的应急预案体系，进而编制相应的应急预案。","consultTime":"2023-11-16","replyTime":"2023-11-20","dept":"国家安全生产应急救援中心","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-24","title":"建筑施工企业项目部是否需单独编制综合应急预案？","consult":"公司是建筑施工企业，已经编制了公司级综合应急预案并已经备案，施工项目部是否也要编制综合应急预案？","reply":"您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第十二条规定，生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案。同时，住房和城乡建设部门发布的建筑行业相关法规和标准，对施工单位和项目管理机构编制应急预案进行了规定。公司施工项目部应根据安全生产和建筑行业等方面法规标准要求，结合工作实际确定编制相应的应急预案。","consultTime":"2024-01-25","replyTime":"2024-01-31","dept":"国家安全生产应急救援中心","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-25","title":"烟花爆竹成品货物重大危险源临界值是总重量还是含药量？","consult":"1.对于烟花爆竹成品货物重大危险源辨识，临界值是成品货物重量还是成品含药量？按照规范描述个人理解应为成品货物总重量，如果为货物总重量如何管控和掌握？2.成品库房重大危险源辨识储存单元为“独立库房”是否考虑实体防火墙的独立防火分区？","reply":"《烟花爆竹重大危险源辨识》（AQ4131-2023）第3.2条规定，临界量是指某种危险物品构成重大危险源所规定的最小数量。对于烟花爆竹成品、半成品的临界量（Q）、设计存放量(q)指成品、半成品的含药量。《烟花爆竹重大危险源辨识》（AQ4131-2023）中第4.3条规定：每栋独立的烟花爆竹成品和半成品仓库划分为一个储存单元。烟花爆竹储存单元应为单栋独立的库房。","consultTime":"2023-03-27","replyTime":"2023-04-07","dept":"危化监管二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-26","title":"二氧化碳致裂器注入液化二氧化碳后属于危险化学品吗？","consult":"我县近期查获一宗使用液化二氧化碳充入二氧化碳致裂器的小作坊，属危险化学品生产企业吗？二氧化碳致裂器注入适量二氧化碳和装填起爆裝置后可作为新型爆破器材。","reply":"你好，请执行《危险化学品目录（2015版）》及《危险化学品目录（2015版）实施指南（试行）》等相关文件要求，依据有关原则进行判定。","consultTime":"2022-01-18","replyTime":"2022-01-27","dept":"危化监管二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-27","title":"《山东省企业危险作业报告办法》是否与上位法抵触？","consult":"山东省今年6月1日实行的《山东省企业危险作业报告办法》是否属于许可范围，是否与《行政许可法》和《安全生产法》抵触。理由如下：1、《安全生产法》第四十三条　生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实。2、《安全生产法》并没有规定生产经营单位必须报告危险作业以及危险作业的内容。","reply":"根据《国务院办公厅关于全面实行行政许可事项清单管理的通知》（国办发〔2022〕2号），企业危险作业报告不属于中央层面设定的行政许可事项。《山东省企业危险作业报告办法》是山东省应急厅、山东省工信厅等九部门为加强企业危险作业安全管理制定的规范性文件，其合法性审核请咨询山东省司法行政部门。","consultTime":"2022-09-25","replyTime":"2022-09-28","dept":"政策法规司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-28","title":"擦炮属于摩擦类还是爆竹类产品？","consult":"咨询一下市面上的擦炮就是有擦火头的，用火柴皮点燃的火炮是属于爆竹类还是摩擦类？","reply":"《国务院办公厅转发安全监管总局等部门关于进一步加强烟花爆竹安全监督管理工作意见的通知》（国办发〔2010〕53号）要求，质检部门要会同安全监管、公安等有关部门，及时组织修订有关产品质量技术标准，科学进行产品分类、分级，从严规定产品种类、规格、药量等重要安全技术指标，取消个人燃放的小礼花类、摩擦类、烟雾类和内筒型组合烟花等危险性大的产品品种。按照《烟花爆竹 安全与质量》GB10631-2013规定，爆竹是指燃放时主体爆炸（主体筒体破碎或者爆裂）但不升空，产生爆炸声音、闪光等效果，以听觉效果为主的产品；玩具类是指形式多样、运动范围相对较小的低空产品，燃放时产生火花、烟雾、爆响等效果的产品，其中摩擦型是指用撞击、摩擦等方式直接引燃引爆主体的产品，摩擦型仅限出口。具体分类问题请咨询相关标准制定单位。","consultTime":"2022-04-17","replyTime":"2022-04-20","dept":"危化监管二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-29","title":"烟花爆竹1.1-2级储存仓库，能否存放C级烟花爆竹产品？","consult":"尊敬的领导，您好！请问烟花爆竹1.1-2级储存仓库，能否存放C级烟花爆竹产品？","reply":"依据《烟花爆竹作业安全技术规程》（GB11652）第9.3.3、《烟花爆竹工程设计安全标准》（GB50161）表3.1.3-2的规定，C级烟花爆竹产品可以在1.1-2级仓库储存，但储存限量、产品堆垛等应符合相关标准要求。","consultTime":"2023-02-11","replyTime":"2023-02-23","dept":"危化监管二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-30","title":"烟花爆竹储存作业中的\"守护作业\"是否指库房看守保安？","consult":"《特种作业人员安全技术培训考核管理规定》中10烟花爆竹安全作业 10.5烟花爆竹储存作业指从事烟花爆竹仓库保管、守护、搬运等作业。 其中烟花爆竹守护作业是否指库房看守保安人员。","reply":"依据《特种作业人员安全技术培训考核管理规定》附件特种作业目录10.5烟花爆竹储存作业，指从事烟花爆竹仓库保管、守护、搬运等作业。烟花爆竹守护作业人员涵盖库房看守保安人员。","consultTime":"2023-07-07","replyTime":"2023-07-17","dept":"危化监管二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-31","title":"烟花爆竹零售店是否需要建立双重预防机制？","consult":"市局要求各县区局推进安全生产双重预防机制建设，辖区烟花爆竹零售店是否需要进行双重预防机制。隐患是否需要进行辨识。","reply":"烟花爆竹生产经营单位应依据《安全生产法》第四条规定，构建安全风险分级管控和隐患排查治理双重预防机制，开展安全风险分级管控和隐患排查治理。","consultTime":"2023-03-31","replyTime":"2023-04-10","dept":"危化监管二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-32","title":"爆竹厂的设计单位需要什么资质？","consult":"1.请问设计生产红炮类产品工厂的设计单位需要具备什么资质？普通的化学工程设计有限公司可以吗？2.生产红炮类产品工厂是否必须要设置专业的燃放场所？没有可以吗？","reply":"依据《烟花爆竹生产企业安全生产许可证实施办法》第七条，烟花爆竹生产企业建设项目的设计由具有乙级以上军工行业的弹箭、火炸药、民爆器材工程设计类别工程设计资质或者化工石化医药行业的有机化工、石油冶炼、石油产品深加工工程设计类型工程设计资质的单位承担。依据《烟花爆竹工程设计标准》（GB50161—2022）第4.1.2条，应设置燃放试验场，且应符合GB50161—2022第4.1.2条、4.1.3条、4.4.1条、8.8.1条、8.8.2条规定。","consultTime":"2023-10-08","replyTime":"2023-10-18","dept":"危化监管二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"10-33","title":"玩具烟花小金鱼是否纳入烟花爆竹管理？","consult":"玩具烟花小金鱼摩擦类产品也比较安全，现在线下婴幼儿用品店、小超市等地方，线上比如淘宝、拼多多都有在卖，因为这个产品主要是雷酸银，公安和应急部门认定不含有烟火药不属于烟花爆竹，不能按烟花爆竹非法经营处理，能否出个界定到底是否属于烟花爆竹？","reply":"《烟花爆竹安全与质量》（GB10631-2013）中明确定义，烟花爆竹是指以烟火药为主要原料制成，引燃后通过燃烧或爆炸，产生光、声、型、烟雾等效果，用于观赏，具有易燃易爆危险的物品。国家对烟花爆竹的生产、经营实施许可制度。未经许可，任何单位或个人不得生产、经营烟花爆竹。雷酸银是一种非常敏感的爆炸物，《烟花爆竹作业安全技术规程》GB-11652中将其列入烟火药。玩具类摩擦型产品是指用撞击摩擦等方式直接引燃引爆主体的产品，仅限出口，不得在国内销售。","consultTime":"2022-01-05","replyTime":"2022-01-14","dept":"危化监管二司","chapter":"安全培训与宣传教育","hasLocalRef":false},{"id":"11-02","title":"危险化学品单位类别如何根据从业人数、营收和重大危险源级别划分？","consult":"1.请问附录A中的危险化学品单位类别根据从业人数、营业收入和危险化学品重大危险源级别划分,我司一级重大危险源2个，从业人员800人，营业收入超过4亿，判定为第几类危险化学品单位啊？2.注 4:企业规模按从业人员、营业收入划分不一致的,按最低等级确定，这句话怎么理解。","reply":"根据附录A，企业危险化学品重大危险源级别为一级危险化学品重大危险源，从业人数在300人以上1000人以下的，企业类别划分为第二类危险化学品单位；营业收入在40000万元以上的，企业类别划分为第一类危险化学品单位，根据表A.1中“注4：表中企业规模按从业人员、营业收入划分不一致的，按最低等级确定”可知，该企业可按照“从业人数在300人以上1000人以下”确定企业类别。","consultTime":"2024-03-11","replyTime":"2024-03-12","dept":"国家安全生产应急救援中心","chapter":"其他","hasLocalRef":false},{"id":"11-03","title":"有罚款的违法记录能注册中级安全工程师吗？","consult":"有罚款的违法记录能注册中级安全工程师吗？","reply":"已电话沟通解答。您好！感谢您对注册安全工程师工作的关注！根据《注册安全工程师职业资格制度规定》（应急〔2019〕8号）第十七条规定，申请注册的人员，必须同时具备下列基本条件：（一）取得注册安全工程师职业资格证书；（二）遵纪守法，恪守职业道德；（三）受聘于生产经营单位安全生产管理、安全工程技术类岗位或安全生产专业服务机构从事安全生产专业服务；（四）具有完全民事行为能力，年龄不超过70周岁。根据与您电话沟通了解到的情况，建议注册申请时，提供行政处罚罚款相关情况说明，具体办理结果以注册审批结论为准。","consultTime":"2024-03-03","replyTime":"2024-03-08","dept":"人事司","chapter":"其他","hasLocalRef":false},{"id":"11-04","title":"三级危险化学品重大危险源是否加装紧急切断？","consult":"我们是油气田开发企业，生产过程中需要部分储罐进行油水沉降分离、临时周转，按照危险化学品重大危险源的相关要求，部分罐区构成了危险化学品三级重大危险源，近期有专家检查指出必须加装紧急切断装置。经查阅40号令，仅明确一级、二级危险化学品重大危险源需加装紧急切断装置。请问三级危险化学品重大危险源是否必须加装紧急切断装置？","reply":"对油气田油水沉降分离储罐加装紧急切断装置无相关规定。","consultTime":"2023-05-22","replyTime":"2023-07-07","dept":"危险化学品安全监督管理二司","chapter":"其他","hasLocalRef":false},{"id":"11-05","title":"安全评价项目组组长必须具备相关行业主专业资格吗？化工专业可否担任其他行业项目组长？","consult":"安全评价项目组组长要求具备相关行业主专业的资格，是不是从事化工行业的评价必须要求化学工艺专业才能当项目组组长？化学工艺专业是否能当其他行业项目组组长？","reply":"《安全评价检测检验机构管理办法》第十七条第二款规定“安全评价项目组组长应当具有与业务相关的二级以上安全评价师资格,并在本行业领域工作三年以上。”感谢对我部工作的大力支持！","consultTime":"2022-10-18","replyTime":"2022-10-19","dept":"规划财务司","chapter":"其他","hasLocalRef":false},{"id":"11-06","title":"非法定评价是否需要资质，如需资质，是什么范围的资质，如何申请？","consult":"请问，非法定评价是否需要资质？如需资质，是什么范围的资质？如何申请？谢谢！","reply":"安全评价机构资质范围是依据《安全生产法》等法律、行政法规确定的，已在《安全评价检测检验机构办理办法》（应急部令第1号中作出规定。感谢对我部工作的大力支持！","consultTime":"2022-10-13","replyTime":"2022-10-18","dept":"规划财务司","chapter":"其他","hasLocalRef":false},{"id":"11-07","title":"《危险化学品经营单位安全评价导则（试行）》目前是否仍然有效？","consult":"请问《危险化学品经营单位安全评价导则试行》是否有效？","reply":"您好，《危险化学品经营单位安全评价导则（试行）》现行有效。感谢留言。","consultTime":"2022-08-23","replyTime":"2022-08-26","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-08","title":"涉尘涉爆企业是否是火灾高危企业？","consult":"涉尘涉爆企业是否是火灾高危企业？如果是，是什么时候纳入的？","reply":"原公安部消防局曾于2013年制定印发了《火灾高危单位消防安全评估导则（试行）》（公消〔2013〕60号），其中规定在本地区具有一定规模的生产、储存、经营易燃易爆危险品场所单位属于火灾高危单位。","consultTime":"2022-07-27","replyTime":"2022-07-29","dept":"消防救援局","chapter":"其他","hasLocalRef":true},{"id":"11-09","title":"安全评价机构技术负责人和安全评价项目负责人能是同一人担任吗？","consult":"安全评价机构技术负责人和安全评价项目负责人能是同一人担任吗？","reply":"专职技术负责人具有一级安全评价师职业资格，并具有与所开展业务相匹配的高级专业技术职称，在本行业领域工作八年以上；安全评价项目组组长应当具有与业务相关的二级以上安全 评价师资格，并在本行业领域工作三年以上。《安全评价检测检验机构管理办法》（应急部令第1号）无不能是同一人的相关规定。","consultTime":"2022-07-19","replyTime":"2022-08-01","dept":"规划财务司","chapter":"其他","hasLocalRef":false},{"id":"11-10","title":"危险化学品建设项目非生产是否强制进入化工园区或化工集中区？","consult":"您好，我想咨询一下，危险化学品经营带仓储非生产的企业“两重点一重大”企业，构成一级重大危险源，是否需要强制进入化工园区或化工集中区？如果需要进入化工园区或化工集中区，请告知相关政策文件。感谢您的及时回复。","reply":"您好，根据《关于“十四五”推动石化化工行业高质量发展的指导意见》，新建危险化学品生产项目必须进入一般或较低安全风险的化工园区（与其他行业生产装置配套建设的项目除外），引导其他石化化工项目在化工园区发展。请根据所在地方政府具体准入要求执行，或征求属地相关部门意见。感谢留言。","consultTime":"2022-07-18","replyTime":"2022-07-22","dept":"危化监管二司","chapter":"其他","hasLocalRef":true},{"id":"11-11","title":"铅酸电池充电间因氢气挥发是否必须定为甲类火灾区域，有无定量判定依据？","consult":"由于蓄电池充电过程中，会有微量氢气产生。所以不少专家认为产生易燃易爆气体氢气，该生产区域应定义为甲类区域。但是也有不少专家认为：蓄电池充电过程中产生的氢气量很少按照《建筑设计防火规范》有关规定，当氢气浓度小于1Lm³且，总量小于25m³时，该区域可不定性为甲类。为此由于缺少相关文献支持，想请领导予以指导如何确定该区域内的火灾类别，谢谢。","reply":"可以参考国家标准《建筑设计防火规范》（GB50016-2014，2018年版）第3.1.2条的条文说明当中表2的有关内容。谢谢！","consultTime":"2022-07-18","replyTime":"2022-07-19","dept":"消防救援局","chapter":"其他","hasLocalRef":false},{"id":"11-12","title":"油田技术服务中物探单位如何界定？","consult":"领导你好，油田技术服务企业中物探单位如何界定？我单位是在物探作业中仅为物探公司开展放线、开坑工序工作，请问我单位是否属于20号令中需要取得安全生产许可证的单位？","reply":"直接从事物探作业的企业应当取得石油天然气企业安全生产许可证（许可范围：物探）；向物探企业提供技术服务或其他辅助性工作的企业，不需取得石油天然气企业安全生产许可证。","consultTime":"2022-07-14","replyTime":"2022-08-01","dept":"危险化学品安全监督管理二司","chapter":"其他","hasLocalRef":false},{"id":"11-13","title":"工业中劳动密集型企业如何界定？","consult":"不管以前定义的还是GBT40248中都没明确规定工业中劳动密集型企业的生产车间和员工宿舍，以什么标准界定？以人数还是就是工业类型划分的？谢谢解惑！","reply":"根据国家标准GB/T40248《人员密集场所消防安全管理》给出的定义，人员密集场所包括人员密集的生产车间和员工宿舍，具体的生产加工类型和人数指标由各地根据本地产业特点、企业规模、管理模式等因素合理确定。谢谢！","consultTime":"2022-07-07","replyTime":"2022-07-09","dept":"消防救援局","chapter":"其他","hasLocalRef":true},{"id":"11-14","title":"《危险化学品经营许可证》有无最新式样和印刷要求，相关文件是什么？","consult":"《危险化学品经营许可证》有新的式样和印刷要求吗？有没有相关文件？","reply":"您好，请查阅《应急管理部办公厅关于更新危险化学品经营许可证与非药品类易制毒化学品生产经营许可证式样的通知》（应急厅〔2020〕48号）。感谢留言。","consultTime":"2022-06-15","replyTime":"2022-06-18","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-15","title":"危险化学品经营许可无储存经营场所是否可以设置在农村自建房内？","consult":"危险化学品经营许可无储存经营场所是否可以设置在农村自建房内？","reply":"您好，申请危险化学品经营许可证应依法登记注册为企业，经营场所具备55号令所规定条件并提供相关文件资料，具体申请办理事项请咨询属地应急管理部门。感谢留言。","consultTime":"2022-05-10","replyTime":"2022-05-14","dept":"危化监管二司","chapter":"其他","hasLocalRef":true},{"id":"11-16","title":"医疗器械是否属于危险化学品？","consult":"根据《危险化学品目录2015版》及其使用指南的规定，属于列入目录的危险化学品。目前，现行法规并未对医疗器械有豁免，因此，其经营应办理危险化学品经营许可证。可是《危险化学品安全管理条例》第九十七条 监控化学品、属于危险化学品的药品和农药....依照其规定。医疗器械已经按药品管理条例办理了相应的许可手续，再按危险化学品许可，是否属重复许可，加重企业负担？","reply":"您好，《安全生产法》修订后，我部启动了相应部门规章的修订工作，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。感谢您的留言。","consultTime":"2021-12-02","replyTime":"2022-04-24","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-17","title":"防疫物资如何回收？","consult":"请问防疫用的救灾物资如帐篷等是否需要回收，如果需要回收程序的参考标准是什么？","reply":"已电话与留言人沟通相关内容，留言人无意见。","consultTime":"2022-04-02","replyTime":"2022-04-07","dept":"救灾和物资保障司","chapter":"其他","hasLocalRef":false},{"id":"11-18","title":"建设单位（甲方）是否属于建筑企业范畴，是否属于安全生产高风险企业？","consult":"我对建设单位的安全生产职责定位有些疑问，请问建设单位甲方是否属于建筑企业，是否属于安全生产高风险企业范畴？","reply":"您好，《安全生产法》第二十四条“矿山、金属冶炼、建筑施工、运输单位和危险物品的生产、经营、储存、装卸单位，应当设置安全生产管理机构或者配备专职安全生产管理人员。”这里指的是建筑施工单位。建设单位的安全责任在《建设工程安全生产管理条例》第六至第十一条有明确规定。","consultTime":"2022-03-25","replyTime":"2022-03-28","dept":"安全生产综合协调司","chapter":"其他","hasLocalRef":false},{"id":"11-19","title":"内浮顶汽油储罐仅设阻火器通气孔是否合规？","consult":"贵司您好，20000立内浮顶汽油储罐甲B液体仓储企业，罐顶只有带阻火器通气孔是否满足法规要求？是否有强制上呼吸阀或氮封要求？如果法规无明确要求，对于此类储罐应该如何削减浮盘与罐顶油气空间风险？谢谢各位专家老师？","reply":"您好，建议参照《立式圆筒形钢制焊接油罐设计规范》（GB50341-2014）有关要求执行。感谢您的留言。","consultTime":"2022-03-22","replyTime":"2022-03-25","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-20","title":"二氯异氰尿酸钠是否属于危险化学品？","consult":"请问二氯异氰尿酸钠是否属于危险化学品？","reply":"二氯异氰尿酸钠未列入《危险化学品目录（2015版）》，但经鉴定若属于危险化学品，有关生产、进口企业应根据《危险化学品登记管理办法》要求进行危险化学品登记，但不需要办理相关安全行政许可手续，企业应需要按照危险化学品进行管理。","consultTime":"2022-03-21","replyTime":"2022-04-07","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-21","title":"使用液氨作为原料生产氨基酸项目是否属于化工企业？","consult":"使用液氨作为原料生产氨基酸项目是否属于化工企业？一个主体下有两个项目一个是危险化学品生产项目一个是氨基酸项目，在同一院内，是按危险化学品企业管理还是按工贸，还是分别管理？","reply":"使用液氨等危险化学品作为原料生产化工产品的企业属于化工企业。根据《危险化学品生产企业安全生产许可证实施办法》第二条：“本办法所称危险化学品生产企业，是指依法设立且取得工商营业执照或者工商核准文件从事生产最终产品或者中间产品列入《危险化学品目录》的企业”。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-28","replyTime":"2022-03-03","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-22","title":"涂料类似的常压聚合生产乳液、硅油等工艺是否属于重点监管危险化工工艺？","consult":"《国家安全监管总局关于公布第二批重点监管危险化工工艺目录和调整首批重点监管危险化工工艺中部分典型工艺的通知》安监总管三〔2013〕3号中，对于聚合反应的豁免条款：“涉及涂料、粘合剂、油漆等产品的常压条件生产工艺不再列入聚合工艺。”，请问描述中的“等产品”，具体是指？与涂料类似的乳液、硅油等产品的常压条件聚合生产工艺是否属于重点监管危险化工工艺？","reply":"根据《国家安全监管总局关于公布首批重点监管的危险化工工艺目录的通知》，聚合工艺的典型工艺含“（5）乳液生产”，感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-19","replyTime":"2022-02-22","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-23","title":"请问二氧化氯粉剂是否需纳入危险化学品进行管理？","consult":"我公司使用二氧化氯粉剂对水进行消毒杀菌，主要成分二氧化氯的含量为10WW，请问二氧化氯粉剂是否需纳入危险化学品进行管理？谢谢！","reply":"根据《危险化学品目录（2015版）》说明四（四）的规定，危险化学品用作农药用途时，是指其原药。因此，该产品不属于纳入目录管理的危险化学品。但是该产品仍有一定的危险性，企业自身应加强管理。","consultTime":"2022-02-18","replyTime":"2022-02-28","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-24","title":"河豚毒素CAS号4368-28-9和鹅膏蕈碱CAS号23109-05-9，两者因具有较强毒性是否属于危险化学品？","consult":"请问河豚毒素CAS号：4368-28-9和鹅膏蕈碱CAS号：23109-05-9，两者因具有较强毒性，是否属于危险化学品？应如何管理？","reply":"符合危险化学品确定原则，但暂时未纳入《危险化学品目录》。企业应该按照剧毒化学品的标准自行加强管理。","consultTime":"2022-02-17","replyTime":"2022-02-25","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-25","title":"20的氨水是危化品吗？","consult":"请问20的氨水是危化品吗？","reply":"您好，氨溶液[含氨＞10%]列入《危险化学品目录》（2015版）。感谢您的留言。","consultTime":"2022-02-14","replyTime":"2022-02-16","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-26","title":"洗洁精、洗衣液的生产企业是否为工贸企业？","consult":"您好！我公司是生产洗洁精、洗衣液的企业，少量使用危险化学品为达到规模以上，工艺流程为灌装、打包、装车。反应过程为常温常压，且无重大危险源。由于公司拟开展安全生产标准化以及双控体系建设，需确认是否为工贸企业？","reply":"感谢您的留言。按营业执照明确的类型执行相应的标准。","consultTime":"2022-02-14","replyTime":"2022-02-21","dept":"安全执法和工贸监管局","chapter":"其他","hasLocalRef":false},{"id":"11-27","title":"安全副总、生产副总、技术副总是否一定设置？","consult":"危化企业，设有安环部经理，他的上级是安环系统主任公司定的职务，现在应急管理局来检查，说“人员配制不符危化企业三年行动专项整治要求无管生产安全副总经理。”请问危化企业是否一定要配置齐全安全副总、生产副总、技术副总？","reply":"根据《危险化学品安全专项整治三年行动实施方案》，“对涉及‘两重点一重大’生产装置和储存设施的企业，新入职的主要负责人和主管生产、设备、技术、安全的负责人及安全生产管理人员必须具备化学、化工、安全等相关专业大专及以上学历或化工类中级及以上职称”，企业必须具有分管生产、技术、安全的负责人，仅设置安环部经理不符合上述要求。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-10","replyTime":"2022-02-15","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-28","title":"停车检修过程中使用是否符合相关法律法规的要求？","consult":"在某项目执行过程中，因中间罐区排净收集的需要，设置了地下排净罐，此收集罐布置在储罐围堰内，填沙埋在地下，正常操作时排净罐不存料，停车检修过程中使用，是否符合相关法律法规的要求？","reply":"目前没有相关标准或规范明确禁止在中间罐区中设置地下埋沙排净罐。如需设置，请做好安全风险分析与评估，强化安全风险管控，确保安全生产。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-09","replyTime":"2022-02-14","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-29","title":"有哪些变更需要通过设计院？","consult":"在化工生产过程中，由于规范的不断更新，现场存在很多不符合规范要求的地方，如果依据规范要求改造必须通过设计院吗？","reply":"当生产装置正在施工安装过程中，由于国家法律、法规或标准发生变化需要修改设计的，属于设计变更。应当由原设计单位负责。当生产装置已经建成投产或属于在役装置的，由于国家法律、法规或标准发生变化需要进行现场改造，按照有关规定作为“改造建设项目”立项实施时，应当执行国家有关建设项目管理程序及要求，并委托符合资质要求的设计单位负责设计。对于为满足现行标准或有关规定的要求，现场改造范围比较小，改造工作量不大且改造费用不高，企业可以通过“技措项目”实施的小项目，则不一定必须通过正规设计单位设计，但应开展安全风险分析。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-07","replyTime":"2022-02-11","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-30","title":"危化品经营企业重大危险源是否需要安装紧急停车系统？","consult":"请问：危险化学品经营企业或生产企业的储罐区组涉及三、四级重大危险源的是否需要设置紧急停车系统即储罐进出口管道需要设置紧急切断阀和配套控制系统？若需要，则其法理依据是什么请赐教，谢谢！","reply":"您好，请查阅《危险化学品重大危险源监督管理暂行规定》及相关标准要求。感谢您的留言。","consultTime":"2022-01-26","replyTime":"2022-01-31","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-31","title":"二氧化碳灭火器能否用于高压变电站火灾？","consult":"甲类化工厂，高压变电站大于600V是否能配置二氧化碳灭火器，用于高压变电站灭火？","reply":"E类火灾（可能发生物体带电燃烧的火灾）场所的灭火器配置要求见国家标准《建筑灭火器配置设计规范》（GB50140-2005），谢谢！","consultTime":"2022-01-24","replyTime":"2022-01-25","dept":"消防救援局","chapter":"其他","hasLocalRef":false},{"id":"11-32","title":"已提前备案但落地未认定化工园区的化工项目，应急部门能否进行三同时审批？请问应急部门能否进行审批？","consult":"《化工园区建设标准和认定管理办法试行》规定：未通过认定的化工园区不得新建、改建、扩建化工项目......，该《办法》很大程度上基于沿海地区化工园区认定基本完成的现实情况下，而我省化工园区认定工作起步较晚2021年6月才出省级认定办法。我市有一化工项目在2021年4月完成备案，落地我市未认定的化工园区，企业欲申请进行“三同时”审查，请问应急部门能否进行审批？","reply":"严格执行《化工园区建设标准和认定管理办法试行》要求，感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-01-18","replyTime":"2022-01-21","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-33","title":"危化品无储存经营企业数量激增，如何通过年度核销等制度加强有效监管？","consult":"国家对危化品经营实行许可制度，然则，名存实亡不为过。地方倾力打造最优营商环境、市场监管部门商事改革等均从许可突破，危化品经营许可，尤其是不带存储的经营类企业，申请程序已然\"洞开”，如2021年青岛市西海岸新区，数量从百余家骤然升至近万家！危化市场真的如此活跃？！绝大多数的无实质业务企业，无形中分散了监管精力。请部危化二司研究出台规定，如年度执法核查品类、数量等，实行核销，对危化品经营企业有效监管。","reply":"您好，谢谢您的建议，我们正组织修订《危险化学品经营许可证管理办法》等部门规章。","consultTime":"2022-01-13","replyTime":"2022-01-15","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-34","title":"公司是否属于国内首次使用的化工工艺，是否需要进行安全可靠性论证？","consult":"您好！按照总局41号令：“国内首次使用的化工工艺，必须经过省级人民政府有关部门组织的安全可靠性论证。”我公司引进国外成熟的丙酮加氢生产异丙醇生产工艺，此工艺技术在国外有多套成功运行的业绩，在国内没有应用先例。但丙酮加氢生产工艺是成熟的生产工艺，国内已有多家生产厂家，且生产工艺与我公司引进的生产工艺基本一致。请问：此类情况是否属于国内首次使用的化工工艺范畴？是否需要进行安全可靠性论证？谢谢！","reply":"根据《危险化学品生产企业安全许可证实施办法》，“国内首次使用的化工工艺，必须经过省级人民政府有关部门组织的安全可靠性论证”根据留言人留言“在国内没有应用先例”，因此贵公司拟引进工艺属于国内首次使用的化工工艺范畴，需要省级人民政府有关部门组织安全可靠性论证。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-01-10","replyTime":"2022-01-13","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-35","title":"危化企业注册安全工程师配置数量有何要求，可否用消防工程师替代？","consult":"危险企业需要配置安全工程师的数量，能否由消防工程师替上？","reply":"您好！感谢您对注册安全工程师工作的关注！根据《注册安全工程师分类管理办法》（安监总人事〔2017〕118号）第十二条规定，危险物品的生产、储存单位应当有相应专业类别的中级及以上注册安全工程师从事安全生产管理工作。中级及以上注册安全工程师比例应自2018年1月1日起2年内，达到15%左右并逐步提高。注册安全工程师暂不能与注册消防工程师互认。","consultTime":"2022-01-08","replyTime":"2022-01-17","dept":"人事司","chapter":"其他","hasLocalRef":false},{"id":"11-36","title":"84消毒液、含75酒精消毒洗手液及消毒凝胶是否需要危险化学品经营资质？","consult":"您好，咨询如下产品销售环节和购买环节是否需要危险化学品经营资质？1.84消毒液：有效氯含量在5-7；2.75酒精消毒洗手液；3.75酒精消毒凝胶。以上，谢谢！","reply":"《安全生产法》修订后，我部也启动了《危险化学品安全管理条例》《危险化学品经营许可证管理办法》等法律、法规、部门规章的修订，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。","consultTime":"2022-01-04","replyTime":"2022-01-07","dept":"危险化学品安全监督管理二司","chapter":"其他","hasLocalRef":false},{"id":"11-37","title":"双酚A产品运输是否属于危险化学品运输？","consult":"尊敬的领导：您好，我司属于双酚A产品属性如下：纯度99.935，苯酚25PPM WT 三酚55PPM WT 生产企业，预计明年投产，目前涉及到产品是否所属危险化学品问题，是否涉及到危险化学品运输？请您释疑，不胜感激。谢谢！","reply":"你好，请按照《危险化学品目录（2015版）》及《危险化学品目录（2015版）实施指南（试行）》有关要求判定，根据《化学品物理危险性鉴定与分类管理办法》，对于物理危险性尚未确定的，可委托具备能力的单位进行鉴定和分类。运输问题请咨询交通运输部门。","consultTime":"2021-12-21","replyTime":"2022-01-04","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-38","title":"作为医疗器械经营和使用单位是否也需要按《危险化学品安全管理条例》管理？","consult":"牙托水这个产品，CAS号80-62-6，这个产品有III类医疗器械注册证，单个包装是100ml或是500ml，作为医疗器械经营和使用单位，是否也需要按《危险化学品安全管理条例》管理？一般的口腔门诊都不具备危险化学品专用仓库的条件。","reply":"你好,请对照《危险化学品目录（2015版）》及《危险化学品目录（2015版）实施指南（试行）》判断是否属于危险化学品。《危险化学品经营许可证管理办法》规定，经营危险化学品的企业应当依照本办法取得危险化学品经营许可证。","consultTime":"2021-12-14","replyTime":"2021-12-24","dept":"危化监管二司","chapter":"其他","hasLocalRef":false},{"id":"11-39","title":"《氧气站设计规范》第6.0.5条每防火分区1700瓶限量如何理解适用？","consult":"《氧气站设计规范》GB50030-2013第6.0.5条规定“氧气实瓶的贮量,每个防火分区不得超过1700瓶，防火分区的设置应符合现行国家标准《建筑设计防火规范》GB50016的有关规定”，是否可以这样理解：氧气充装车间内一个防火分区，另有惰性气体充装最多可存放1700瓶氧气实瓶，防火分区按现行“建规”中对氧气车间防火分区的要求执行？","reply":"感谢您的留言，请咨询标准编制单位。","consultTime":"2021-10-30","replyTime":"2021-11-05","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-40","title":"消火栓箱内的消防水带有无使用年限的要求？","consult":"请问消火栓箱内的消防水带有无使用年限的要求？若有，相关的规范、标准依据是什么？","reply":"具体请对照国家产品标准GB6246-2011《消防水带》，谢谢！","consultTime":"2021-10-27","replyTime":"2021-10-28","dept":"消防救援局","chapter":"其他","hasLocalRef":false},{"id":"11-41","title":"陆上石油天然气探井是否需要单独做安全生产三同时？","consult":"目前陆上石油天然气探井的安全生产三同时都是以气田为单位进行，但是在目前油气企业增储扩能的情况下，部分企业在勘探区块内布置了大量的勘探井，这些勘探井在能源部门单独立项，也不属于原有已审批气田的开发内容，请问这些勘探井是需要单独做安全生产三同时，还是使用本勘探区块已开发气田的安全生产三同时？","reply":"根据《建设项目安全设施“三同时”监督管理办法》（原国家安监总局令第36号），建设项目安全设施“三同时”有关要求适用于经县级以上人民政府及其有关主管部门依法审批、核准或者备案的生产经营单位新建、改建、扩建工程项目，勘探井应纳入所属石油天然气建设项目安全设施“三同时”管理，无需单独实施安全设施“三同时”。","consultTime":"2021-10-11","replyTime":"2021-10-14","dept":"危化监管二司","chapter":"其他","hasLocalRef":true},{"id":"11-42","title":"GB50160-2008第6.3.14条是否适用于甲醇储罐？\"储罐根部\"具体指哪个阀门？","consult":"《石油化工企业设计防火标准2018版》GB50160-2008第6.3.14条规定：全压力式液化烃储罐宜采用有防冻措施的二次脱水系统，储罐根部宜设紧急切断阀。想咨询一下：该条款是否适用于甲醇储罐？“储罐根部”是否指储罐进出口第一道阀门？","reply":"感谢您的留言，请咨询标准编制单位。","consultTime":"2021-09-27","replyTime":"2021-09-27","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-43","title":"可燃、有毒报警系统GDS系统是否需要sil认证？","consult":"你好，我想咨询一下，可燃、有毒报警系统GDS系统是否需要sil认证？哪些条文明确规定了？","reply":"《石油化工可燃气体和有毒气体检测报警设计规范》（GB 50493-2019）第3.0.8条规定：“可燃气体和有毒气体检测报警系统应独立于其他系统单独设置”，常规的GDS没有安全仪表功能要求。按照GB 50493-2019第5.1.3条规定：“可燃气体或有毒气体检测信号作为安全仪表系统的输入时，探测器宜独立设置，探测器输出信号应送至相应的安全仪表系统，探测器的硬件配置应符合现行国家标准《石油化工安全仪表系统设计规范》GB/T B50770有关规定”，如果GDS检测信号作为SIS的输入条件，则单独设置探测器，并将输出信号送至相应的SIS，满足SIS安全完整性等级要求。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2021-09-26","replyTime":"2021-09-30","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-44","title":"氨气浓度报警值应执行150PPM还是39PPM？","consult":"你好，根据氨制冷企业安全规范2018里规定是150PPM，但是工作场所有害因素职业接触限值确是39PPM，请问为什么这2个标准相差这么多，实际应该怎么设定浓度值？","reply":"感谢您的留言。咨询标准编制单位。","consultTime":"2021-08-01","replyTime":"2021-08-05","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-45","title":"生物制药企业药品处于临床一期阶段，年度全员安全培训是否仍需完成20学时？","consult":"你好，我公司是生物制药类单位，但是现在唯一的药品处于一期临床刚结束的阶段，请问，对于年度全员安全培训要求依然是20课时吗？","reply":"感谢您的留言。《生产经营单位安全培训规定》（原国家安全监管总局第3号令）第十三条规定：生产经营单位新上岗的从业人员，岗前安全培训时间不得少于24学时。煤矿、非煤矿山、危险化学品、烟花爆竹、金属冶炼等生产经营单位新上岗的从业人员安全培训时间不得少于72学时，每年再培训的时间不得少于20学时。","consultTime":"2021-07-09","replyTime":"2021-07-16","dept":"安全执法和工贸监管局","chapter":"其他","hasLocalRef":false},{"id":"11-46","title":"工贸行业使用危化品的安全管理人员应取哪类资格证？","consult":"建材类，玻璃厂，使用危险化学品，行业为工贸，国名经济代码为C3041,企业的单位主要负责人和安全生产管理人员，是取工贸行业的安全生产管理人员证，还是危险化学品安全管理人员证？谢谢！","reply":"感谢您的留言。《安全生产培训管理办法》（原国家安全监管总局令第44号）第二十三条规定，危险物品的生产、经营、储存单位和矿山、金属冶炼单位主要负责人、安全生产管理人员经考核合格后，颁发安全合格证；特种作业人员经考核合格后，颁发《中华人民共和国特种作业操作证》(以下简称特种作业操作证)；危险化学品登记机构的登记人员经考核合格后，颁发上岗证；其他人员经培训合格后，颁发培训合格证。","consultTime":"2021-07-03","replyTime":"2021-07-09","dept":"安全执法和工贸监管局","chapter":"其他","hasLocalRef":false},{"id":"11-47","title":"还有哪些应急预案以部门名义发布，具体哪些预案？","consult":"我想要应急预案目录清单，然后到底哪些应急预案以政府（办公室）名义发布，具体哪些预案；还有哪些应急预案以部门名义发布，具体哪些预案？麻烦你们提供一下具体应急预案名称？","reply":"根据《突发事件应急预案管理办法》（国办发〔2013〕101号）第二条规定，各级政府及其部门、基层组织、企事业单位、社会团体等均应结合实际制定相关应急预案；据不完全统计，截至2019年年底，我国已编制应急预案780余万件。根据《突发事件应急预案管理办法》（国办发〔2013〕101号）第十九条规定，国家总体应急预案报国务院审批，以国务院名义印发；专项应急预案报国务院审批，以国务院办公厅名义印发；部门应急预案由部门有关会议审议决定，以部门名义印发，必要时，可以由国务院办公厅转发。地方各级人民政府总体应急预案应当经本级人民政府常务会议审议，以本级人民政府名义印发；专项应急预案应当经本级人民政府审批，必要时经本级人民政府常务会议或专题会议审议，以本级人民政府办公厅(室)名义印发；部门应急预案应当经部门有关会议审议，以部门名义印发，必要时，可以由本级人民政府办公厅(室)转发。","consultTime":"2021-05-27","replyTime":"2021-05-27","dept":"救援协调局","chapter":"其他","hasLocalRef":false},{"id":"11-48","title":"想咨询在安全法规文件中提及的企业主要负责人是指企业的谁？","consult":"你好！想咨询在安全法规文件中提及的企业主要负责人是指企业的谁？公司法定代表人和董事长必须要是企业主要安全负责人吗？","reply":"按照《中华人民共和国安全生产法》释义，对公司制的企业，按照公司法的规定，有限责任公司（包括国有独资公司）和股份有限公司的董事长是公司的法定代表人，经理负责“主持公司的生产经营管理工作”。因此，有限责任公司和股份有限公司的主要负责人应当是公司董事长和经理（总经理、首席执行官或其他实际履行经理职责的企业负责人。对于非公司制的企业，主要负责人为企业的厂长、经理、矿长等企业行政“一把手”。","consultTime":"2021-05-26","replyTime":"2021-07-21","dept":"政策法规司","chapter":"其他","hasLocalRef":false},{"id":"11-49","title":"为什么官网上找不到2021最新修订的消防法？","consult":"为什么官网上找不到2021最新修订的消防法？","reply":"《中华人民共和国立法法》第五十八条第二款规定：“法律签署公布后，及时在全国人民代表大会常务委员会公报和中国人大网以及在全国范围内发行的报纸上刊载。”请关注上述刊载途径，同时我们也会及时在部网站更新。","consultTime":"2021-05-26","replyTime":"2021-07-21","dept":"政策法规司","chapter":"其他","hasLocalRef":false},{"id":"11-50","title":"危险化学品条例适用范围包括使用危险化学品从事生产的化工企业和工商贸八大行业吗？","consult":"请问危险化学品条例适用范围包括使用危险化学品从事生产的化工企业和工商贸八大行业吗？","reply":"危险化学品安全管理条例第二条规定，危险化学品生产、储存、使用、经营和运输的安全管理，适用本条例。危险化学品安全管理条例释义中指出，使用危险化学品的单位十分广泛，既有企业等生产经营单位，也有企业以外的其他单位和组织。只要涉及危险化学品使用的单位，都应遵守该条例有关规定要求。感谢对安全生产工作的关注。","consultTime":"2021-05-21","replyTime":"2021-06-02","dept":"危化监管一司","chapter":"其他","hasLocalRef":false},{"id":"11-51","title":"个体种植养殖农户是否适用《安全生产法》？","consult":"领导你好！我想咨询一个关于安全生产法的问题：在农业中从事个体种植、养殖业的农户，是否属于《安全生产法》的调整范围？个体种植、养殖业这种活动属于调整范围么？","reply":"您好！全国人大常委会法工委与应急管理部共同编写的《中华人民共和国安全生产法释义》一书对此问题有所解释。《安全生产法》适用的主体范围是在中华人民共和国领域内从事生产经营活动的单位，是指一切合法或者非法从事生产经营活动的企业、事业单位和个体经济组织以及其他组织，不论其性质如何、规模大小，只要是从事生产经营活动，都用遵守本法的各项规定。","consultTime":"2021-05-18","replyTime":"2021-07-21","dept":"政策法规司","chapter":"其他","hasLocalRef":false},{"id":"11-52","title":"涉氨冷库企业算是危险化学品企业么，它的日常管理按照什么标准执行？","consult":"请问涉氨冷库企业算是危险化学品企业么，它的日常管理按照什么标准执行？","reply":"感谢您的留言。涉氨冷库企业隶属行业性质应根据企业生产经营单位并依据国民经济行业分类标准，最终确定。","consultTime":"2021-04-06","replyTime":"2021-04-12","dept":"安全执法和工贸监管局","chapter":"其他","hasLocalRef":false},{"id":"11-53","title":"液氨制冷机组安全阀需要强制性每年进行校验吗？","consult":"您好，我想咨询下液氨制冷机组上的安全阀有没有什么依据必须每年都需要进行校验，企业需不需要每年都需要校验？","reply":"您的留言已收到。建议参考《冷库安全规程》（GB/T28009-2011）5.2.8要求执行。","consultTime":"2021-03-29","replyTime":"2021-03-31","dept":"安全执法和工贸监管局","chapter":"其他","hasLocalRef":false},{"id":"11-54","title":"GB/T50493-2019标准编制组在网络上发布的集中答复是否可信，可否作为官方解释？","consult":"网络上收集到以裴炳安老师和50493标准编制组名义发布的2个对标准实施过程中问题的答复，请明确这2个答复的可信吗？是否可以作为官方正式解答？","reply":"GB/T50493-2019《石油化工可燃气体和有毒气体检测报警设计标准》是住建部和市场监管总局联合发布的国家标准。请咨询住建部和市场监管总局。","consultTime":"2021-02-13","replyTime":"2021-06-28","dept":"政策法规司","chapter":"其他","hasLocalRef":false},{"id":"11-55","title":"《生产安全事故应急条例》第十四条中\"规模较大、危险性较高\"如何界定？","consult":"生产安全事故应急条例第十四条规定“规模较大、危险性较高的易燃易爆物品、危险化学品等危险物品的生产、经营、储存、运输单位，请问上述“规模较大、危险性较高”怎么区别？谢谢！","reply":"规模较大是指除小微以外的生产经营单位，规模划分参照国家统计局印发的《统计上大中小微型企业划分办法（2017）》（国统字【2017】213号）。","consultTime":"2021-02-04","replyTime":"2021-02-05","dept":"国家安全生产应急救援中心","chapter":"其他","hasLocalRef":false},{"id":"11-56","title":"GB/T 29639-2020附录C中\"应急执行机构签署页\"应如何理解和编制？","consult":"您好，想请教一下，关于GB29639-2020规范，附录C应急执行机构签署页，能不能解释一下？","reply":"应急执行机构签署页是指执行应急预案的机构领导应当签署，表明相关执行机构已知晓应急预案内容。也是为了促进预案执行。","consultTime":"2021-01-25","replyTime":"2021-01-27","dept":"国家安全生产应急救援中心","chapter":"其他","hasLocalRef":false},{"id":"11-57","title":"机械行业从业人员安全生产再培训每年应完成多少学时，依据哪个法规？","consult":"机械行业从业人员安全生产培训每年再培训学时为多少学时，有没有相关的法规规定？","reply":"感谢您的留言。《生产经营单位安全培训规定》（原国家安全监管总局第3号令）第九条规定：生产经营单位主要负责人和安全生产管理人员初次安全培训时间不得少于32学时。每年再培训时间不得少于12学时。","consultTime":"2021-01-05","replyTime":"2021-01-12","dept":"安全执法和工贸监管局","chapter":"其他","hasLocalRef":false},{"id":"11-58","title":"《危险化学品企业应急准备指南》要求的应急事故池，无污染工厂是否也需要设置？","consult":"《危险化学品企业生产安全事故应急准备指南（2019版）》的附表应急准备工作表，其中要素10（应急设施）：应急事故池。有满足事故状态下临时贮存废水、防止漫流的应急事故池。这个要求对于无污染的工厂也需要设置吗？","reply":"应急事故池，是用来处置事故状态下的泄漏物、救援产生废水的临时储存措施，防止次生事故和环境污染。按照《化工建设项目环境保护设计规范》（GB50483-2009），化工建设项目均应设置。在生产过程中无污染的工厂，发生火灾，有关介质燃烧后会产生有毒有害废物，在火灾扑救过程中，会产生有毒有害消防废水，都不能直接外排，需应急池临时储存，处理合格后才能排放。","consultTime":"2020-11-30","replyTime":"2020-12-02","dept":"安全生产应急救援中心","chapter":"其他","hasLocalRef":false}];

  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.mode === mode);

  if (mode === 'ai' && typeof checkAIStatus === 'function') {
    checkAIStatus();
  }
}

/* ===== SEARCH ENGINE ===== */
function tokenize(text) {
  var cleaned = text.replace(/[^一-龥a-zA-Z0-9]/g, ' ');
  var words = cleaned.split(/\s+/).filter(Boolean);
  var tokens = [];
  var seen = {};
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (/^[a-zA-Z0-9]+$/.test(w)) {
      if (!seen[w]) { tokens.push(w); seen[w] = true; }
    } else {
      for (var j = 0; j < w.length; j++) {
        var c = w[j];
        if (!seen[c]) { tokens.push(c); seen[c] = true; }
        if (j < w.length - 1) {
          var bigram = w[j] + w[j+1];
          if (!seen[bigram]) { tokens.push(bigram); seen[bigram] = true; }
        }
      }
    }
  }
  return tokens;
}

function search(query, chapterFilter) {
  if (!query.trim()) return [];
  var tokens = tokenize(query);
  if (tokens.length === 0) return [];

  var results = [];
  var ql = query.toLowerCase();

  for (var i = 0; i < QA_DATA.length; i++) {
    var item = QA_DATA[i];
    if (chapterFilter && item.chapter !== chapterFilter) continue;

    var tl = item.title.toLowerCase();
    var cl = item.consult.toLowerCase();
    var rl = item.reply.toLowerCase();
    var score = 0;
    var matchedTerms = [];

    var al = (item._annotation || '').toLowerCase();

    if (tl.indexOf(ql) !== -1) { score += 100; matchedTerms.push(query); }
    if (cl.indexOf(ql) !== -1) { score += 60; matchedTerms.push(query); }
    if (rl.indexOf(ql) !== -1) { score += 50; matchedTerms.push(query); }
    if (al.indexOf(ql) !== -1) { score += 40; matchedTerms.push(query); }

    for (var j = 0; j < tokens.length; j++) {
      var t = tokens[j];
      if (t.length < 2) continue;
      if (tl.indexOf(t) !== -1) { score += 20; if (matchedTerms.indexOf(t) === -1) matchedTerms.push(t); }
      if (cl.indexOf(t) !== -1) { score += 10; if (matchedTerms.indexOf(t) === -1) matchedTerms.push(t); }
      if (rl.indexOf(t) !== -1) { score += 8; if (matchedTerms.indexOf(t) === -1) matchedTerms.push(t); }
      if (al.indexOf(t) !== -1) { score += 6; if (matchedTerms.indexOf(t) === -1) matchedTerms.push(t); }
    }

    if (score > 0) {
      results.push({ item: item, score: score, terms: matchedTerms });
    }
  }

  results.sort(function(a, b) { return b.score - a.score; });
  return results;
}

/* ===== UTILS ===== */
var entityMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, function(c) { return entityMap[c]; });
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightText(text, terms) {
  if (!terms || terms.length === 0) return escapeHtml(text);
  var sorted = terms.slice().sort(function(a, b) { return b.length - a.length; });
  var result = escapeHtml(text);
  for (var i = 0; i < sorted.length; i++) {
    var t = sorted[i];
    if (t.length < 2) continue;
    var escaped = escapeHtml(t);
    var re = new RegExp('(' + escapeRegex(escaped) + ')', 'gi');
    result = result.replace(re, '<mark>$1</mark>');
  }
  return result;
}

/* ===== SEARCH MODE RENDER ===== */
function renderSearchResults(results, query) {
  var container = document.getElementById('results');
  if (results.length === 0) {
    container.innerHTML = query
      ? '<div class="no-results"><div class="icon">&#128269;</div><div>没有找到匹配的结果</div><div style="font-size:13px;margin-top:8px;">试试其他关键词，或切换到「全文浏览」模式</div></div>'
      : '<div class="no-results"><div class="icon">&#128214;</div><div>输入关键词开始搜索 659 条应急管理部官方答复</div><div style="font-size:13px;margin-top:8px;">标注 <span class="local-tag-small">&#127758; 需查地方规定</span> 的答复，可一键查询各地应急管理部门网站</div></div>';
    return;
  }

  var bestScore = results[0].score;
  var html = '';

  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    var item = r.item;
    var isBest = r.score >= bestScore * 0.8;

    html += '<div class="result-card' + (isBest ? ' best-match' : '') + '">';
    html += '<div class="card-header">';
    html += '<span class="qa-id">' + escapeHtml(item.id) + '</span>';
    html += '<span class="qa-title">' + highlightText(item.title, r.terms) + '</span>';
    html += '<span class="qa-chapter">' + escapeHtml(item.chapter) + '</span>';
    if (item.hasLocalRef) {
      html += '<span class="local-tag" onclick="openGovPanel(\'' + escapeHtml(query) + '\')">&#127758; 需查地方规定</span>';
    }
    html += '</div>';

    if (item.consult) {
      html += '<div class="qa-section"><div class="qa-label">&#128221; 咨询问题</div><div class="qa-content">' + highlightText(item.consult, r.terms) + '</div></div>';
    }
    if (item.reply) {
      html += '<div class="qa-section"><div class="qa-label">&#9989; 官方答复</div><div class="qa-content">' + highlightText(item.reply, r.terms) + '</div></div>';
    }

    // Annotation block
    if (item._annotation) {
      html += '<div class="annotation-block">';
      html += '<div class="annotation-label">&#128221; 专家注释</div>';
      html += '<div class="annotation-text">' + highlightText(item._annotation, r.terms) + '</div>';
      html += '</div>';
    }

    html += '<div class="qa-meta">';
    if (item.consultTime) html += '<span>&#128197; 咨询：' + escapeHtml(item.consultTime) + '</span>';
    if (item.replyTime) html += '<span>&#128203; 回复：' + escapeHtml(item.replyTime) + '</span>';
    if (item.dept) html += '<span>&#127979; ' + escapeHtml(item.dept) + '</span>';
    html += '</div></div>';
  }
  container.innerHTML = html;
}

function updateSearchStats(results, query) {
  var stats = document.getElementById('stats');
  if (query) {
    var localCount = 0;
    for (var i = 0; i < results.length; i++) {
      if (results[i].item.hasLocalRef) localCount++;
    }
    var text = '找到 ' + results.length + ' 条相关答复';
    if (localCount > 0) {
      text += '（其中 ' + localCount + ' 条涉及地方规定）';
    }
    stats.innerHTML = text;
  } else {
    stats.textContent = '';
  }
}

/* ===== BROWSE MODE ===== */
function renderBrowse(filterText) {
  var container = document.getElementById('browseContent');
  filterText = filterText || '';

  var html = '';

  // TOC
  html += '<div class="browse-toc"><div class="toc-title">&#128218; 目录 · 共 11 章 659 条答复</div><div class="toc-grid">';
  var idx = 1;
  for (var i = 0; i < CHAPTERS.length; i++) {
    var ch = CHAPTERS[i];
    html += '<div class="toc-item" onclick="scrollToChapter(\'' + escapeHtml(ch.name) + '\')">';
    html += '<span>' + padNum(idx) + '. ' + escapeHtml(ch.name) + '</span>';
    html += '<span class="toc-num">' + ch.items.length + ' 条</span>';
    html += '</div>';
    idx++;
  }
  html += '</div></div>';

  // Chapter blocks
  var totalVisible = 0;
  var chNum = 1;
  for (var c = 0; c < CHAPTERS.length; c++) {
    var ch = CHAPTERS[c];
    var filteredItems = ch.items;
    if (filterText) {
      var ft = filterText.toLowerCase();
      filteredItems = ch.items.filter(function(item) {
        return item.title.toLowerCase().indexOf(ft) !== -1 ||
               item.consult.toLowerCase().indexOf(ft) !== -1 ||
               item.reply.toLowerCase().indexOf(ft) !== -1 ||
               (item._annotation || '').toLowerCase().indexOf(ft) !== -1;
      });
    }
    if (filteredItems.length === 0 && filterText) continue;

    totalVisible += filteredItems.length;
    var chId = 'ch-' + escapeHtml(ch.name).replace(/\s/g, '_');

    html += '<div class="chapter-block" id="' + chId + '">';
    html += '<div class="chapter-head" onclick="toggleChapter(\'' + chId + '\')">';
    html += '<div class="chapter-head-left">';
    html += '<span class="chapter-head-num">' + padNum(chNum) + '</span>';
    html += '<span class="chapter-head-title">' + escapeHtml(ch.name) + '</span>';
    html += '<span class="chapter-head-count">' + filteredItems.length + ' 条答复</span>';
    html += '</div>';
    html += '<span class="chapter-head-arrow">&#9654;</span>';
    html += '</div>';
    html += '<div class="chapter-body">';

    for (var j = 0; j < filteredItems.length; j++) {
      var item = filteredItems[j];
      var itemId = 'qa-' + item.id.replace(/\./g, '_');
      html += '<div class="qa-browse-item" id="' + itemId + '">';
      html += '<div class="qa-browse-head" onclick="toggleQA(\'' + itemId + '\')">';
      html += '<span class="qa-browse-id">' + escapeHtml(item.id) + '</span>';
      html += '<span class="qa-browse-q">' + (filterText ? highlightText(item.title, [filterText]) : escapeHtml(item.title)) + '</span>';
      if (item.hasLocalRef) {
        html += '<span class="qa-browse-local" onclick="event.stopPropagation();openGovPanel(\'' + escapeHtml(item.title.substring(0, 20)) + '\')">&#127758;</span>';
      }
      html += '<span class="qa-browse-arrow">&#9654;</span>';
      html += '</div>';
      html += '<div class="qa-browse-detail">';
      if (item.consult) {
        html += '<div class="qa-section"><div class="qa-label">&#128221; 咨询问题</div><div class="qa-content">' + (filterText ? highlightText(item.consult, [filterText]) : escapeHtml(item.consult)) + '</div></div>';
      }
      if (item.reply) {
        html += '<div class="qa-section"><div class="qa-label">&#9989; 官方答复</div><div class="qa-content">' + (filterText ? highlightText(item.reply, [filterText]) : escapeHtml(item.reply)) + '</div></div>';
      }
      if (item._annotation) {
        html += '<div class="annotation-block">';
        html += '<div class="annotation-label">&#128221; 专家注释</div>';
        html += '<div class="annotation-text">' + (filterText ? highlightText(item._annotation, [filterText]) : escapeHtml(item._annotation)) + '</div>';
        html += '</div>';
      }
      html += '<div class="qa-meta" style="margin-top:10px">';
      if (item.consultTime) html += '<span>&#128197; 咨询：' + escapeHtml(item.consultTime) + '</span>';
      if (item.replyTime) html += '<span>&#128203; 回复：' + escapeHtml(item.replyTime) + '</span>';
      if (item.dept) html += '<span>&#127979; ' + escapeHtml(item.dept) + '</span>';
      html += '</div></div></div>';
    }
    html += '</div></div>';
    chNum++;
  }

  container.innerHTML = html;
  document.getElementById('browseStats').textContent = filterText
    ? '筛选结果：' + totalVisible + ' 条答复'
    : '';
}

function padNum(n) {
  return n < 10 ? '0' + n : '' + n;
}

function toggleChapter(chId) {
  var el = document.getElementById(chId);
  if (el) el.classList.toggle('open');
}

function toggleQA(itemId) {
  var el = document.getElementById(itemId);
  if (el) el.classList.toggle('open');
}

function scrollToChapter(chName) {
  var chId = 'ch-' + escapeHtml(chName).replace(/\s/g, '_');
  var el = document.getElementById(chId);
  if (el) {
    el.classList.add('open');
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

var browseSearchInput = document.getElementById('browseSearchInput');
browseSearchInput.addEventListener('input', function() {

});

/* ===== GOVERNMENT SEARCH PANEL ===== */
var govSearchInput = document.getElementById('govSearchInput');
var govSearchPanel = document.getElementById('govSearchPanel');
var btnCloseGov = document.getElementById('btnCloseGov');
var btnGovSearch = document.getElementById('btnGovSearch');

function openGovPanel(keyword) {
  govSearchPanel.style.display = 'block';
  if (keyword) {
    govSearchInput.value = keyword + ' 应急管理';
  }
  govSearchInput.focus();
  buildGovLinks();
}

btnCloseGov.addEventListener('click', function() {
  govSearchPanel.style.display = 'none';
});

function buildGovLinks() {
  var grid = document.getElementById('govLinksGrid');
  var html = '';
  for (var i = 0; i < GOV_LINKS.length; i++) {
    var link = GOV_LINKS[i];
    html += '<a class="gov-link-item" href="' + link.url + '" target="_blank" rel="noopener" title="' + escapeHtml(link.name) + '">' + escapeHtml(link.name) + '</a>';
  }
  grid.innerHTML = html;
}

function doGovSearch() {
  var keyword = govSearchInput.value.trim();
  if (!keyword) return;
  var searchQuery = encodeURIComponent(keyword + ' 应急管理 site:gov.cn');
  window.open('https://www.bing.com/search?q=' + searchQuery, '_blank');
}

btnGovSearch.addEventListener('click', doGovSearch);
govSearchInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doGovSearch();
});

/* ===== CHAPTER FILTERS (SEARCH MODE) ===== */
function buildChapterFilters() {
  var seen = {};
  var chapters = [];
  for (var i = 0; i < QA_DATA.length; i++) {
    var ch = QA_DATA[i].chapter;
    if (!seen[ch]) { chapters.push(ch); seen[ch] = true; }
  }
  var container = document.getElementById('chapterFilters');
  container.innerHTML = '<span class="filter-chip active" data-chapter="">全部章节</span>';
  for (var j = 0; j < chapters.length; j++) {
    container.innerHTML += '<span class="filter-chip" data-chapter="' + escapeHtml(chapters[j]) + '">' + escapeHtml(chapters[j]) + '</span>';
  }
  container.querySelectorAll('.filter-chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      container.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
      this.classList.add('active');
      doSearch();
    });
  });
}

function getActiveChapter() {
  var active = document.querySelector('#chapterFilters .filter-chip.active');
  return active ? active.dataset.chapter : '';
}

/* ===== MAIN SEARCH LOGIC ===== */
var currentQuery = '';
var searchInput = document.getElementById('searchInput');
var btnClear = document.getElementById('btnClear');

function doSearch() {
  var chapter = getActiveChapter();
  var results = search(currentQuery, chapter);
  renderSearchResults(results, currentQuery);
  updateSearchStats(results, currentQuery);
}

searchInput.addEventListener('input', function() {
  currentQuery = this.value.trim();
  btnClear.classList.toggle('visible', currentQuery.length > 0);
  doSearch();
});

btnClear.addEventListener('click', function() {
  searchInput.value = '';
  currentQuery = '';
  btnClear.classList.remove('visible');
  doSearch();
  searchInput.focus();
});

/* ===== BACK TO TOP BUTTON ===== */
var btnBackTop = document.getElementById('btnBackTop');
window.addEventListener('scroll', function() {
  btnBackTop.style.display = window.scrollY > 600 ? 'block' : 'none';
});
btnBackTop.addEventListener('click', function() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ===== INIT ===== */
buildChapterFilters();
