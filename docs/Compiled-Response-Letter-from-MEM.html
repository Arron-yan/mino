22-02-22","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-21","title":"存储民用零售包装危险化学品是否需要办理危化品经营许可证？","consult":"我司是仓储公司，主要以货物存储、搬卸为主，货物如涉及储存小包装香水、柠檬油CAS号：8008-56-8、丝柏香薰精油CAS号：8013-86-3植物精油，15ml瓶等民用零售包装的危险货物属于《危险化学品目录》2015版的2828项，但又不属于《危险化学品目录使用手册》中2828项下具体列明的88种具体的物质，请问单纯存储此类是否需要办理危化品经营许可证？","reply":"您好，《安全生产法》修订后，我部启动了相应部门规章的修订工作，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。感谢您的留言。","consultTime":"2022-03-11","replyTime":"2022-03-14","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-22","title":"危化品经营许可证可否跨省异地使用？","consult":"在浙江省舟山市取得危险化学品经营许可证后，是否可以江西省九江市异地经营？法律依据是什么？","reply":"根据《危险化学品经营许可证管理办法》等有关规定，应当在经营场所所在地申领危险化学品经营许可证。","consultTime":"2022-01-05","replyTime":"2022-01-12","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-23","title":"经营危化品目录内的原料药是否需要危化品经营许可证？","consult":"一般情况下药品经营企业按照药品相关法规经营已上市的原料药药品，其存储条件对温湿度有着严格的要求，那么在经营某些药品比如：地高辛急性毒性-经口,类别2这种在危险化学品目录内的原料药是否也需要办理危险化学品经营许可证才可经营此类品种呢？","reply":"按照《危险化学品安全管理条例》第九十七条规定，监控化学品、属于危险化学品的药品和农药的安全管理，依照本条例的规定执行；法律、行政法规另有规定的，依照其规定。地高辛列入《危险化学品目录（2015版）》（序号：177），因此，地高辛原料药经营应取得危险化学品经营许可证。","consultTime":"2021-07-29","replyTime":"2021-08-02","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-24","title":"天然气长输管道企业不含经营销售，只收取管输费是否需要办理危化品经营许可证？","consult":"我公司为国家管网集团下属三级单位，目前主营业务为管道输送天然气，不含天然气的销售，只收取管输费，是否还需要办理危化品经营许可证？","reply":"根据《国家安全监管总局办公厅关于油气输送管道安全监管有关问题的复函》（安监总厅管三函〔2016〕84号），天然气长输管道企业应依照《危险化学品经营许可证管理办法》（国家安全生产监督管理总局令第55号）有关规定，办理危险化学品经营许可证。","consultTime":"2022-06-07","replyTime":"2022-06-30","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-25","title":"天然气长输管道企业危化品经营许可办证层级、在建能否办理、是否为无仓储经营？","consult":"1.省内跨地市天然气长输管道企业应在哪一级应急管理部门办理危险化学品经营许可证，对哪个地市是否有要求？2.在建阶段的天然气长输管道企业能否办理危险化学品经营许可证？3.天然气长输管道企业是否属于无仓储经营？","reply":"根据《国家安全监管总局办公厅关于油气输送管道安全监管有关问题的复函》（安监总厅管三函〔2016〕84号），油气长输管道企业应依照《危险化学品经营许可证管理办法》（国家安全生产监督管理总局令第55号）有关规定，办理危险化学品经营许可证。其中，中央企业所属省级、设区的市级公司（分公司）、带有储存设施经营的油气长输管道企业经营许可证的审批、颁发由设区的市级应急管理部门负责；其他油气长输管道企业经营许可证的审批、颁发由县级应急管理部门负责（没有设立县级发证机关的，其经营许可证由市级发证机关审批、颁发）。具体事宜请咨询当地市级应急管理部门。","consultTime":"2022-07-03","replyTime":"2022-07-29","dept":"危化二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-26","title":"天然气长输管道输送企业是否需要办理危化品经营许可证？","consult":"天然气长输管道输送企业经营天然气，下游用户为市、县城市燃气用户及大型电厂用户，是否需要办理危险化学品经营许可证？","reply":"根据《危险化学品经营许可证管理办法》（原国家安监总局令第55号）第二条“在中华人民共和国境内从事列入《危险化学品目录》的危险化学品的经营（包括仓储经营）活动，适用本办法”、第三条“国家对危险化学品经营实行许可制度。经营危险化学品的企业，应当依照本办法取得危险化学品经营许可证”的规定，天然气长输管道企业应当办理危险化学品经营许可证。","consultTime":"2021-11-24","replyTime":"2021-11-29","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-27","title":"异地经营且含储存的危化品经营许可证如何办理？","consult":"1.在储存设施与公司注册地不一致的情况下例如，储存设施在天津、公司注册地在北京，已经跨省份，应在何地办理危险化学品经营许可证？公司注册地、储存设施所在地或其他地方？2.在公司将储存设施的安全管理、运营维护工作，委托其他危化品企业该企业已取得包含储存范围的危险化学品经营许可证运营的情况下，本公司是否还需要办理包含储存经营方式的危险化学品经营许可证？望解答，感谢，祝工作顺利！","reply":"您好，涉及办理经营许可证具体事项，请咨询公司注册地属地应急管理部门；租赁经营场所和储存场所经营的，经营方应按55号令规定提供租赁证明重新办理危险化学品经营许可证。感谢留言。","consultTime":"2022-06-16","replyTime":"2022-06-20","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-28","title":"属于药品的危险化学品是否需要办理经营许可？","consult":"贵司在2021年8月2日和8月9日答复网友留言时“医用酒精、地高辛原料药经营应取得危险化学品经营许可证”。像医用酒精、高锰酸钾等，已经按《中华人民共和国药品管理法》、《农药管理条例》办理了药品或医疗用品销售许可证、农药生产销售许可证，如果再办理危险化学品经营许可证，是不是重复许可？增加了企业负担？是不是也违背了《危险化学品安全管理条例》第九十七条....法律、行政法规另有规定的，依照其规定？","reply":"您好，《安全生产法》修订后，我部启动了相应部门规章的修订工作，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类化学品。感谢留言。","consultTime":"2022-05-10","replyTime":"2022-05-14","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-29","title":"建筑施工企业提供危险化学品材料是否属危险化学品经营？","consult":"您好，以下事项咨询，谢谢。建筑施工企业向相关方客户提供危险化学品材料如涂料，列入危险化学品目录，不提供涂刷服务。这种危险化学品材料的提供服务，是否属危险化学品经营服务？是否需要办理危险化学品经营许可证？","reply":"您好，若该企业向客户销售属于危险化学品的涂料，这种行为属于危险化学品经营。应当按照《危险化学品经营许可证管理办法》办理危险化学品经营许可证。感谢留言。","consultTime":"2022-08-07","replyTime":"2022-08-11","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-30","title":"成品油生产企业需要办理安全生产许可证吗？","consult":"经营汽油加油站的企业需要办理危险化学品经营许可证，那生产成品油需要办理安全生产许可证吗？","reply":"按照《危险化学品生产企业安全生产许可证实施办法》规定，危险化学品生产企业是指依法设立且取得工商营业执照或者工商核准文件从事生产最终产品或者中间产品列入《危险化学品目录》的企业。危险化学品生产企业应当依照规定取得危险化学品安全生产许可证。未取得安全生产许可证的企业，不得从事危险化学品的生产活动。成品油如汽油等属于危险化学品的，应依法办理安全生产许可证。感谢对危险化学品安全生产工作的关心关注！","consultTime":"2021-12-23","replyTime":"2021-12-30","dept":"危化监管一司","chapter":"消防安全","hasLocalRef":false},{"id":"7-31","title":"企业无仓储经营危险化学品可否办理许可？","consult":"现有一企业预销售硫磺、硫酸等危险化学品，该企业属于贸易性质的经营，无仓储。我局可否给其办理危险化学品经营许可证无仓储？","reply":"您好，请依据《危险化学品经营许可证管理办法》有关规定办理。感谢您的留言。","consultTime":"2022-02-23","replyTime":"2022-02-26","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-32","title":"是否需要办理危化品经营许可证？","consult":"老师，您好！请问稀释成50硫酸、50盐酸、50硝酸、50磷酸、50氢氧化钠属于危化品吗？这些稀释后溶液主要想用于环境监测用，包装单元密封为2ml瓶，请问需要申请危化品生产许可证？如果对外销售需要办理危化品经营许可证吗？运输也必须符合危化品运输吗？该种属于“有关试剂的特殊规定，为了鼓励科学研究，减少对相关院校及科研机构的影响，因此规定对科学实验必须的试剂类产品暂不纳《目录》管理”情况吗？","reply":"您好，根据《危险化学品经营许可证管理办法》，购买危险化学品进行分装、充装或者加入非危险化学品的溶剂进行稀释，然后销售的，依照本办法执行。感谢留言。","consultTime":"2022-05-07","replyTime":"2022-05-10","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-33","title":"氦气液化可否办理经营许可证？","consult":"请问拟将高纯氦气经物理方式液化成液氦进行销售，纯度不发生变化，按照《危险化学品目录2015版实施指南》中的条款应申请危险化学品经营许可证还是生产许可证呢？","reply":"根据《危险化学品经营许可证管理办法》等有关规定，应当办理危险化学品经营许可证。","consultTime":"2021-12-24","replyTime":"2021-12-26","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-34","title":"不经营管道内输送的天然气无买卖行为和收益是否需要办理危险化学品经营许可证？","consult":"专门运营工业用户直供天然气管道从长输管道阀门至工业用户围墙阀门、提供天然气输送服务的企业，不经营管道内输送的天然气无买卖行为和收益，是否需要办理危险化学品经营许可证？企业是否属安监总厅管三函【2016】84号复函类型，是否要按照该函领取危险化学品经营许可证？","reply":"根据《国家安全监管总局办公厅关于油气输送管道安全监管有关问题的复函》（安监总厅管三函〔2016〕84号），天然气长输管道企业应依照《危险化学品经营许可证管理办法》（国家安全生产监督管理总局令第55号）有关规定，办理危险化学品经营许可证。","consultTime":"2022-04-15","replyTime":"2022-05-18","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-35","title":"液氨稀释成氨水，属于危险化学品生产还是经营？","consult":"液氨稀释成氨水，从浓度来看是100稀释成低浓度氨溶液[含氨＞10]，从溶质来看液氨是NH3，氨水是NH3.H2O，请问此类企业是办理危险化学品安全生产许可证还是危险化学品经营许可证？","reply":"您好，依据《危险化学品生产企业安全生产许可证实施办法》（国家安全监管总局令第41号）《危险化学品经营许可证管理办法》（国家安全监管总局令第55号）《关于印发危险化学品目录（2015版）实施指南（试行）的通知》（安监总厅管三〔2015〕80号）有关要求，应该取得危险化学品安全生产许可证。感谢您的留言。","consultTime":"2022-03-21","replyTime":"2022-03-25","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-36","title":"生产不具物理危险性的化学品，需要办理安全生产许可证吗？","consult":"某化学品不含有《危险化学品目录》2015中的成分，且已经鉴定不具有物理危险性，但有皮肤腐蚀类别2，皮肤致敏物类别1等健康危害，请问生产该类产品需办理安全生产许可证吗？销售该类产品，需要办理危化品经营许可证吗？","reply":"您好，按《危险化学品目录（2015版）实施指南（试行）》不属于危险化学品，那么销售该类产品不需要办理危险化学品经营许可证。","consultTime":"2022-03-21","replyTime":"2022-03-23","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-37","title":"不在目录但经鉴定属危化品，可否主动申办经营许可证？","consult":"硝酸异辛酯不在《危险化学品目录》 2015版里，但是经鉴定依据《危险化学品目录》 2015版中关于“危险化学品的定义和确定原则”属于危险化学品，那么硝酸异辛酯需要办理危险化学品经营许可证吗？假如不需要的话，那么为了响应使用客户的要求，我们可以主动申请办理危险化学品经营许可证吗？","reply":"根据《危险化学品经营许可证管理办法》《危险化学品目录（2015版）实施指南（试行）》，经营物品符合危险化学品的定义和确定原则，但未列入《危险化学品目录（2015版）》的，不需要办理危险化学品经营许可证。","consultTime":"2023-04-07","replyTime":"2023-04-13","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-38","title":"经营不需办理生产许可的危化品的，是否需要经营许可证？","consult":"根据国家安全监管总局办公厅《关于印发《危险化学品目录2015版实施指南》，对于要成分均为列入《目录》的危险化学品，并且主要成分质量比或体积比之和小于70的混合物，生产企业经过鉴定属于危险化学品确定原则，并已根据《危险化学品登记管理办法》进行危险化学品登记可不办相关安全行政许可的产品，如经销此类产品的企业，是否需办理危化品经营许可证？","reply":"根据《危险化学品安全管理条例》《危险化学品生产企业安全生产许可证实施办法》《危险化学品经营许可证管理办法》和《危险化学品目录（2015版）实施指南（试行）》的规定，未列入《目录》但经鉴定符合危险化学品确定原则的危险化学品，不需要办理危险化学品经营许可。","consultTime":"2022-01-17","replyTime":"2022-01-20","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-39","title":"经营消毒用品升华硫是否需要危化品经营许可证？","consult":"现在市场上有大量的消毒用品升华硫，商丘市亮峰卫生用品有限公司生产的【卫生许可证号：豫卫消证字2016第0008号】在售，主要销售单位是在商场和京东商城线上店铺，超市以及线下实体店，基本都未取得危化品经营许可证。如经销此类产品的企业，是否需办理危化品经营许可证？不知道应急管理部对此有何要求？","reply":"您好，《安全生产法》修订后，我部启动了相应部门规章的修订工作，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。感谢您的留言。","consultTime":"2022-04-20","replyTime":"2022-04-25","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-40","title":"经销生活日用品打火机以及打火机充气瓶是否需办理危化品经营许可证？","consult":"现在市场上有大量的日用化学品一次性丁烷打火机以及丁烷充气罐在售，主要销售单位是在商场，超市以及日用百货烟酒店，基本都未取得危化品经营许可证。如经销此类产品的企业，是否需办理危化品经营许可证？不知道应急管理部对此有何要求？","reply":"您好，《安全生产法》修订后，我部也启动了《危险化学品经营许可证管理办法》的修订，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品，感谢留言。","consultTime":"2022-04-07","replyTime":"2022-04-10","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-41","title":"LNG和CNG不在危化品目录内，能否加入无储存经营许可范围？","consult":"请问一下LNG和CNG等不在危险化学品目录内，但确实是危险化学品，如果办理无储存危险化学品经营许可证，这两项能加到许可范围内吗？如果能加应怎么写，如果不能是什么原因呢？无储存肯定是不作为城镇燃气供应的，即使供应也是供应给下游企业，企业再办理燃气经营许可，他们再继续销售，请帮忙解答一下，谢谢啦。","reply":"您好，LNG、CNG已列入《危险化学品目录》（2015年版），相关安全许可问题请查阅《国家安全监管总局办公厅关于燃气安全许可有关问题的复函》（安监总厅政法函〔2015〕227号。感谢您的留言。","consultTime":"2022-03-08","replyTime":"2022-03-13","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-42","title":"不带存储设施的危险化学品经营许可证是否可以异地使用？","consult":"请问不带存储设施的危险化学品经营许可证是否可以异地使用？无存储设施的危险化学品经营许可证核发需要哪些条件？政府无存储设施危化品经营企业如何监管？","reply":"您好，请查阅《危险化学品经营许可证管理办法》，具体办理事宜及监管要求请咨询属地应急管理部门，感谢留言。","consultTime":"2022-04-01","replyTime":"2022-04-05","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-43","title":"进口香水经营是否需要办理危险化学品经营许可证？","consult":"我司通过海关进口批量香水，香水基本成分是SD乙醇39-C、香精、水等，闭杯闪点21℃，CAS号：64-17-5，包装规格是100mL瓶，香水CAS号为64-17-5，与《危险化学品目录2015版》序号为2568项的乙醇[无水]CAS号相同。该香水具有危险化学品属性，同时也是日用化学产品，咨询是否需要办理危险化学品经营许可证？","reply":"你好，请执行《危险化学品目录（2015版）》及《危险化学品目录（2015版）实施指南（试行）》等相关文件要求，依据有关原则进行判定。未列入《危险化学品目录（2015版）》，但经鉴定有关属于危险化学品的，应根据《危险化学品登记管理办法》（国家安全监管总局令第53号）要求进行危险化学品登记，企业应需要按照危险化学品进行管理。","consultTime":"2021-11-16","replyTime":"2021-11-26","dept":"危化二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-44","title":"销售电子烟烟油是否需要办理危险化学品经营许可证？","consult":"销售闭杯闪点小于60摄氏度的电子烟烟油是否需要取得危险化学品经营许可证？","reply":"您好，《安全生产法》修订后，我部启动了相应部门规章的修订工作，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类化学品。感谢留言。","consultTime":"2022-05-09","replyTime":"2022-05-13","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-45","title":"不构成重大危险源的带储存设施的危化品经营企业的经营方式是什么？","consult":"不构成重大危险源的带储存设施的危化品经营企业的经营方式是“安监安监总厅管三函〔2012〕179号”文件中“专门从事危险化学品仓储经营、带有储存设施经营危险化学品、不带有储存设施经营危险化学品等三种形式”中的哪一种？谢谢！","reply":"您好，按照现行《危险化学品经营许可证管理办法》（国家安全监管总局令第55号）有关要求，不构成重大危险源的带储存设施的危化品经营企业的经营方式为“不带有储存设施的经营”。近期，修正后的《安全生产法》实施后，我们正组织对有关配套部门规章进行修正。感谢您的留言。","consultTime":"2022-04-07","replyTime":"2022-04-10","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-46","title":"非药品类易制毒票据经营单位是否需要制定应急预案并备案、购买安全生产责任保险？","consult":"领导好，请问非药品类易制毒经营没有实体店，只有办公室的票据经营单位。1.是否需要制定应急预案并且备案？2.是否需要购买安全责任保险？以上两个问题盼回复，谢谢！","reply":"已电话沟通解答。您好，应急管理部规章《生产安全事故应急预案管理办法》（以下简称《办法》）第十二条规定：“生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案，并体现自救互救和先期处置等特点。”你单位作为非药品类易制毒化学品经营单位，应按照上述规定，结合实际编制本单位应急预案。该《办法》第二十六条对危险性比较大的单位和人员密集场所经营单位的应急预案备案工作进行了规定，如你单位不属于该条所列单位，则不需进行生产安全事故应急预案备案。","consultTime":"2024-11-27","replyTime":"2024-12-04","dept":"国家安全生产应急救援中心","chapter":"消防安全","hasLocalRef":false},{"id":"7-47","title":"关于烟花爆竹零售店销售人员“安全教育培训”是否必须考核合格？","consult":"根据《烟花爆竹经营许可实施办法》第十六条，“零售经营者应当符合下列条件：...二...销售人员经过安全知识教育\"。根据《中华人民共和国安全生产法》第二十八条及《生产经营单位安全培训规定》第四条规定，“未经安全培训合格的从业人员，不得上岗作业”。如果烟花爆竹零售店销售人员经过安全知识教育，但未考核合格，应该适用于哪条法律法规？如果是前者则不违法，如果是后者则涉嫌违法。","reply":"《烟花爆竹经营许可实施办法》（国家安全生产监督管理总局令第65号）第十六条规定，零售经营主要负责人经过安全培训合格，销售人员经过安全知识教育。未规定零售经营主要负责人以外其他销售人员经考核合格。","consultTime":"2022-03-16","replyTime":"2022-03-25","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-48","title":"两法规中 “储存设施” 概念是否一致？加油站不构成重大危险源的应急预案是否需要进行评审？","consult":"《生产安全事故应急预案管理办法》应急管理部令第2号第二十一条“矿山、金属冶炼企业和易燃易爆物品、危险化学品的生产、经营带储存设施的，下同......”中的“带储存设施的”与《危险化学品经营许可证管理办法》第三十七第二款“本办法所称储存设施，是指按照《危险化学品重大危险源辨识》GB18218确定......”中的“储存设施”是否相同概念？加油站不构成重大危险源的应急预案是否需要进行评审？","reply":"您好，《生产安全事故应急预案管理办法》和《危险化学品经营许可证管理办法》中所称“储存设施”概念是相同的。根据《危险化学品经营许可证管理办法》第三十七第二款规定：“本办法所称储存设施，是指按照《危险化学品重大危险源辨识》（GB18218）确定，储存的危险化学品数量构成重大危险源的设施”，若某加油站经确定不构成重大危险源，则不属于《生产安全事故应急预案管理办法》第二十一条第一款规定的带有储存设施经营危险化学品的情形。按照《生产安全事故应急预案管理办法》第二十一条第二款规定，该加油站可以根据自身需要，对本单位编制的应急预案进行论证。","consultTime":"2024-03-01","replyTime":"2024-03-08","dept":"国家安全生产应急救援中心","chapter":"消防安全","hasLocalRef":false},{"id":"7-49","title":"加油站属于\"带储存企业\"吗？","consult":"加油站属于带储存企业吗？应急部《危险化学品双重预防机制建设工作指南 试行》，“1.2 本文件适用于取得应急管理部门许可的危险化学品生产企业、经营带储存企业...”，包括加油站么？","reply":"您好，按照现行《危险化学品经营许可证管理办法》（国家安全监管总局令第55号）有关要求，不构成重大危险源的带储存设施的危化品经营企业的经营方式为“不带有储存设施的经营”。近期，修正后的《安全生产法》实施后，我们正组织对有关配套部门规章进行修正。感谢您的留言。","consultTime":"2022-02-09","replyTime":"2022-02-14","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-50","title":"加油站等相关企业是否属于两重点一重大企业？","consult":"尊敬的领导，请教以下两个问题：1.加油站是否属于“两重点一重大”企业，如果是的话，是否必须要按照“两重点一重大”企业进行管理？2.无仓储经营的重点危险化学品，是否属于“两重点一重大”企业，如果是的话，是否必须要按照“两重点一重大”进行管理？由于加油站和无仓储企业的特殊性，虽然经营的品种属于重点监管的危险化学品，但与储存企业又有不同。在基层各地对此类问题的认知不同，措施也不同，恳请部领导给予答疑。","reply":"您好，按照现行《危险化学品经营许可证管理办法》（国家安全监管总局令第55号）有关要求，不构成重大危险源的带储存设施的危化品经营企业的经营方式为“不带有储存设施的经营”。近期，修正后的《安全生产法》实施后，我们正组织对有关配套部门规章进行修正。感谢您的留言。","consultTime":"2022-01-06","replyTime":"2022-01-11","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-51","title":"界定危化品经营方式的两份文件中 “储存设施” 定义是否相同？","consult":"安监总厅管三函〔2012〕179号文件中第五点中“经营方式，包括专门从事危险化学品仓储经营、带有储存设施经营危险化学品、不带有储存设施经营危险化学品等三种形式。” 中“储存设施”的定义和 《危险化学品经营许可证管理办法》55号第三十七条第二款是否一致？","reply":"您好，安监总厅管三函〔2012〕179号文件第五点所述“储存设施”定义与《危险化学品经营许可证管理办法》第三十七条第二款一致，感谢留言。","consultTime":"2022-04-07","replyTime":"2022-04-09","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-52","title":"危险化学品仓储经营、不带储存设施经营、带储存设施经营的区分？","consult":"危险化学品仓储经营、不带储存设施经营、带储存设施经营的区分。例如：加油站、气体充装站包括经营瓶装惰性气体分别以上哪种经营方式？","reply":"您好，请依据《危险化学品经营许可证管理办法》有关规定和属地发证机关要求办理相应的经营许可证。感谢留言。","consultTime":"2022-04-28","replyTime":"2022-05-02","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-53","title":"危险化学品纯批发企业的经营方式是什么？","consult":"危险化学品纯批发企业的经营方式是“安监安监总厅管三函〔2012〕179号”文件中“专门从事危险化学品仓储经营、带有储存设施经营危险化学品、不带有储存设施经营危险化学品等三种形式”中的哪一种？谢谢！","reply":"根据《危险化学品经营许可证管理办法》规定，无仓储设施危险化学品“纯批发企业”的经营方式，属于“不带有储存设施经营危险化学品”","consultTime":"2022-01-29","replyTime":"2022-02-03","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-54","title":"无仓储资质的危化品经营企业能否通过仓储合同或租赁方式从事危化品仓储经营？","consult":"1.甲公司有氢氧化钠的经营资质，乙公司也有氢氧化钠的经营资质，但是乙公司没有储存经营，无许可范围包括危化品氢氧化钠的仓储内容，请问甲和乙是否可以签订涉及危化品氢氧化钠产品的《仓储合同》？2.第一问的延伸，丙公司有危化品氢氧化钠的仓储资质，乙公司和丙公司签订租赁协议后，乙公司是否可以和甲公司签订涉及氢氧化钠危化品的《仓储合同》？","reply":"您好，依据《危险化学品经营许可证管理办法》，未取得经营许可证，任何单位和个人不得经营危险化学品；危险化学品经营方式包括专门从事危险化学品仓储经营、不带有储存设施经营危险化学品、带有储存设施经营危险化学品。感谢您的留言。","consultTime":"2022-03-09","replyTime":"2022-03-14","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-55","title":"危化品“经营带储存设施”企业与“储存企业”有何区别？","consult":"《生产安全事故应急预案管理办法》应急部令第2号第二十一条“矿山、金属冶炼企业和易燃易爆物品、危险化学品的生产、经营带储存设施的，下同、储存、运输企业，”。这里所指的危险化学品经营带储存设施的，下同企业与危险化学品储存企业有何不同？请指教，谢谢！","reply":"已电话沟通解答。 您好，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》中所称“储存设施”与《危险化学品经营许可证管理办法》“储存设施”概念相同。根据《危险化学品经营许可证管理办法》第三十七第二款规定“本办法所称储存设施，是指按照《危险化学品重大危险源辨识》（GB18218）确定，储存的危险化学品数量构成重大危险源的设施”。谢谢。","consultTime":"2024-03-15","replyTime":"2024-03-21","dept":"国家安全生产应急救援中心","chapter":"消防安全","hasLocalRef":false},{"id":"7-56","title":"商店卖了一瓶8元的自喷漆，应急局要处罚10多万是否合理？","consult":"近日，我百货店被应急局查处，说是职业举报人举报，一次性举报了好几家店铺，说我店铺销售容量430ml净重235g自喷漆，该自喷漆用于民用，要对我店铺进行立案查处，如果应急局不处罚，举报人就行政复议执法人员，说他们不作为，如果处罚的，就得10多万的处罚，作为一个小百货店，是不是存在“小过重罚”行为？我也查阅了很多资料，应急部的回复：“《安全生产法》修订后，我部启动了相应部门规章的修订工作，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品，”现在具体是怎么执行的？卖了一瓶8元的自喷漆，现在要进行10多万处罚是否合理？","reply":"感谢您的留言。《危险化学品安全法》规定，国家实行危险化学品登记制度，危险化学品生产企业、进口企业生产或者进口的危险化学品应依法登记；《危险化学品经营许可证管理办法》第二条规定，从事列入《危险化学品目录》的危险化学品的经营活动适用本办法。自喷漆等未列入《危险化学品目录》，不属于危险化学品。《国家安全监管总局办公厅关于印发危险化学品目录（2015版）实施指南（试行）的通知》有关含量的规定，本意是为了防范不法人员通过“变名”等方式非法生产经营危险化学品，威胁人民群众生命财产安全。对于人民群众生活中使用的自喷漆、消毒液、香水、清洗剂、杀虫剂，以及饮用的白酒等“物品”，其虽然含有危险化学品“成分”，但“物品”的危险性已通过包装、限量等得到有效防控。危险化学品经营许可制度实施20年来，均未对相关“物品”的经营实施许可。综合考虑人民群众日常消费需求和安全风险，相关“物品”经营活动无需办理危险化学品经营许可。","consultTime":"2026-04-28","replyTime":"2026-05-07","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-57","title":"医用氧气是否属于危险化学品？生产医用氧气是否需要办理安全生产许可证？","consult":"请问医用氧气是属于危险化学品吗？在经营范围规范表述目录里面在危险化学品经营内有标注，在危险化学品生产中没有标注，意思是医用氧气生产不属于危险化学品生产吗？谢谢！","reply":"氧[压缩的或液化的]列入《危险化学品目录(2015版)》（序号：2528）的危险化学品，生产、经营需要办理相关安全行政许可。","consultTime":"2021-07-20","replyTime":"2021-07-23","dept":"危险化学品安全监督管理二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-58","title":"应急管理部目前是否出台有相关实施办法明确应当购买安责险的生产经营单位范围？","consult":"1.安全生产法第五十一条规定属于国家规定的高危行业、领域的生产经营单位，应当投保安全生产责任保险。具体范围和实施办法由国务院应急管理部门会同国务院财政部门、国务院保险监督管理机构和相关行业主管部门制定。请问应急管理部目前是否出台有相关实施办法明确应当购买安责险的生产经营单位范围？2.安责险是否能作为地方部门核发、延续危化品行业行政许可的前置条件？3.加油站、加气站是否必须购买安责险？","reply":"1.按照《安全生产责任保险实施办法》（安监总办〔2017〕140号）第六条规定，煤矿、非煤矿山、危险化学品、烟花爆竹、交通运输、建筑施工、民用爆炸物品、金属冶炼、渔业生产等属于国家规定的高危行业、领域的生产经营单位应当依法投保安全生产责任保险。2.不可作为前置条件；3.属于高危行业的生产经营单位应当依法投保安责险。","consultTime":"2022-05-17","replyTime":"2022-05-19","dept":"规划财务司","chapter":"消防安全","hasLocalRef":false},{"id":"7-59","title":"汽油加油站危化品经营方式属于那种方式？","consult":"汽油加油站经营方式是属于“带有储存设施的经营”、“不带有储存设施的经营”和“仓储经营”三种中的哪一种？","reply":"您好，按照现行《危险化学品经营许可证管理办法》（国家安全监管总局令第55号），不构成重大危险源的危险化学品经营企业，其经营方式为“不带有储存设施经营”。近期，修正后的《安全生产法》实施后，我们正组织对有关配套部门规章进行修正，感谢留言。","consultTime":"2022-09-14","replyTime":"2022-09-18","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"7-60","title":"请问生产经营单位的定义及范围有明确界限吗？","consult":"您好，请问生产经营单位的定义及范围有明确界限吗？物业公司也算是生产经营单位吗？","reply":"《安全生产法》第二条：“在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法；”","consultTime":"2020-10-28","replyTime":"2020-12-02","dept":"安全生产应急救援中心","chapter":"消防安全","hasLocalRef":false},{"id":"7-61","title":"请问生产经营单位的定义及范围有明确界限吗？","consult":"您好，请问生产经营单位的定义及范围有明确界限吗？物业公司也算是生产经营单位吗？","reply":"《安全生产法》第二条：“在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法；”","consultTime":"2020-10-28","replyTime":"2020-12-02","dept":"安全生产应急救援中心","chapter":"消防安全","hasLocalRef":false},{"id":"7-62","title":"申请第一类易制毒化学品许可单位是否需要经营场所和仓储设施？","consult":"危险化学品经营单位可以申请开票模式无仓储模式经营危险化学品，或将货物委托专业的仓储企业管理即租赁仓储企业仓位，或采取自有及租赁经营仓储场所经营。请问申请第一类易制毒化学品经营许可的单位是否可以申请开票模式经营？如果不行，可否只租赁专业仓库的某一小间仓库或仓位、由专业仓库管理，还是必须自有或整体租赁仓库存放自己的易制毒化学品、并由申请易制毒经营企业自己管理？谢谢。","reply":"您好，申请第一类易制毒化学品经营许可，应当按照《非药品类易制毒化学品生产、经营许可办法》要求，向所在省、自治区、直辖市人民政府安全生产监督管理部门申请办理。感谢留言。","consultTime":"2022-07-04","replyTime":"2022-07-08","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-63","title":"零售、批发贸易类不带存储，纯经营危险化学品企业的应急预案是否需要专家评审和签字？","consult":"《生产安全事故应急预案管理办法》第二十一条 矿山....危险化学品的生产、经营带储存设施的，下同.......其他生产经营单位，应当对本单位编制的应急预案进行评审，并形成书面评审纪要。前款规定以外的其他生产经营单位可以根据自身需要，对本单位编制的应急预案进行论证。依据以上法律规定：零售、批发贸易类不带存储，纯经营危险化学品企业的应急预案是否需要专家评审和签字？还是企业自行论证就可以？","reply":"已电话沟通解答。您好，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第二十一条第一款、第二款明确说明了哪些生产经营单位的应急预案需要组织评审或者根据需要进行论证。如你单位不符合第一款有关规定，则不需要进行评审，可根据自身需要对本单位应急预案进行论证。","consultTime":"2024-03-21","replyTime":"2024-03-25","dept":"国家安全生产应急救援中心","chapter":"消防安全","hasLocalRef":false},{"id":"7-64","title":"投保安责险的高危行业中，危化品企业是否区分生产、储存和经营？","consult":"《安全生产法》第51条规定高危行业要投保安全生产责任保险，请问高危行业中危险化学品企业区分生产、储存和经营吗？不带储存设施的危险化学品经营企业也属于高危行业吗？也需要购买这个安责险吗？谢谢！","reply":"您好，《中共中央国务院关于推进安全生产领域改革发展的意见》明确提出在矿山、危险化学品、烟花爆竹、交通运输、建筑施工、民用爆炸物品、金属冶炼、渔业生产等高危行业领域强制实施安全生产责任保险制度，购买安责险具体要求请咨询属地应急管理部门。感谢留言。","consultTime":"2022-06-12","replyTime":"2022-06-16","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":true},{"id":"7-65","title":"跨境电商进口日用危化品如何仓储？","consult":"我司拟通过跨境电商渠道经营进口日用危化品，例如染发剂双氧乳中过氧化氢含量超过8，盒装双氧乳60体积ml，经鉴定属于危险化学品目录2015版，请问贵部门对相关商品是否有经营许可、危化品登记、仓储等方面的要求？盼复？","reply":"您好，《安全生产法》修订后，我部启动了相应部门规章的修订工作，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。感谢您的留言。","consultTime":"2022-05-19","replyTime":"2022-05-23","dept":"危化监管二司","chapter":"消防安全","hasLocalRef":false},{"id":"8-01","title":"84消毒液、医用酒精是否属于危险化学品？","consult":"84消毒液、医用酒精是否属于危险化学品？是否需要按照危化品相关管理规定进行管理？","reply":"您好，《安全生产法》修订后，我部也启动了配套法规规章的修订，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。感谢留言。","consultTime":"2022-08-19","replyTime":"2022-08-23","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-02","title":"γ-松油烯是否属于《危险化学品目录》2015版列明的危险化学品？","consult":"γ-松油烯 CAS号99-85-4是否归属于《危险化学品目录》2015版第2125条萜烃CAS号63394-00-3？是否属于《危险化学品目录》2015版列明的危险化学品？","reply":"萜烃是指分子式为异戊二烯的整数倍、由两个或两个以上的异戊二烯分子，以头尾相连结合起来的烯烃类化合物，是烃类萜的总称，γ-松油烯是一种单萜烃类物质，属于《危险化学品目录（2015版）》列明的危险化学品。","consultTime":"2021-07-28","replyTime":"2021-07-30","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-03","title":"涉及重点监管危险化工工艺和危化品的装置，设计单位是否必须具备化工石化甲级资质？","consult":"根据《危险化学品安全管理条例》，第七条第一款“涉及国家安全生产监督管理总局公布的重点监管危险化工工艺、重点监管危险化学品的装置，由具备石油化工医药行业相应资质的设计单位设计”。而《危险化学品企业安全分类整治目录2020年》暂扣或吊销类1：涉及危险化工工艺、重点监管危险化学品的危险化学品生产装置，未经具有综合甲级资质或者化工石化专业甲级单位设计。请问：涉及危化设计是否必须要甲级资质？","reply":"《危险化学品安全管理条例》第七条主要规定了有关部门的监督检查权，不涉及危化设计资质要求。《危险化学品企业安全分类整治目录（2020年）》暂扣或吊销安全生产许可证类1的法律依据是：《危险化学品生产企业安全生产许可证实施办法》第九条规定、涉及危险化工工艺、重点监管危险化学品的装置，由具有综合甲级资质或者化工石化专业甲级设计资质的化工石化设计单位设计。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-10","replyTime":"2022-03-15","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-04","title":"闪点≤60℃但不属于2828项\"含易燃溶剂的制品\"的混合物，是否仍属危险化学品？","consult":"危险化学品目录实施指南中第七条说明：“化学品只要满足《目录》中序号第2828项闪点判定标准即属于第2828项危险化学品，2828项定义为“含易燃溶剂的合成树脂、油漆、辅助材料、涂料等制品[闭杯闪点≤60℃]”。问题：混合物闪点≤60℃，但不属于2828项定义的含易燃溶剂的合成树脂、油漆、辅助材料、涂料等制品，是否属于危险化学品？并办理相应许可？望答复。","reply":"根据现行的规定,混合物闪点≤60℃(闪点高于35℃，但不超过60℃的液体如果在持续燃烧性试验中得到否定结果的除外),即属于2828项危险化学品。","consultTime":"2022-03-30","replyTime":"2022-04-07","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-05","title":"《危险化学品目录》及实施指南第2828项范围包括纯品吗？","consult":"《危险化学品目录》及实施指南第2828项范围明确的都是混合物，如果一种纯品闪点小于60℃，危险特性已确定，不需鉴定，需要按照危险化学品办理许可证吗？","reply":"您好，《危险化学品目录》第2828项仅适用于混合物，根据《危险化学品目录（2015版）实施指南（试行）》的规定，符合危险化学品确定原则,但未列入《目录》的化学品，企业应根据《危险化学品登记管理办法》要求进行危险化学品登记，并按照危险化学品进行管理，但不需要办理相关安全行政许可手续。感谢留言。","consultTime":"2022-06-04","replyTime":"2022-06-08","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-06","title":"具有危化品危险特性但不在目录中的化学品（如碳酸甲乙酯），生产许可依据是什么？","consult":"实际工作中遇到一些化学品，具有《危险化学品目录》中危险化学品的定义和确定原则描述的危险特性，但其不在《危险化学品目录》中。例如碳酸甲乙酯闪点低于28摄氏度，火险类别属于甲类，但是碳酸甲乙酯不在《危险化学品目录》中，生产碳酸甲乙酯是否需要许可？如果需许可，具体的许可依据？","reply":"你好，未列入《危险化学品目录（2015版）》，但经鉴定有关属于危险化学品的，有关生产、进口企业应根据《危险化学品登记管理办法》要求进行危险化学品登记，但不需要办理相关安全行政许可手续，企业应需要按照危险化学品进行管理。","consultTime":"2021-11-30","replyTime":"2021-12-10","dept":"危化二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-07","title":"判断是否是危险化学品的基准是《危险化学品目录2015版》吗？","consult":"标题的政策要求各个企业对购入的危险化学品申请二维码，那请问    1.判断是否是危险化学品的基准是《危险化学品目录2015版》吗？2.如果产品由多种物质组合加工而成，只要产品中含有《危险化学品目录2015版》中的其中一种物质，那就认定是危险化学品，是吗？谢谢！","reply":"按照《危险化学品目录（2015版）》和《危险化学品目录（2015版）实施指南（试行）》的标准判断是否属于危险化学品。","consultTime":"2022-02-15","replyTime":"2022-02-24","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-08","title":"一般化学品的混合稀释无化学反应是否属于违法违规小化工？","consult":"我附近有一家单位，从广东购买混凝土退水剂浓缩液聚羧酸溶液，按说明加水稀释并掺杂少量葡萄糖酸钠食品级后，卖给混凝土搅拌站，被发改委认定为行业代码2661的小化工，该退水剂为水性不易燃不易爆无毒无害无环境污染。而附近一家被应急局查处的，将多种危化品加水搅拌做成工业清洗剂销的企业，产品已鉴定为危化品，却被认为行业代码属于2681日化，不一定属于小化工。希望得到权威部门说明小化工的认定标准。","reply":"行业代码2661的认定是依据《国民经济行业分类》(GB/T 4754-2017)。非法违法小化工的认定是依据《国务院安全生产委员会关于印发&lt;全国及危险化学品道路运输安全集中整治方案&gt;&lt;非法违法“小化工”专项整治方案&gt;的通知》（安委〔2020〕8号），符合“非法违法生产、储存化工产品（危险化学品）及使用化工产品（危险化学品）非法违法从事生产经营活动的小化工、小作坊、黑窝点”的企业。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2021-09-19","replyTime":"2021-09-24","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-09","title":"球形铝粉是否属于危险化学品？","consult":"《危险化学品分类信息表》显示铝粉有易燃和遇水放气危险性。我司生产的球形铝粉，经应急管理局化学品登记中心鉴定：不属于易燃固体、不属于遇水放气的物质和混合物。经“沈阳化工研究院有限公司”鉴定：不符合危险化学品的确定原则，不属于危险化学品。综上所述：我司生产的球形铝粉，是否可以理解为不属于《危险化学品目录》中序号为1377的“铝粉”范畴，也不属于危险化学品?","reply":"你好，根据《危险化学品目录（2015版）》铝粉不论颗粒度，属于危险化学品。","consultTime":"2021-12-09","replyTime":"2021-12-20","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-10","title":"煤焦油危险性分类应采信哪一标准判定？","consult":"1.煤焦油闪点确定依据：1《建规2018版》175页 3.1.1 5常见煤焦油闪点为65-100℃，2实测煤焦油闪点为76.5、73.5、72.3℃。2.《危险化学品分类信息表》安监总厅管三〔2015〕80号，第1569项将煤焦油危险性类别定为易燃液体类别2。3. GB3000.7-2013表1，按照煤焦油的闪点应定义为易燃液体类别4. 请问煤焦油的危险性类别应按照哪个标准确定？","reply":"煤焦油有低温煤焦油、中温煤焦油、高温煤焦油，按照从严原则，根据《危险化学品目录（2015版）实施指南（试行）》，煤焦油危险性类别为易燃液体类别2。您的意见将在修订《危险化学品分类信息表》时统筹研究。","consultTime":"2021-07-18","replyTime":"2021-07-24","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-11","title":"电解熔融氯化钠生产金属钠是否属于重点监管危险工艺？","consult":"电解工艺氯碱的危险因素主要为氢气、三氯化氮、氯气。金属钠电解不涉及氢气、温度高三氯化氮分解、不涉及腐蚀性溶液；涉及氯气，已按照危险、剧毒化学品等标准规范管控。安全专家从氯碱定义、工艺简介中熔融电解质来确定金属钠电解为重点监管的工艺。我们不认同，认为识别的关键在于危险性大小，而不能仅从上述内容和生产液氯来确定。希望贵部门确定金属钠电解生产是否属于重点监管危险工艺中的电解工艺氯碱。","reply":"电解法生产金属钠符合（安监总管三〔2009〕116号）电解工艺的工艺特性和工艺危险特点，明确属于重点监管的危险工艺；“已按照危险、剧毒化学品等标准规范管控”不代表电解法生产金属钠不具有该工艺危险，并没有改变电解法生产金属钠会产生氯气的事实。感谢您对危险化学品安全生产工作的关心关爱。","consultTime":"2022-01-07","replyTime":"2022-01-11","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-12","title":"农药产品是否属于危险化学品？","consult":"农药原药不在危化品目录，其闪点高于60℃，是否属于危险化学品？农药制剂产品含农药、乳化剂等其闪点小于60℃，是否属于危险化学品？危化品目录2828项对农药制剂产品是否适用？望答复。","reply":"根据《危险化学品目录（2015版）》及其实施指南的规定，农药原药不在危化品目录内的，不属于危险化学品；危化品目录2828项适用农药制剂。","consultTime":"2022-01-11","replyTime":"2022-01-21","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-13","title":"危险化学品企业如何界定？","consult":"请教对于危化品企业的界定是依据什么？是生产、使用、储存领证，还是只要使用就定义为危化品企业，比如所有原物料、中间产物均不涉及危化品和危化工艺的企业，仅在污水处理和产品检测时使用少量危化品的，是否属于危化品企业？","reply":"感谢您的留言。请依照《危险化学品生产企业安全生产许可证实施办法》（国家安全生产监督管理总局令第41号）、《危险化学品经营许可证管理办法》（国家安全生产监督管理总局令第55号）、《危险化学品安全使用许可证实施办法》（国家安全生产监督管理总局令第57号）中的规定界定。","consultTime":"2021-08-06","replyTime":"2021-08-11","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-14","title":"危险化学品企业安全分类整治目录2020年中变配电所定义？","consult":"应急管理部发文《危险化学品企业安全分类整治目录2020年》：“装置的控制室、机柜间、变配电所、化验室、办公室等不得与设有甲、乙A类设备的房间布置在同一建筑物内。”。该变配电所是否指变电和配电在一起的场所？是否包含无人值守的且在爆炸划分区外的配电室、马达控制室、MCC房？","reply":"变配电所包括变电所和配电所，两者既可单独设置，也可一起设置。该条款的主要目的是防止甲、乙A类设备发生火灾、爆炸事故时对人员或重要设施造成损害，控制室、机柜间、变配电室一旦因事故导致无法使用，可能严重影响应急处置。因此，即使配电室、马达控制室、MCC房等无人值守且在爆炸划分区外，仍应落实该条款要求。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-04-06","replyTime":"2022-04-07","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-15","title":"含81个危险类别但不在2828条目录的物料是否属危化品？锂电池等为何未列入目录？","consult":"尊敬的同志您好，如下问题困扰已久还望拔冗解答，多谢！1.如果物料含有《危险化学品目录2015》中危险性较大的81个危险类别，但是成分含量又不在2828条目录里，该物料是否属于危险品化学品？2.放射性物质比如铀235，六氟化钚，一般满足致癌性等对健康危害，还有新冠等病毒等，为何他们未列入危化品目录？3.所有固体液体气体都是由化学品组成，危化品目录2015里也含有混合物，为何锂电池等物品不在目录里？","reply":"1.根据《危险化学品目录（2015版）实施指南（试行）》的规定，符合危险化学品确定原则,但未列入《目录》的化学品，企业应根据《危险化学品登记管理办法》要求进行危险化学品登记，但不需要办理相关安全行政许可手续，企业应需要按照危险化学品进行管理。2.放射性物质有专门的监管法规，不在危险化学品的监管范围内。3.列入《目录》的物质，不考虑锂电子等货物，但会关注电池液。","consultTime":"2022-02-08","replyTime":"2022-02-18","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-16","title":"镁锭[含镁＞99]是否属于此分类，是否属于危险化学品？","consult":"您好，根据《危险化学品目录》2018版，1572号镁，CAS号7439-95-4及1573号镁合金[片状、带状或条状,含镁＞50]的分类，镁锭[含镁＞99]是否属于此分类？是否属于危险化学品？","reply":"你好，请对照《危险化学品目录（2015版）》第1572、1573号进行判定。","consultTime":"2021-12-28","replyTime":"2022-01-05","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-17","title":"叔丁醇钠储存，火灾危险性分类是属于哪一类物质？","consult":"老师您好：请问叔丁醇钠储存，火灾危险性分类是属于哪一类物质？应存放在什么类型的仓库？","reply":"根据建筑设计防火规范，确定该物质的火灾危险性。","consultTime":"2022-02-07","replyTime":"2022-02-17","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-18","title":"含有机过氧化物混合物GHS分类？","consult":"某混合物糊状物含有10的过氧化二苯甲酰，按GB 30000.16-2013 有机过氧化物的分类标准，计算得到该混合物中有效氧含量和过氧化氢含量都不超过1，判定不被分类为有机过氧化物。也不含其他2015版危化品目录列明的化学物质。混合物整体GHS分类仅有皮肤致敏物1，和严重眼损伤眼刺激类别1。该类混合物属于2015版危化品目录列明的危险化学品还是属于落入确定原则的危险化学？","reply":"你好，请执行《危险化学品目录（2015版）》及《危险化学品目录（2015版）实施指南（试行）》等相关文件要求，依据有关原则进行判定。根据《化学品物理危险性鉴定与分类管理办法》，对于物理危险性尚未确定的，可委托具备能力的单位进行鉴定和分类。","consultTime":"2021-11-19","replyTime":"2021-11-30","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-19","title":"84号文“不得与甲、乙A类设备同建筑”是否适用非石化单位？","consult":"咨询多次，音讯全无。从去年11月起就“危险化学品企业安全分类整治目录应急〔2020〕84号附件”对标问题咨询了四次，均无答复。继续咨询：应急〔2020〕84号文附件中“不得与设有甲、乙A类设备的房间布置在同一建筑物内”的规定，是否适用包括非石化单位无人值守、防火分区独立、防火墙隔开的、不含变电的MCC室？仍然盼回复！","reply":"虽然《危险化学品企业分类整治目录2020》中“装置的控制室、机柜间、变配电所、化验室、办公室等不得与设有甲、乙A类设备的房间布置在同一建筑物内”列明的违法依据是《石油化工企业设计防火标准》（GB50160-2008）（2018年版），但其他类别的危险化学品企业也应参考执行该条规定。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-22","replyTime":"2022-02-28","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-20","title":"民用零售包装危化品存放仓库需满足什么条件？","consult":"我司是仓储公司，主要以货物存储、搬卸为主，货物如涉及储存小包装香水、柠檬油CAS号：8008-56-8、丝柏香薰精油CAS号：8013-86-3植物精油，15ml瓶等民用零售包装的危险货物属于《危险化学品目录》2015版的2828项要存放的危品专用仓库要什么满足条件或要办理什么资质才算危品专用仓？还是说仓库只要通过自建局的消防验收符合就行呢？","reply":"您好，《安全生产法》修订后，我部启动了相应部门规章的修订工作，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。感谢您的留言。","consultTime":"2022-03-11","replyTime":"2022-03-14","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-21","title":"无溶剂环氧涂料闪点高于60℃是否不属危化品？","consult":"如题，无溶剂环氧涂料产品属于国家鼓励类产品，闪点高于60℃，是否就不属危化品？如果只生产此类无溶剂环氧涂料产品，是否可以不办理危化品安全生产许可？","reply":"无溶剂环氧涂料是否属于危险化学品，需要由化学品危险性鉴定机构进行鉴定分类。是否办理危化品安全生产许可，请在鉴别分类基础上，按照《危险化学品生产企业安全生产许可证实施办法》《危险化学品目录（2015版）实施指南（试行）》等有关规定要求办理。","consultTime":"2021-07-02","replyTime":"2021-07-08","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-22","title":"危险化学品无冷却措施的内注导热油式电加热反应釜都是淘汰落后设备吗？","consult":"非重点监管危险化工工艺的无冷却措施的内注导热油式电加热反应釜是否属于《淘汰落后危险化学品安全生产工艺技术设备目录第二批》淘汰落后设备?","reply":"根据《淘汰落后危险化学品安全生产工艺技术设备目录（第二批）》，无冷却措施的内注导热油式电加热反应釜（油浴反应釜、油浴锅）属于淘汰落后设备，限制范围为：涉及重点监管危险化工工艺的反应釜禁用，在役设备一年内更换完毕。因此，非重点监管危险化工工艺的无冷却措施的内注导热油式电加热反应釜不属于《淘汰落后危险化学品安全生产工艺技术设备目录（第二批）》淘汰落后设备。","consultTime":"2024-07-12","replyTime":"2024-08-02","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-23","title":"危险化学品是否只是指纳入《危险化学品目录2015版》的化学品？","consult":"《安全生产法》第一百一十七条 本法下列用语的含义：危险物品，是指易燃易爆物品、危险化学品、放射性物品等能够危及人身安全和财产安全的物品。危险化学品是否只是指纳入《危险化学品目录2015版》的化学品？易燃易爆物品的是如何界定的？","reply":"危险化学品是指《危险化学品安全管理条例》管理的危险化学品。在《危险化学品安全管理条例》管理外，还存在另外一些易燃易爆物品，如城镇燃气、民爆物品等。","consultTime":"2022-03-10","replyTime":"2022-03-21","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-24","title":"公司是否需要取得危险化学品安全生产许可证？","consult":"我公司打算生产一种涂料，该涂料所含成分均不在危险化学品目录中，闪点为56℃，高于35℃，但不超过60℃；经检测在60.5℃和75℃均不发生持续燃烧。请问是否需要办理危险化学品生产许可证?","reply":"建议委托专业机构鉴定是否属于危险化学品，若属于危险化学品应按照《化学品物理危险性鉴定与分类管理办法》第十七条，办理危险化学品登记，按照有关危险化学品的法律、法规和标准的要求，加强安全管理。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-21","replyTime":"2022-02-25","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-25","title":"氨是否属于易燃气体？","consult":"《危险化学品目录2015版实施指南试行》，液氨危险性类别为易燃气体，类别2。而实际上氨难燃，这点在《爆炸危险环境电力装置设计规范》GB50058-2014条文解释2.0.26条中也有说明“经验表明，氨很难点燃.......。”，在氨ChemWatch Review SDS 中危险性类别未定性为易燃气体。其理化性质中未注明其易燃性。故，氨的危险类别不应为易燃气体，其主要危险性应为毒性。","reply":"你好，请执行《危险化学品目录（2015版）》及《危险化学品目录（2015版）实施指南（试行）》等相关文件要求，依据有关原则进行判定。","consultTime":"2021-11-11","replyTime":"2021-11-22","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-26","title":"依据《危化品目录》，氯乙烯介质属于急性毒性类别1还是急性毒性类别2？","consult":"尊敬的领导：现咨询一下：依据《危化品目录》，氯乙烯介质属于急性毒性类别1还是急性毒性类别2？","reply":"根据《危险化学品目录（2015版）实施指南（试行）》，氯乙烯危险性类别为易燃气体，类别1；化学不稳定性气体，类别B；加压气体；致癌性，类别1A。","consultTime":"2021-07-27","replyTime":"2021-07-30","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-27","title":"液氨和20%氨水是否属于高度危害危化品？是否必须将单端面机封改为双端面机封？","consult":"根据《淘汰落后危险化学品安全生产工艺技术设备目录第二批》通知要求，单端面机械密封离心泵和填料密封离心泵液下泵除外，设为禁止类，要求甲A类、极度危害、高度危害和操作温度超过自燃点的危险化学品禁用，在役设备三年内更换完毕。请问液氨、20浓度氨水是否属于高度危害危险化学品？是否强制需要改用双端面机封？","reply":"根据《职业性接触毒物危害程度分级》（GBZ/T 230-2025），液氨属于中度危害危险化学品，20%氨水属于轻度危害危险化学品。感谢您对危险化学品安全管理工作的关心。","consultTime":"2025-07-09","replyTime":"2025-07-16","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-28","title":"液氨属于可燃液体还是可燃气体？","consult":"液氨属于可燃液体还是可燃气体？","reply":"按《危险化学品目录（2015版）实施指南（试行）》，液氨危险性类别为易燃气体，类别2。","consultTime":"2021-07-16","replyTime":"2021-07-20","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-29","title":"86号文禁止的间歇釜式硝化工艺是否仅指注解的27种？三级以下工艺可否继续使用间歇釜？","consult":"《淘汰落后危险化学品安全生产工艺技术设备目录第二批》应急厅〔2024〕86号中，序号4，禁止使用的间歇或半间歇釜式硝化工艺，是否仅指其注解中的27种？其余硝化工艺工艺危险度等级低于3级的是否强制要求改造？是否可使用间歇式釜？","reply":"已列入《淘汰落后危险化学品安全生产工艺技术设备目录第二批》采用间歇或半间歇釜式硝化工艺生产硝基苯等27种化学品的，应严格执行，按时完成改造；暂未列入的，鼓励对标执行，提高硝化本质安全水平。目前，正在研究新一批淘汰落后化工安全生产工艺技术设备目录，进一步完善相关要求。感谢您对危险化学品安全管理工作的关心。","consultTime":"2025-09-02","replyTime":"2025-09-05","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-30","title":"经营炭黑油需要在危险化学品经营许可证上添加这一项吗？","consult":"请问经营炭黑油需要在危险化学品经营许可证上添加这一项吗？危险化学品目录没有炭黑油怎么解释炭黑油现在有没有其它的名称？","reply":"您好，根据《危险化学品目录（2015版）实施指南（试行）》第五条：主要成分均为列入《目录》的危险化学品，并且主要成分质量比或体积比之和不小于70%的混合物（经鉴定不属于危险化学品确定原则的除外），可视其为危险化学品并按危险化学品进行管理，安全监管部门在办理相关安全行政许可时，应注明混合物的商品名称及其主要成分含量。炭黑油（英文简称CBO）是煤焦油高沸点馏分,主要成分一般为蒽油和沥青，符合该条危化品鉴定标准，需要在经营许可证上添加该项。感谢留言。","consultTime":"2022-08-19","replyTime":"2022-08-21","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-31","title":"自用70危险化学品溶液是否需要登记？","consult":"新项目中有无机硫酸盐溶液的生产该无机硫酸盐列入危险化学品目录，无燃爆危险性，非剧毒，质量浓度70；未列入《危险化学品使用量的数量标准》，此溶液作为同一项目中后续生产的原料自行使用无外售。该无机硫酸盐溶液有其他危化品生产企业已经作为危化品登记，新项目的建设单位未对此溶液做过登记。请问按本项目的性质中间产品，无外售经营，该无机硫酸盐溶液是否必须作为危化品登记？","reply":"你好，请执行《危险化学品目录（2015版）》及《危险化学品目录（2015版）实施指南（试行）》等相关文件要求，依据有关原则进行判定。","consultTime":"2022-01-26","replyTime":"2022-02-10","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-32","title":"试生产期间及系统升级期间如何办理易制毒备案？","consult":"请问在试生产期间如何办理易制毒备案证明？还有就是网上办理系统升级期间如何办理易制毒备案证明？谢谢！","reply":"《非药品类易制毒化学品生产、经营许可办法》（原国家安全监管总局令第5号）对备案工作有相关规定，备案工作由地方应急管理部门负责，具体事宜请咨询地方应急管理部门。因非药品类易制毒化学品综合管理信息系统升级改造，2021年12月底前暂时无法使用，如需办理，请咨询当地应急管理部门。已电话沟通解决。感谢您对非药品类易制毒监管工作的关注。","consultTime":"2021-10-09","replyTime":"2021-10-15","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-33","title":"医用酒精是否属于危险化学品？","consult":"您好：根据《危险化学品目录》2018，乙醇无水cas：64-17-5属于危险化学品，医用酒精不在此列。但国务院安委会2016年7号文《涉及危险化学品安全风险的行业品种目录》中，又在多个行业将其列为危险化学品。请问医用酒精，或者浓度低于99.5的酒精是否属于危险化学品？是否按照《危险化学品安全管理条例》进行管理？","reply":"根据《危险化学品目录（2015版）实施指南（试行）》，乙醇溶液按体积比含乙醇≥24%就属于危险化学品。医用酒精的浓度为75%，因此属于危险化学品。根据《危险化学品安全管理条例》第九十七条的规定，“监控化学品、属于危险化学品的药品和农药的安全管理，依照本条例的规定执行；法律、行政法规另有规定的，依照其规定”，因此，医用酒精应按照《危险化学品安全管理条例》进行管理。","consultTime":"2021-08-04","replyTime":"2021-08-09","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-34","title":"燃料油是否属于危化品？","consult":"中石化下属的燃料油公司经营的给船只用油的燃料油是否属于危化品？","reply":"危险化学品是具有毒害、腐蚀、爆炸、燃烧、助燃等性质，对人体、设施、环境具有危害的剧毒化学品和其他化学品。根据化学品分类和标签系列国家标准（GB 30000.2～29），我国从化学品28类95个危险类别中，选取了其中危险性较大的81个类别作为危险化学品。每种燃料油的具体危险危害性不完全相同，是否属于危险化学品，需要化学品危险性鉴定机构进行鉴定分类。","consultTime":"2021-07-19","replyTime":"2021-08-12","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-35","title":"醇基燃料是否为3类危险化学品？","consult":"请问醇基燃料是否为3类危险化学品？现行的目录是哪个版本？","reply":"你好，现行目录为《危险化学品目录（2015版）》。闪点小于60度，符合产品标准的醇基燃料属于危险化学品。","consultTime":"2021-12-08","replyTime":"2021-12-17","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-36","title":"GBT37243-2019中\"储存设施\"是否含经营储存企业？戊类盐酸是否需要外部防护距离评估？","consult":"领导，您好，咨询个问题。1.危险化学品生产装置和储存设施外部安全防护距离确定方法GBT37243-2019中适应范围为危险化学品生产装置和储存设施外部安全防护距离，这里指的储存设施是单纯储存还是经营储存的企业？2.储存的危险化学品为爆炸物、有毒气体、易燃气体需要进行外部安全防护距离确定，经营储存的戊类盐酸也需要进行外部安全防护距离确认吗？","reply":"感谢您的留言，请咨询标准编制单位。","consultTime":"2021-12-06","replyTime":"2021-12-10","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-37","title":"油气长输管道线路、站场是否依据GB36894-2018计算个人与社会风险？","consult":"该标准所述“储存设施”没有明确说明是否包含“油气输送管道”，而与之配套的《危险化学品生产装置和储存设施外部安全防护距离确定方法》GB∕T37243-2019的适用范围不包含“油气输送管道”，现咨询：“油气长输管道（管道线路是输送油气的，管道站场是给油气加压的可能会有储存油气），管道线路、管道站场是否都需要计算个人风险和社会风险值？","reply":"油气长输管道站场的生产装置和储存设施个人风险和社会风险的可接受风险基准值的判定可依据《危险化学品生产装置和储存设施风险基准》（GB36894-2018）执行，油气长输管道线路风险评价依据《油气输送管道风险评价导则》（SY/T6859-2020）执行。","consultTime":"2022-04-14","replyTime":"2022-05-18","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-38","title":"《工贸企业粉尘防爆安全规定》中的工贸企业包含危化品生产企业么？","consult":"请问，即将要实施的《工贸企业粉尘防爆安全规定》中的工贸企业包含危化品生产企业么？","reply":"感谢您的留言。《工贸企业粉尘防爆安全规定》（中华人民共和国应急管理部令第6号）适用于存在可燃性粉尘爆炸危险的冶金、有色、建材、机械、轻工、纺织、烟草、商贸等工贸企业的粉尘防爆安全工作及其监督管理。","consultTime":"2021-08-04","replyTime":"2021-08-09","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-39","title":"“三同时”办法中“县级以上”是否包括县级？","consult":"1.《建设项目安全设施“三同时”监督管理办法》中的县级以上地方各级安全生产监督管理部门是否包括县一级？2.“生产、储存烟花爆竹建设项目安全设施设计审查”事项县级应急管理部门是否有审批权限？","reply":"1.《建设项目安全设施“三同时”监督管理办法》中的县级以上地方各级安全生产监督管理部门包括县级。2.按照《建设项目安全设施“三同时”监督管理办法》第五条规定，县级以上地方各级安全生产监督管理部门对本行政区域内的建设项目安全设施“三同时”实施综合监督管理，并在本级人民政府规定的职责范围内承担本级人民政府及其有关主管部门审批、核准或者备案的建设项目安全设施“三同时”的监督管理。","consultTime":"2022-03-25","replyTime":"2022-03-28","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-40","title":"装置区界内有无定义？距离乙类装置区最外沿设备40米是否符合三年专项整治的要求？","consult":"涉及甲乙类火灾危险性的生产装置控制室不得布置在装置区内。装置区界内有无定义？距离乙类装置区最外沿设备40米是否符合三年专项整治的要求？粉尘爆炸危险性的厂房无休息室，距离厂房40米有宿舍是否符合三年专项整治的要求？活性炭粉尘厂房是否属于粉尘爆炸危险性厂房？","reply":"装置区是指成组布置的装置及装置之间的连片区域，一般通过道路、界墙等与其他区域隔离。在装置区外的控制室，还应满足《石油化工企业设计防火标准》（GB50160-2008）等标准关于防火间距的要求。按照消防法，宿舍属于人员密集场所，与粉尘爆炸危险性厂房的距离应满足国家标准要求。活性炭粉尘属于具有爆炸性的粉尘。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-04","replyTime":"2022-03-09","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-41","title":"个人未办理危险化学品生产许可证非法生产危化品如何处理？","consult":"《安全生产许可证条例》第二条国家对矿山企业、建筑施工企业和危险化学品、烟花爆竹、民用爆炸物品生产企业以下统称企业实行安全生产许可制度。企业未取得安全生产许可证的，不得从事生产活动。没有说明个人生产危化品应该如何处理？那么个人的黑作坊生产危化品应该如何处罚？","reply":"《安全生产违法行为行政处罚办法》（原国家安全监管总局令第15号）第六十八条规定，本办法所称的生产经营单位，是指合法和非法从事生产或者经营活动的基本单元，包括企业法人、不具备企业法人资格的合伙组织、个体工商户和自然人等生产经营主体。依据《安全生产非法违法行为查处办法》（安监总政法〔2011〕158号）第二条，公民、法人或者其他组织未依法取得安全监管监察部门负责的行政许可，擅自从事生产经营建设活动的行为均属于安全生产非法行为。感谢您对危险化学品安全生产工作的关心。","consultTime":"2023-02-13","replyTime":"2023-03-27","dept":"危险化学品安全监督管理一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-42","title":"企业内部工艺安全实验室需要什么资质？","consult":"原国家安监总局关于加强精细化工反应安全风险评估工作的指导意见及评估导则2017年1号文，对反应安全风险评估单位的专业能力和资质进行了相关要求。请问作为企业内部的工艺安全实验室，测试对象只限于企业内部的工艺及化学品，该实验室的资质有相关要求吗？也必须有CNAS资质吗？","reply":"根据《关于加强精细化工反应安全风险评估工作的指导意见》（安监总管三〔2017〕1号）和《危险化学品生产建设项目安全风险防控指南（试行）》，精细化工反应安全风险评估机构需要具备中国合格评定国家认可实验室（CNAS认可实验室）资质条件和中国计量认证（CMA认可实验室）资质条件，并具备必要的工艺技术、工程技术、热安全和热动力学技术团队和实验能力，保证相关设备和测试方法及时得到校验和比对，保证测试数据的准确性。企业满足相关要求，且反应安全风险评估对象只是企业内部的工艺及化学品的，可以自行开展反应风险评估工作，但不具备资质则不能对外出具评估报告。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-08-02","replyTime":"2022-08-08","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-43","title":"针对企业消防队的事故处置指挥所要遵循的方式方法是否有相关的国家标准和规范？","consult":"我司是一家大型危化品生产企业，下辖十多家生产装置，配备有专职消防队。2017年之前消防队指挥员由政府派驻的武警官兵担任，负责演习和出警时指挥处置各类紧急情况，公司设有应急专员一职协调消防队和工厂人员的配合处置工作。2017年以后，随着消防部门的改制，政府派驻的消防官兵全部撤离，企业消防队全部由保安公司劳务派遣人员组成。目前公司取消了消防指挥员一职原来由政府派驻的官兵担任，消防队的演练和出警处置现在均由公司的应急专员负责指挥。工厂各方对公司应急专员的指挥的正确性偶尔有不同意见，这就促发我们思考应急指挥处置的标准和规范问题。请问，针对企业消防队的事故处置指挥所要遵循的方式方法是否有相关的国家标准和规范？","reply":"企业专职消防队开展危化品事故处置指挥应坚持“统一指挥、分级负责、流程规范、协同高效”原则，明确应急指挥层级与权限，规范接警响应、现场侦察、决策处置、协同联动等全流程工作程序。针对危化品事故处置，需紧密结合装置工艺特性制定科学处置方案，强化与属地应急预案体系衔接，建立内部应急力量支撑、外部综合力量支持的应急体系。针对企业生产安全事故应急救援处置，可参照2015年原国家安全生产监督管理总局制定的《危险化学品事故应急救援指挥导则》，该导则明确了危险化学品事故应急救援指挥的基本原则和程序，适用于指导政府部门、外部救援力量和事故单位共同参与的应急救援工作；同时运用国家安全生产应急救援中心2023年编写出版的《典型危险化学品应急处置指导手册》等相关专业书籍、标准，开展业务培训，提高危险化学品事故应急处置的指挥水平。","consultTime":"2025-12-17","replyTime":"2025-12-24","dept":"国家安全生产应急救援中心","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-44","title":"那该加油站的应急预案还需要进行外部专家评审吗？","consult":"根据《危险化学品经营许可证管理办法》第三十七条第二款规定：“本办法所称储存设施，是指按照《危险化学品重大危险源辨识》GB18218确定，储存的危险化学品数量构成重大危险源的设施”，若某加油站经确定不构成重大危险源，则不属于,《生产安全事故应急预案管理办法》第二十一条第一款规定的带有储存设施经营危险化品的情形。那该加油站的应急预案还需要进行外部专家评审吗？","reply":"已电话沟通解答。您好，根据《危险化学品经营许可证管理办法》第三十七第二款规定“本办法所称储存设施，是指按照《危险化学品重大危险源辨识》（GB18218）确定，储存的危险化学品数量构成重大危险源的设施”，若某加油站确定不构成重大危险源，则不属于《生产安全事故应急预案管理办法》第二十一条第一款规定的需要进行应急预案评审的情形，可按照《生产安全事故应急预案管理办法》第二十一条第二款规定，根据自身需要，对本单位编制的应急预案进行论证。","consultTime":"2024-03-25","replyTime":"2024-03-27","dept":"国家安全生产应急救援中心","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-45","title":"关于加油站油罐采用阻隔防爆技术改造后安全距离问题？","consult":"尊敬的各位领导:加油站油罐采用阻隔防爆技术改造后安全距离规范GB50156-2012中为什么删除了阻隔防爆的内容。现根据最新发布2021年8月1日实行--加油气站油气储存罐体阻隔防爆技术要求；我的问题是现有加油站汽、柴油罐再遇到类似外部安全距离不符合要求的，是否仍然可以加装阻隔防爆装置？","reply":"您好，《汽车加油加气加氢站技术标准》（GB 50156-2021）已经施行，具体要求请咨询标准起草单位。感谢留言。","consultTime":"2022-06-13","replyTime":"2022-06-16","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-46","title":"关于国务院安委会《全国安全生产专项整治三年行动计划》所述的交接班室是否包含外操间？","consult":"《全国安全生产专项整治三年行动计划》第二条主要任务的第二项第2点：“涉及甲乙类火灾危险性的生产装置控制室、交接班室原则上不得布置在装置区内,确需布置的,应按照《石油化工控制室抗爆设计规范》GB 50779-2012,在2020年底前完成抗爆设计、建设和加固。”词条中是否包含外操间？新设计项目的外操间满足GB50160防火间距和GB50984防护距离是否可以布置在装置区内？","reply":"根据《石油化工控制室设计规范》（SH/T3006-2012），整体按抗爆设计规范建设的控制室内，可设置独立外操室等辅助房间。对于抗爆设计的有关要求，涉及甲乙类火灾危险性的生产装置的装置区内布置有外操间的，应满足《石油化工控制室抗爆设计规范》（GB50779-2012）、《石油化工企业设计防火规范》（GB50160-2014）、《石油化工工厂布置设计规范》（GB5098-2014）等有关要求。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-28","replyTime":"2022-03-30","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-47","title":"专项整治三年行动计划中的控制室是否包含机柜间？","consult":"三年行动计划：涉及甲乙类的装置控制室、交接班室原则上不得布置在装置区内。精细化工依据规范：1.《建筑设计防火规范》第3.6.9“甲、乙类厂房的分控制室宜独立设置”。2.《精细化工企业工程设计防火标准》第8.3.1“办公室、休息室、控制室、化验室等”。3.《控制室设计规范》术语中控制室与机柜间分开，条文解释将装置控制室、联合控制室划归为控制室。故三年计划中控制室不含机柜间，可对？","reply":"《危险化学品安全生产专项整治三年行动实施方案》提到的控制室不含机柜间。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-07","replyTime":"2022-03-11","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-48","title":"开展精细化工反应安全风险评估的机构需要什么资质条件，企业能否自行评估？","consult":"尊敬的应急管理部：您好！安监总管三〔2017〕1号文《关于加强精细化工反应安全风险评估工作的指导意见》提到“反应安全风险评估工作专业性强，技术要求高，各有关企业要高度重视，聘请具备相关专业能力的机构组织开展评估。”请问国家对于开展反应安全风险评估的机构组织有什么样具体的要求？如果企业能达到该项要求，是否可以自行开展反应安全风险评估工作？","reply":"根据《关于加强精细化工反应安全风险评估工作的指导意见》（安监总管三〔2017〕1号）和《危险化学品生产建设项目安全风险防控指南（试行）》，精细化工反应安全风险评估机构需要具备中国合格评定国家认可实验室（CNAS认可实验室）资质条件和中国计量认证（CMA认可实验室）资质条件，并具备必要的工艺技术、工程技术、热安全和热动力学技术团队和实验能力，保证相关设备和测试方法及时得到校验和比对，保证测试数据的准确性。企业满足相关要求，且反应安全风险评估对象只是企业内部的工艺及化学品的，可以自行开展反应风险评估工作。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-08-01","replyTime":"2022-08-05","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-49","title":"石油库与库外建筑物的安全距离应从何处起算？","consult":"《石油库设计规范》GB 50074-2014表4.0.10注2规定，有关石油库与库外居住区、公共建筑物、工矿企业、交通线的安全距离，库内设施有防火堤的储罐区应从防火堤中心线算起，根据《公路安全保护条例》第十八条，油库储存甲乙类油品的罐区与公路距离不应小于100m，请问100m是储罐区防火堤中心线至公路用地外缘的距离还是指储罐罐外壁至公路用地外缘的距离？望回复，谢谢。","reply":"您好，涉及《公路安全保护条例》相关内容建议咨询其相关部门。感谢您的留言。","consultTime":"2022-03-10","replyTime":"2022-03-15","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-50","title":"加油站是否需按财企[2012]16号计提安全生产费用？","consult":"根据《企业安全生产费用提取和使用管理办法》财企〔2012〕16号要求，危险品生产与储存企业以上年度实际营业收入为计提依据，采取超额累退方式按照标准平均逐月提取。加油站有汽油、柴油储存设施，但未达到重大危险源，是否需要按照该《办法》计提安全生产费？","reply":"您好，根据《企业安全生产费用提取和使用管理办法》，加油站属于危险品生产与储存企业，应按该办法要求计提安全生产费用。感谢留言。","consultTime":"2022-07-18","replyTime":"2022-07-22","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-51","title":"化工企业的安全总监能不能算在专职安全员的名额里面？","consult":"化工企业的安全总监能不能算在专职安全员的名额里面？化工企业专职安全员要求达到总人数的2%，比如一个210人的企业设置安全总监1人，专职安全员4人，是否符合规定？","reply":"专职安全生产管理人员需正式任命，专门从事本企业安全管理工作，一般不得兼任或兼职其他工作，具体请咨询当地应急管理部门。","consultTime":"2021-12-10","replyTime":"2021-12-20","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-52","title":"危化品企业要求安全管理人员必须化工类等相关专业，何为相关专业？","consult":"我想问一下在危化企业工作，从事电气维护管理工作同时安全管理也做。本人本科学历“电气自动化”专业，电气中级职称。企业还要求我自费学习化工类专业，专科学历。就因为毕业证书没带“化工”两字。我想问一下化工类等及相关专业具体有哪些专业？难道在危化企业下属辅助工段车间安全员必须都要化工类专业？","reply":"已与本人联系，根据个人实际情况，解释了政策要求。","consultTime":"2021-07-05","replyTime":"2021-08-06","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-53","title":"是否有更详细的要求供企业参照执行，具体需要什么资质？","consult":"您好，根据《AQ 3053-2015 立式圆筒形钢制焊接储罐安全技术规程》常压储罐应该进行定期全面检验，但是规程中只是要求有资质的检验人员和检验机构，对于需要什么资质没有详细说明。1.是否有更详细的要求供企业参照执行，具体需要什么资质？2.在没有详细说明的情况下，企业能否自己进行定期检验工作？","reply":"建议咨询标准起草单位。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-04","replyTime":"2022-03-07","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-54","title":"危化品生产企业中的可燃性粉尘车间需要按照《工贸企业粉尘防爆安全规定》执行么？","consult":"危化品生产企业中的可燃性粉尘车间需要按照《工贸企业粉尘防爆安全规定》执行么？","reply":"《工贸企业粉尘防爆安全规定》（应急部令第6号）第二条规定，存在可燃性粉尘爆炸危险的冶金、有色、建材、机械、轻工、纺织、烟草、商贸等工贸企业（以下简称粉尘涉爆企业）的粉尘防爆安全工作及其监督管理，适用本规定。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2021-09-12","replyTime":"2021-09-14","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-55","title":"危化品经营企业加油站是否需要购买安全生产责任保险？","consult":"国家规定高危行业、领域的生产经营单位，法律则要求他们应当投保安全生产责任保险。加油站属于高危行业、领域吗，需要购买安全生产责任保险吗？不购买，会不会被处罚？","reply":"依据《安全生产法》《关于推进安全生产领域改革发展的意见》等有关规定，加油站需要购买安全生产责任险；《安全生产法》第一百零九条规定了相应的法律责任。","consultTime":"2025-03-07","replyTime":"2025-03-12","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-56","title":"危险化学品储存企业如何界定？写字楼、实验室少量存放危化品是否属于危化储存企业？","consult":"《建设项目安全设施“三同时”监督管理办法》第七条第二生产、储存危险化学品包括使用长输管道输送危险化学品，下同的建设项目；我们实验室试剂柜有一些试剂危化品，执法部门要求我们依法进行安全现状评价，经查询相关法律法规，均无明确要求我们这种企业做安全评价，执法部门问我们是不是使用危化品，实验室会使用一些试剂，他们说是使用就会储存，那么请问写字楼办公企业使用酒精消毒是不是危化品储存企业？","reply":"您好，《建设项目安全设施“三同时”监督管理办法》第二条明确“经县级以上人民政府及其有关主管部门依法审批、核准或者备案的生产经营单位新建、改建、扩建工程项目（以下统称建设项目）安全设施的建设及其监督管理，适用本办法”，请结合该条款和第七条进行辨别是否适用。是否需要做现状安全评价，请查阅适用《危险化学品安全管理条例》第三十二条的具体类别。感谢留言。","consultTime":"2022-07-21","replyTime":"2022-07-25","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-57","title":"装卸车和分析取样人员是否属三年行动计划中\"储存设施操作人员\"？爆炸危险性化学品如何界定？","consult":"您好，请问：1.涉及重大危险源和爆炸性化学品的装卸车操作人员和分析取样人员是否属于《危险化学品安全专项整改三年行动计划》中“涉及重大危险源、重点监管化工工艺的生产装置、储存设施操作人员”和“涉及爆炸危险性化学品的生产装置和储存设施的操作人员”中的“储存设施操作人员”范围？2.《危险化学品安全专项整改三年行动计划》中提到的“爆炸危险性化学品”有无明确界定范围？烦请予以明确答复，谢谢！","reply":"“涉及重大危险源和爆炸性化学品的装卸车操作人员和分析取样人员”属于“涉及重大危险源、重点监管化工工艺的生产装置、储存设施操作人员”和“涉及爆炸危险性化学品的生产装置和储存设施的操作人员”中的“储存设施操作人员”范围。爆炸危险性化学品是指《危险化学品目录(2015版)实施指南(试行）》中，《危险化学品分类信息表》里面“危险性类别”为“爆炸物”的危险化学品。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-04-06","replyTime":"2022-04-12","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-58","title":"危险化学品新建项目是否需要按GB30871办理作业票？","consult":"您好！想问一下危险化学品生产单位的新建项目与生产装置有可靠隔离或新建项目周围无危险化学品生产装置是否需要按照GB30871-2022要求办理相关作业票？","reply":"感谢您对危化品安全生产工作的关心关注。根据《中华人民共和国标准化法》《全国专业标准化技术委员会管理办法》等有关法规规定，有关解释工作请咨询标准起草单位中国化学品安全协会（联系电话010-64463992）。","consultTime":"2022-04-12","replyTime":"2022-04-13","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-59","title":"危险化学品无储存企业是否需要投安全生产责任保险？","consult":"危险化学品不带有储存设施经营企业，仅限票据往来方式经营，不储存也不运输，根据《安全生产责任保险管理办法》规定，这类企业是否属于高危行业？是否需要投保安责险？","reply":"您好，《中共中央国务院关于推进安全生产领域改革发展的意见》明确提出在矿山、危险化学品、烟花爆竹、交通运输、建筑施工、民用爆炸物品、金属冶炼、渔业生产等高危行业领域强制实施安全生产责任保险制度，购买安责险具体要求请咨询属地应急管理部门。感谢留言。","consultTime":"2022-06-22","replyTime":"2022-06-26","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-60","title":"不涉及主工艺的小技改和工艺优化，以上是否需要安全审查？","consult":"《危险化学品建设项目安全监督管理办法》第四十三条改建项目定义较笼统，针对危化品生产企业：1.非主要装置；2.危化品生产装置中的非危化品管道、非危化品储存设备设施；3.隐患整改项目；4.不涉及主工艺的小技改和工艺优化；以上是否需要安全审查？目前本地应急管理部门均要求审查的同时，但以上小技改属于企业内部隐患整改并无正式立项批复，又存在无法报备的问题。麻烦相关领导对以上给与解答，恳请回复为盼！","reply":"《安全生产法》第三十一条规定，生产经营单位新建、改建、扩建工程项目（以下统称建设项目）的安全设施，必须与主体工程同时设计、同时施工、同时投入生产和使用。安全设施投资应当纳入建设项目概算。《建设项目安全设施“三同时”监督管理暂行办法》（原国家安全监管总局令第36号）第三条规定，本办法所称的建设项目安全设施，是指生产经营单位在生产经营活动中用于预防生产安全事故的设备、设施、装置、构（建）筑物和其他技术措施的总称。第四条规定，生产经营单位是建设项目安全设施建设的责任主体。建设项目安全设施必须与主体工程同时设计、同时施工、同时投入生产和使用。安全设施投资应当纳入建设项目概算。危险化学品改建项目如符合上述法律法规规定，则执行《危险化学品建设项目安全监督管理办法》（原国家安全监管总局令第45号）有关要求。感谢您对危化品安全监管工作的关心和关注。","consultTime":"2021-09-23","replyTime":"2021-09-28","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-61","title":"白酒生产企业是否需要领取危化品安全生产许可证？","consult":"按照原总局66号令《食品生产企业安全生产监督管理暂行规定》第十七条第二款规定：食品生产企业的中间产品为危险化学品的，应当依照有关规定取得危险化学品安全生产许可证。现在有个问题需要咨询，白酒生产（特别是粮食酿造）企业按照国民经济分类属于轻工行业，纳入工贸行业监管范畴，但中间产品应该是乙醇，是否需要领取危险化学品安全生产许可证？","reply":"感谢您的留言。根据《国家安全监管总局办公厅关于白酒制造企业安全生产监管工作有关问题的复函》（安监总厅管四函[2015]165号），白酒制造企业在轻工行业安全监管范畴。","consultTime":"2021-04-14","replyTime":"2021-04-20","dept":"安全执法和工贸监管局","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-62","title":"建设工程室内装饰装修是否需办理安全设施评价等相关手续？","consult":"《建设项目安全设施“三同时”监督管理办法》规定的危害程度较高的生产项目指非煤矿矿山建设项目；生产、储存危险化学品的建设项目；生产、储存烟花爆竹的建设项目；金属冶炼建设项目；使用危险化学品从事生产并且使用量达到规定数量的化工建设项目以外的其他建设项目需要就其安全生产条件和设施进行综合分析，并形成书面报告备查。请问如果建设项目仅进行室内装饰装修，是否需要办理安全评价？如是未办理是否有什么后果？","reply":"依照《建设项目安全设施“三同时”监督管理办法》第九条要求进行“三同时”管理。","consultTime":"2022-07-20","replyTime":"2022-07-25","dept":"安全生产综合协调司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-63","title":"危化品生产企业新增分离塔是否需进行安全预评价？","consult":"您好，危化品生产企业需要新增并丁烷分离塔和石脑油分离塔两座。1.根据《建设项目安全设施“三同时”监督管理办法》第七条第五款，请问依据此条款是否需要进行安全预评价？2.根据《建设项目安全设施“三同时”监督管理办法》第十六条，请问安全设施设计是否可以由本单位组织审查？","reply":"根据《危险化学品建设项目安全监督管理办法》，新建、改建、扩建危险化学品生产的建设项目应开展安全评价和安全设施设计，安全设施设计审查应按国家有关规定报经有关部门审查。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-18","replyTime":"2022-02-23","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-64","title":"不对外销售是否需要取危险化学品安全生产许可证？","consult":"请问:1.化工企业设置制氮装置，企业内部使用，作置换、保护气体，不对外销售，是否需要取危险化学品安全生产许可证？2.企业设置精留装置，对乙醇进行回收套用，是否需要取得危险化学品安全生产可证？","reply":"感谢您的留言。按照《危险化学品安全管理条例》（中华人民共和国国务院令第591号）第十四条，危险化学品生产企业进行生产前，应当依照《安全生产许可证条例》的规定，取得危险化学品安全生产许可证。如您的企业属于上述情况，需要取得危险化学品安全生产许可证，具体请按照《危险化学品生产企业安全生产许可证实施办法》（国家安全生产监督管理总局令第41号）和地方有关规定办理。","consultTime":"2021-08-03","replyTime":"2021-08-08","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-65","title":"业重大事故隐患判定标准中企业应配备的注册安全工程师可否是化工安全专业？","consult":"众所周知其他安全专业《安全生产专业实务》大纲及考试内容为公共科目所学内容，并未真正有新的专业内容增加。民用爆炸物品行业重大事故隐患判定标准中企业应配备的注册安全工程师可否是化工安全专业？","reply":"已电话沟通解答。您好！感谢您对注册安全工程师工作的关注！《民用爆炸物品行业重大事故隐患判定标准(试行)》（工信厅安全函〔2023〕337 号）由工业和信息化部办公厅公布，根据《安全生产法》第十条第二款，国务院交通运输、住房和城乡建设、水利、民航等有关部门依照本法和其他有关法律、行政法规的规定，在各自的职责范围内对有关行业、领域的安全生产工作实施监督管理。有关民用爆炸物品行业重大事故隐患判定标准与行业内生产经营单位配备注册安全工程师相关政策，建议咨询工业和信息化部。","consultTime":"2024-02-28","replyTime":"2024-03-06","dept":"人事司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-66","title":"预案导则附件9.7中\"重要防护目标\"是指厂内还是厂外？","consult":"生产经营单位生产安全事故应急预案编制导则GBT29639-2020中附件9.7关键的路线、标识和图纸中b重要防护目标、风险清单及分布图，是指企业内部危险的装置和区域还是指GB36894-2018《危险化学品生产装置和储存设施风险基准》中所说的企业外部的防护目标？","reply":"已电话沟通解答。《生产经营单位生产安全事故应急预案编制导则》（GB/T29639-2020）9.7中提到的“重要防护目标”包括但不限于《危险化学品生产装置和储存设施风险基准》（GB36894-2018）中所列的防护目标，还包括可能发生事故而影响生产经营单位安全生产的目标物，具体依据风险评估结果确定。","consultTime":"2024-10-11","replyTime":"2024-10-14","dept":"国家安全生产应急救援中心","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-67","title":"甲乙类火灾危险性的生产装置控制室可否具有办公室、休息室、外操室、巡检室功能？","consult":"《危险化学品安全专项整治三年行动实施方案》中“涉及甲乙类火灾危险性的生产装置控制室、交接班室原则上不得布置在装置区内,确需布置的,应按照《石油化工控制室抗爆设计规范》GB50779-2012,在2020年底前完成抗爆设计、建设和加固”，现按GB50779-2012设计生产装置控制室，该生产装置露天设置，非厂房内装置，问可否在控制室内设置办公室、休息室、外操室、巡检室？","reply":"根据《石油化工控制室设计规范》（SH/T3006-2012），整体按抗爆设计规范建设的控制室内，可设置独立的办公室、休息室、外操室、巡检室等辅助房间。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-04","replyTime":"2022-03-09","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-68","title":"空分装置中控室是否需要搬迁至办公楼？","consult":"领导好！根据国务院安委会《全国安全生产专项整治三年行动计划》附件三《危险化学品安全专项整治三年实施方案》“涉及甲乙类火灾危险性的生产装置控制室、交接班室原则上不得布置在装置区内，确需布置的，应按照《石油化工控制室搞爆设计规范》GB50779-2012，在2020年底前完成搞爆设计、建设和加固”，空分装置中氧属于助燃气体，装置只涉及物理爆炸，请问已建空分装置的控制室，是否需要按照上列要求搬迁？","reply":"按照《建筑设计防火规范（2018年版）》（GB50016-2014），氧气的火灾危害性分类为乙类，故空分装置的控制室应按照《危险化学品安全专项整治三年行动方案》的要求，原则上不得布置在装置区内，确需布置的，应按照《石油化工控制室防爆设计规范》（GB50779-2012）的要求，进行防爆设计、建设和加固。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-25","replyTime":"2022-03-29","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-69","title":"精细化工改建项目控制室是否需按重大隐患判定标准甄别？","consult":"请问：精细化工企业改建项目的控制室是否需要按照《化工和危险化学品生产经营单位重大生产安全事故隐患判定标准试行》第十三进行甄别？","reply":"精细化工企业改建项目的控制室需要按照《化工和危险化学品生产经营单位重大生产安全事故隐患判定标准（试行）》第十三进行甄别，即“控制室或机柜间面向具有火灾、爆炸危险性装置一侧不满足国家标准关于防火防爆的要求”的应判定为重大事故隐患。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-04-14","replyTime":"2022-04-19","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-70","title":"精细化工企业控制室是否不得与甲类厂房同一建筑物？","consult":"一精细化工企业在2020年前建设，按规范标准及企业需要，将配电室或控制室与甲类车间设置在同一建筑物，投入试生产，但尚未取得使用企业证书。2020年应急部出台《安全分类整治目录》，指出装置的控制室、机柜间、变配电所、化验室、办公室等不得与设有甲、乙A类设备的房间布置在同一建筑物内。现企业拟申请许可证书，专家认为石油化工企业才需要执行，请问已建设的精细化工企业是否要执行该标准？是否为许可否决项？","reply":"《危险化学品企业安全分类整治目录（2020年）》适用于危险化学品企业，已建设的精细化工企业需要执行。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-11","replyTime":"2022-03-15","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-71","title":"精细化工企业是否必须进行精细化工反应风险评估？","consult":"根据危险化学品三年整治要求，精细化工企业需进行精细化工反应风险评估。而根据《国家安全监管总局关于加强精细化工反应安全风险评估工作的指导意见》安监总管三〔2017〕1号中满足第二部分要求的企业才需要做精细化工反应风险评估，请问具体应按哪个文件执行？","reply":"根据《危险化学品安全专项整治三年行动实施方案》，涉及硝化、氯化、氟化、重氮化、过氧化工艺的精细化工生产装置必须于2021年底前完成有关产品生产工艺全流程的反应安全风险评估。同时，按照《关于加强精细化工反应安全风险评估工作的指导意见》（安监总局三〔2017〕1号），有以下情形之一的要开展反应安全风险评估：1.国内首次使用的新工艺、新配方投入工业化生产的以及国外首次引进的新工艺且未进行过反应安全风险评估的；2.现有的工艺路线、工艺参数或装置能力发生变更，且没有反应安全风险评估报告的；3.因反应工艺问题，发生过安全生产事故的。符合这两个文件规定范围内任一情况的企业，均应按要求开展精细化工反应风险评估。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-01-06","replyTime":"2022-01-11","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-72","title":"出具精细化工反应风险评估报告需要哪些资质？","consult":"精细化工安全生产管理过程中，对于出具或者提交的反应风险评估报告单位要具备相关资质，分别是有哪些资质？","reply":"《国家安全监管总局关于加强精细化工反应安全风险评估工作的指导意见》（安监总管三〔2017〕1号）中，要求企业“聘请具备相关专业能力的机构组织开展评估”，反应安全风险评估单位需要具备必要的工艺技术、工程技术、热安全和热动力学技术团队和实验能力，具备中国合格评定国家认可实验室（CNAS认可实验室）资质。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-01-26","replyTime":"2022-01-28","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-73","title":"装置区如何界定？","consult":"《全国安全生产专项整治三年行动计划》第二条主要任务的第二项第2点：“涉及甲乙类火灾危险性的生产装置控制室、交接班室原则上不得布置在装置区内,确需布置的,应按照《石油化工控制室抗爆设计规范》GB50779-2012,在2020年底前完成抗爆设计、建设和加固。”当控制室等与装置距离，大于《石油化工企业设计防火规范》GB50160第四章所要求的距离时，是否认定该控制室处于装置区外？","reply":"装置区是指成组布置的装置及装置之间的连片区域，一般通过道路、界墙等与其他区域隔离。在装置区外的控制室，还应满足《石油化工企业设计防火标准》（GB50160-2008）等标准关于防火间距的要求。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-04-29","replyTime":"2022-04-30","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-74","title":"装置区的具体范围如何界定？","consult":"涉及爆炸危险性化学品的生产装置控制室、交接班室不得布置在装置区内；涉及甲乙类火灾危险性的生产装置控制室、交接班室不宜布置在装置区内。能不能明确一下这个所谓的装置区的具体范围，是指生产装置内？还是生产装置所在的位置？","reply":"按照《危险化学品安全专项整治三年行动实施方案》要求，涉及《危险化学品目录（2015版）实施指南（试行）》中，《危险化学品分类信息表》里面“危险性类别”为“爆炸物，1.1项”的危险化学品生产装置控制室、交接班室，不得布置在装置区内，已建成投用的必须于2020年底前完成整改。“装置区内”指不得布置在装置界区、生产储存设备设施界区、生产厂房以内。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2021-09-10","replyTime":"2021-09-11","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-75","title":"有切断阀的上下游装置可否分别划分为独立生产单元？","consult":"领导好，根据《危险化学品重大危险源辨识》GB18218-2018 生产单元：危险化学品的生产、加工及使用的装置及设施，当装置及设施之间有切断阀时，以切断阀作为分隔界限划分为独立的单元。请问：1.联合生产装置的上下游装置之间设有切断阀时，是否可以将上游装置、下游装置分别划分为一个生产单元？2.同一装置规模较大，如合成氨装置不同工段间设置了切断阀，是否可以分别划分为一个生产单元？","reply":"感谢您对危险化学品安全生产工作的关心关注，根据《中华人民共和国标准化法》《全国专业标准化技术委员会管理办法》等有关法规规定，有关解释工作请咨询标准起草单位中国安科院，联系电话为010-84911220。","consultTime":"2022-04-18","replyTime":"2022-04-20","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-76","title":"冶金企业不涉及金属冶炼工艺的建设项目（如搭建原料棚顶），是否仍需按金属冶炼项目做三同时？","consult":"冶金企业是否要按照企业的性质将所有本企业的新、改、扩建项目当作金属冶炼建设项目进行管理，并开展“三同时”工作安全预评价、安全设施设计、安全验收评价呢？包含那些完全不涉及金属冶炼、压延工艺的建设项目，如：针对露天的废钢原料储区搭建顶棚就是将原料从露天储存变成室内储存；针对加热炉的尾气处理增设尾气治理设施等等。","reply":"感谢您的留言。冶金企业不是所有新、改、扩建项目均按照金属冶炼建设项目进行管理，金属冶炼项目按照《金属冶炼目录（2015版）》执行。其他不涉及金属冶炼的新、改、扩建项目对照《建设项目安全设施“三同时”监督管理办法》（国家安全生产监督管理总局令第36号）相关规定执行。","consultTime":"2021-11-04","replyTime":"2021-11-11","dept":"安全执法和工贸监管局","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-77","title":"加油站防渗漏检测井积水是否违反安全规范？AQ3010-2007的“人孔阴井”是否包含此类检测井？","consult":"您好！加油站检查中发现该站有一防渗漏检测井该井设在加油站的出油管线上，位于加油站站房的北侧卸油口附近路面地下，主要用于检测双层复合管线油品的渗漏情况。井内设有双层复合管线、防渗漏检测设施及与之配套的电气线路存在积水现象，按照《加油站作业安全规范》AQ3010-2007第8.1.8条“人孔阴井内部不得积水或锈蚀......”，请请教这里的“人孔阴井”仅指罐区操作井？还是包括这一防渗漏检测井？","reply":"您好，现行《加油站作业安全规范》第8.1.8条所述“人孔阴井”系地下储油罐人孔井，该条规定主要是避免积水渗入油罐与油品混合。对所述防渗漏检测井积水问题，应主要分析积水对管线、测漏设施及电气线路正常运行的影响。感谢留言。","consultTime":"2022-08-10","replyTime":"2022-08-14","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-78","title":"《油气储存企业紧急切断系统基本要求试行》中提到储罐是否包括柴油储罐？","consult":"您好，领导，请问《油气储存企业紧急切断系统基本要求试行》中提到储罐是否包括柴油储罐？柴油储罐是否需要设置紧急切断阀？谢谢！","reply":"您好，《油气储存企业紧急切断系统基本要求》（试行）适用于油气储存企业在役大型地上常压储罐（公称直径大于或等于30米或公称容积大于或等于10000立方米的储罐，不含低温储罐）紧急切断阀的改造，包括柴油储罐。感谢留言！","consultTime":"2022-05-29","replyTime":"2022-05-31","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-79","title":"GB50156-2021中\"一二级耐火等级民用建筑\"的范围是否包含重要公共建筑？","consult":"《汽车加油加气加氢站技术标准》GB50156-2021的“表4.0.4”注解4描述：“一、二级耐火等级民用建筑物面向加油站一侧的墙为无门窗洞口的实体墙时，油罐、加油机和通气管管口与该民用建筑物的距离，不应低于本表规定的安全间距的70，且不应小于6m。” 此描述中的“一、二级耐火等级民用建筑物”是否包含耐火等级为一、二级的重要公共建筑物？","reply":"您好，根据《汽车加油加气加氢站技术标准》附录B，民用建筑物包括重要公共建筑物，感谢留言。","consultTime":"2022-09-23","replyTime":"2022-09-26","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-80","title":"关于《危险化学品重大危险源辨识GB18218-2018》适用范围的界定？","consult":"上海天然气有限公司天然气处理厂，为平湖油气田安全生产许可证许可的设施，属于陆上设施，该处理厂储存的液化气，从储量来看，达到重大危险源标准。属地监管人员碰到疑惑：1.《危险化学品重大危险源辨识》不适用“海上石油天然气开采活动”，需要明确该企业陆上生产经营行为是否属于“海上石油天然气开采活动”？是否需要进行强制辨识？2.该企业生产经营活动是否应按照《危险化学重大危险源监督管理暂行规定》纳入监管？","reply":"海洋石油陆岸终端属于海洋石油生产设施，不适用《危险化学品重大危险源监督管理暂行规定》。","consultTime":"2023-06-20","replyTime":"2023-07-07","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-81","title":"关于加油站作业安全规范AQ3010-2007是否有效？","consult":"我是基层安全生产执法人员，在对加油站检查中发现由顾客自己持加油枪往大的塑料桶内加柴油，我们在网上搜到的加油站作业安全规范AQ 3010-2007版本，6.1.3加油员不应向绝缘性容器加注汽油、柴油及煤油等，6.2.3加油作业应由加油员操作，不得由顾客自行处置。加油站违反了该标准的两项，现在加油站对该标准有异议，提出顾客可以自助加柴油，基层执法人员没有对柴油和塑料桶的鉴别能力，请问可以依据该标准吗？","reply":"您好，《加油站作业安全规范》（AQ3010-2007）现行有效，修订后的标准正按程序报批。感谢您的留言。","consultTime":"2022-03-22","replyTime":"2022-03-24","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-82","title":"加油站阻隔防爆技术改造后安全距离如何核定？","consult":"尊敬的领导：应急管理部《关于宣布失效一批安全生产文件的通知》应急〔2018〕32号 中已宣布《国家安全监管总局办公厅关于加油站采用阻隔防爆技术改造安全距离核定有关问题的复函》安监总厅管三函〔2013〕181号失效，我的问题是现有加油站汽、柴油罐再遇到类似外部安全距离不符合要求的，是否仍然可以加装阻隔防爆装置？急盼回复为感！","reply":"您好，《AQ/T 3001-2021加油（气）站油（气）储存罐体阻隔防爆技术要求》《AQ/T 3002-2021阻隔防爆橇装式加油（气）装置技术要求》2项推荐性行业标准由应急管理部2021年第3号公告发布，自2021年8月1日起施行。国家鼓励采用推荐性标准。感谢您的留言。","consultTime":"2022-02-25","replyTime":"2022-02-28","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-83","title":"危化品经营许可证及场地可否出租经营？事故责任能否私下约定划分？","consult":"我是一个民营企业加油加气站1.公司把土地，危化品企业公司出租给个人，个人在地上投资盖建加油站，个人以公司名义经营加油站。危化品许可证也出租给私人。2.公司没有聘请他，是租赁。出了安全事故由私人承担可以吗？公司不承担责任，由他个人承担！这种可以出租吗？","reply":"您好，依据《安全生产法》《危险化学品经营许可证管理办法》有关规定，生产经营单位不得将生产经营项目、场所、设备发包或者出租给不具备安全生产条件或者相应资质的单位或者个人；任何单位和个人不得伪造、变造经营许可证，或者出租、出借、转让其取得的经营许可证，或者使用伪造、变造的经营许可证。感谢留言。","consultTime":"2022-04-08","replyTime":"2022-04-12","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-84","title":"安监总管三[2013]76号文第十五条如何理解？","consult":"一个天然气凝液回收小型项目，该项目国民经济行业分类属于陆地石油开采-伴生天然气的综合利用，因此按照《天然气凝液回收设计规范》SYT0077-2019、《石油天然气工程防火设计规范》GB50183-2004等设计，其液化石油气、天然气凝液储存总容量为1000m³，属四级站场，储存量构成四级重大危险源，对于该项目设计阶段内外部防火间距的确定，是否需要按照安监总管三76号文所属8个规范最严格的来确定？","reply":"应根据建设项目工艺特点和标准规范的适用范围确定本项目采用的标准规范。","consultTime":"2023-03-10","replyTime":"2023-04-20","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-85","title":"加油站爆炸危险区域内放置矿泉水、车用尿素（戊类包装），是否违反AQ3010-2022可燃物禁令？","consult":"尊敬的领导：您好！我是一名加油站安全管理人员。在日常工作中，我站为方便客户，在加油机爆炸危险区域内非核心防爆区摆放了整箱矿泉水、车用尾气处理液等便民商品。近期，有举报及属地应急管理部门质询认为，此举可能违反《加油站作业安全规范》AQ3010-2022第6.1.1条中“加油机爆炸危险区域内不应放置可燃性物品”的规定。经我站初步分析：1.矿泉水和车用尾气处理液本体为不燃物品建筑设计防火规范中戊类；2.其包装纸箱、塑料桶虽可燃，但根据《建筑设计防火规范2018年版》GB50016-2014第3.1.5条，当可燃包装重量不超过物品本身重量14、可燃包装体积不超过物品本身体积12时，整体火灾危险性仍按戊类不燃物品确定。经核算，上述商品符合该条件。因此，我们认为其不应属于AQ3010-2022所禁止的“可燃性物品”。鉴于各地执法理解不一，特恳请贵部明确：1.AQ3010-2022第6.1.1条中的“可燃性物品”，是否应理解为本体为丙类及以上可燃物品，或虽本体为丁戊类但因包装导致整体火灾危险性升级为丙类的物品？2.本体为戊类不燃、且可燃包装未导致整体火灾危险性升级的矿泉水、车用尾气处理液等商品，是否可以在加油机爆炸危险区域内的指定位置有序摆放？恳请指导，谢谢！","reply":"1.可燃性物品是指火灾危险性为甲类、乙类和丙类物品。具体物品可依据《建筑设计防火规范》（GB50016-2014）第3.1.3条、第3.1.5条规定进行判定。加油站常见的可燃性物品为可燃性燃油添加剂、机油、食用油、纸巾类等商品。不包括垃圾桶、标识标牌、广告牌、交通锥、工作用清洁布和台账资料等物品。对于丁、戊类物品，当可燃包装重量大于物品本身重量1/4或可燃包装体积大于物品本身体积的1/2时，应按丙类确定。2.丁戊类物品无相关限制。","consultTime":"2026-04-17","replyTime":"2026-04-22","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-86","title":"应急预案可以不邀请相关救援队伍以及周边相关企业、单位或社区代表参加编制组吗？","consult":"根据29639-2020中，4.2章节成立应急预案编制工作组的要求：预案编制工作组中应邀请相关救援队伍以及周边相关企业、单位或社区代表参加。但在实际操作中没有可操作性，消防队和社区并不配合也没有义务参加本单位加油站应急预案。可以不邀请相关救援队伍以及周边相关企业、单位或社区代表参加编制组吗？","reply":"《生产经营单位生产安全事故应急预案编制导则》（GB/T29639-2020）为生产经营单位应急预案编制提供依据和指南，为国家推荐性标准。你单位编制预案应以取得实效、提高预案质量为出发点。关于预案编制组成员，请根据企业实际，参照地方有关规定执行。","consultTime":"2023-08-29","replyTime":"2023-09-01","dept":"国家安全生产应急救援中心","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-87","title":"加油站主要负责人与法定代表人或投资人或执行事务合伙人是否必须为同一人？","consult":"加油站主要负责人与法定代表人或投资人或执行事务合伙人是否必须为同一人？危险化学品经营许可证打的是法定代表人，有的加油站企业形式为个人独资企业或合伙制企业，而主要负责人又另有他人。","reply":"您好，根据《关于推进安全生产领域改革发展的意见》的规定，生产经营单位的法定代表人和实际控制人同为安全生产的第一责任人。感谢留言。","consultTime":"2022-05-07","replyTime":"2022-05-10","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-88","title":"加油站油罐和卸车点与站外建筑物的安全距离应如何计算，是3米、5米还是6米？","consult":"根据加油站规范4.0.4条，加油站卸车点及油罐车与周边不需要安全距离。但根据规范2.1.6 卸车设施属于加油加气作业区，该区域的边界线为设备爆炸危险区域边界线加3m”。因油罐车爆炸区域为3米，油罐车与站外建筑物的安全距离应为爆炸危险区域3米加上3米的爆炸危险区域边界线，共应6米。同时规范指出卸车点与站房的安全距离为5米。故我们认为安全距离也至少要5米。请问油罐和卸车点与站外建筑物的安全距离？","reply":"您好，请咨询标准起草单位。感谢您的留言。","consultTime":"2022-01-18","replyTime":"2022-01-21","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-89","title":"加油站属于油气储存企业吗？","consult":"请问油气储存企业的范围有哪些？加油站是否属于油气储存企业？","reply":"按照《油气储存企业安全风险评估指南（试行）》，油气储存企业包括石油库（含化学品罐区）、石油储备库、液化烃储存、LNG储存等类型企业，加油站不属于该范围。","consultTime":"2023-04-04","replyTime":"2023-04-09","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-90","title":"加油站应急预案论证是否需要外部专家签字方可备案？","consult":"加油站应急预案论证是否需要外部专家签字方可备案？谢谢。","reply":"已电话沟通解答。您好！根据应急管理部第2号令修正的《生产安全事故应急预案管理办法》未明确规定参加预案论证人员的资格条件等内容。请结合本单位实际执行。","consultTime":"2024-05-22","replyTime":"2024-05-29","dept":"国家安全生产应急救援中心","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-91","title":"加油站内的加油机、灭火器、消防沙箱、应急照明灯等是“安全设备”吗？","consult":"《安全生产法》第36条规定，“安全设备的设计、制造、安装、使用...应当符合国家标准或者行业标准”“生产经营单位必须对安全设备进行经常性维护、保养...”，我局执法人员在实际工作中，针对加油站哪些属于“安全设备”说法不一。请问：1.加油站内的加油机、灭火器、消防沙箱、应急照明灯等是“安全设备”吗？2.加油站内安全设备有哪些？","reply":"您好，安全设备主要是指为了保护从业人员等生产经营活动参与者的安全，防止生产安全事故发生以及在发生生产安全事故时用于救援而安装适用的机械设备和器械。加油站安全设备可参阅《汽车加油加气加氢站技术标准》等标准规范，例如加油机上的安全拉断阀、剪切阀等。感谢留言。","consultTime":"2022-04-13","replyTime":"2022-04-16","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-92","title":"加油站油罐操作井是否属于受限空间？","consult":"尊敬的各位领导，我想咨询汽车加油站油罐区油罐操作井是否为受限空间有限空间，对操作井的日常维护工作卫生清理、刷漆防腐是否应按照受限空间特殊作业进行管理？另望明确判别的标准规范文件，谢谢您。","reply":"您好，《危险化学品企业特殊作业安全规范》（GB 30871-2022）已经发布，将于2022年10月1日起正式实施。感谢您的留言。","consultTime":"2022-03-31","replyTime":"2022-04-01","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-93","title":"加油站的较大危险因素的场所和设施、设备如何确定？","consult":"《安全生产法》规定要在有较大危险因素的生产经营场所和有关设施、设备上设置明显的安全警示标志。加油站企业的哪些场所和设施、设备属于有较大危险因素？","reply":"您好，请查阅《汽车加油加气站设计与施工规范》（GB 50156-2021）第6.6.2条和14.2.3条，《加油站作业安全规范》（AQ3010-2007)第9条关于安全警示和安全标志有关要求。感谢您的留言。","consultTime":"2022-03-11","replyTime":"2022-03-14","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-94","title":"加油岛附近非加油区域摆放杂物是否构成隐患？","consult":"加油站加油岛附近防撞栏与加油岛之间，非加油岛上是否能摆放杂物？摆放后是否构成隐患问题？","reply":"您好，请查阅《加油站作业安全规范》等相关标准，或咨询起草单位，感谢留言。","consultTime":"2022-04-11","replyTime":"2022-04-14","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-95","title":"GB50156-2021实施后，油罐间距检查是否仍可沿用2006版？","consult":"老加油站，油罐与周边间距不足，原来按照GB50156-2006 第4.0.4A 条规定采用了阻隔防爆罐，间距视为合格，之后一直没有改造。现在GB50156-2021出台了，油罐的周边间距检查还能认可GB50156-2006第4.0.4A 条规定吗，还是必须按照新标准检查？","reply":"您好，请咨询标准起草单位。感谢您的留言。","consultTime":"2022-02-28","replyTime":"2022-03-02","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-96","title":"\"大型油气储存基地\"如何界定？","consult":"请对“大型油气储存基地”的定义或界定范围给予答复，目前相关标准中没有查到相关术语，谢谢！","reply":"您好，根据《关于开展大型油气储存基地安全风险评估工作的通知》，大型油气储存基地包括：单罐罐容不小于10万立方米、总库容不小于100万立方米的原油库，单罐罐容不小于5千立方米、总库容不小于5万立方米的成品油库，单罐罐容不小于1万立方米、总库容不小于10万立方米的液化天然气接收站，单罐罐容不小于1千立方米、总库容不小于1万立方米的液化石油气储存企业。感谢留言。","consultTime":"2022-06-08","replyTime":"2022-06-11","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-97","title":"天然气长输管道安全设施设计应执行哪个导则？","consult":"请问天然气长输管道安全设施设计执行《陆上油气管道建设项目安全设施设计导则》AQT3055-2019还是《化工建设项目安全设计管理导则》AQT3033-2022？天然气长输管道项目是否必须开展HAZOP分析？","reply":"天然气长输管道安全设施设计执行《陆上油气管道建设项目安全设施设计导则》（AQ/T 3055-2019）。对天然气长输管道项目开展HAZOP分析无相关规定。","consultTime":"2023-05-24","replyTime":"2023-07-07","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-98","title":"加油站是否所有专项预案每年、所有现场处置方案每半年都要演练？","consult":"《生产安全事故应急预案管理办法》应急管理部令第2号第二十六条　生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故预防重点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。请问，加油站是否对制定的所有专项预案每年都要演练一次？所有的现场处置方案每半年都要演练一次？","reply":"《生产安全事故应急预案管理办法》（应急管理部令第2号）对预案演练有着明确规定，请按照规定内容，并结合地方相关规定执行。","consultTime":"2023-02-22","replyTime":"2023-02-27","dept":"国家安全生产应急救援中心","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-99","title":"加油站一名员工离职，新招一名新员工入职，该站应急预案是否需要重新备案？","consult":"我公司是央企单位，所属一座加油站为委托站管理形式，站内人员3人，公司应急预案按规定已做备案，加油站应急预案也在属地应急局做备案。问：加油站一名员工离职，新招一名新员工入职，该站应急预案是否需要重新备案？","reply":"《生产安全事故应急预案管理办法》（应急管理部令第2号）第三十七条明确说明了应急预案修订涉及组织指挥体系与职责、应急处置程序、主要处置措施、应急响应分级等内容变更的，修订工作应当参照本办法规定的应急预案编制程序进行，并按照有关应急预案报备程序重新备案。请结合你公司实际，参考该条款内容考虑是否需要重新修订预案并备案。","consultTime":"2023-05-27","replyTime":"2023-05-30","dept":"国家安全生产应急救援中心","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-100","title":"罐内隔仓条款中\"城市建成区\"以哪个部门划定为准？","consult":"请教一下，《橇装式加油装置的汽车加油站技术规范》SHT 3134-2002，4.3设在城市建成区内的橇装式加油装置地面防火油罐的总容积以及单罐最大容积应小于或等于20m3。当地面防火油罐单罐容积大于10m'时，罐内应设隔仓，隔仓的容积应小于或等于10m3，这一条指的的“城市建成区”是以哪个部门划定的为准？有没有具体的出处？","reply":"您好，请咨询标准起草单位。感谢留言。","consultTime":"2022-05-05","replyTime":"2022-05-08","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-101","title":"汽车加气站技术改造是否需要重新履行“三同时”手续？","consult":"领导您好：我公司旗下汽车加气站现需将LNG液化天然气储罐增压加气模式改造为CNG管束车供气模式，请问此类工艺技术改造是否需要重新履行“三同时”手续？望贵司予以解答，谢谢！","reply":"您好，根据《危险化学品建设项目安全监督管理办法》，新建、改建、扩建危险化学品生产的建设项目应开展安全评价和安全设施设计。感谢留言。","consultTime":"2022-02-16","replyTime":"2022-02-20","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-102","title":"泄压罐是否需要进行重大危险源辨识？","consult":"成品油长输管道中为了防止管道、设备超压，设置了水击保护系统，其中设置了泄压罐，罐容200立方米，平常为空罐，输油管道泄压过程暂存于泄压罐内的油品，也将通过回注流程注入输油管道系统。请问该类型泄压罐是否需要进行重大危险源辨识？GB18218适用范围不包含危险化学品的厂外运输？","reply":"成品油长输管道设置的泄压罐需要开展重大危险源辨识，辨识标准采用《危险化学品重大危险源辨识》（GB 18218-2018）。","consultTime":"2022-04-11","replyTime":"2022-05-18","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-103","title":"综合应急预案和特种设备专项应急预案的关系？","consult":"我公司为加气站，业务单一规模较小。根据GBT 29639-2020生产经营单位生产安全事故应急预案编制导则5.3内容“专项应急预案与综合应急预案中的应急组织机构、应急响应程序相近时,可不编写专项应急预案，相应的应急处置措施并入综合应急预案”。我公司按照上述要求执行，是否可以只编制综合应急预案，不用单独编制特种设备专项应急预案？","reply":"您好！《生产经营单位生产安全事故应急预案编制导则》（GB/T 29639-2020）规定了生产经营单位应急预案体系构成和综合应急预案、专项应急预案、现场处置方案的主要内容等，在“5应急预案体系”的“5.1概述”部分规定:“生产经营单位应根据有关法律、法规和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，科学合理确立本单位的应急预案体系”。你单位确立应急预案体系，应全面落实有关法律、法规和相关标准的要求。《特种设备安全监察条例》（国务院令第549号）第六十五条规定：“特种设备安全监督管理部门应当制定特种设备应急预案。特种设备使用单位应当制定事故应急专项预案，并定期进行事故应急演练”。根据该法规规定，你单位若使用相关特种设备，应当编制特种设备专项应急预案。","consultTime":"2024-02-16","replyTime":"2024-02-20","dept":"国家安全生产应急救援中心","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-104","title":"编制加油站应急预案的安全咨询公司是否需要相应资质？","consult":"您好，我是加油站员工，公司想邀请第三方安全咨询公司替我们编制生产安全事故应急救援预案，但因为加油站涉及危险化学品重大危险源，安全风险较高，想咨询一下，对编制加油站应急预案的第三方安全咨询公司和编制人员是否有特别的资格或资质要求？谢谢！","reply":"您好！目前并未有专门法规标准规定对第三方安全咨询公司编制生产安全事故应急预案或者对其资质进行要求。根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第九条规定，编制应急预案应当成立编制工作小组，由本单位有关负责人任组长，吸收与应急预案有关的职能部门和单位的人员，以及有现场处置经验的人员参加。你单位应结合地方相关规定和单位实际落实。","consultTime":"2024-01-22","replyTime":"2024-01-25","dept":"国家安全生产应急救援中心","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-105","title":"加油站出租给个人经营，出事故公司可否免责？","consult":"你好，我是一个民营企业加油加气站,提出以下问题：1.公司把土地；公司出租给个人，个人投资建盖加油加气站，个人以我公司名义经营加油加气站，危化品许可证也出租给个人。2.公司没有聘请他，是合同租赁，请问出了安全事故公司不承担责任，由他个人承担可以吗？","reply":"您好，依据《安全生产法》《危险化学品经营许可证管理办法》有关规定，生产经营单位不得将生产经营项目、场所、设备发包或者出租给不具备安全生产条件或者相应资质的单位或者个人；任何单位和个人不得伪造、变造经营许可证，或者出租、出借、转让其取得的经营许可证，或者使用伪造、变造的经营许可证。感谢您的留言。","consultTime":"2022-03-22","replyTime":"2022-03-26","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-106","title":"2017版工贸行业重大隐患判定标准是否现行有效？","consult":"2017年工贸行业重大隐患判定标准里，机械行业涉及到喷涂车间、调漆间未规范设置通风装置和防爆电气设备设施。针对这条内容，是否可以应用到其他行业？例如木制品加工、企业汽车维修等，因为都涉及到喷漆调漆。","reply":"感谢您的留言。机械行业类重大事故隐患标准不适用于轻工类等其它行业。轻工行业喷涂等重大隐患判定依据轻工类判定标准第六条 “6.喷涂车间、调漆间未规范设置通风装置和防爆电气设备设施。”","consultTime":"2021-08-18","replyTime":"2021-08-25","dept":"安全执法和工贸监管局","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-107","title":"粉尘防爆安全规定第十三条是否适用于工贸企业所有车间？","consult":"《工贸企业粉尘防爆安全规定》第十三条：粉尘涉爆企业新建、改建、扩建涉及粉尘爆炸危险的工程项目安全设施的设计、施工应当按照《粉尘防爆安全规程》等有关国家标准或者行业标准，在安全设施设计文件、施工方案中明确粉尘防爆的相关内容。请问设计单位应具备相关资质吗？若需要资质，应具备哪些资质？请应急部领导解答，万分感谢！","reply":"感谢您的留言。《工贸企业粉尘防爆安全规定》第13条没有对设计单位的资质提出要求。设计单位的资质应满足对应工程项目行业对资质的要求。","consultTime":"2021-10-21","replyTime":"2021-10-28","dept":"安全执法和工贸监管局","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-108","title":"喷胶（聚氨酯类胶）作业场所是否属于工贸行业重大隐患判定中的\"喷涂车间\"？","consult":"五轻工行业。6.喷涂车间、调漆间未规范设置通风装置和防爆电气设备设施。请问对于喷胶聚氨酯类胶作业的场所，是否属于上述第6款中的“喷涂车间”？","reply":"感谢您的留言。请你单位对喷胶车间进行风险辨识，如喷胶车间属于易燃易爆场所，应按照《爆炸危险环境电力装置设计规范》（ GB50058）等要求进行规范管理。","consultTime":"2021-09-30","replyTime":"2021-10-08","dept":"安全执法和工贸监管局","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-109","title":"GB50493与计量器具新规冲突，可燃有毒气体报警器型式批准要求如何协调？","consult":"依据50493-2019 3.0.5可燃气体探测器必须取得国家指定机构或其授权检验单位的计量器具型式批准证书、国家法规有要求的有毒气体探测器必须取得国家指定机构或其授权检验单位的计量器具型式批准证书。2020年10月，市场监管总布了《关于调整实施强制管理的计量器具目录》2020年第42号，对不再目录类的气体报警探测器不再进行型式批准。两个规范文件冲突之处如何协调？","reply":"感谢您的留言，有关标准、规范文件内容释义问题请咨询该标准、规范文件的编制单位。","consultTime":"2021-08-09","replyTime":"2021-08-13","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-110","title":"工地食堂使用燃气做饭，是否需要安装可燃气体报警装置？","consult":"我们这里是一个建筑工地，然后工地食堂使用燃气灌做饭，每天大概50人就餐。需要安装可燃气体报警装置吗？","reply":"依照《安全生产法》第三十六条，餐饮等行业的生产经营单位使用燃气的，应当安装可燃气体报警装置，并保障其正常使用。","consultTime":"2022-07-23","replyTime":"2022-07-25","dept":"安全生产综合协调司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-111","title":"工贸企业氨制冷机房电气设备是否需要防爆？","consult":"查阅GB50072、AQ7015等标准，氨制冷机房电气防爆仅要求事故风机及应急照明，对压缩机电机等电气设备无要求。《冷库设计规范（征求意见稿）》7.2.7条文说明中提到氨制冷机房内正常工作的电力装置未要求按爆炸性气体环境进行电气设计。有属地专家检查提出，氨制冷机房压缩机电机及其他电气设备线路均应按照《爆炸危险环境电力装置设计规范》（GB50058）进行防爆设计。请问是否必须按照专家意见整改？","reply":"感谢您的留言。根据现行《冷库设计规范》（GB50072-2010）中第7.2.11规定：“制冷机房照明宜按正常环境设计。照明方式宜为一般照明，设计照度不应低于150lx。”，另外该标准所附的条文说明，对该条有较为详细解释，请参考。","consultTime":"2020-12-08","replyTime":"2020-12-14","dept":"安全执法和工贸监管局","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-112","title":"烟花爆竹库区围墙外有养鸡场（不住人），外部安全距离是按50人以下还是其他标准确定？","consult":"烟花爆竹库区围墙外有一养鸡场建筑不住人，这怎么确定外部安全距离？是按照50人以下确定？","reply":"《烟花爆竹工程设计安全标准》（GB50161-2022）第4.3.2条、第4.3.3条对烟花爆竹生产批发企业危险品总仓库区1.1级、1.3级仓库的外部安全距离进行了明确规定，其中企业人数是指企业的职工总数。","consultTime":"2023-10-27","replyTime":"2023-11-03","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-113","title":"喷胶车间是否属于喷涂车间？","consult":"根据《工贸行业重大生产安全事故隐患判定标准2017版》，二、行业类重大事故隐患五轻工行业。6.喷涂车间、调漆间未规范设置通风装置和防爆电气设备设施。请问：汽车零部件行业中的喷胶车间是否属于该标准中的“喷涂车间”范畴？","reply":"感谢您的留言。请你单位对喷胶车间进行风险辨识，如喷胶车间属于易燃易爆场所，应按照《爆炸危险环境电力装置设计规范》 GB50058以及等要求进行规范。","consultTime":"2021-08-23","replyTime":"2021-08-30","dept":"安全执法和工贸监管局","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-114","title":"新安全法中关于可燃气体报警装置的含义？","consult":"新安全法第36条明确要求：餐饮等行业的生产经营单位使用燃气的，应当安装可燃气体报警装置，并保障其正常使用。请问此处的可燃气体报警装置是否包含紧急切断阀，可燃气体报警装置是否只安装可燃气体报警器和控制箱即可，是否需要安装紧急切断阀并与其联锁？","reply":"您好！关于《安全生产法》第三十六条规定，餐饮等行业的生产经营单位使用燃气的，应当安装可燃气体报警装置。","consultTime":"2021-09-02","replyTime":"2021-09-22","dept":"安全生产综合协调司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-115","title":"新安法要求安装可燃气体报警装置，具体适用哪些场所？","consult":"政法司领导：您好！新安全法第36条第四款规定“餐饮等行业的生产经营单位使用燃气的，应当安装可燃气体报警装置，并保障其正常使用。”请问单位食堂如使用燃气，是否“应当安装可燃气体报警装置”？如不安装，9月1日始，可能会受到“第九十九条　生产经营单位有下列行为之一的，责令限期改正，可以处五万元以下的罚款”的处罚？","reply":"《安全生产法》第二条规定，“在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法”。依照本条规定，《安全生产法》适用的主体范围，是指一切合法或者非法从事生产经营活动的企业、事业单位和个体经济组织以及其他组织，不论其性质如何规模大小，只要是在中华人民共和国领域内从事生产经营活动，都应遵守《安全生产法》的各项规定。","consultTime":"2021-06-15","replyTime":"2021-07-21","dept":"政策法规司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-116","title":"毛纺织企业是否应该按照应按照粉尘防爆相关规定进行管理？","consult":"您好，毛纺织企业在生产中会产生毛粉尘，但在《工贸行业重点可燃性粉尘目录》2015版里不包含毛粉尘，而在《纺织工业粉尘防爆安全规程》GB32276-2015,1范围第二款“本标准适用于使用棉、麻、毛、混纺、化纤、丝等为原料的纺织工业粉尘爆炸危险场所的工程设计、施工、生产管理。”中毛粉尘又属于涉爆粉尘，毛粉尘是否属于涉爆粉尘？该企业能否按《纺织工业粉尘防爆安全规程》相关规定进行管理？","reply":"感谢您的留言。毛纺织企业毛粉尘是涉爆粉尘，应按《纺织工业粉尘防爆安全规程》进行管理。","consultTime":"2022-03-09","replyTime":"2022-03-16","dept":"安全执法和工贸监管局","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-117","title":"76号文关于“具有爆炸危险性的建设项目防火间距须满足GB50160”的规定是否适用于氢气储存充装项目？","consult":"我公司拟新建氢气储存充装项目，不生产，只充装，储存数量不构成重大危险源。国家安全监管总局、住房城乡建设部《关于进一步加强危险化学品建设项目安全设计管理的通知》安监总管三〔2013〕76号第十五“具有爆炸危险性的建设项目，其防火间距应至少满足GB50160的要求。”的规定是否适用于该项目？","reply":"您好，氢气属于首批重点监管的危险化学品，与空气混合能形成爆炸性混合物，其储存、充装项目具有爆炸危险性。因此，该项目适用《关于进一步加强危险化学品建设项目安全设计管理的通知》第十五条规定。感谢留言。","consultTime":"2022-08-17","replyTime":"2022-08-21","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-118","title":"独立空分工厂主控室是否需要按重大隐患判定标准进行抗爆评估？","consult":"关于“《化工和危险化学品生产经营单位重大生产安全事故隐患判定标准试行》中十三、控制室或机柜间面向具有火灾、爆炸危险性装置一侧不满足国家标准关于防火防爆的要求。”，独立的空分工厂的主控室是否要按照这条标准对标，是否需要进行抗爆评估？其原设计依据《G50016建筑设计防火规范》并未按照《石油化工设计防火规范》GB50160-2008《石油化工控制室设计规范》SHT3006-2012。","reply":"要按照这条标准对标。氧的火灾危险性为乙类，属助燃物，纯氧可与油脂、铝质材料等可燃物发生剧烈燃烧，甚至爆炸（参见河南义马气化厂“7·19”重大爆炸事故调查报告）。空分装置的控制室、机柜间面向空分冷箱、液氧储槽的外墙应为无门窗洞口、耐火极限不低于3h的不燃烧材料实体墙。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2021-09-22","replyTime":"2021-09-28","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-119","title":"长输天然气管道配套站场需要配备重型防护服吗？","consult":"国家安监总局安监总厅管三〔2011〕142号文指出，针对天然气，在生产、使用、贮存场所设置可燃气体监测报警仪，使用防爆型的通风系统和设备，配备两套以上重型防护服。佩带供气式呼吸器。请问长输天然气管道站场是否属于生产、使用、贮存场所？站场是否需要配备重型防护服、佩带供气式呼吸器？","reply":"按照《国家安全监管总局办公厅关于明确石油天然气长输管道安全监管有关事宜的通知》（安监总厅管三〔2014〕78号），油气长输管道安全监管纳入危险化学品安全监管范围，按照有关危险化学品安全监管法律法规、规范标准实施监管。天然气长输管道站场应执行《国家安全监管总局办公厅关于印发首批重点监管的危险化学品安全措施和应急处置原则的通知》（安监总厅管三〔2011〕142号）的有关规定。","consultTime":"2022-03-04","replyTime":"2022-03-10","dept":"危险化学品安全监督管理二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-120","title":"“两重点一重大”建设项目HAZOP分析的适用范围及是否需单独出报告？","consult":"关于进一步加强危险化学品建设项目安全设计管理的通知》安监总管三〔2013〕76号规定了涉及“两重点一重大”的建设项目，必须在基础设计阶段开展HAZOP分析，危险化学品企业，是三个都涉及的需要做分析，还是涉及一种就需要做？需要单独分析出报告吗？","reply":"《关于进一步加强危险化学品建设项目安全设计管理的通知》安监总管三〔2013〕76号规定，建设单位在建设项目设计合同中应主动要求设计单位对设计进行危险与可操作性（HAZOP）审查，涉及“两重点一重大”的建设项目，必须在基础设计阶段开展HAZOP分析。只要涉及“两重点一重大”之一的就需要进行HAZOP分析，并出具分析报告。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-13","replyTime":"2022-02-17","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-121","title":"果某一化工工艺不属于危险工艺列出的典型工艺，是否就不判定为危险工艺？","consult":"请问：如果某一化工工艺不属于危险工艺列出的典型工艺，是否就不判定为危险工艺？如R-COOH用草酰氯中-Cl取代-OH生成R-COCl的反应。由于第二批危险工艺中将氯化亚砜作为氯化剂定为氯化工艺，因此有部分企业为了避开危险工艺，就用草酰氯作为氯化剂。谢谢！","reply":"根据《国家安全监管总局关于公布首批重点监管的危险化工工艺目录的通知》（安监总管三〔2009〕116号），氯化是化合物的分子中引入氯原子的反应，包含氯化反应的工艺过程为氯化工艺，因此用草酰氯作为氯化剂的工艺属于氯化工艺。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2023-01-16","replyTime":"2023-01-23","dept":"危险化学品安全监督管理一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-122","title":"工贸企业涉氨构成重大危险源是否必须做HAZOP分析？","consult":"《关于进一步加强危险化学品建设项目安全设计管理的通知》（安监总管三〔2013〕76号）写到：涉及“两重点一重大”和首次工业化设计的建设项目，必须在基础设计阶段开展HAZOP分析。公司属于工贸企业，需要使用液氨制冷，已构成重大危险源，是否需要做HAZOP分析？","reply":"感谢您的留言。您提到的《关于进一步加强危险化学品建设项目安全设计管理的通知》（安监总管三〔2013〕76号），主要是针对危险化学品建设项目安全设计管理提出的相关要求，核实您公司是否属于危险化学品建设项目。","consultTime":"2020-12-11","replyTime":"2020-12-14","dept":"安全执法和工贸监管局","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-123","title":"浓硫酸制备硝基胍工艺能否调整为非“硝化工艺”？","consult":"咨询如题，浓硫酸制备硝基胍的机理是利用浓硫酸的脱水性，脱去原料硝酸胍中一分子的水。不是典型的硝化工艺。原总局安监总管【2013】3号文中，将硝基胍制备列入了典型“硝化工艺”，希望能调整为非“硝化工艺”？","reply":"根据《国家安全监管总局关于公布首批重点监管的危险化工工艺目录的通知》（安监总管三〔2009〕116号），硝化是有机化合物分子中引入硝基的反应，硝化法可分成直接硝化法、间接硝化法和亚硝化法，分别用于生产硝基化合物、硝胺、硝酸酯和亚硝基化合物等。硝基胍的制备属于典型的硝化工艺，感谢您对危险化学品安全监管工作的关心支持。","consultTime":"2022-06-05","replyTime":"2022-06-09","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-124","title":"甲类胶水库房与周边建筑物的距离应执行哪个标准？","consult":"您好，在烟花爆竹引线生产中需要用到胶水，胶水的成分是90乙醇和10硝化棉；设计单位在设计图纸上标注胶水库房为甲类，甲类库房在《烟花爆竹工程设计安全标准》没有明确规定与周围建筑物或道路的距离要求，《建筑防火设计规范》中明确规定建规不适用于花炮厂房仓库的建筑防火设计，请问有无其它相关规范对这个甲类库房间距有明确要求？","reply":"《烟花爆竹工程设计安全标准》（GB50161-2022）第1.0.4条规定：烟花爆竹生产建设项目和批发经营仓库的工程设计，除应符合本标准外，尚应符合国家现行有关标准的规定。第3.1.5条规定：氧化剂、可燃物及其他化工原材料仓库的火灾危险性分类应符合现行国家标准《建筑设计防火规范》GB50016的有关规定。","consultTime":"2022-12-09","replyTime":"2022-12-20","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-125","title":"HAZOP分析是否必须采用团体标准？","consult":"根据AQT 3049-2013和AQT3054-2015，HAZOP分析是一种定性风险分析，不涉及定量内容。目前在一些检查中要求必须采用中国化学品安全协会团体标准TCCSAS 001-2018中的风险矩阵进行半定量分析。请问危险化学品建设项目在进行HAZOP分析时，是否必须采用团体标准？还是执行AQ标准，在HAZOP中进行定性分析，在LOPA中进行半定量分析？谢谢！","reply":"《中华人民共和国标准化法》第十八条第一款规定：国家鼓励学会、协会、商会、联合会、产业技术联盟等社会团体协调相关市场主体共同制定满足市场和创新需要的团体标准，由本团体成员约定采用或者按照本团体的规定供社会自愿采用。但团体标准一经法规性文件采用，即变为行政强制。如果没有上述行政强制，在进行HAZOP分析时，执行《危险与可操作性分析（HAZOP分析）应用导则》（AQ/T 3049-2013）和保护层分析（LOPA）方法应用导则（AQ/T3054-2015）。具体情况请咨询当地应急管理部门。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2022-03-25","replyTime":"2022-03-30","dept":"危化监管一司","chapter":"应急救援与预案管理","hasLocalRef":true},{"id":"8-126","title":"硅基分子中引入-NR2基团，是否属于重点监管的危险工艺胺基化工艺？","consult":"领导您好，在硅基分子中引入-NR2基团，是否属于重点监管的危险工艺胺基化工艺？","reply":"根据《国家安全监管总局关于公布首批重点监管的危险化工工艺目录的通知》（安监总管三〔2009〕116号），胺化是在分子中引入胺基（R2N-）的反应，涉及胺化反应的工艺过程为胺基化工艺。在硅基分子中引入-NR2基团，属于胺基化工艺。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2023-01-10","replyTime":"2023-01-16","dept":"危险化学品安全监督管理一司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"8-127","title":"领苯二甲醛，过氧乙酸，过氧化氢，84消毒液，医用酒精是否需要危化品经营资质？","consult":"您好！老师咨询如下产品销售和购买环节是否需要危化品经营资质？1.领苯二甲醛消毒液正—邻苯二甲醛含量5.5gL±0.5gL。2.过氧乙酸含量：2.4gL±0.36gL。3.过氧化氢含量：2.7-3.3wv；都属于医用产品有安全评估报告。","reply":"您好，《安全生产法》修订后，我部也启动了《危险化学品经营许可证管理办法》的修订，拟对危险化学品经营许可范围进行调整，不再涵盖日用化学品和医药用品类的化学品。感谢留言。","consultTime":"2022-04-12","replyTime":"2022-04-15","dept":"危化监管二司","chapter":"应急救援与预案管理","hasLocalRef":false},{"id":"9-01","title":"《矿山救援规程》第五条中关于“规模较小” 是怎样界定？","consult":"尊敬的领导，您好！我想咨询一下《矿山救援规程》第五条中关于“规模较小”，是按哪个文件界定？《矿山救援规程》第五条矿山救援队是处置矿山生产安全事故的专业应急救援队伍。所有矿山都应当有矿山救援队为其服务。矿山企业应当建立专职矿山救援队；规模较小、不具备建立专职矿山救援队条件的，应当建立兼职矿山救援队，并与邻近的专职矿山救援队签订应急救援协议。","reply":"已电话沟通解答。感谢您对矿山应急救援队伍建设的关注和支持。考虑到我国矿山企业数量多、分布区域广，生产规模、从业人员数量、灾害程度差异大，不便在全国范围内对应当建立专职矿山救援队的企业规模进行划分界定。依据《生产安全事故应急条例》，所谓规模较小的企业，是指生产规模较小、从业人员较少的小型企业或者微型企业。可参照《统计上大中小微型企业划分办法》以及《关于调整部分矿种矿山生产建设规模标准的通知》《关于加强金属非金属地下矿山外包工程安全管理的若干规定》中有关矿山生产建设规模标准，并统筹考虑企业从业人员数量、灾害程度、建立专职矿山救援队是否确有困难等情况，使其符合“所有矿山都应当有矿山救援队为其服务”要求。","consultTime":"2024-10-30","replyTime":"2024-11-04","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":true},{"id":"9-02","title":"关于应急预案是否需要重新备案？","consult":"请问煤矿上级公司的法人发生了变更，下属的煤矿生产安全事故应急预案，是否需要重新备案？","reply":"已电话沟通解答。您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十五条和《生产经营单位生产安全事故应急预案评估指南》（AQ/T9011-2019）有关规定，你单位应对企业变更部分是否涉及《生产安全事故应急预案管理办法》第37条所述内容进行评估，并明确给出结论。若你单位法人变更涉及单位应急指挥机构变化及有关职责调整等第37条所述内容的，则需要重新备案。请你单位结合地方有关规定以及企业实际，开展应急预案修订、备案相关工作，确保应急预案的针对性、实用性和可操作性。","consultTime":"2024-04-12","replyTime":"2024-04-16","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-03","title":"关于油气开采的技术服务需要安全生产许可证吗？","consult":"我是从事油气田地面脱硫作业，提供技术服务的需要安全生产许可证吗？安全生产许可证范围是井下作业，和我地面脱硫技术服务资质相匹配吗？","reply":"依据《非煤矿矿山企业安全生产许可证实施办法》（国家安全监管总局令第20号）和《国家安全监管总局办公厅关于印发非煤矿矿山企业安全生产许可证申请书等10种文书格式的通知》（安监总厅管一〔2009〕183号）规定，从事陆上采油（气）、海上采油（气）、钻井、物探、测井、录井、井下作业、油建、管道储运、海油工程活动，应依法取得相应范围的石油天然气企业安全生产许可证。","consultTime":"2022-04-08","replyTime":"2022-04-12","dept":"危险化学品安全监督管理二司","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-04","title":"企业综合预案、专项预案、现场处置方案共有28项是不是需要每周做一次应急演练？","consult":"按照《生产安全事故应急预案管理办法》规定：“非煤矿山应当至少每半年组织一次生产安全事故应急预案演练”。有的专家提出是单位应急预案所有项目半年全部演练一次，有的专家认为是每半年组织专项预案和现场处置方案其中各一项，就可以。请问企业到底应该怎么做？假如企业综合预案、专项预案、现场处置方案共有28项，是不是需要每周做一次应急演练？","reply":"你好，《生产安全事故应急预案管理办法》（应急部令第2号）第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。请正确理解演练的定义，企业应根据自身实际，灵活采用桌面演练、实战演练、专项演练、综合演练等演练形式，有针对性的组织开展应急预案演练，提高应急处置能力。","consultTime":"2023-05-13","replyTime":"2023-05-18","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-05","title":"公司是否需要设立兼职救护队？","consult":"我所在煤矿为年产量120万吨的矿井，我上级公司已设立矿山救护队，且矿山救护队到我矿的实际行车时间为25分钟，我矿是否必须设立兼职矿山救护队？","reply":"已电话沟通解答。根据《矿山救援规程》，“矿山企业应当建立专职矿山救援队；规模较小、不具备建立专职矿山救援队条件的，应当建立兼职矿山救援队，并与邻近的专职矿山救援队签订应急救援协议。专职矿山救援队至服务矿山的行车时间一般不超过30分钟。”你矿上级公司已设立救护队，且行车时间为25分钟，可以不设立兼职救护队，也可视情建立。","consultTime":"2024-07-05","replyTime":"2024-07-11","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-06","title":"煤矿矿井是否可以委托第三方机构开展应急预案编制和修订工作？","consult":"根据《生产安全事故应急预案管理办法》，煤矿矿井是否可以委托第三方机构开展应急预案编制和修订工作？","reply":"已电话沟通解答。您好！应急管理部规章《生产安全事故应急预案管理办法》第九条规定：“编制应急预案应当成立编制工作小组，由本单位有关负责人任组长，吸收与应急预案有关的职能部门和单位的人员，以及有现场处置经验的人员参加。”该部门规章未对第三方机构编制或者修订生产安全事故应急预案的相关内容作出规范和要求。请你单位结合行业和地方相关规定以及本单位实际，组织开展应急预案编制和修订工作。","consultTime":"2024-11-28","replyTime":"2024-12-05","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-07","title":"民间救援组织能否有资格与非煤露天矿山签订救援协议？","consult":"本人是安全生产专业救援队伍人员，我想请问民间的救援组织能否与非煤露天矿山签订救援协议？","reply":"矿山救援专业性强、危险程度高，矿山救护队伍应当遵守《矿山救护规程》（AQ1008-2007）等有关规定，经过资质认证，取得资质证书后，方可从事矿山救护工作，不建议无资质的民间救援组织从事矿山救护工作。感谢您对应急救援事业的关注与支持。","consultTime":"2021-07-29","replyTime":"2021-08-04","dept":"救援协调和预案管理局","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-08","title":"规模较小的露天非煤矿山企业是否可以与临近的社会救援队伍签订救援协议？","consult":"根据《安全生产法》第八十二条《生产安全事故应急条例》第九条 《非煤矿矿山企业安全生产许可证实施办法》第六条第十二项规定，生产规模较小的企业必须指定兼职的应急救援人员，并可以与邻近的应急救援队伍签订救援协议，并没有规定一定要与有资质的矿山救援队签订协议，但是《矿山救援规程》第五条规定必须与专职矿山救援队签订协议，专职矿山救援队至服务矿山的行车时间一般不超过30分钟。但是，我县无专职矿山救援队，市里面仅有1支矿山救援队，且行车时间都在1小时以上，我县成立有蓝天救援队。我想咨询的问题是《矿山救援规程》是否要服从上位法，规模较小的露天非煤矿山企业是否可以与临近的社会救援队伍如蓝天救援队，拥有民政局颁发的登记证书签订救援协议？","reply":"已电话沟通解答。感谢您对矿山应急救援队伍建设的关注和支持。    《矿山救援规程》明确要求“矿山企业应当建立专职矿山救援队；规模较小、不具备建立专职矿山救援队条件的，应当建立兼职矿山救援队，并与邻近的专职矿山救援队签订应急救援协议。专职矿山救援队至服务矿山的行车时间一般不超过30分钟。”另外，根据《&lt;矿山救援规程&gt;解读》，专职矿山救援队的驻地距离服务矿山较远的，可以采取派驻救援队（可轮流驻扎）的方式为服务矿山提供应急救援服务。个别生产规模较小且地理位置偏远的矿山企业，不具备建立专职矿山救援队条件且周边30分钟车程范围内无专职矿山救援队的，应当与距离最近的专职矿山救援队签订应急救援协议。综上所述，鉴于《矿山救援规程》是《安全生产法》、《生产安全事故应急条例》等在矿山救援领域的具体细化，请遵照以上有关内容执行，与距离最近的专职矿山救援队签订应急救援协议，确保矿山救援工作实效。","consultTime":"2025-10-23","replyTime":"2025-10-29","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-09","title":"规模较小的非煤露天矿山是否可以视情况减少兼职矿山救援队人员配备？","consult":"尊敬的领导，按照《矿山救援规程》第五条“矿山企业应当建立专职矿山救援队;规模较小、不具备建立专职矿山救援队条件的，应当建立兼职矿山救援队，并与邻近的专职矿山救援队签订应急救援协议。专职矿山救援队至服务矿山的行车时间一般不超过30分钟。”我们积极推进专兼职救援队伍建设，根据第十三条“兼职矿山救援队应当符合下列规定:一根据矿山生产规模、自然条件和灾害情况确定队伍规模，一般不少于2个小队，每个小队不少于9人”，我县矿山规模普遍较小，部分小型非煤露天矿山作业人数在10人以下，全员设置成兼职救援队员都不能满足18人的要求，问：一是鉴于露天矿山风险较为单一，主要是边坡风险，加之作业人员少，能否只配1个小队或根据矿山实际减少兼职救援人员配置？谢谢！","reply":"《矿山救援规程》明确要求“所有矿山都应当有矿山救援队为其服务”，对兼职矿山救援队建设做出规定，根据矿山生产规模、自然条件和灾害情况确定队伍规模，对人员数量提出一般性要求，应满足“设正、副队长和装备仪器管理人员，确保救援装备处于完好和备用状态”的规定。参照兼职队伍主要任务及日常管理要求，结合你县具体情况，可将规模较小的矿山全部作业人员设为兼职救援队员，首先满足“设正、副队长和装备仪器管理人员”要求，结合实际值班、备勤、休整安排配置小队数量和人员，确保落实“24小时应急值班制度”及相关职责。","consultTime":"2025-10-31","replyTime":"2025-11-06","dept":"国家安全生产应急救援中心","chapter":"事故调查处理","hasLocalRef":false},{"id":"9-10","title":"陆上油气安全设施设计专篇是否仍执行2008版指导书？","consult":"原国家安全监管总局原《关于印发陆上石油天然气建设项目安全设施设计专篇编写指导书的通知》安监总管一[2008]7号中规定的《陆上石油天然气建设项目安全设施设计专篇编写指导书地面工程部分》是否依然有效？因该指导书规定了专篇为8章，但在一些
