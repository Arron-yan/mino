<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>应急管理部咨询答复汇编</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #f5f5f5;
  color: #333;
  line-height: 1.6;
  --blue: #2980b9;
  --blue-dark: #1a5276;
}

.header {
  background: linear-gradient(135deg, var(--blue-dark), var(--blue));
  color: white;
  padding: 20px 20px 0;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header h1 { font-size: 1.4em; margin-bottom: 4px; }
.header .subtitle { font-size: 0.85em; opacity: 0.85; padding-bottom: 14px; }

/* Mode Tabs */
.mode-tabs {
  display: flex;
  gap: 0;
  max-width: 400px;
  margin: 0 auto;
}

.mode-tab {
  flex: 1;
  padding: 10px 20px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  border-radius: 8px 8px 0 0;
  transition: all 0.2s;
}

.mode-tab:hover { background: rgba(255,255,255,0.25); color: white; }
.mode-tab.active { background: #f5f5f5; color: var(--blue-dark); }

/* Search Mode */
.search-container {
  max-width: 860px;
  margin: 20px auto;
  padding: 0 16px;
}

.search-box {
  display: flex;
  gap: 10px;
  background: white;
  border-radius: 12px;
  padding: 12px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  align-items: center;
}

.search-box input {
  flex: 1;
  border: none;
  outline: none;
  font-size: 16px;
  padding: 4px 0;
  background: transparent;
}

.search-box input::placeholder { color: #aaa; }

.btn-clear {
  background: none; border: none; color: #999;
  cursor: pointer; font-size: 18px; padding: 4px 8px; display: none;
}
.btn-clear.visible { display: block; }
.btn-clear:hover { color: #333; }

.filters {
  display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
}

.filter-chip {
  padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd;
  background: white; cursor: pointer; font-size: 13px;
  transition: all 0.2s; white-space: nowrap;
}
.filter-chip:hover { border-color: var(--blue); color: var(--blue); }
.filter-chip.active { background: var(--blue); color: white; border-color: var(--blue); }

.stats {
  margin-top: 16px; color: #888; font-size: 13px; padding: 0 4px;
}

.results, .browse-container {
  max-width: 860px; margin: 0 auto; padding: 0 16px 40px;
}

/* Result Cards */
.result-card {
  background: white; border-radius: 10px; padding: 18px 20px;
  margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  transition: box-shadow 0.2s; border-left: 4px solid transparent;
}
.result-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.result-card.best-match { border-left-color: #27ae60; }

.card-header {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 8px; gap: 8px;
}

.qa-id { font-size: 12px; color: var(--blue); font-weight: 600; white-space: nowrap; }
.qa-title { font-size: 15px; font-weight: 600; color: #2c3e50; flex: 1; }
.qa-chapter {
  font-size: 11px; background: #eaf2f8; color: var(--blue);
  padding: 2px 10px; border-radius: 12px; white-space: nowrap;
}

.local-tag {
  font-size: 11px; background: #fef3e2; color: #e67e22;
  padding: 2px 10px; border-radius: 12px; white-space: nowrap;
  cursor: pointer; border: 1px solid #f5c281; transition: background 0.2s;
}
.local-tag:hover { background: #fdebd0; }
.local-tag-small {
  font-size: 11px; background: #fef3e2; color: #e67e22;
  padding: 2px 8px; border-radius: 10px;
}

.qa-section { margin-top: 10px; font-size: 14px; }
.qa-label { font-weight: 600; color: #555; font-size: 12px; margin-bottom: 4px; }
.qa-content { color: #444; font-size: 14px; padding-left: 8px; border-left: 3px solid #e8e8e8; }

.qa-meta { margin-top: 10px; font-size: 12px; color: #999; display: flex; gap: 16px; flex-wrap: wrap; }

mark { background: #fff3cd; padding: 1px 2px; border-radius: 2px; color: #856404; }

/* Annotation */
.annotation-block {
  margin-top: 12px; background: #f0f8f0; border: 1px solid #c8e6c9;
  border-radius: 8px; padding: 12px 16px;
}
.annotation-block .annotation-label {
  font-size: 11px; font-weight: 700; color: #2e7d32;
  margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
}
.annotation-block .annotation-text {
  font-size: 13px; color: #444; line-height: 1.7;
}
.annotation-badge-small {
  font-size: 11px; background: #e8f5e9; color: #2e7d32;
  padding: 2px 8px; border-radius: 10px;
}

.no-results { text-align: center; padding: 60px 20px; color: #999; }
.no-results .icon { font-size: 48px; margin-bottom: 16px; }

/* Browse Mode */
.browse-container { margin-top: 20px; }

.browse-toc {
  background: white; border-radius: 10px; padding: 20px 24px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 20px;
}

.toc-title { font-size: 16px; font-weight: 700; color: var(--blue-dark); margin-bottom: 16px; }

.toc-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 8px;
}

.toc-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; background: #f8fafb; border: 1px solid #e8e8e8;
  border-radius: 8px; cursor: pointer; transition: all 0.15s;
  font-size: 14px; color: #333;
}
.toc-item:hover { border-color: var(--blue); background: #eaf2f8; }
.toc-item .toc-num { color: var(--blue); font-size: 12px; font-weight: 600; }

.chapter-block {
  background: white; border-radius: 10px; margin-bottom: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden;
}

.chapter-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; background: #f8fafb; cursor: pointer;
  border-bottom: 1px solid transparent; transition: all 0.15s;
  user-select: none;
}
.chapter-head:hover { background: #eef3f8; }
.chapter-block.open .chapter-head { border-bottom-color: #e8e8e8; }

.chapter-head-left { display: flex; align-items: center; gap: 12px; }
.chapter-head-num { font-size: 13px; color: var(--blue); font-weight: 700; }
.chapter-head-title { font-size: 15px; font-weight: 600; color: #2c3e50; }
.chapter-head-count { font-size: 12px; color: #999; }
.chapter-head-arrow { font-size: 12px; color: #999; transition: transform 0.2s; }
.chapter-block.open .chapter-head-arrow { transform: rotate(90deg); }

.chapter-body { display: none; }
.chapter-block.open .chapter-body { display: block; }

.qa-browse-item {
  border-bottom: 1px solid #f0f0f0; transition: background 0.1s;
}
.qa-browse-item:last-child { border-bottom: none; }
.qa-browse-item:hover { background: #fafbfc; }
.qa-browse-item.open { background: #f9fafb; }

.qa-browse-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px; cursor: pointer; user-select: none;
}
.qa-browse-head .qa-browse-id { font-size: 12px; color: var(--blue); font-weight: 600; min-width: 42px; }
.qa-browse-head .qa-browse-q { font-size: 14px; color: #333; flex: 1; }
.qa-browse-head .qa-browse-local {
  font-size: 10px; background: #fef3e2; color: #e67e22;
  padding: 1px 6px; border-radius: 10px; cursor: pointer;
}
.qa-browse-head .qa-browse-arrow { font-size: 10px; color: #bbb; transition: transform 0.2s; }
.qa-browse-item.open .qa-browse-arrow { transform: rotate(90deg); }

.qa-browse-detail { display: none; padding: 0 20px 16px 68px; }
.qa-browse-item.open .qa-browse-detail { display: block; }

/* Browse mode search */
.browse-search {
  background: white; border-radius: 10px; padding: 12px 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 16px;
  display: flex; gap: 10px; align-items: center;
}
.browse-search input {
  flex: 1; border: none; outline: none; font-size: 15px; background: transparent;
}
.browse-search input::placeholder { color: #aaa; }
.browse-search .browse-search-stats { font-size: 13px; color: #999; white-space: nowrap; }

/* Back to top */
.btn-back-top {
  position: fixed; bottom: 24px; right: 24px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--blue); color: white; border: none;
  font-size: 20px; cursor: pointer; box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  display: none; z-index: 150; transition: opacity 0.2s;
}
.btn-back-top:hover { background: var(--blue-dark); }

/* Government Search Panel */
.gov-search-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: white; border-top: 2px solid var(--blue);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  z-index: 200; max-height: 60vh; overflow-y: auto;
  display: none;
}

.gov-search-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 20px; background: #f8fafb;
  border-bottom: 1px solid #e8e8e8; position: sticky; top: 0; z-index: 10;
}
.gov-search-header h3 { font-size: 15px; color: #2c3e50; }

.btn-close {
  background: none; border: none; font-size: 22px;
  color: #999; cursor: pointer; padding: 0 4px; line-height: 1;
}
.btn-close:hover { color: #333; }

.gov-search-body { padding: 16px 20px; }

.gov-search-row {
  display: flex; gap: 10px; margin-bottom: 20px;
}
.gov-search-row input {
  flex: 1; padding: 10px 14px; border: 1px solid #ddd;
  border-radius: 8px; font-size: 14px; outline: none;
}
.gov-search-row input:focus { border-color: var(--blue); }

.btn-gov-search {
  padding: 10px 20px; background: var(--blue); color: white;
  border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
  white-space: nowrap; transition: background 0.2s;
}
.btn-gov-search:hover { background: #1a6da0; }

.gov-links-title { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 12px; }

.gov-links-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px;
}

.gov-link-item {
  display: block; padding: 8px 12px; background: #f8fafb;
  border: 1px solid #e8e8e8; border-radius: 6px; font-size: 13px;
  color: var(--blue); text-decoration: none; transition: all 0.15s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gov-link-item:hover { background: #eaf2f8; border-color: var(--blue); }

/* Hidden class */
.hidden { display: none !important; }

@media (max-width: 600px) {
  .header h1 { font-size: 1.1em; }
  .card-header { flex-wrap: wrap; }
  .qa-title { font-size: 14px; }
  .search-box { padding: 10px 14px; }
  .gov-links-grid { grid-template-columns: repeat(2, 1fr); }
  .gov-search-row { flex-direction: column; }
  .toc-grid { grid-template-columns: 1fr 1fr; }
  .qa-browse-detail { padding-left: 16px; }
}

</style>
</head>
<body>

<div class="header">
  <h1>应急管理部咨询答复汇编</h1>
  <div class="subtitle">11 章 · 653 条答复 · 全文搜索 + 逐条浏览</div>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="search">&#128269; 搜索</button>
    <button class="mode-tab" data-mode="browse">&#128218; 浏览</button>
  </div>
</div>

<div id="searchMode">
  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="输入关键词搜索..." autofocus>
      <button class="btn-clear" id="btnClear">&#10005;</button>
    </div>
    <div class="filters" id="chapterFilters"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="results" id="results">
    <div class="no-results"><div class="icon">&#128214;</div><div>输入关键词开始搜索 653 条答复</div><div style="font-size:13px;margin-top:8px">标注 <span class="local-tag-small">&#127758;</span> 的答复可查各地应急管理厅官网</div></div>
  </div>
</div>

<div id="browseMode" class="hidden">
  <div class="browse-container">
    <div class="browse-search"><input type="text" id="browseSearchInput" placeholder="浏览模式下筛选..."><span class="browse-search-stats" id="browseStats"></span></div>
    <div id="browseContent"></div>
  </div>
</div>

<button class="btn-back-top" id="btnBackTop">&#9650;</button>

<div class="gov-search-panel" id="govSearchPanel">
  <div class="gov-search-header"><h3>&#127758; 各地应急管理部门查询</h3><button class="btn-close" id="btnCloseGov">&times;</button></div>
  <div class="gov-search-body">
    <div class="gov-search-row"><input type="text" id="govSearchInput" placeholder="输入关键词搜索全国 gov.cn..."><button class="btn-gov-search" id="btnGovSearch">&#128269; 搜政府网站</button></div>
    <div class="gov-links-section"><div class="gov-links-title">&#127979; 各省应急管理厅（局）官网</div><div class="gov-links-grid" id="govLinksGrid"></div></div>
  </div>
</div>

<script>
var QA_DATA = [{"id":"1-01","title":"个体工商户能否成为《安全生产法》适格主体？","consult":"《安全生产法》第二条 在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法。那么，个体工商户是否属于安全生产法规定的“生产经营单位”？","reply":"《安全生产法》第二条规定，“在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法”。依照本条规定，《安全生产法》适用的主体范围，是指一切合法或者非法从事生产经营活动的企业、事业单位和个体经济组织以及其他组织，不论其性质如何规模大小，只要是在中华人民共和国领域内从事生产经营活动，都应遵守《安全生产法》的各项规定。","consultTime":"2021-01-11","replyTime":"2021-08-03","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-02","title":"《生产经营单位安全培训规定》中的从业人员是否包含主要负责人和安全管理人员？","consult":"依照《生产经营单位安全培训规定》3号令2015年5月29日修正中“第四章 安全培训的组织实施第十九条生产经营单位从业人员的安全培训工作，由生产经营单位组织实施。”关于这条我想咨询一下，这里的从业人员是否包含生产经营单位的主要负责人和安全管理人员？如果不包含，那么生产经营单位的主要负责人和安全管理人员的培训，是只能由具备安全培训资质的机构组织吗？","reply":"感谢您的留言。按照《生产经营单位安全培训规定》（原国家安全监管总局令第3号)第四条规定，生产经营单位应当进行安全培训的从业人员包括主要负责人、安全生产管理人员、特种作业人员和其他从业人员。第二十条规定，具备安全培训条件的生产经营单位，应当以自主培训为主；可以委托具备安全培训条件的机构，对从业人员进行安全培训。不具备安全培训条件的生产经营单位，应当委托具备安全培训条件的机构，对从业人员进行安全培训。生产经营单位委托其他机构进行安全培训的，保证安全培训的责任仍由本单位负责。","consultTime":"2022-02-28","replyTime":"2022-03-01","dept":"安全执法和工贸监管局","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-03","title":"内陆小型淡水渔业养殖场是否也属于高危行业？","consult":"领导咨询一下：按照《安全生产责任保险实施办法》安监总办〔2017〕140号第六条规定，渔业生产等属于国家规定的高危行业、领域的生产经营单位应当依法投保安全生产责任保险。那么是否所有从事渔业养殖、生产的企业或养殖场都需投保安责险，包括很小的池塘养殖、流水养殖等。如：内陆池塘养殖仅1亩的池塘养殖个体户、仅有2-3亩的鱼苗苗种场水深不到1米、陆基养鱼的企业等。","reply":"按照《安全生产责任保险实施办法》安监总办〔2017〕140号第六条规定，渔业生产领域生产经营单位应投保安责险。渔业生产领域是指从事水生动物和海藻类水生植物的养殖和捕捞等作业活动行业、领域，具体投保范围以所在地区应急管理部门明确的投保范围为准。","consultTime":"2023-07-13","replyTime":"2023-07-18","dept":"规划财务司","chapter":"安全生产基本法律制度","hasLocalRef":true},{"id":"1-04","title":"生产经营单位的从业人员及安全生产管理机构如何定义？","consult":"《安全生产法》第二十一条 前款规定以外的其他生产经营单位，从业人员超过一百人的，应当设置安全生产管理机构或者配备专职安全生产管理人员。有两个问题需咨询：1.这个单位的从业人员包括哪些人员？劳务派遣和承包工程或为本单位提供服务的外包人员是否计算在内？2.设置的安全生产管理机构必须是独立的专业职能部门，还是只要某部门兼安全生产职能即可？或成立类似安委会、安委办的管理机构即可？","reply":"您好，根据全国人大常委会法工委与应急管理部共同编写的《中华人民共和国安全生产法释义》中相关内容，生产经营单位的从业人员，是指该单位从事生产经营活动各项工作的所有人员，包括管理人员、技术人员和各岗位的工人，也包括生产经营单位临时聘用的人员和被派遣劳动者。安全生产管理机构是指生产经营单位内部设立的专门负责安全生产管理事务的独立部门。","consultTime":"2021-02-03","replyTime":"2021-07-29","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-05","title":"物业管理服务有限公司属于生产经营单位吗？","consult":"应急部领导：安全生产法中对于生产经营单位的定义过于广泛，我想确认像物业管理服务有限公司属于生产经营单位吗？","reply":"《安全生产法》第二条规定，“在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法”。依照本条规定，《安全生产法》适用的主体范围，是指一切合法或者非法从事生产经营活动的企业、事业单位和个体经济组织以及其他组织，不论其性质如何规模大小，只要是在中华人民共和国领域内从事生产经营活动，都应遵守《安全生产法》的各项规定。","consultTime":"2021-06-16","replyTime":"2021-07-21","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-06","title":"专职安全生产管理人员包括哪些人员？","consult":"近期检查，有专家提出：安全环保部经理，因兼管环保，所以不属于专职安全管理人员。请问这个说法有法律依据吗？专职安全生产管理人员具体包括哪些人员？","reply":"依据安全生产法释义，专职安全生产管理人员是指在生产经营单位中专门负责安全生产管理、不再兼任其他工作的人员。《危险化学品企业重点人员安全资质达标导则（试行）》2.1条规定，专职安全生产管理人员需正式任命，专门从事本企业安全管理工作，一般不得兼任或兼职其他工作。具体情况请咨询当地应急管理部门。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2022-01-17","replyTime":"2022-01-20","dept":"危化监管一司","chapter":"安全生产基本法律制度","hasLocalRef":true},{"id":"1-07","title":"安全生产管理机构和安全生产管理人员的职责中的“组织”具体定义是怎样的？","consult":"相当部分的企业“安全生产管理人员根本就组织不了员工，因为员工受班组长或类似于班组长等管理人员的制约，如果主要负责人不进行干预，安全管理人员就无法对员工实施组织，“组织”也就无从谈起。个人觉着安全管理人员安全职责中的“组织”不应该是安全管理人员的，应该是主要负责人和员工的直线管理者的。请问，《安全生产法》中规定安全生产管理机构和安全生产管理人员的职责中的“组织”具体定义是怎样的？","reply":"《安全生产法》第二十二条中具体规定了生产经营单位的安全生产管理机构以及安全生产管理人员的职责：（一）组织或者参与拟定本单位安全生产规章制度、操作规程和生产安全事故应急救援预案；（二）组织或者参与本单位安全生产教育和培训，如实记录安全生产教育和培训情况；...（三）组织或者参与本单位应急救援演练；…","consultTime":"2021-06-11","replyTime":"2021-07-21","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-08","title":"无本公司的社会保险是否可以担任本公司的主要负责人？","consult":"有一家涉及危险化学品储存、经营公司A的法定代表人未满60周岁是该公司A的主要负责人，该人在公司A中未缴纳社会保险，作为代替，该法定代表人在公司B中购买社会保险。在此种情况下，该人是否可以继续当该公司A的主要负责人？","reply":"您好，根据《关于推进安全生产领域改革发展的意见》，生产经营单位的法定代表人和实际控制人同为安全生产的第一责任人，法定代表人缴纳社会保险途径不影响其履行安全生产责任。感谢留言。","consultTime":"2022-06-20","replyTime":"2022-06-25","dept":"危化监管二司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-09","title":"总经理为主要负责人时，董事长还有哪些法定安全职责？","consult":"公司总经理和董事长不是同一个人，总经理为主要负责人，请问董事长法定安全职责有哪些？是否需要参加公司的应急演练，安全生产领导小组会议？董事会是否需要定期召开安全会议？是否需要组织每季度安全检查？","reply":"关于生产经营单位主要负责人的职责，《安全生产法》第十八条明确了7项职责，请对照法律规定执行。","consultTime":"2020-09-14","replyTime":"2020-09-28","dept":"国家安全生产应急救援中心","chapter":"安全生产基本法律制度","hasLocalRef":true,"_annotation":"【注释】①《安全生产法》（2021修订）第五条明确：生产经营单位的主要负责人是本单位安全生产第一责任人。公司制企业中，董事长作为法定代表人、总经理主持生产经营工作，两者均属“主要负责人”范畴，共同承担第二十一条的七项法定职责。②董事长即使不负责日常经营管理，仍需履行法定安全职责：定期主持召开董事会安全生产专题会议、将安全生产纳入董事会重要议事日程、督促检查全员安全生产责任制的落实情况。③关于具体活动：董事长应当参加安全生产领导小组会议（作为主要负责人之一）；应急演练和季度安全检查如由总经理直接组织，董事长应通过督促检查机制确保落实。④新法大幅提高了主要负责人未履职的处罚力度——发生特别重大事故的，处上一年年收入100%罚款，并可能终身禁业。履职全程留痕是关键。\n【依据】《安全生产法》第5条、第21条、第94条；《中共中央国务院关于推进安全生产领域改革发展的意见》"},{"id":"1-10","title":"食品生产企业设置安全管理机构后，配备2名专职安管人员是否符合规定？","consult":"依据《食品生产企业安全生产监督管理暂行规定》第六条规定：“从业人员超过100人的食品生产企业，应当设置安全生产管理机构或者配备3名以上专职安全生产管理人员”，如果食品生产企业从业人员超过100人，设置了安全生产管理机构，配备了2名专职安全生产管理人员，是否符合此规定要求？","reply":"感谢您的留言。根据描述，该企业符合规定要求。如各地另有地方性法规有相关要求，遵守地方性法规要求。","consultTime":"2022-04-14","replyTime":"2022-04-21","dept":"安全执法和工贸监管局","chapter":"安全生产基本法律制度","hasLocalRef":true},{"id":"1-11","title":"城市公交属于高危行业、领域的生产经营单位吗，如果是，有相应的法规说明吗？","consult":"第五十一条 生产经营单位必须依法参加工伤保险，为从业人员缴纳保险费。国家鼓励生产经营单位投保安全生产责任保险；属于国家规定的高危行业、领域的生产经营单位，应当投保安全生产责任保险。请问城市公交属于高危行业、领域的生产经营单位吗？如果是，有相应的法规说明吗？","reply":"按照《安全生产责任保险实施办法》（安监总办〔2017〕140号）第六条规定，煤矿、非煤矿山、危险化学品、烟花爆竹、交通运输、建筑施工、民用爆炸物品、金属冶炼、渔业生产等属于国家规定的高危行业、领域的生产经营单位应当依法投保安全生产责任保险。","consultTime":"2022-05-20","replyTime":"2022-05-24","dept":"规划财务司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-12","title":"城市轨道交通运营单位是否属于高危行业？","consult":"城市轨道交通运营单位是否属于高危行业？是否应当投保安全生产责任保险？","reply":"根据《安全生产责任保险实施办法》（安监总办〔2017〕140号）有关规定，包括交通运输在内的八大高危行业领域的生产经营单位应当投保安全生产责任保险。","consultTime":"2023-03-30","replyTime":"2023-04-04","dept":"规划财务司","chapter":"安全生产基本法律制度","hasLocalRef":false,"_annotation":"【注释】①城市轨道交通运营单位明确属于高危行业。应急管理部规划财务司2023年4月4日官方答复确认，城市轨道交通纳入“交通运输”高危行业领域，应当依法投保安全生产责任保险。②2025年3月七部委联合印发新版《安全生产责任保险实施办法》（应急〔2025〕27号），第二条将“交通运输”明确列入八大高危行业，第四十三条细化交通运输包括道路运输、水路运输、管道运输，城市轨道交通属于道路运输范畴。③地方层面：厦门市交通局明确负责“城市轨道交通运营”领域的安责险实施；山东省将“城市轨道交通工程”列入交通工程建设高危领域。④新办法将每人死亡伤残责任全国最低保障限额从30万元提升至40万元，且应覆盖全体从业人员（含临时聘用人员、劳务派遣人员）。\n【依据】《安全生产法》第51条；《安全生产责任保险实施办法》（应急〔2025〕27号）第2条、第43条；应急管理部官网2023-04-04答复"},{"id":"1-13","title":"废止《关于在高危行业推进安全生产责任保险的指导意见》，是否意味着安责险不再强制购买？","consult":"废止《关于在高危行业推进安全生产责任保险的指导意见》，是否可以理解为不再强制高危行业购买安全生产责任保险？","reply":"废止《关于在高危行业推进安全生产责任保险的指导意见》，是因2017年各地试点工作已结束，已在八大高危行业全面推行安责险制度。为了避免地方应急管理部门以《指导意见》作为设置准入门槛的政策依据，出现理解上的歧义和执行上的偏差，废止了该《指导意见》，并不是不再推行安责险工作。目前，各地应按照2017年印发的《安全生产责任保险实施办法》和2022年印发的《应急管理部关于进一步做好安全生产责任保险工作的紧急通知》有关规定和要求实施安责险工作。","consultTime":"2023-02-28","replyTime":"2023-03-01","dept":"规划财务司","chapter":"安全生产基本法律制度","hasLocalRef":true,"_annotation":"【注释】①安责险仍然强制购买。废止《指导意见》是因为2017年各地试点已于当年结束，安责险制度已在全国八大高危行业全面推行，继续保留试点指导意见反而会产生歧义。②安责险的强制性依据已从部门指导意见上升为法律层面——《安全生产法》（2021修订）第五十一条明确规定：“属于国家规定的高危行业、领域的生产经营单位，应当投保安全生产责任保险。”这是法律层面的强制性要求，效力高于部门规范性文件。③2025年新《实施办法》进一步强化了强制性：未按规定投保的，由负有安全生产监督管理职责的部门责令限期改正，并可处五万元以上十万元以下的罚款。\n【依据】《安全生产法》第51条；《安全生产责任保险实施办法》（应急〔2025〕27号）第2条、第32条"},{"id":"1-14","title":"安全生产责任险可以放在专项储备-安全生产费科目列示吗？","consult":"安全生产责任险可以放在专项储备-安全生产费科目列示吗？望回复。","reply":"根据《企业安全生产费用提取和使用管理办法》（财企〔2012〕16号）的有关规定，企业安全生产责任保险保费可以在安全费用列支。","consultTime":"2021-11-01","replyTime":"2021-11-04","dept":"应急管理部规划财务司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-15","title":"安全生产责任险目前是否属于安全生产费的计提范围？","consult":"安全生产责任险目前是否属于安全生产费的计提范围？","reply":"根据《企业安全生产费用提取和使用管理办法》（财企〔2012〕16号）相关规定，从事煤炭生产、非煤矿山开采、建设工程施工、危险品生产与储存、交通运输、烟花爆竹生产、冶金、机械制造、武器装备研制生产与试验（含民用航空及核燃料）等行业企业，依据本企业行业属性，以产量或营业收入作为计提依据，按照规定标准提取安全费用。具体请查阅财企〔2012〕16号文件的“第二章安全费用的提取标准”。","consultTime":"2021-10-28","replyTime":"2021-11-04","dept":"应急管理部规划财务司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-16","title":"应急局监管哪些工贸行业，是否拥有处罚权？","consult":"请问应急局监管的工贸行业具体是什么？包括哪些企业类型，宾馆、饭店、KTV、超市等行业主管部门明确的行业，按照三管三必须的要求，应急管理局有权处罚吗？","reply":"感谢您的留言。各部门的安全监管职责由地方政府确定，需符合《安全生产法》关于“安全生产工作实行管行业必须管安全、管业务必须管安全、管生产经营必须管安全”的要求。","consultTime":"2021-10-17","replyTime":"2021-10-22","dept":"安全执法和工贸监管局","chapter":"安全生产基本法律制度","hasLocalRef":true},{"id":"1-17","title":"《安全生产法》第51条所指的高危行业具体包括哪些？","consult":"《安全生产法》第51条规定高危行业要投保安全生产责任保险，请问哪些行业才是高危行业，国家有什么规章文件规定作为依据吗？","reply":"按照《安全生产责任保险实施办法》（安监总办〔2017〕140号）第六条规定，煤矿、非煤矿山、危险化学品、烟花爆竹、交通运输、建筑施工、民用爆炸物品、金属冶炼、渔业生产等属于国家规定的高危行业、领域的生产经营单位应当依法投保安全生产责任保险。","consultTime":"2022-03-09","replyTime":"2022-03-14","dept":"规划财务司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-18","title":"《氨制冷企业安全规范》（AQ7015-2018）应不应该作为强制性标准执行？","consult":"应急管理部于2018年5月22日发布、2018年12月1日实施的《氨制冷企业安全规范》（AQ7015-2018）规定“本标准的全部技术内容为强制性”，这一规定是否与2018年1月1日起施行的新《标准化法》第二条中的“国家标准分为强制性标准、推荐性标准，行业标准、地方标准是推荐性标准。”相抵触？","reply":"不相抵触。依据《安全生产法》《标准化法》《深化标准化工作改革方案》的有关规定，安全生产行业标准包括强制性行业标准和推荐性行业标准。","consultTime":"2021-01-05","replyTime":"2021-06-28","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":true,"_annotation":"【注释】①《标准化法》（2018年施行）第二条规定行业标准为推荐性标准——这是原则。但国务院2015年印发的《深化标准化工作改革方案》明确：“安全生产、公安、税务标准暂按现有模式管理。”即安全生产领域的强制性行业标准在改革过渡期内继续保留强制性效力，不立即转化为推荐性标准或上升为强制性国家标准。②AQ7015-2018虽然发布于2018年5月（新《标准化法》施行后），但其属于“安全生产”例外领域，依据改革方案的特别安排，其“全部技术内容为强制性”的规定合法有效。③2020年国家标准委《关于进一步加强行业标准管理的指导意见》重申：原强制性行业标准逐步整合为强制性国家标准，“法律法规和国务院另有规定的除外”——安全生产即属此类例外。④企业应当继续将AQ7015-2018作为强制性标准执行，直至该标准被新的强制性国家标准替代或主管部门另行通知。\n【依据】《标准化法》第2条；《深化标准化工作改革方案》（国发〔2015〕13号）；国家标准委《关于进一步加强行业标准管理的指导意见》（2020年）"},{"id":"1-19","title":"安全生产方面的标准，当地方的技术标准与国家标准不一致时，哪个标准效力更高？","consult":"安全生产方面的标准，当地方的技术标准与国家标准要求不一致时，那个标准效力更高，企业需要优先执行哪一个？","reply":"依据《标准化法》的有关规定，地方标准是推荐性标准，地方标准的技术要求不得低于强制性国家标准的相关技术要求。当地方标准与强制性国家标准要求不一致时，企业应当执行强制性国家标准；当地方标准与推荐性国家标准要求不一致时，企业可以选择执行。","consultTime":"2021-02-27","replyTime":"2021-06-28","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":true},{"id":"1-20","title":"应急管理行业标准为什么有的属于强制标准，有的属于推荐标准？","consult":"中华人民共和国应急管理部2020年第6号公告中，应急管理行业标准为什么有的属于强制标准，有的属于推荐标准。","reply":"依据《安全生产法》《消防法》《标准化法》《深化标准化工作改革方案》《应急管理标准化工作管理办法》等有关规定，应急管理行业标准包括强制性行业标准和推荐性行业标准。","consultTime":"2021-02-27","replyTime":"2021-06-28","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-21","title":"《安全生产法》中法律责任部分罚款的“以上”“以下”包含本数吗？","consult":"您好，请问《安全生产法》中法律责任部分罚款的“以上”“以下”包含本数吗？","reply":"法律法规规章已有规定的，按照相关规定执行。如果没有规定，按照以下规定执行：《立法技术规范》（试行）（一）规定：24.规范年龄、期限、尺度、重量等数量关系，涉及以上、以下、以内、不满、超过的规定时，“以上、以下、以内”均含本数，“不满、超过”均不含本数。","consultTime":"2021-06-11","replyTime":"2021-07-21","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":true},{"id":"1-22","title":"建筑行业新进场人员是否需要三级安全教育，培训时间和方式如何执行？","consult":"《生产经营单位安全培训规定》中第十一条、十二条、十三条款要求，三个条款中没有明确提到建筑行业，建筑行业应该按照那条规定对新进场人员进行教育，是否需要进行进场三级教育，教育培训时间是多少？如需要进场三级教育，建筑行业工作存在自己的工作形式，不存厂矿、车间工段、区、队，那我们该如何开展？","reply":"您好！您所提及的建筑行业是一个较为宽泛的概念。如仅就建筑施工而言，建筑施工企业同样属于生产经营单位。依据《中华人民共和国安全生产法》第二十五条规定，“生产经营单位的安全生产管理机构以及安全生产管理人员履行下列职责：……（2）组织或者参与本单位安全生产教育和培训，如实记录安全生产教育和培训情况。……”。依照《建设工程安全生产管理条例》第三十七条规定，“作业人员进入新的岗位或者新的施工现场前，应当接受安全生产教育培训。未经教育培训或者教育培训考核不合格的人员，不得上岗作业。施工单位在采用新技术、新工艺、新设备、新材料时，应当对作业人员进行相应的安全生产教育培训”。关于建筑行业新进场人员教育培训相关问题，由于《建筑业企业职工安全培训教育暂行规定》目前已被住房和城乡建设部废止，具体情况请与建设行政主管部门联系咨询。","consultTime":"2021-10-24","replyTime":"2021-11-05","dept":"安全生产综合协调司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-23","title":"企业购买安责险的行业类别具体明细是什么？","consult":"1. 含有武装押运的企业是否需要购买安责险？如购买安责险所属行业类别是什么？2. 物流公司需要购买安责险，所属的行业类别是交通运输中子行业类别的普通货物运输还是货运枢纽？3. 棉业有限公司涉及棉麻加工轧花、榨油的企业，所属行业类别是工贸的纺织行业么？","reply":"按照《安全生产责任保险实施办法》（安监总办〔2017〕140号）第六条规定，煤矿、非煤矿山、危险化学品、烟花爆竹、交通运输、建筑施工、民用爆炸物品、金属冶炼、渔业生产等属于国家规定的高危行业、领域的生产经营单位应当依法投保安全生产责任保险。如涉及上述行业企业，应投保安全生产责任保险，目前我部正在修订上述办法，会对高危行业、领域用语含义进行进一步解释。","consultTime":"2023-06-23","replyTime":"2023-06-29","dept":"规划财务司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-24","title":"化学品安全技术说明书（SDS）的修订周期是几年？","consult":"GBT16483-2000中写明化学品安全技术说明书五年修订一次。但是更新后的GBT16483-2008未写明，查询相关资料对于修订周期均无明确的说法。","reply":"根据《危险化学品安全管理条例》第十五条规定，危险化学品生产企业发现其生产的危险化学品有新的危险特性的，应当立即公告，并及时修订其化学品安全技术说明书和化学品安全标签。","consultTime":"2021-07-02","replyTime":"2021-07-08","dept":"危化监管二司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-25","title":"医院、学校实验室储存、使用的危险化学品是否归属于应急管理部门监管？","consult":"医院、学校实验室储存、使用的危险化学品是否归属于应急管理部门监管？","reply":"您好，危险化学品安全监管应贯彻落实“三管三必须”和“谁审批谁负责，谁主管谁负责”的要求，根据《危险化学品安全管理条例》，负有危险化学品安全监督管理职责的部门应当相互配合、密切协作，依法加强对危险化学品的安全监督管理。感谢留言。","consultTime":"2022-07-07","replyTime":"2022-07-10","dept":"危化监管二司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-26","title":"地方性要求与国务院文件不一致怎么办？","consult":"《国务院关于进一步加强企业安全生产工作的通知》安监总管三〔2010〕186号要求：专职安全生产管理人员应不少于企业员工总数的2不足50人的企业至少配备1人，与《山东省生产经营单位安全生产主体责任规定》山东省人民政府令第311号第二次修订规定从业人员在300人以上不足1000人有冲突，请问以哪一个文件为准？感谢您的答复？","reply":"企业安全管理机构和人员配备情况要在《安全生产法》的总体框架下根据行业特点进行细化。具体执行情况可咨询省级应急管理部门。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2021-09-13","replyTime":"2021-09-15","dept":"危化监管一司","chapter":"安全生产基本法律制度","hasLocalRef":true},{"id":"1-27","title":"安全管理员的工资是否可以列入每年计提的安全生产费用预算中？","consult":"请问，企业配备专职安全管理员，安全管理员的工资是否可以列入每年计提的安全生产费用预算中？","reply":"根据《企业安全生产费用提取和使用管理办法》（财企〔2012〕16号）有关规定，安全生产费用的使用范围主要包括安全防护设施设备、重大危险源和事故隐患评估整改、安全检查及标准化建设、作业人员安全防护、安全生产宣教及培训、新技术新装备推广、安全检测检验等。基于此，安全管理员的工资薪酬不可以列入每年计提的安全生产费用预算中。","consultTime":"2022-03-08","replyTime":"2022-03-14","dept":"规财财务司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-28","title":"安全生产法规定的安全生产条件具体是指哪几个方面？","consult":"安全生产法第十七条规定生产经营单位应当具备本法和有关法律、行政法规和国家标准或者行业标准规定的安全生产条件；不具备安全生产条件的，不得从事生产经营活动。这里的安全生产条件具体是指哪几个方面？或者哪些内容的缺失可以算不具备安全生产条件？","reply":"有关行业的安全生产条件由《安全生产法》等安全生产相关法律法规以及规范该行业的其他相关法律法规和标准予以规范。","consultTime":"2021-03-15","replyTime":"2021-07-29","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-29","title":"《安全生产法》第十七条规定的安全生产条件具体指哪些？","consult":"根据《安全生产法》第十七条“生产经营单位应当具备本法和有关法律、行政法规和国家标准或者行业标准规定的安全生产条件；不具备安全生产条件的，不得从事生产经营活动。”，请问哪些是应具备的安全生产条件，能否公布相应的法律、行政法规和标准目录。","reply":"有关行业的安全生产条件由《安全生产法》等安全生产相关法律法规以及规范该行业的其他相关法律法规和标准予以规范。","consultTime":"2021-03-15","replyTime":"2021-07-29","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-30","title":"工矿商贸生产经营单位包括哪些行业？","consult":"请问，工矿商贸生产经营单位包括哪些行业？建筑企业算工矿商贸企业吗？","reply":"感谢您的留言。工贸企业是指《关于修订&lt;冶金有色建材机械轻工纺织烟草商贸行业安全监管分类标准（试行）&gt;的通知》（应急厅〔2019〕17号），矿山和危化企业另有界定；建筑企业不属于工贸企业。","consultTime":"2021-02-01","replyTime":"2021-02-08","dept":"安全执法和工贸监管局","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"1-31","title":"应急部门安全生产综合监督管理职责包括的具体内容？","consult":"安全生产法第九条  国务院安全生产监督管理部门依照本法，对全国安全生产工作实施综合监督管理；县级以上地方各级人民政府安全生产监督管理部门依照本法，对本行政区域内安全生产工作实施综合监督管理。   请问“综合监督管理”怎么理解？是否可以理解为：指导协调、监督检查同级政府有关部门和下级政府安全生产工作，组织开展安全生产和消防工作考核、巡查。","reply":"根据应急管理部“三定”规定，应急管理部依法行使国家安全生产综合监督管理职权，指导协调、监督检查国务院有关部门和各省（自治区、直辖市）政府安全生产工作，组织开展安全生产巡查、考核工作。","consultTime":"2021-05-06","replyTime":"2021-07-21","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":true},{"id":"1-32","title":"《安全生产法》中的主要负责人指的什么？","consult":"《安全生产法》中的主要负责人指的什么？包不包括实际控制人？而实际控制人的概念多见于上市公司，不是上市公司有没有实际控制人？","reply":"全国人大常委会法工委与应急管理部共同编写的《中华人民共和国安全生产法释义》一书对此问题有所解释。生产经营单位的主要负责人，对企业而言，不同组织形式的企业有所不同。《中共中央国务院关于推进安全生产领域改革发展的意见》规定，生产经营单位的法定代表人和实际控制人同为安全生产的的第一责任人。对于有限责任公司和股份有限公司，主要负责人应当是公司董事长和经理（总经理、首席执行官或其他实际履行经理职责的企业负责人）；对于非公司制的企业，主要负责人为企业的厂长、经理、矿长等企业行政“一把手”。","consultTime":"2021-05-07","replyTime":"2021-07-21","dept":"政策法规司","chapter":"安全生产基本法律制度","hasLocalRef":false},{"id":"2-01","title":"30%氰化钠溶液的急性毒性是类别1还是类别2？","consult":"重大危险源辨识过程中，30氰化钠溶液的临界量是参考固体氰化钠的临界量50吨,还是以30氰化钠溶液最大毒性LD50值6.4mgkg大鼠经口判断为急性毒性类别2，临界量500吨？","reply":"感谢您的留言。咨询标准编制单位。","consultTime":"2021-08-06","replyTime":"2021-08-11","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-02","title":"37%甲醛溶液重大危险源辨识临界量是多少，应归类为急性毒性还是易燃液体？","consult":"37的甲醛溶液，在重大危险源辨识时，临界量是多少？应归类为急性毒性还是易燃液体？","reply":"根据《化学品物理危险性鉴定与分类管理办法》，对于物理危险性尚未确定的，可委托具备能力的单位进行鉴定和分类。重大危险源请按照《危险化学品重大危险源监督管理暂行规定》和有关标准要求进行辨识和评估。","consultTime":"2021-12-07","replyTime":"2021-12-16","dept":"危化监管二司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-03","title":"GB 30077-2023和GB 18218-2018对危化品使用单位如何适用？","consult":"1. GB 30077.2013的适用范围是危化品生产和储存单位，新版增加了危险化学品单位定义，包含了使用单位，但是定义下方有备注：本文件中特指满足附录A的危险化学品生产和储存单位，请问使用单位是否适用，这句话是指？2. 根据GB18218-2018进行识别时，危化品重大危险源辨识的适用范围包括使用单位，但是附录A危化品重大危险源辨识流程只分为生产单元和储存单元，是指使用单元不在等级内？","reply":"1. 本文件对生产和贮存单位的物资配备做强制性要求（见标准3.2条款），使用单位可根据自身情况参照执行；2. 本文件针对危化品生产和贮存单位进行分类规定（见标准3.2条款），以重大风险源等级作为分类依据，使用单位可根据自身情况参照执行。","consultTime":"2024-03-08","replyTime":"2024-03-11","dept":"国家安全生产应急救援中心","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-04","title":"白酒生产企业是否需要针对酒库、酒罐区进行重大危险源辨识？","consult":"白酒属于“酒、饮料和精制茶制造业”门类，但是根据其闪点计算56度以上的原浆酒又属于易燃液体，《危险化学品重大危险源辨识》中规定了易燃液体的临界量为5000t，我们在日常工作中遇到的问题是大家对是否对白酒进行重大危险源辨识有争议，一部分人认为比对易燃液体的临界量进行辨识，一部分人认为白酒不属于危险化学品，不需要进行重大危险源辨识。请各位专家及领导给予解答，是否需要对白酒进行重大危险源辨识。","reply":"感谢您的留言。根据有关法规，不需要对白酒进行重大危险源辨识。","consultTime":"2021-10-21","replyTime":"2021-10-28","dept":"安全执法和工贸监管局","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-05","title":"重大危险源分级系数α取值中，厂区边界外扩500米常住人口是否包含厂内人员和宿舍人员？","consult":"关于重大危险源辨识分级中分级系数的取值，标准明确为厂区边界向外扩展500ｍ范围内常住人口数量，包括α厂区内生产人员吗，还是仅仅只是厂区外部居民？厂区员工宿舍内的人员算么？生产区的工作人员算么？","reply":"重大危险源辨识中a取值的要求是“重大危险源的厂区边界向外扩展500米范围内常住人口数量”，所以不包括重大危险源所属企业厂界范围内的工作人员，但包括该企业厂界外500米范围内本企业及其临近企业职工宿舍楼里的人员。感谢您对危险化学品安全生产工作的关心。","consultTime":"2022-03-25","replyTime":"2022-03-25","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-06","title":"重大危险源降级后，备案未到期可否等到期再更新？","consult":"尊敬的应急管理部：重大危险源三级企业,内外部安全条件、环境均未发生变化的情况下.在最新的《安全现状评价》中重大危险源风险等级降为四级,但备案尚未三年到期.此种降级的情况,企业是否可以在即将到期时再更新备案？","reply":"在企业内外部安全条件、环境均未发生变化的情况下，在最新的《安全现状评价》中重大危险源等级由三级降为四级，但备案尚未三年到期的，危险化学品单位也应及时向所在地县级人民政府应急管理部门更新备案。理由：《危险化学品重大危险源监督管理暂行规定》（国家安全监管总局令40号）第十一条、第二十三条有明确要求。","consultTime":"2022-02-14","replyTime":"2022-02-21","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":true},{"id":"2-07","title":"危险化学品储罐设计最大量到底如何界定？","consult":"GB18218-2018第4.2.2条规定：危险化学品储罐以及其他容器、设备或仓储区的危险化学品的实际存在量按设计最大量确定。GB50160-20082018年版6.3.9 液化烃、液氨等储罐的储存系数不应大于0.9；TSG21-2016 第31.13装量系数规定:储存液化气体的压力容器应当规定设计储存量，装量系数不得大于0.95。那液化天然气储罐是按最大容积来计算实际存储量么？","reply":"应按照设计最大量来计算重大危险源的R值。储罐使用过程中实际的最大储存量应符合相关标准规范要求。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-01-16","replyTime":"2022-01-21","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-08","title":"CAS号为8006-61-9的汽油的重大危险源临界值为多少？","consult":"CAS号为8006-61-9的汽油的重大危险源临界值为多少？","reply":"重大危险源临界值可在《危险化学品重大危险源辨识》（GB18218-2018）中表1危险化学品名称及临量中查询到。汽油的临界量为200吨。感谢您对危险化学安全生产工作的关心关注。","consultTime":"2022-03-08","replyTime":"2022-03-10","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-09","title":"危险化学品重大危险源辨识中设计最大量如何确定？","consult":"GB18218-2018中规定：危险化学品储罐以及其他容器设备或仓储区的危险化学品的实际存在量按设计最大量确定。请问在具体进行重大危险源辨识的时候如何确定这个最大量？","reply":"感谢您的留言，请咨询标准编制单位。","consultTime":"2021-10-26","replyTime":"2021-10-26","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-10","title":"40%的一甲胺水溶液判定重大危险源时的临界量如何确定？","consult":"请教40的一甲胺水溶液判定重大危险源时的临界量如何确定？沸点是49.4℃，闪点是-9.94℃，请给予指导，谢谢。","reply":"感谢您的留言，请咨询标准编制单位。","consultTime":"2021-09-22","replyTime":"2021-09-27","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-11","title":"白酒储罐区是否需要进行重大危险源辨识？","consult":"尊敬的领导及专家，您们好！有一个问题一直困扰我，请问白酒储罐区需不需要进行重大危险源辨识？个人拙见，觉得不需要进行辨识，白酒不属于危险化学品，属于饮料类，现阶段没有标准进行辨识。望相关领导及专家给予解惑，非常感谢！","reply":"感谢您的留言。根据《国家安全监管总局办公厅关于白酒制造企业安全生产监管工作有关问题的复函》（安监总厅管四函〔2015〕165号），白酒制造企业在轻工行业安全监管范畴。","consultTime":"2021-04-06","replyTime":"2021-04-12","dept":"安全执法和工贸监管局","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-12","title":"CNC加工中心的安全风险是什么等级？","consult":"CNC加工中心这种设备，如果我们进行企业风险评估，应该是属什么什么风险等级，是不是根据《机械行业较大危险因素辨识与防范培训手册》定为较大风险。","reply":"感谢您的留言。请结合企业实际，对照《机械行业较大危险因素辨识与防范指导手册》“金属切削工艺”有关内容，进行安全风险评估。","consultTime":"2021-12-09","replyTime":"2021-12-16","dept":"安全执法和工贸监管局","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-13","title":"化工园区负责人“化工专业背景”包括哪些专业？","consult":"化工园区安全风险排查治理导则试行第7.2条要求：化工园区管委会应配备具有化工专业背景的负责人。请问这里的化工专业具体有哪些专业符合条件？安全工程类是否符合？","reply":"“化工专业背景”要求的基本原则是相关人员应具有化工相关知识，具备与岗位相匹配的安全风险辨识和管理能力。具体专业名称范围由各地结合实际确定。相关专业和资质是否达标可结合《危险化学品企业重点人员安全资质达标导则（试行）》予以确定，具体咨询当地应急管理部门。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2022-07-05","replyTime":"2022-07-06","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":true},{"id":"2-14","title":"化工园区安全风险排查评估中，园区规划、产业规划、禁限控目录是否需要专家评审和政府发布？","consult":"请问，在化工园区安全风险排查治理评估中，《化工园区整体规划》、《化工园区产业规划》、《禁限控目录》是否需要专家评审通过，并以当地人民政府文件发布？","reply":"按照《化工园区安全风险排查治理导则》（试行），化工园区应编制《化工园区总体规划》、《化工园区产业发展规划》，并严格按照《化工园区总体规划》、《化工园区产业发展规划》制定《化工园区产业指引》和“禁限控”目录。具体相关规划和禁限控目录是否需要专家评审和发布方式由园区或负责管理园区的人民政府确定。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2021-09-13","replyTime":"2021-09-15","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":true},{"id":"2-15","title":"苯乙烯介质输送是否必须使用屏蔽泵或磁力泵，可否使用离心泵替代？","consult":"贵司下发的《苯乙烯安全风险隐患排查指南试行》中要求涉及苯乙烯介质的输送应选用屏蔽泵或磁力泵等无泄漏泵，指南中隐患排查依据为安监总厅 管三〔2011〕142号令，查阅142号令内容并未强制要求使用屏蔽泵或磁力泵等无泄漏泵输送苯乙烯介质，且当时下发142号令文件要求企业参考使用。请问贵司是否可以使用离心泵作为输送苯乙烯的介质？","reply":"苯乙烯为易燃液体，为从源头全面提升防泄漏水平，预防和控制泄漏，应参照《国家安全监管总局办公厅关于印发首批重点监管的危险化学品安全措施和应急处置原则的通知》（安监总厅管三〔2011〕142号）的要求，选用屏蔽泵或磁力泵等无泄漏泵来输送苯乙烯。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-24","replyTime":"2022-03-01","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-16","title":"道路运输行业风险辨识和分级管控是否有相关法律法规依据？","consult":"请问有否道路运输行业风险辨识和分级管控的相关法律、法规、规定？","reply":"按照“管行业必须管安全、管业务必须管安全、管生产经营必须管安全”的要求，建议向道路运输行业主管部门咨询。","consultTime":"2021-06-03","replyTime":"2021-07-21","dept":"政策法规司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-17","title":"《工贸行业重大生产安全事故隐患判定标准2021年版》什么时候能发布？","consult":"尊敬的上级领导，请问一下:《工贸行业重大生产安全事故隐患判定标准2021年版》会在什么时候能公布请告知一下，谢谢？","reply":"感谢您的留言。《工贸行业重大生产安全事故隐患判定标准（2021年版）》正在抓紧起草中，后续按照程序报批，届时将在我部网站公布，请继续关注。","consultTime":"2021-06-30","replyTime":"2021-07-05","dept":"安全执法和工贸监管局","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-18","title":"危化品生产企业未设安全管理机构和专职安管人员继续生产，属于重大隐患还是一般违法？","consult":"您好，危险化学品生产企业持证未设置安全生产管理机构，未设置专职安全管理人员，继续进行生产的情形，是属于重大事故隐患吗？因为根据判定标准，安管人员未经依法考核合格才是？还是不具备安全生产条件需要暂扣证？还是一般违法行为呢？谢谢！","reply":"根据《危险化学品生产企业安全生产许可证实施办法》（安监总局令41号）第十二条“企业应当依法设置安全生产管理机构，配备专职安全管理人员。配备的专职安全管理人员必须能够满足安全生产的需要”。持证企业未设置专职安全管理人员的，按照《安全生产许可证条例》规定，安全生产许可证颁发管理机关发现不具备安全生产条件的，应当暂扣或吊销安全生产许可证。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-03","replyTime":"2022-03-08","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-19","title":"非中央化学品生产经营企业是否需要每月开展重大安全隐患排查？","consult":"非中央化学品生产经营企业用对本单位重大安全隐患进行每月一次排查吗？","reply":"国务院安委会办公室印发的《安全生产治本攻坚三年行动方案(2024-2026年)》要求“健全完善生产经营单位重大事故隐患自查自改常态化机制，生产经营单位主要负责人要每季度带队对本单位重大事故隐患排查整治情况至少开展1次检查(高危行业领域每月至少1次),完善并落实覆盖生产经营单位每一名从业人员的安全生产岗位责任制”，以上要求应涵盖各类生产经营单位，而非仅针对“中央企业”。","consultTime":"2024-07-10","replyTime":"2024-07-23","dept":"危险化学品安全监督管理一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-20","title":"工贸行业重大隐患判定标准（2017）机械行业第7点是否适用于轻工家具制造业？","consult":"工贸行业重大事故隐患判定标准2017的行业标准如第四项的机械行业第7点适合轻工的家具厂吗？","reply":"感谢您的留言。重大事故隐患判定标准仅适用于对应行业，机械行业重大隐患不适用于轻工行业。","consultTime":"2022-03-03","replyTime":"2022-03-10","dept":"安全执法和工贸监管局","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-21","title":"安全生产标准化企业申请定级，除工贸行业重大隐患判定标准外还有无其他判定标准？","consult":"《企业安全生产标准化建设定级办法》应急〔2021〕83号中，申请定级的企业应符合条件的第九条“全面开展隐患排查治理，发现的重大隐患已完成整改”中的企业机械行业存在的重大隐患除了应遵守《工贸行业重大生产安全事故判定标准》以外，有没有其他的判定标准。","reply":"感谢您的留言。机械行业重大事故隐患按照《工贸行业重大生产安全事故隐患判定标准（2017版）》（安监总管四〔2017〕129号）判定，无其他判定标准。","consultTime":"2021-12-11","replyTime":"2021-12-17","dept":"安全执法和工贸监管局","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-22","title":"工贸行业重大隐患判定标准中“槽、罐类设备”如何界定？","consult":"请问工贸行业重大生产安全事故隐患判定标准（征求意见稿）中（二）有色行业（共12条）中第8条，炉、窑、槽、罐类设备本体及附属设施未定期检查，出现严重焊缝开裂、腐蚀、破损、衬砖损坏、壳体发红、煤气泄漏及明显弯曲变形等未报修或报废，仍继续使用或采用外部喷淋冷却方式维持使用。中的“槽、罐类设备”如何界定？","reply":"感谢您的留言。工贸行业重大生产安全事故隐患判定标准（征求意见稿）正在修订完善中，发布时将配套解读，对“槽、罐类设备”进行界定。","consultTime":"2021-03-09","replyTime":"2021-03-15","dept":"安全执法和工贸监管局","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-23","title":"生产若干年后标准更新是否要根据新标准整改现场生产设施的建设时采用的标准遗留的隐患问题？","consult":"生产设施在投入使用时采用的的相关标准，在生产若干年后标准更新，是否要根据新标准整改现场生产设施的建设时采用的标准遗留的隐患问题！","reply":"新的标准如果是强制性标准，则必须依据新标准进行整改。鼓励企业采用推荐性标准。","consultTime":"2021-04-13","replyTime":"2021-06-28","dept":"政策法规司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-24","title":"什么条件的燃气加热炉不属于淘汰落后设备？","consult":"什么条件的燃气加热炉不属于淘汰落后设备，是火焰监测和熄火保护都没有，还是火焰监测和熄火保护有其中之一就满足要求，就不属于淘汰落后设备。","reply":"《淘汰落后危险化学品安全生产工艺技术设备目录（第一批）》（应急厅〔2020〕38号）中“二、淘汰落后的设备”第七条“无火焰监测和熄火保护系统的燃气加热炉、导热油炉”是指同时不具备火焰监测和熄火保护系统的燃气加热炉、导热油炉。但由于《石油化工企业设计防火标准（2018年版）》（GB 50160-2008）、《管式加热炉规范》（SY/T 0538-2012）、《导热油加热炉系统规范》（SY/T 0524-2016）、《工业燃油燃气燃烧器通用技术条件》（GB/T 19839-2005）等标准规范均对燃气加热炉、导热油炉应具备熄火保护系统（或熄火保护措施）提出明确要求，因此燃气加热炉、导热油炉至少应具备熄火保护系统，因此有熄火保护系统而没有火焰监测的不属于淘汰落后设备。","consultTime":"2024-04-26","replyTime":"2024-04-30","dept":"危险化学品安全监督管理一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-25","title":"渉爆粉尘采用的重力式沉降除尘，是淘汰工艺吗？","consult":"企业的渉爆粉尘采用重力式沉降除尘，请问这是淘汰工艺吗？如果是，有淘汰工艺或设备目录可依吗？","reply":"感谢您的留言。重力沉降室除尘目前未纳入《淘汰落后生产能力、工艺和产品的目录》，但禁止采用此种方式吸取可燃性粉尘。《粉尘防爆安全规程》明确规定“禁止采用干式静电除尘器和重力沉降室除尘”。《工贸企业粉尘防爆安全规定》（应急管理部令第6号）明确规定“禁止采用粉尘沉降室除尘或者采用巷道式构筑物作为除尘风道。”","consultTime":"2021-11-01","replyTime":"2021-11-08","dept":"安全执法和工贸监管局","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-26","title":"淘汰落后设备目录中的燃气加热炉是否包含制氢转化炉和硫磺焚烧炉？","consult":"您好！向您咨询一下，第一批淘汰落后设备目录中无火焰监测和熄火保护系统的燃气加热炉、导热油炉是否包含制氢转化炉、硫磺焚烧炉？制氢转化炉、硫磺焚烧炉是否需要增加火焰监测和熄火保护系统，谢谢！","reply":"根据《淘汰落后危险化学品安全生产工艺技术设备目录（第一批）》，制氢转化炉、硫磺焚烧炉不需要增加火焰监测和熄火保护系统。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-04-12","replyTime":"2022-04-14","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-27","title":"丙类仓库内是否可以设置电动传送带或者分拣装置？","consult":"您好！近年来仓储物流行业发展迅速，仓库除了进行货物仓储外，可能涉及到小面积、短距离的传送带，还可能涉及电动分拣装置用于货物的拆分、二次包装等作业。请问，在丙类仓库内是否可以设置类似上述所描述的电动传送带或者分拣装置，有无明确的法规依据帮助企业进行合规判定？","reply":"仓储物流建筑的防火设计要求见国家标准《建筑设计防火规范》（GB50016-2014）（2018年版）第3.3.10条。谢谢！","consultTime":"2022-02-28","replyTime":"2022-02-28","dept":"消防救援局","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-28","title":"安监总管三〔2013〕76号文第14条如何理解？","consult":"在设计一个空分制氧的项目，储存构成重大危险源。本身制氧站有专门的规范《氧气站设计规范》、《深度冷冻法生产氧气及相关气体安全技术规程》等规范。按照安监总管三〔2013〕76号文第14条，对于制氧站外部和内部安全间距的确定，需不需要按照安监总管三〔2013〕76号文第14条中所述的8个规范最严格的来确定。","reply":"制氧站安全间距要求是否需要满足《国家安全监管总局住房城乡建设部关于进一步加强危险化学品建设项目安全设计管理的通知》（安监总管三〔2013〕76号）第十四条所提8个标准最严格条款，由标准适用范围确定。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2021-09-11","replyTime":"2021-09-14","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-29","title":"请教聚羧酸高性能减水剂的工艺是否属于聚合工艺？","consult":"请教聚羧酸高性能减水剂的工艺是否属于聚合工艺？","reply":"依据《国家安全监管总局关于公布第二批重点监管危险化工工艺目录和调整首批重点监管危险化工工艺中部分典型工艺的通知》（安监总管三〔2013〕3号）附件3“涉及涂料、粘合剂、油漆等产品的常压条件生产工艺不再列入‘聚合工艺’”，聚羧酸高性能减水剂的工艺不属于聚合工艺。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-23","replyTime":"2022-02-25","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-30","title":"中成药制造企业使用乙醇生产，应按工贸企业还是危化企业监管？","consult":"应急管理部领导，你们好。我是一名医药生产企业安全员，有一个问题困扰着我，特此留言，希望可以得到解惑。我们司是一家中成药制造企业，主要生产工艺包括中药提取和固体制剂，生产过程中主要使用乙醇无重大危险源。生产过程为物理过程，产品为药品，无危险化学品。目前归危化监管，监管要求与危化相同，一定程度增加了企业负担，医药企业是否可以考虑根据实际情况，生产工艺和原辅材料的特性，分为危化监管和工贸行业监管？","reply":"企业在生产过程中使用了危险化学品，地方不管是按照工贸企业还是危化企业进行安全监管，都应执行《危险化学品安全管理条例》和相关标准规定。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-15","replyTime":"2022-02-18","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-31","title":"天然气处理站是否需要执行GB 50160规范要求？","consult":"根据安监总管三[2013]76号文件，天然气处理站场是否属于危险化学品建设项目？如果天然气处理站场属于危险化学品建设项目，根据76号文件第十四第十五条要求，天然气处理站是否需要执行GB50160的规范要求？因为根据石油化工企业设计防火标准GB50160-20082018年版规范总则，天然气处理站非炼油厂、石油化工厂化纤厂或其不在GB50160标准的规定范围之内。","reply":"天然气处理站场不属于危险化学品建设项目；应根据建设项目工艺特点和标准规范的适用范围确定本项目采用的标准规范。","consultTime":"2023-03-11","replyTime":"2023-04-20","dept":"危险化学品安全监督管理二司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-32","title":"“两重点一重大”是指三项同时满足还是满足任意一项？","consult":"应急局领导，您好！涉及两重点一重大生产企业是指重大危险源、重点监管的危险化工工艺、重点监管的危险化学品三项同时满足的生产企业；还是指只要涉及重大危险源、重点监管的危险化工工艺、重点监管的危险化学品中的任意一项的生产企业？","reply":"只要涉及一项就属于两重点一重大项目，有关规定可查阅应急部网站。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-07-27","replyTime":"2022-08-01","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"2-33","title":"一个厂区内多个重大危险源可否合并建档？","consult":"一个生产厂区内有多个重大危险源，是不是可以合并建立一个重大危险源档案包含所有重大危险源内容，还是每一个重大危险源都单独建立重大危险源。","reply":"《危险化学品重大危险源监督管理暂行规定》第二十二条明确了重大危险源档案应当包括的具体内容，其中一些内容是通用的，一些内容是针对各个具体重大危险源的。企业有多个重大危险源的，可以建立一个总的档案，包括重大危险源总清单、通用的资料及各具体重大危险源分档案。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-02-25","replyTime":"2022-03-02","dept":"危化监管一司","chapter":"安全风险管控与隐患排查","hasLocalRef":false},{"id":"3-01","title":"工贸企业有限空间和粉尘防爆规定是否适用于化工企业？","consult":"尊敬的部领导，不要回复法条了，法条都看过了，烦请明确回复下。","reply":"感谢您的留言。《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）《工贸企业粉尘防爆安全规程》（应急管理部令第6号）均不适用于化工企业。","consultTime":"2021-09-22","replyTime":"2021-09-29","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-02","title":"上煤系统振动筛下料斗是否属于有限空间？","consult":"上煤系统振动筛下料斗，下料斗高度3.5米，平常主要运输物料为:煤。里面上下自然通风，里面没有有毒有害气体，只是进出口受限，","reply":"感谢您的留言。工贸企业应依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第二条第二款规定并结合现场实际情况来判断。如果企业确认在作业过程中，该空间不存在有毒有害、易燃易爆物质积聚或者氧含量不足的情况，则可以不纳入有限空间进行管理。","consultTime":"2021-12-09","replyTime":"2021-12-16","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-03","title":"地下室受限空间巡检是否属于进入受限空间作业？","consult":"地下室受限空间巡检是否属于进入受限空间作业？","reply":"感谢您的留言。咨询标准编制单位。","consultTime":"2021-08-02","replyTime":"2021-08-06","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-04","title":"受限空间是否只有在作业时在作业场所设置警示标识？","consult":"想咨询，我公司为一家化工企业，受限空间可分为两类，一类是反应釜、储罐等，其人孔需要借助专业工具方可打开，另一类为污水观察井、未封闭水池等，不需要工具即可进入；请问以上识别的受限空间：无论是否作业均需要设置警示标识？还是仅需要在作业时在作业场所设置警示标识？","reply":"2022年10月1日实施的《危险化学品企业特殊作业安全规范》（GB30871-2022）规定，停止受限空间作业期间，应在受限空间入口处增设警示标志，并采取防止人员误入的措施。因此，企业应在非作业时、作业中断期间，在受限空间入口显著位置设置安全警示标志。在受限空间作业期间，在受限空间外应设有专人监护。感谢您对危化品安全管理工作的关心关注。","consultTime":"2022-04-09","replyTime":"2022-04-10","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-05","title":"哪些地下室属于有限空间？","consult":"你好，我公司有一小型污水处理站是建在地下的单独的，通过楼梯和楼房梯子差不多下去，设有机械通风系统，相当于处理设施设在地下室，会有人员巡查。应急厅函〔2020〕299号对有限空间界定时，其中，进出口受限有门算不算进出受限？，未按固定工作场所设计此处不需要人员值守，但需要巡检，算不算固定工作场所？，通风不良有通风系统算不算通风不良？。请问这种情况算不算有限空间？","reply":"感谢您的留言。如你单位属于工贸企业，应结合生产实际，按照《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第七条规定，对污水处理站进行安全风险辨识，如存在有毒有害、易燃易爆物质积聚或者氧含量不足的情况，可能会发生中毒窒息事故的，应纳入有限空间进行管理。","consultTime":"2021-12-22","replyTime":"2021-12-29","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-06","title":"地下管廊是否属于有限空间？","consult":"根据《应急管理部办公厅关于印发有限空间作业安全指导手册》应急厅函〔2020〕299号，有限空间是指：封闭或部分封闭、进出口受限但人员可以进入，未被设计为固定工作场所，通风不良，易造成有毒有害、易燃易爆物质积聚或氧含量不足的空间。根据定义，地下管廊仅仅满足进出口受限一点，其余均不满足，地下管廊设计为固定工作场所，通风良好，无有害气体积聚，根据管廊实际情况，请明确地下管廊是否属于有限空间？谢谢！","reply":"感谢您的留言！地下管廊全称为地下城市管道综合走廊，是在城市地下建造一个隧道空间，将电力、通信、燃气、供热、给排水等各种工程管线集于一体，设有专门的检修口、吊装口和监测系统，实施统一规划、统一设计、统一建设和管理，是保障城市运行的重要基础设施。根据应急厅函〔2020〕299号规定，有限空间是指封闭或部分封闭、进出口受限但人员可以进入，未被设计为固定工作场所，通风不良，易造成有毒有害、易燃易爆物质积聚或氧含量不足的空间。地下管廊是否属于有限空间不能一概而论。如果企业可以确认该地下管廊不存在有毒有害、易燃易爆物质积聚或氧含量不足的情况，则可以不纳入有限空间进行管理。","consultTime":"2023-02-07","replyTime":"2023-02-09","dept":"国家安全生产应急救援中心","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-07","title":"安全生产基础司印发的《有限空间作业安全指导手册》是否具有法律效力？","consult":"安全生产基础司印发的《有限空间作业安全指导手册》是否具有法律效力。《有限空间作业安全指导手册》氧含量的标准是19.5-23.5，而GB30871和山东省印发的《DB37T1933-2011工贸企业有限空间作业安全规范》氧含量标准是18-23.5。我单位一直执行国标和地方标准，但是外部检查、体系审核时专家提出此为不符合项，要求我单位进行整改。疑问为是否这个手册的效力高于国标，地方标准？","reply":"感谢您的留言。按国家标准执行。","consultTime":"2021-08-06","replyTime":"2021-08-13","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":true,"_annotation":"【注释】①应急管理部安全生产基础司印发的《有限空间作业安全指导手册》本身不是法律或强制性标准，不具有直接的法律强制效力，不能作为行政处罚的独立依据。②但手册是对《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）和《缺氧危险作业安全规程》（GB 8958）国家标准的解释性、操作性指南，具有重要的参考指导作用。③在安全检查或事故调查中，手册可作为判断企业是否履行安全义务的重要参考。企业应当按照国家标准（GB 8958等）和技术规范执行有限空间作业管理，手册是帮助理解和落实标准要求的工具。④有限空间作业安全监管的强制性依据为：国家安全监管总局令第59号（部门规章）、GB 8958《缺氧危险作业安全规程》（强制性国家标准）。\n【依据】《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）；GB 8958-2006"},{"id":"3-08","title":"59号令规定的有限空间需同时满足几个条件？什么情况会被处罚？","consult":"第二十八条　工贸企业有下列行为之一的，由县级以上安全生产监督管理部门责令限期改正；逾期未改正的，责令停产停业整顿，可以并处5万元以下的罚款：一未在有限空间作业场所设置明显的安全警示标志的；1. 请问有限空间和有限空间作业分别是什么意思？2. 若未在有限空间设置警示标识，有限空间作业时张贴了警示标识，这样属于上述处罚项吗？","reply":"感谢您的留言。1. 有限空间作业指在有限空间内开展的生产作业活动。2. 企业未在有限空间设置警示标识属于59号令第二十八条规定的应处罚行为。","consultTime":"2021-06-15","replyTime":"2021-06-22","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":true},{"id":"3-09","title":"工贸行业特殊作业应执行什么规范标准？","consult":"您好，一是请问一下工贸行业特殊作业动火、高空、吊装、有限空间、临时用电等是否有什么规范或者标准，如危化企业必须执行化学品生产单位特殊作业安全规范GB30871，如果有，请问是什么规范或者标准，如果没有，那请问一下特殊作业除了落实安全措施以外，还需要办理审批表嘛？二是工贸行业是否也必须执行化学品生产单位特殊作业安全规范GB30871？","reply":"感谢您的留言。1. 工贸行业应按照《安全生产法》、《工贸企业有限空间作业安全管理与监督暂行规定》等法律规章和特种作业相关要求，强化作业安全风险管控。有限空间需要办理作业审批表，其他特殊作业是否需要审批应由企业根据风险辨识情况自行决定。2. 非化学品生产单位的工贸行业不需要执行《危险化学品企业特殊作业安全规范》（GB 30871-2022）。","consultTime":"2022-03-23","replyTime":"2022-03-28","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-10","title":"有限空间内桥式吊车能否用于应急救援？","consult":"公司有热处理井式炉有限空间维修作业，当维修人员出现缺氧或者物体打击伤害后，不能自行从井底上来的情况下，公司有桥式吊车，可用吊车进行应急救援吗，井口不利于使用三脚架。如果不能使用吊车救援的话应该如何救援？","reply":"感谢留言。桥式吊车作为工业吊装设备，起吊过程中容易对被困人员造成挤压、碰撞等二次伤害，不宜作为应急救援装备直接参与救援工作。有限空间作业应当严格遵守“先通风、再检测、后作业”要求。可有效防止事故发生。对于风险较高的有限空间作业，建议作业人员佩戴全身式安全带，并配套使用安全绳，安全绳一端与安全带连接，另一端与有限空间外的挂点可靠连接。一旦发生异常情况，外部人员可通过安全绳提升被困作业人员。同时，请进一步完善现场处置方案，做好应急演练，确保应急准备到位。","consultTime":"2026-05-21","replyTime":"2026-05-27","dept":"国家安全生产应急救援中心","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-11","title":"除尘设备集尘室是否属于有限空间？","consult":"我司除尘设备的集尘室约三个立方米左右，是否属于有限空间，我们隔一天就需要对木粉尘进行清理，若按有限空间作业管理，人力物力消耗真的很大，请问相关部门有无简化管理的方案，集尘室位于地面上，一个进入口，宽高约为0.8米1.8米，粉尘有水喷雾增湿。","reply":"感谢您的留言。依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号），集尘室应纳入有限空间管理。","consultTime":"2021-09-09","replyTime":"2021-09-16","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-12","title":"单位无有毒有害气体且具备排风设备的地下机房属于有限空间吗？","consult":"您好，领导。我单位的室外地下水处理机房，机房一端有一个1m见方的出入口，人员通过爬梯出入，另一端有排风口，连接机房内的排风设备。机房内不产生有毒有害及易燃易爆气体，且排风设备24小时开启。请问领导，这类机房是不是可以识别为非有限空间？","reply":"您好，留言收悉。根据《工贸企业有限空间作业安全规定》（应急管理部令第13号）要求，有限空间是指封闭或者部分封闭，未被设计为固定工作场所，人员可以进入作业，易造成有毒有害、易燃易爆物质积聚或者氧含量不足的空间。如您单位是工贸企业，且机房符合上述全部要求的，判定为有限空间，不符合上述要求的，不判定为有限空间。","consultTime":"2025-05-15","replyTime":"2025-05-19","dept":"国家安全生产应急救援中心","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-13","title":"机械制造企业的喷漆房、烤漆房，属于有限空间吗？","consult":"您好，领导咨询一下，机械制造企业的喷漆房、烤漆房，属于有限空间吗？","reply":"感谢您的留言。按标准规范设计建造的喷漆房、烤漆房不属于有限空间。","consultTime":"2022-05-02","replyTime":"2022-05-09","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-14","title":"进入布袋除尘器内部更换布袋是否属于有限空间作业？","consult":"你好，我单位存在布袋除尘器直径1.5-2米，在检修时会进入除尘器内部进行布袋更换作业，更换除尘器布袋之前会将除尘器两侧的门打开，除尘器内部通风良好无氧含量不足的情况但有粉尘存在是否识别为有限空间？谢谢！","reply":"感谢您的留言。工贸企业应依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第二条第二款规定并结合现场实际情况来判断。针对布袋除尘器，如果储存的粉尘具有易燃易爆性质，应将布袋除尘器纳入有限空间管理。","consultTime":"2022-02-17","replyTime":"2022-02-24","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-15","title":"乳制品生产企业使用的奶仓、待装罐、配料罐等牛乳储存罐是否属于有限空间？","consult":"领导好：咨询一下乳制品生产企业使用的奶仓、待装罐、配料罐等牛乳储存罐是否属于有限空间？","reply":"感谢您的留言。企业应结合生产实际，按照《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第七条规定，对奶仓、待装罐、配料罐等牛乳储存罐进行安全风险辨识，如存在有毒有害、易燃易爆物质积聚或者氧含量不足的情况，可能会发生中毒窒息事故的，应纳入有限空间进行管理。","consultTime":"2021-12-22","replyTime":"2021-12-29","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-16","title":"评价部分有限空间作业风险很小是否不纳入有限空间管理，或者不纳入许可管理？","consult":"领导好：请问有限空间管理根据风险 评价大小进行分类管理，如评价部分有限空间作业风险很小，是否不纳入有限空间管理，或者不纳入许可管理、现场不需要设置警示牌。因为分类管理有限空间有利于现场安全管理。","reply":"感谢您的留言。目前没有分类管理办法，可以通过分级审批或采取不同工作要求和风险管控措施等方式解决风险高低的问题。","consultTime":"2021-09-10","replyTime":"2021-09-17","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-17","title":"地上敞开式水池是否是有限空间？","consult":"地上敞开式水池算有限空间么？","reply":"感谢您的留言。请依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第二条第二款规定并结合现场实际情况来判断。","consultTime":"2021-09-07","replyTime":"2021-09-14","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-18","title":"作业时人员站在池井上方，不进入有限空间内部，请问是否属于有限空间作业？","consult":"我司已将雨污水井，隔油池，沉淀池均为地下有限空间辨识为有限空间，纳入有限空间管理。目前我司需要对上述有限空间进行捞污作业，工作内容为清理漂浮垃圾，作业时人员站在池井上方，不进入有限空间内部，请问是否属于有限空间作业？是否需要办理有限空间作业许可证？","reply":"感谢您的留言。因为有限空间内部存在的有毒有害和易燃易爆气体具有扩散性，目前已经发生多起未进入有限空间内部、在有限空间周边作业仍然出现中毒导致人员伤亡的事故。因此，当分析有限空间存在有毒有害和易燃易爆气体时，不论是否进入有限空间，在周边进行作业时，都属于有限空间作业，应执行审批制度，办理审批手续。","consultTime":"2021-11-29","replyTime":"2021-12-06","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-19","title":"日常作业的低风险有限空间企业是否可以内部规定不办理作业审批？","consult":"根据《工贸企业有限空间参考目录》，里面有的有限空间是风险很小的，而且是日常都要作业的，针对这种风险小的，企业是否可以内部规定不办理作业审批只是落实相关措施。或者《工贸企业有限空间参考目录》只是个参考，企业是否可以不辨识出那种风险很小的有限空间。","reply":"感谢您的留言。工贸企业应依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第二条第二款规定并结合现场实际情况，来判断是否属于有限空间。企业开展有限空间作业时，应履行审批手续。根据风险大小和作业频繁程度等实际情况，企业可以采取分级审批等方式。","consultTime":"2021-12-04","replyTime":"2021-12-10","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-20","title":"固定式架车机等设备地坑是否属于有限空间？","consult":"领导你好，固定式架车机等设备地坑是否属于有限空间？地下空间不存在有毒有害、易燃易爆物质积聚或者氧含量不足的？","reply":"感谢您的留言。你单位应结合生产实际，按照《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第七条规定，对固定式架车机等设备地坑进行安全风险辨识，如确认该设备地坑不存在有毒有害、易燃易爆物质积聚或者氧含量不足的情况，不会发生中毒窒息事故的，不需纳入有限空间进行管理。","consultTime":"2021-12-23","replyTime":"2021-12-30","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-21","title":"满足哪几个条件才构成有限空间？","consult":"59号令，对有限空间进行了定义，给定了6个条件，但对于具体满足哪几个条件才是有限空间并未说明。有限空间作业安全指导手册，也同样未说明。这在给企业判定有限空间是带来很大难处，各专家的说法也不一致。有些本身不含有、不产生、也不会外界意外引入有害气体的空间，如设备地坑、清水池等，也全部被算作有限空间，给企业管理带来诸多不便。希望能再明确一下。","reply":"感谢您的留言。请依据《工贸企业有限空间作业安全管理与监督暂行规定》（安全监管总局令第59号）第二条第二款规定并结合现场实际情况来判断。","consultTime":"2021-03-27","replyTime":"2021-03-30","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-22","title":"企业有限空间和有限空间作业如何准确认定，认定标准是什么？","consult":"你好，我单位数控加工中心和数控车床是否属于有限空间，人员进入数控加工中心装卸加工零件或维修设备是否属于有限空间作业？","reply":"感谢您的留言。你单位应结合生产实际，按照《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第七条规定，对数控加工中心和数控车床进行安全风险辨识，如确认该数控加工中心和数控车床不存在有毒有害、易燃易爆物质积聚或者氧含量不足的情况，不会发生中毒窒息事故的，不需纳入有限空间进行管理。","consultTime":"2021-12-20","replyTime":"2021-12-27","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-23","title":"电梯井是否属于有限空间？","consult":"领导好：咨询一下电梯井是否属于有限空间？","reply":"感谢您的留言。工贸企业应依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第二条第二款规定并结合现场实际情况来判断。如果企业确认在安装、巡查和检维修等作业过程中，该空间不存在有毒有害、易燃易爆物质积聚或者氧含量不足的情况，则可以不纳入有限空间进行管理。","consultTime":"2021-12-10","replyTime":"2021-12-17","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-24","title":"有限空间按如何定义，如何管理？","consult":"我浏览了执法局对有限空间定义的回复。发现回复标准不统一，有的回复提到存在易燃易爆气体，有的提到易燃易爆物质，有的还提到高处坠落，有的还提到....等危害因素。我的问题1：对于易燃易爆这个风险，是具体指气体还是泛指所有易燃易爆物质？问题2：如果仅存在高处坠落风险的密闭空间，是否定义有限空间？3.像地上消防水池，无有毒有害气体，无易燃易爆物质，但是有淹溺的风险，是否是有限空间？","reply":"感谢您的留言。1. 根据《工贸企业有限空间作业安全管理与监督暂行规定》，易燃易爆物质以气体和粉尘为主。2. 仅存在高处坠落风险的作业场所可以不纳入有限空间管理范围。3. 无有毒有害气体，无易燃易爆物质，仅有淹溺的风险的地上消防水池可以不纳入有限空间管理范围。","consultTime":"2022-03-21","replyTime":"2022-03-28","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-25","title":"消防水池、化粪池、空气储罐是否属于有限空间？","consult":"地下消防水池，人不会进入；地下化粪池，在地面下1米，人也不会进入；3m³空气储罐，有人孔，但里面是空气，而且人也不会进入；像这样的属于有限空间吗？","reply":"感谢您的留言。工贸企业应依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第二条第二款规定并结合现场实际情况来判断。一般情况下，化粪池存在有毒有害和易燃易爆物质，且需要开展清理和检维修作业，应纳入有限空间进行管理。消防水池和空气储罐，如果企业确认在作业过程中，该空间不存在有毒有害、易燃易爆物质积聚或者氧含量不足的情况，则可以不纳入有限空间进行管理。","consultTime":"2021-12-09","replyTime":"2021-12-16","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-26","title":"电加热台车炉内部检修是否属于有限空间作业？","consult":"1、电加热台车炉内部尺寸宽长高1.7m1.8m2m门为电动上提式尺寸1.71.8m，在内检修算不算有限空间作业？2、配电室地坑,有地坑盖板和爬梯，下面走电缆。尺寸 长宽深20m4m3m，算不算有限空间？3、小型凉水塔算不算有限空间？门尺寸宽高0.40.6m,内部检修风机。内部体积约2m³？","reply":"感谢您的留言。1.如你单位经分析，电加热台车炉内不涉及有毒有害气体或无氧含量不足的情况，则在内检修算不算有限空间作业。2.对于配电室和凉水塔，应依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第二条第二款规定并结合现场实际情况来判断。如果企业确认在作业过程中，该空间不存在有毒有害、易燃易爆物质积聚或者氧含量不足的情况，则可以不纳入有限空间进行管理。","consultTime":"2021-12-01","replyTime":"2021-12-08","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-27","title":"机械制造企业喷漆房、烤漆房是否属于有限空间？","consult":"您好，领导，咨询一下，机械制造行业的喷漆房、烤漆房，有通风设施与环保设备相连，环保设备通过抽风，把房内的气体抽入环保设备处理，这样是否为有限空间。","reply":"感谢您的留言。按标准规范设计建造的喷漆房、烤漆房不属于有限空间。","consultTime":"2022-05-02","replyTime":"2022-05-10","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-28","title":"有限空间作业归属特种作业吗？","consult":"咨询一下，现在有限空间作业归属特种作业吗？","reply":"感谢您的留言。《特种作业目录》中不涉及有限空间作业。","consultTime":"2021-09-23","replyTime":"2021-09-30","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-29","title":"食堂的污水池是否按照有限空间来辨识，是否要按照较大风险来申报？","consult":"风险报告核查的时候专家提出，食堂旁边的一个污水池大约长2米、宽1.2米、深2米应当要辨识为有限空间，作为较大风险来申报。但是平时上面都是有水泥板盖住的，根本不会打开来作业，而且周围有警示标志，每年我们会请环卫部门过来清理一下抽一下脏东西，这个污水池本质上来说和化粪池是一样的。","reply":"感谢您的留言。工贸企业应依据《工贸企业有限空间作业安全管理与监督暂行规定》（国家安全监管总局令第59号）第二条第二款规定并结合你企业现场实际情况来判断。一般情况下，污水池易存在有毒有害和易燃易爆物质，且需要开展清理和检维修作业，应按照有限空间进行辨识和管理。","consultTime":"2021-11-29","replyTime":"2021-12-06","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-30","title":"《工贸企业粉尘防爆安全规定》适用行业范围？","consult":"您好，我公司为电力生产企业，公司涉及褐煤等煤炭粉尘、粉煤灰等，结合《工贸企业粉尘防爆安全规定》《工贸行业重点可燃性粉尘目录2015版》，未发现电力行业所涉及的褐煤等煤炭粉尘、粉煤灰属于可燃性粉尘，根据上述规定，我们理解电力行业不适用于《工贸企业粉尘防爆安全规定》，这样理解是否正确？请有关部门予以准确答复。","reply":"感谢您的留言。《工贸企业粉尘防爆安全规定》（应急管理部令第6号）适用行业不包括电力生产企业，发电厂生产过程中产生的粉尘不适用本规定。","consultTime":"2021-08-13","replyTime":"2021-08-20","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-31","title":"什么情况会被归类为粉尘涉爆企业？","consult":"请问哪些可以归类为粉尘涉爆企业是只要出现爆炸性的粉尘就是，还是必须有除尘系统？","reply":"感谢您的留言。工贸行业内存在可燃性粉尘爆炸危险的企业属于粉尘涉爆企业。涉及可爆粉尘的场所要严格遵守相关法规标准要求。","consultTime":"2022-04-19","replyTime":"2022-04-25","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-32","title":"可燃性粉尘除尘设备是否禁止使用机械振打方式除尘设备？","consult":"今年来国家及各级政府安全管理部门加强了环保设备的管理，特别是对可燃性粉尘的除尘设备的管理，2019年实行的《粉尘防爆安全规程》GB 15577-2018规范其在内容伤对除尘设备上进行了较为详细的规定。其中《粉尘防爆安全规程》GB 15577-2018对可燃性粉尘的除尘设备的选型进行了规定（8.4.5）：袋式除尘器不应采用机械振打方式，滤袋应采用阻燃及防静电的滤料制作，滤袋抗静电特征应符合GB/T。","reply":"感谢您的留言。按照标准要求，符合袋式除尘器定义的除尘器，不得采用机械振打方式。其他类型除尘器可参照执行。","consultTime":"2021-04-06","replyTime":"2021-04-12","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-33","title":"工贸企业小量产生微量铝粉除尘，是否可采用非防爆室内小型除尘器？","consult":"企业需求量化管控非定性管控。如一台小型机将铝箔分切过程会产生微量的粉尘每天量10克，出于清洁配室内除尘器工业用非防爆小型脉冲除尘，如按防爆规程标准要求，需要配置防爆除尘器且需要单独隔离，还需很多防控措施。对于企业成本很高，个人分析：小量产生微量铝粉除尘实际危险性很小，采用每天清洁措施等安全风险可控，是否可采用非防爆室内小型除尘器。建议：出具体量化尘量等指标分级管控，风险低简化管。","reply":"感谢您的留言。工贸的粉尘涉爆企业应按照《工贸企业粉尘防爆安全规定》（应急管理部令第6号）进行管理，收集铝粉的除尘器应符合相关标准的要求。企业可根据粉尘产生的有关实际情况，评估确定粉尘爆炸危险场所安全风险等级，制定并落实管控措施。目前不允许采用非防爆室内小型除尘器，您的建议我们会在制修订标准中进行考虑。","consultTime":"2021-09-08","replyTime":"2021-09-15","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-34","title":"火力发电厂是否需要依据新出的工贸企业粉尘防爆规定开展工作？","consult":"火力发电厂是否需要依据新出的工贸企业粉尘防爆规定开展工作？","reply":"感谢您的留言。《工贸企业粉尘防爆安全规定》（应急管理部令第6号）不适用于火力发电企业。","consultTime":"2021-08-03","replyTime":"2021-08-10","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-35","title":"粉尘粒径大于目录规定值是否仍属涉爆粉尘？","consult":"您好！《工贸行业重点可燃性粉尘目录2015版》的条款中静电喷涂粉末中位粒径为17.3µm，比这个数大了是涉爆粉尘呢，还是比它小了是呢？如果中位粒径是35µm，那属于涉爆粉尘吗？","reply":"感谢您的留言。《工贸行业重点可燃性粉尘目录（2015版）》所列粉尘仅限于冶金、有色、建材、机械、轻工、纺织、烟草、商贸等行业企业生产加工所涉及的爆炸危险性相对较高的重点可燃性粉尘。你所提及的粉尘是否涉爆请自行收集样品送请有关单位实验验证是否具备可爆性。","consultTime":"2021-11-28","replyTime":"2021-12-03","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-36","title":"机械加工行业喷涂工序中的塑料粉末是否一定是涉爆粉尘，具体怎么界定？","consult":"我公司属于机械加工行业，生产汽车零部件，喷涂工序中使用塑料粉末，请问塑料粉末是否一定为涉爆粉尘，如果不一定，请问如何分析界定。","reply":"感谢留言。你单位可请具备相应能力的检测检验机构（通过国家检测检验机构认证即CMA认证，认定证书范围内包括粉尘可爆性判定或粉尘爆炸性测试的内容，具体名单可在国家市场监管总局有关网站查询）进行粉尘可爆性判定或粉尘爆炸性测试等检测测试。如测试属于可爆粉尘，应按照《工贸企业粉尘防爆安全规定》（应急管理部第6号令）等相关文件进行管理。","consultTime":"2022-05-12","replyTime":"2022-05-19","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-37","title":"注塑粉碎粉尘是否受《工贸企业粉尘防爆安全规定》管辖？","consult":"汽车零部件或内饰件生产企业,通常都会对不良品进行切割、粉碎后回收添加使用,在粉碎过程中,会产生粉尘,请教此过程产生的粉尘如何界定其风险属性及粉爆限值，使用何种处理工艺会更好地防范粉爆,塑胶粉碎的粉尘是否受《工贸企业粉尘防爆安全规定》管辖。","reply":"感谢您的留言。汽车零部件生产由于工艺和材质不同，粉碎过程中产生的粉尘，其粉尘爆炸属性需要你单位自行采样，通过实验测试得出。塑料制品业适用于《工贸企业粉尘防爆安全规定》。","consultTime":"2021-08-31","replyTime":"2021-09-07","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-38","title":"木制品切割粉尘，是否应该按照粉尘防爆规定进行管理？","consult":"家具加工行业，涉及木制品切割粉尘，粉尘颗粒大小明显不属于可燃粉尘目录2015年版中对木粉尘的规定，是否需要进行粉尘爆炸性检测，还是可以直接不认定为涉爆粉尘场所？","reply":"感谢您的留言。切割木粉尘为可燃性粉尘，应按照粉尘防爆相关规定进行管理。","consultTime":"2021-09-18","replyTime":"2021-09-24","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-39","title":"皮革行业磨革粉尘是否属于涉爆粉尘？","consult":"您好，我工业园区监管范围内有数家皮革企业，皮革企业磨革工序在皮革的粒面层或肉面层磨出均匀细致的绒毛会产生磨革粉尘湿度约12.3，磨革粉尘不在《工贸行业重点可燃性粉尘目录》2015版里。想咨询一下，皮革行业磨革粉尘是否涉爆。谢谢，等候您的回复。","reply":"感谢您的留言。《工贸行业重点可燃性粉尘目录（2015版）》所列粉尘仅限于冶金、有色、建材、机械、轻工、纺织、烟草、商贸等行业企业生产加工所涉及的爆炸危险性相对较高的重点可燃性粉尘。你单位皮革粉尘是否涉爆请自行收集样品送请有关单位实验验证是否具备可爆性。","consultTime":"2021-11-25","replyTime":"2021-12-01","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-40","title":"皮革鞣制、拉伸、磨革工艺产生的粉尘是否属于涉爆粉尘，应如何管理？","consult":"《轻工行业较大危险因素辨识与防范指导手册》2016版皮革鞣制加工中拉伸磨革部分将磨革机、磨革车间较大危险因素确定为容易引起粉尘爆炸，存在伤亡扩大的危险。但是①《工贸行业重点可燃性粉尘目录2015版》中无皮革粉尘②《皮革机械辊式往复运动机械 安全要求》GBT30405附录D,表D.1-磨革机重大危险清单也未将皮革粉尘列入。皮革鞣制加工磨革机、磨革车间是否按照《粉尘防爆安全规程》管理？","reply":"感谢您的留言。皮革鞣制拉伸磨革粉尘为可燃性粉尘，应按照粉尘防爆相关规定进行管理。","consultTime":"2021-09-17","replyTime":"2021-09-24","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-41","title":"移动式布袋除尘器是否属于除尘系统？","consult":"领导您好！根据GB15577-2018《粉尘防爆安全规程》中第3.10条除尘系统的定义，移动式布袋除尘器是否满足除尘系统的定义？视为除尘系统的一种？","reply":"感谢您的留言。根据《粉尘防爆安全规程》（GB15577-2018）第3.10条除尘系统定义为由吸尘罩、风管、除尘器、风机及控制装置组成的用于捕集气固两相流中固体颗粒物的系统。移动式布袋除尘器不属于除尘系统。","consultTime":"2021-09-05","replyTime":"2021-09-13","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-42","title":"国家层面能否出台符合粉尘涉爆的除尘系？","consult":"粉尘涉爆专项整治多年，也组织多次培训，但受专业和能力限制，基层和企业执行效果不好，在国家层面能否出台符合粉尘涉爆的除尘系统产品目录或产品供货商，方便企业整改。","reply":"感谢您的留言。国家对涉及可燃性粉尘的除尘系统有明确的标准规范要求，企业在整改时应要求除尘系统供应商提供产品符合标准规范要求。","consultTime":"2021-01-21","replyTime":"2021-01-25","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-43","title":"添加阻燃剂后是否还需第三方鉴定才能认定为非燃爆环境？","consult":"我们是一家工程塑料粒子生产企业，聘请安评公司编制现状评价过程中，安评人员要求我们必须出具ABS树脂颗粒不具有燃爆性的第三方检测报告。我们的工艺的塑料颗粒混料后热熔挤出再进行切粒，切粒后为2mm圆形柱颗粒，在混料时添加阻燃剂。请问这种情况下是否能够认定为我们涉及可燃性粉尘场所的燃爆环境。是否必须做第三方技术鉴定后才能认为通过增加阻燃剂后产品没有燃爆性。","reply":"感谢您的留言。爆炸性环境是指在大气条件下,可燃性粉尘与气态氧化剂（主要是空气）形成的混合物被点燃后，能够保持燃烧自行传播的环境。涉及的粉尘是否为可燃性粉尘可以通过查询国家公布的重点可燃性粉尘目录、相关国家标准规范或请具备相应能力的检测检验机构（通过国家检测检验机构认证即CMA认证，认定证书范围内包括粉尘可爆性判定或粉尘爆炸性测试的内容，具体名单可在国家市场监管总局有关网站查询）进行粉尘可爆性判定或粉尘爆炸性测试等检测测试。","consultTime":"2022-01-08","replyTime":"2022-01-14","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-44","title":"茶叶、咖啡加工产生的粉尘是否为可燃性粉尘？","consult":"在《工贸行业重点可燃性粉尘目录2015版》中，茶叶粉尘和咖啡粉尘未列其中，所以在对相关企业实施检查时，专家说这两类属于可燃性粉尘，但相关企业提出了质疑，其理由是国家没有具体规定该两类粉尘属于可燃性粉尘，他们干了几十年也从未听说过哪家企业发生过粉尘爆炸事故，但我们曾做过实验，茶叶、咖啡粉尘能够点燃，我们按照《工贸企业粉尘防爆安全规定》和《粉尘防爆安全规程》对相关企业实施检查到底是对是错？","reply":"感谢您的留言。《工贸行业重点可燃性粉尘目录2015版》只是归纳了重点可燃性粉尘。茶叶、咖啡粉尘属于可爆性粉尘，相关企业要按照《工贸企业粉尘防爆安全规定》和《粉尘防爆安全规程》进行管理。","consultTime":"2022-03-18","replyTime":"2022-03-25","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-45","title":"颗粒饲料（油性、粘结）企业成品库（包装）是否应划为22区？","consult":"GB19081-2008饲料加工系统粉尘防爆安全规程7.1饲料粉尘爆炸危险场所的划分中将成品库（包装）列为22区。而企业实际包装的成品为颗粒状（油性、粘结），不具粉尘爆炸危险性。个人认为应根据企业实际划为非危险区。","reply":"感谢您的留言。《饲料加工系统粉尘防爆安全规程》（GB 19081-2008）适用于饲料加工系统粉尘防爆的设计、施工、运行和管理。颗粒饲料在本标准适用范围内，应符合本标准的要求。","consultTime":"2021-01-28","replyTime":"2021-01-29","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-46","title":"饲料加工企业除尘器泄爆措施可否用泄爆片代替无焰泄爆？","consult":"饲料加工企业在车间混合机和粉碎机部位一般都有配套的除尘器，请问这类除尘器的泄爆措施是必须要上无焰泄爆装置还是上泄爆片就可以呢？","reply":"感谢您的留言。按照《粉尘防爆安全规程》（GB 15577-2018）第7.3.3条 不能通过泄压导管向室外泄爆的室内容器设备，应安装无焰泄爆装置。","consultTime":"2021-07-31","replyTime":"2021-08-06","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-47","title":"GB 30871-2022动火作业升级管理如何执行？","consult":"GB30871-2022中动火作业升级管理描述为：“遇节假日、重点时段或其他特殊情况，动火作业应升级管理。”跟2014版相比，略去了“夜间”这一要求。请问，夜间动火作业还需要升级管理吗？还有，这里的重点时段该如何理解呢？","reply":"建议咨询标准起草单位。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-07-12","replyTime":"2022-07-13","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-48","title":"GB30871《化学品生产单位特殊作业安全规范》动火时间如何填写？","consult":"GB30871《化学品生产单位特殊作业安全规范》，样表《动火安全作业证》中动火时间自 年 月 日时分始至 年 月 日时分止，应该填写计划动火作业时间，还是填写实际动火作业的开始时间和动火作业的结束时间。","reply":"感谢您对危化品安全生产工作的关心关注。根据《中华人民共和国标准化法》《全国专业标准化技术委员会管理办法》等有关法规规定，有关解释工作请咨询标准起草单位中国化学品安全协会（联系电话010-64463992）。","consultTime":"2022-03-23","replyTime":"2022-03-24","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-49","title":"工贸企业有无类似危化企业GB 30871的标准？","consult":"危化企业有GB30871，工贸企业用哪个标准？如没有能否尽快出台个管理制度办法或规范？","reply":"目前未发布工贸企业危险作业安全生产标准，具体可执行相关行业专业安全生产标准。","consultTime":"2021-01-14","replyTime":"2021-01-18","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-50","title":"如何利用成熟结构技术实现决口快速封堵？","consult":"现在决口封堵技术都是传统的单体大型重物封堵，效率低下不用多说，而利用钢管形成空间框架后抛石方案在98年成功应用，当时是人工在决口上搭设，所以效率低下，现在可以在岸上整体搭设成比决口更宽、长数十数钢管支架，尔后用直升机一次吊装到决口上游，依靠决口-2侧岸堤支撑长于决口宽度的框架，框架不会被冲走，接下来抛石就会固定了！","reply":"首先感谢您对防汛抢险工作的关心和支持。目前我国堤防溃口封堵中多数应用砼四面体、沙袋、铅丝石笼、土方等传统物料，这些物料有储运量大、投料方便等特点。根据实际情况，也综合采用植入竹木桩、钢管桩等骨架，再填充沙袋、土石，最后合龙闭气等联合封堵方法。目前我们正在联合工业和信息化部、科学技术部开展防汛抢险急需技术装备揭榜攻关，推动决口溃堤封堵处置成套技术和装备体系研发生产，为防汛抢险提供有力核心技术装备保障。","consultTime":"2021-07-26","replyTime":"2021-07-29","dept":"防汛抗旱司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-51","title":"危化企业中塑料热熔或者塑料焊接属于动火作业吗？","consult":"请问危化企业中塑料热熔或者塑料焊接属于动火作业吗？","reply":"根据《危险化学品企业特殊作业安全规范》3.4条，动火作业指在直接或间接产生明火的工艺设施以外的禁火区内从事可能产生火焰、火花或炽热表面的非常规作业。包括使用电焊、气焊（割）、喷灯、电钻、砂轮、喷砂机等进行的作业。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-04-12","replyTime":"2022-04-15","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-52","title":"GB 30871-2014等有关文件中的安全设施如何理解？","consult":"在许多文件如GB30871-2014中提到安全设施，请问安全设施的范围有哪些？从哪个标准中查询到？","reply":"感谢您对危险化学品安全生产工作的关心关注。根据《中华人民共和国标准化法》《全国专业标准化技术委员会管理办法》等有关法规规定，有关解释工作请咨询标准起草单位中国化学品安全协会（联系电话010-64463992）。","consultTime":"2022-04-28","replyTime":"2022-04-28","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false,"_annotation":"【注释】①原答复时间为GB 30871-2022发布前（该标准已于2022年3月15日发布，2022年10月1日实施，替代了GB 30871-2014）。②现行有效的GB 30871-2022《危险化学品企业特殊作业安全规范》适用范围：危险化学品生产、经营（带储存）企业，化工及医药企业。核心要求涵盖：动火作业、受限空间作业、盲板抽堵作业、高处作业、吊装作业、临时用电作业、动土作业、断路作业等8类特殊作业的安全管理要求。③主要变化（2022版 vs 2014版）：特级动火和受限空间作业全程视频监控、动火分析时间间隔由2小时调整为1小时、增加了“作业交底”要求、强化了监护人职责。④非危化品企业虽不强制适用，但其特殊作业分级管理框架和安全措施具有通用参考价值。\n【依据】GB 30871-2022《危险化学品企业特殊作业安全规范》"},{"id":"3-53","title":"工贸企业机械行业特殊作业安全规范是否适用GB 30871-2022？","consult":"请问工贸企业机械行业特殊作业安全规范是否适用GB30871-2022 危险化学品企业特殊作业规范？企业根据生产工艺会使用一定量的危险化学品如环己烷、二甲基甲酰胺、甲酚等。谢谢！","reply":"感谢您的留言。《危险化学品企业特殊作业安全规范》（GB30871-2022）不适用于工贸行业。","consultTime":"2022-05-03","replyTime":"2022-05-10","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-54","title":"施工现场涉及高处、动火等作业是否按GB30871标准执行特殊作业管理？","consult":"请问：GB30871-2014规定了化学品生产单位设备检维修中特殊作业安全管理规定，那么，一个新成立的危险化学品生产、使用的企业或新的独立的工程建设项目，在项目施工建设期间，施工现场也涉及高处、动火等作业，是否按GB30871标准执行特殊作业管理？如果不是，那又执行什么标准，作业过程中该办理什么作业票证？谢谢！","reply":"感谢您的留言，请咨询标准编制单位。","consultTime":"2021-09-14","replyTime":"2021-09-18","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-55","title":"机械制造企业动火作业应遵循哪个标准或规范，分为几级动火，动火时长怎么确定？","consult":"机械制造企业动火作业应遵循哪个标准或规范，分为几级动火，动火时长怎么确定？","reply":"感谢您的留言。机械行业动火作业无行业标准或规范。","consultTime":"2021-08-17","replyTime":"2021-08-24","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-56","title":"特殊作业批准是否允许授权？","consult":"化学品生产单位特殊作业安全规范新版生效后，特殊作业批准允许授权吗？","reply":"感谢您对危化品安全生产工作的关心关注。根据《中华人民共和国标准化法》《全国专业标准化技术委员会管理办法》等有关法规规定，有关解释工作请咨询标准起草单位中国化学品安全协会（联系电话010-64463992）。","consultTime":"2022-05-05","replyTime":"2022-05-07","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-57","title":"特殊动火签批人主管厂长或总工程师是否为主要负责人和安全生产总监？","consult":"gb30871-2014版中，特殊动火审批为：主管厂长或总工程师，我们公司实际是主要负责人，还有两位安全和生产总监，没有总工，请问主要负责人、安全总监、生产总监是否能审批特殊动火？","reply":"感谢您的留言，请咨询标准编制单位。","consultTime":"2021-09-17","replyTime":"2021-09-23","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false,"_annotation":"【注释】①机械制造行业确实没有专门针对动火作业的行业标准。但企业不能因此认为动火作业安全管理无章可循——动火作业属于特殊作业的通用类型，可参照以下标准执行：②GB 30871-2022《危险化学品企业特殊作业安全规范》——虽然是危化品行业标准，但其动火作业分级管理（特级/一级/二级动火）、作业票管理、气体检测、监护人制度等通用要求具有很强的参考价值。③《机关、团体、企业、事业单位消防安全管理规定》（公安部令第61号）第二十条规定：单位应当对动用明火实行严格的消防安全管理，办理动火审批手续。此要求适用于所有单位。④企业应结合实际自行制定动火作业管理制度（参照GB 30871框架），明确动火分级标准、审批流程、现场监护人职责、可燃气体检测频次等——这是安全生产标准化的基本要求。\n【依据】GB 30871-2022；公安部令第61号第20条"},{"id":"3-58","title":"《安全生产法》中第三十三条中安全设备应如何定义？","consult":"安全设备的维护、保养，定期检测，安全设备具体有哪些？设备上的安全附件如光栅、双手开关、安全阀等属于安全设备吗？","reply":"全国人大常委会法工委与原国家安全生产监督管理总局共同编写的《中华人民共和国安全生产法释义》一书对此问题有所解释。安全设备主要是指为了保护从业人员安全、防止生产安全事故发生以及在发生生产安全事故时用于救援而安装使用的机械设备和器械，如矿山使用的自救器、灭火设备以及各种安全检测仪器，包括安全检测系统、瓦斯检测器、测风表、氧气检测仪、顶板压力检测仪等。","consultTime":"2021-06-10","replyTime":"2021-07-21","dept":"政策法规司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-59","title":"《安全生产法》所指的安全设备应如何理解和适用？","consult":"请问安全生产法中所指的安全设备有没有具体解释或示例。","reply":"全国人大常委会法工委与应急管理部共同编写的《中华人民共和国安全生产法释义》一书对此问题有所解释。安全设备，主要指为了保护从业人员等生产经营活动参与者的安全，防止生产安全事故发生以及在发生生产安全事故时用于救援而安装使用的机械设备和器械，如矿山使用的自救器、灭火设备以及安全检测系统、瓦斯检测器、测风仪表、氧气检测仪、顶板压力监测仪器等各种安全检测仪器。","consultTime":"2021-04-21","replyTime":"2021-07-21","dept":"政策法规司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-60","title":"危险化学品经营企业能否在试生产结束后销售试生产期间生产产品？","consult":"四川省某企业二氧化碳气体分装项目安全设施施工完成后，试生产期间产品未销售完毕，试生产结束后继续销售165瓶。 请问安监总厅管三函〔2012〕100号答复危险化学品生产企业销售试生产期间产品，是否适用于危险化学品经营企业？四川省安监局 工商局川安监〔2012〕178号规定，试生产期间属于合法行为，企业在试生产结束后继续销售试生产期间未销售完产品的行为，应急部门是否应作为无危化经营许可证查处？","reply":"您好，依据《危险化学品建设项目安全监督管理办法》有关规定，建设项目试生产期限应当不少于30日，不超过一年。依据《危险化学品经营许可管理办法》有关规定，未取得经营许可证，任何单位和和个人不得经营危险化学品。","consultTime":"2022-02-25","replyTime":"2022-02-28","dept":"危化监管二司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-61","title":"安全帽超过有效期但外观完好，能否继续使用？","consult":"尊敬的领导您好！我是企业安全管理员，目前我们在对安全帽的管理存在一些疑惑盼回复。根据国标安全帽的材质来看使用期限一般有30个月不等，那么使用期限到期后，安全帽依然是完好的能否使用，有无相关国家标准的具体条款。谢谢？","reply":"强制性国家标准GB 2811-2019《头部防护安全帽》第7.2条款规定了安全帽的制造商应在产品永久标识中明示产品的强制报废期限，即当安全帽到达该期限后应进行报废处理；同时，7.3条款规定了安全帽的制造商应提供安全帽的报废判别条件和使用期限。","consultTime":"2021-06-03","replyTime":"2021-06-28","dept":"政策法规司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-62","title":"《工贸行业较大危险因素辨识与防范指导手册（2016版）》是否属于现行有效在用规定？","consult":"1. 咨询《工贸行业较大危险因素辨识与防范指导手册（2016版）》是否属于现行有效在用规定？2. 上述规定里的机械行业较大危险因素辨识与防范指导手册内第七部分电器设备里的配电箱如何判定，该配电箱所指的范围和类型是什么？（根据生产法三十二条应当在有较大危险因素的生产经营场所和有关设施、设备上，设置明显的安全警示标志，依据生产法96条第一项应该处罚5万)。","reply":"感谢您的留言。《工贸行业较大危险因素辨识与防范指导手册（2016版）》不属于规定，供企业开展较大危险辨识与防范参考使用。","consultTime":"2021-04-09","replyTime":"2021-04-12","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-63","title":"GB/T是否可以作为处罚标准？","consult":"安法内容：对未为从业人员发放符合国家标准和行业标准！劳动防护用品的行为，是处罚项。而目前，只有GB/T11651是针对劳动防护用品的标准规范。请问：可以用GB/T来作为处罚项吗？这个问题同样也用于安法其他罚则。因为标准化法里，国家标准就包括强制性和推荐性。请给予解答，目前基层备受困扰，罚了怕诉讼，不罚怕追责！谢谢！","reply":"2020年12月，国家标准化管理委员会发布了强制性国家标准GB 39800.1-2020《个体防护装备配备规范 第1部分：总则》，该标准内容已全部代替了GB/T 11651-2008《个体防护装备选用规范》和GB/T 29510-2013《个体防护装备配备基本要求》，并于2022年1月1日正式实施。“未为从业人员提供符合国家标准或者行业标准的劳动防护用品的”，依据新《安全生产法》第九十九条处罚。","consultTime":"2021-03-17","replyTime":"2021-06-28","dept":"政策法规司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-64","title":"新投产危化品项目从何时起算首次安全现状评价周期？","consult":"新投产的危险化学品建设项目，请问是从投产试运行开始3年做安全现状评价么，还是从安全设施竣工验收通过后3年，或者有其他时间要求。","reply":"依据《危险化学品建设项目安全监督管理办法》（国家安全生产监督管理总局令第45号）第二十五条规定，油气长输管道建设项目试生产期间，建设单位应当按照本办法的规定委托有相应资质的安全评价机构对建设项目及其安全设施试生产（使用）情况进行安全验收评价。依据《危险化学品安全管理条例》第二十二条规定，生产、储存危险化学品的企业，应当委托具备国家规定的资质条件的机构，对本企业的安全生产条件每3年进行一次安全评价，提出安全评价报告。","consultTime":"2022-04-07","replyTime":"2022-05-18","dept":"危险化学品安全监督管理二司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-65","title":"自收自支科研事业单位是否属于《安全生产法》的适用范围？","consult":"安全类法律法规如：《安全生产法》、《生产经营单位培训规定》、《建筑项目安全设施三同时管理办法》等大多都是适用于生产经营单位，请问专门从事科研的自收自支事业单位没有生产和经营活动适用么？","reply":"《安全生产法》第二条规定，“在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法”。依照本条规定，《安全生产法》适用的主体范围，是指一切合法或者非法从事生产经营活动的企业、事业单位和个体经济组织以及其他组织，不论其性质如何规模大小，只要是在中华人民共和国领域内从事生产经营活动，都应遵守《安全生产法》的各项规定。事业单位是否适用《安全生产法》，要看其是否从事生产经营活动。","consultTime":"2021-06-14","replyTime":"2021-07-21","dept":"政策法规司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-66","title":"DCS控制室值班人数最低要求是多少？","consult":"关于化工企业的DCS控制室值班人员最低人数要求是多少，并非消防控制室的人数。是否有法律依据明确规定了？","reply":"《石油化工控制设计规范》（SH/T3006-2012）、《控制室设计规范》(HG/T20508-2014)等标准规范未对企业DCS控制室值班人员数量做出要求，企业应结合DCS控制室操作站数量等实际情况，按需配置DCS控制室值班人员。考虑现实情况，DCS控制室操作人员最少不应少于2人，防止出现无人盯岗情况。感谢您对危险化学品安全生产工作的关心关注。","consultTime":"2022-03-12","replyTime":"2022-03-17","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-67","title":"高空作业吊篮是否必须要求安装人员获得高空作业吊篮安转拆除证？","consult":"涉及高空作业吊篮的安装，人员所持高处安装、维护、拆除作业可以吗？还是必须是要城建局发的高空作业吊篮安转拆除证。","reply":"感谢您的留言。《高处安装、维护、拆除作业人员安全技术培训大纲和考核标准》中包括座板式单人吊具、高处作业吊篮、移动式高处作业平台（车）、建筑升降机等内容。持有高处安装、维护、拆除作业特种作业操作证可进行高空作业吊篮的安装。","consultTime":"2021-05-10","replyTime":"2021-05-17","dept":"安全执法和工贸监管局","chapter":"危险化学品安全","hasLocalRef":false},{"id":"3-68","title":"中控室是否必须要求24小时安排人员值守吗？","consult":"乙炔生产，瓶装乙炔灌装，每天白天生产4-5小时就生产结束了，在生产结束后或者没有生产的时候，中控室必须24小时安排人员值守吗？如果需要，是根据哪个文件来执行的？","reply":"按照新修改的《安全生产法》第四十一条“生产经营单位应当建立安全风险分级管控制度，按照安全风险分级采取相应的管控措施”，乙炔作为一类易燃气体和A类化学不稳定气体，企业应采取有效措施保证乙炔生产、灌装装置和瓶装乙炔随时处于风险可控状态，因此中控室应保证24小时人员值守。感谢您对危化品安全管理工作的关心和支持。","consultTime":"2021-09-22","replyTime":"2021-09-28","dept":"危化监管一司","chapter":"危险化学品安全","hasLocalRef":false},{"id":"4-01","title":"《乡镇街道突发事件应急预案编制参考》《村社区突发事件应急预案编制参考》适用范围？","consult":"请问这两个编制参考是否适用于公共卫生和社会安全事件？","reply":"《乡镇（街道）突发事件应急预案编制参考》和《村（社区）突发事件应急预案编制参考》立足为基层单位开展应急预案编制工作提供“菜单式”服务，提出了参考性指导意见。基层单位在编制自然灾害、事故灾难、公共卫生、社会安全等领域应急预案时，可参考借鉴。","consultTime":"2024-01-08","replyTime":"2024-01-17","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-02","title":"应急预案管理办法第三十三条“每半年一次”演练频次具体如何理解和执行？","consult":"领导您好：《生产安全事故应急预案管理办法》第三十三条 “生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案”，我司有18项现场处置方案，并未推行地方标准的情况下，请问一年应当执行多少次现场处置方案的演练？","reply":"您好！您所咨询的问题，涉及演练频次规定和演练组织实施两个方面。首先，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第三十三条，生产经营单位每半年至少组织一次现场处置方案演练，这是对现场处置方案演练频次的最低要求。其次，依据《生产安全事故应急演练基本规范》（AQ/T9007-2019），应急演练按照演练内容分为综合演练和单项演练，按照演练形式分为实战演练和桌面演练，不同类型的演练可相互组合。组织现场处置方案演练，可结合实际灵活安排演练内容和形式。综上，你单位可根据本单位的事故风险特点，统筹考虑确定现场处置方案等各类预案演练的频次，有针对性开展演练，切实提高应急处置能力。","consultTime":"2024-01-19","replyTime":"2024-01-24","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-03","title":"预案编制导则更新后，应当执行2013版还是2020版？","consult":"领导好，《生产经营单位生产安全事故应急预案编制导则》（GBT 29639-2020）于2021年4月1日实施，请问生产经营单位现在编制的话是执行现行标准GBT 29639-2013还是2020版本呀？谢谢。","reply":"标准发布到实施之间时间称为“过渡期”，过渡期内，新旧标准都可以用。现在编制预案，建议参照2020版导则。","consultTime":"2020-11-19","replyTime":"2020-12-02","dept":"安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-04","title":"企业专项预案是有企业主要负责人签发还是由主管负责人签发？","consult":"请问：企业专项预案是有企业主要负责人签发还是由主管负责人签发？","reply":"已电话沟通解答。你好，《生产安全事故应急预案管理办法》第二十四条明确规定“生产经营单位的应急预案经评审或者论证后，由本单位主要负责人签署，向本单位从业人员公布，并及时发放到本单位有关部门、岗位和相关应急救援队伍。”请贵单位根据规定执行预案编制。","consultTime":"2025-10-22","replyTime":"2025-10-27","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-05","title":"专项应急预案是否需要一站一案？","consult":"本公司所辖多座雨水泵站，工艺、工艺参数、设备型号、设备数量、风险源均相同，仅地理位置不同，但均在同一功能区域内，相邻距离不超过5公里范围，现已针对雨水泵站编制有专项应急预案，请问是否需要对每一座雨水泵站编制专项应急预案，即一站一案？此外，如需一站一案，按照专项应急预案演练要求，每半年一次，上述各站均需要每半年组织一次应急演练吗？还是统筹组织？","reply":"已电话沟通解答。您好，根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第六条明确“专项应急预案，是指生产经营单位为应对某一种或者多种类型生产安全事故，或者针对重要生产设施、重大危险源、重大活动防止生产安全事故而制定的专项性工作方案。现场处置方案，是指生产经营单位根据不同生产安全事故类型，针对具体场所、装置或者设施所制定的应急处置措施。依据上述条款，贵单位应针对雨水泵站编制专项预案，针对具体场所的泵站编制现场处置方案。另，《生产安全事故应急预案管理办法》第三十三条规定“生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或专项应急预案演练，每半年至少组织一次现场处置方案演练。”贵单位应结合《生产安全事故应急预案管理办法》和行业、地方的相关规定，根据本单位的事故风险特点确定演练频次，确保演练取得实效。","consultTime":"2024-07-17","replyTime":"2024-07-24","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-06","title":"专项应急预案，是否必须有与之相承接现场处置方案？","consult":"我公司根据法律法规要求找到第三方机构建立了应急预案体系。在体系建立之初，考虑到危化品为比较重要的一项风险点，故按照专项应急预案编制的，请问是否还需要为其编制现场处置方案。","reply":"您好。根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》明确，专项应急预案是指生产经营单位为应对某一种或者多种类型生产安全事故，或者针对重要生产设施、重大危险源、重大活动防止生产安全事故而制定的专项性工作方案。现场处置方案是指生产经营单位根据不同生产安全事故类型，针对具体场所、装置或者设施所制定的应急处置措施。你单位应当按照规定，结合本单位组织管理体系、生产规模和可能发生的事故特点，确立本单位的应急预案体系，编制相应的应急预案。","consultTime":"2026-01-27","replyTime":"2026-02-02","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-07","title":"专项预案和现场处置方案的演练频次各有什么要求？","consult":"《生产安全事故应急预案管理办法》生产经营单位制定应急预案演练计划，…每半年至少组织一次现场处置方案演练。单位根据辨识的风险点编制了多个专项方案触电、物打、坍塌、火灾、爆炸、防汛、防暑、环境、有限空间等等和几十个现场处置方案，是每个现场处置方案每半年都至少演练一次算符合本《办法》最低要求？还是在半年内针对某一现场方案或部分开展至少一次演练算符合《办法》最低要求？半年内全部开展至少一次难度大。","reply":"你好，《生产安全事故应急预案管理办法》（应急管理部令第2号）第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。请正确理解演练的定义，企业应根据自身实际，灵活采用桌面演练、实战演练、专项演练、综合演练等演练形式，有针对性的组织开展应急预案演练，提高应急处置能力。","consultTime":"2023-12-19","replyTime":"2023-12-20","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-08","title":"乡镇政府应急预案体系是否也包括总体、专项预案？","consult":"尊敬的部领导，近期本人学习山东省突发事件总体应急预案，发现预案体系里，总体应急预案由县级以上各级政府制定。参考内蒙古的总体应急预案，也是县级以上制定总体应急预案。特来咨询一下，乡镇政府预案体系是否也是包含总体应急预案，专项应急预案和部门应急预案？是否需要制定乡镇总体应急预案？","reply":"根据《突发事件应急预案管理办法》（国办发〔2013〕101号）第七条规定，总体应急预案是应急预案体系的总纲，是政府组织应对突发事件的总体制度安排，由县级以上各级人民政府制定；第八条规定，乡镇街道专项和部门应急预案侧重明确突发事件的预警信息传播、组织先期处置和自救互救、信息收集报告、人员临时安置等内容，重点规范乡镇层面应对行动，体现先期处置特点。","consultTime":"2022-02-21","replyTime":"2022-02-25","dept":"救援协调和预案管理局","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-09","title":"已编制突发事件应急预案，是否还需单独编制生产安全事故应急预案？","consult":"领导您好，咨询一下，企业单位编制了突发事件应急预案，包含了防汛专项预案、地震专项应急预案、食品安全专项应急预案、防恐防暴专项应急预案、生产安全事故专项应急预案和生产安全事故现场处置方案，还需要再单独编制生产安全事故应急预案吗？感谢回复，谢谢！","reply":"你好。《生产安全事故应急预案管理办法》（应急部令第2号）第十二条明确规定“生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案”。第十三条至第十七条进行了具体说明。你单位可结合地方有关规定参照执行。","consultTime":"2025-05-15","replyTime":"2025-05-21","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-10","title":"企业日常应急演练是否需要按AQ9012-2023开展评估？","consult":"企业按计划开展的生产安全事故综合预案演练、生产安全事故专项预案演练及生产安全事故现场处置方案演练是否需要按照7月1日实施的《生产安全事故应急救援评估规范》AQ9012 -2023开展企业应急救援评估？","reply":"已电话沟通解答。您好，《生产安全事故应急救援评估规范》（AQ 9012-2023）主要适用于依法成立的事故调查组所开展的较大及以上生产安全事故应急救援评估工作。企业开展生产安全事故应急演练，不需要按照该标准开展应急救援评估，可参照《生产安全事故应急演练基本规范》（AQ/T 9007-2019）和《生产安全事故应急演练评估规范》（AQ/T 9009-2015）开展演练评估工作。","consultTime":"2024-06-11","replyTime":"2024-06-13","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-11","title":"是否所有专项预案每年、所有现场处置方案每半年都必须演练一次？","consult":"法规要求，生产经营单位应当制定本单位的应急预案演练计划，根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练，每半年至少组织一次现场处置方案演练。那这个次数范围是公司所有的综合及专项应急预案都要每年至少一次，所有的现场处置方案都要每半年至少一次嘛？","reply":"你好，《生产安全事故应急预案管理办法》（应急部令第2号）第三十三条对生产经营单位应急预案演练次数进行了规定，这是对演练频次的最低要求。请正确理解演练的定义，综合预案、专项预案和现场处置方案的演练可以同时开展。企业应根据自身实际，结合地方有关规定，灵活采用桌面演练、实战演练、专项演练、综合演练等形式，有针对性的组织开展应急预案演练，提高应急处置能力。","consultTime":"2023-10-25","replyTime":"2023-10-27","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-12","title":"企业涉及多个厂房，应急预案备案函是否需要根据厂房个数进行多个备案？","consult":"领导，您好。咨询一下，企业如果有2个厂房，前期因厂房建立时间有差异，就厂房分别进行了安全事故应急预案备案函，目前其中一个厂房备案函快到期，另一个厂房备案函未到期，请问是否能等另一个厂房备案函到期前，两个厂房合并进行一套安全事故应急预案备案就可以，无需多个厂房分别编制应急预案和备案？感谢回复，谢谢！","reply":"已电话沟通解答。您的问题首先要明确应急预案的编制和修订工作流程。《生产安全事故应急预案管理办法》（应急部令第2号）第十二条明确规定“生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案”。第十三条至第十七条进行了具体说明。备案工作请按照《生产安全事故应急预案管理办法》，并结合你单位预案体系实际情况，同时参照地方有关规定执行。","consultTime":"2025-09-17","replyTime":"2025-09-24","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-13","title":"多生产环节的工厂各环节是否需单独编制应急预案？","consult":"公司集团下属工厂多个二级厂，无独立法人，涉及多个不同的生产环节涉及主要危害因素不同，工厂是否需要单独编制生产安全事故应急预案？","reply":"已电话沟通解答。您好，《生产安全事故应急预案管理办法》（根据应急管理部令第2号修正）规定生产经营单位应急预案分为综合应急预案、专项应急预案和现场处置方案。生产经营单位应当根据有关法律、法规、规章和相关标准，结合本单位组织管理体系、生产规模和可能发生的事故特点，与相关预案保持衔接，确立本单位的应急预案体系，编制相应的应急预案。贵单位应结合集团下属工厂的实际编制生产安全事故应急预案，如所在行业和地方另有规定的请遵照规定执行。","consultTime":"2024-08-23","replyTime":"2024-08-30","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-14","title":"2020版应急预案编制导则中应急救援协议有什么具体要求？","consult":"根据最新的预案编制导则2020版，附件要求必须付有应急救援协议，一般的工贸行业需要和外部的救援队伍签署协议吗？如需签署应该和怎样的救援队伍签署？","reply":"关于企业建立应急救援队伍或与邻近救援队伍签订救援协议的要求，《生产安全事故应急条例》第十条有明确规定。与邻近救援队伍签订救援协议的目的是为了弥补本企业救援能力不足，企业与什么样的救援队伍签订协议要根据本企业具体情况而定。","consultTime":"2021-03-18","replyTime":"2021-03-23","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-15","title":"GBT 29639-2020《生产经营单位生产安全事故应急预案编制导则》如何理解和适用？","consult":"导则附录B中，B.1 单位内部应急资源，“按照应急资源的分类，分别描述应急资源的基本现状”中应急资源的分类标准是什么，参照什么标准来分类，请帮忙答疑，谢谢？","reply":"应急管理部目前尚未针对应急资源制订统一的标准规范。应急物资和装备分类可以参考《应急物资分类及编码》（GB/T38565-2020）。","consultTime":"2022-04-08","replyTime":"2022-04-14","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-16","title":"GBT 29639应急预案编制导则主要内容和注意事项是什么？","consult":"领导您好   GBT29639导则中，响应启动包括有应急会议召开，该项工作在企业应急预案中是否必须要体现出来；因为企业发生安全生产事故后，企业主要负责人收到事故报告后，肯定是第一时间协调资源，组织各部门进行现场处置，如果还要组织应急会议，可能会影响到救援时机。如果该项工作必须要涉及，那这个会议的召开的时机应在何时，比如，收到事故报告后就要开会？还是事故被控制后再召开？那会议的主要内容要怎么描述呢。","reply":"已电话沟通解答。您好！《生产经营单位生产安全事故应急预案编制导则》（GB/T 29639-2020）是推荐性标准，该标准中关于应急会议召开的内容非强制性要求。响应启动后，召开应急会议的主要目的是迅速组织相关部门和人员了解情况，评估形势和影响，高效有序进行信息共享、资源调配、行动计划落实等。应急会议可以在会议室召开、在事故现场召开或采用视频等形式召开。你单位编制应急预案，应结合本单位组织管理体系、生产规模和可能发生的事故特点等实际情况，明确响应启动后是否召开、何时召开、如何召开应急会议等相关内容。","consultTime":"2024-12-13","replyTime":"2024-12-17","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-17","title":"关于安全生产中生产经营单位如何定义？","consult":"您好，关于安全生产中生产经营单位的定义有些疑惑，所谓的生产经营单位是否仅仅是生产和经营的单位，对于销售单位有独立的仓库的单位《安全生产法》是否适用，如主要负责人取得安全管理证，配备专职或兼职的安全管理人员以及法律法规要求的培训、检查、应急预案的编制及演练等等。","reply":"《安全生产法》第二条规定，“在中华人民共和国领域内从事生产经营活动的单位（以下统称生产经营单位）的安全生产，适用本法”。依照本条规定，《安全生产法》适用的主体范围，是指一切合法或者非法从事生产经营活动的企业、事业单位和个体经济组织以及其他组织，不论其性质如何规模大小，只要是在中华人民共和国领域内从事生产经营活动，都应遵守《安全生产法》的各项规定。","consultTime":"2021-06-15","replyTime":"2021-07-21","dept":"政策法规司","chapter":"烟花爆竹安全","hasLocalRef":false},{"id":"4-18","title":"一般微型工贸企业、小型工贸企业和中型工贸企业是否有要求生产安全事故应急预案备案？","consult":"根据生产安全事故应急预案备案管理办法，仅对个别企业要求进行备案，请问一般的微型工贸企业、小型工贸企业和中型工贸企业是否有要求备案，如无要求是否可以不用备案？","reply":"您好！应急管理部规章《生产安全事故应急预案管理办法》第二十六条对危险性比较大的单位和人员密集场所经营单位的应急预案备案工作进行了具体规定。同时，该《办法》第四条第二款规定，县级以上地方各级人民政府应急管理部门负责本行政区域内应急预案的综合协调管理工作。县级以上地方各级人民政府其他负有安全生产监督管理职责的部门按照各自的职责负责有关行业、领域应急预案的管理工作。一般的微型工贸企业、小型工贸企业和中型工贸企业，应结合落实本行业和所在地方的有关规定要求，开展预案备案工作。","consultTime":"2025-01-15","replyTime":"2025-01-20","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":true},{"id":"4-19","title":"已按GBT 29639编制火灾专项预案，是否还需按GBT 38315编制？","consult":"目前有《生产经营单位生产安全事故应急预案编制导则》GBT 29639-2020和《社会单位灭火和应急疏散预案编制及实施导则》GBT38315-2019两个导则。对于石化企业已按照GBT 29639编制火灾专项预案，是否还需要按GBT38315编制灭火和疏散预案？另外，两个导则在条款要素、响应分级、组织机构等方面存在不同的要求，如果同时执行两个导则会形成两个不同的预案体系，该如何协调？","reply":"《生产经营单位生产安全事故应急预案编制导则》GB/T 29639-2020规定了生产经营单位生产安全事故应急预案的编制程序、体系构成和综合应急预案、专项应急预案、现场处罝方案的主要内容以及附件信息，是为生产经营单位应急预案编制提供依据和指南。《社会单位灭火和应急疏散预案编制及实施导则》GB/T38315-2019以国家标准的形式明确了社会单位灭火和应急疏散预案编制和演练的具体要求。两个标准均为推荐性标准，请结合企业实际和地方有关规定，参照《突发事件应急预案管理办法》（国办发〔2013〕101号）《生产安全事故应急预案管理办法》（应急管理部令第2号）确定你单位预案体系。","consultTime":"2023-07-27","replyTime":"2023-08-01","dept":"国家安全生产应急救援中心","chapter":"烟花爆竹安全","hasLocalRef":false,"_annotation":"【注释】①两个标准的定位不同：GB/T 29639-2020《生产经营单位生产安全事故应急预案编制导则》是应急预案编制的通用标准，适用于各类生产安全事故（含火灾）；GB/T 38315-2019《社会单位灭火和应急疏散预案编制及实施导则》是专门针对灭火和应急疏散的专项标准，适用对象为“社会单位”（机关、团体、企业、事业单位）。②对一般生产经营单位而言：火灾专项预案已按GB/T 29639编制的，内容涵盖了灭火和应急疏散的，可以不再单独按GB/T 38315重新编制。但建议对照GB/T 38315检查火灾专项预案是否覆盖了其核心要素（如灭火行动、通信联络、疏散引导、安全防护救护等分组和职责）。③对消防安全重点单位：建议以GB/T 38315为主要依据编制灭火和应急疏散预案，因为该标准对消防演练频次、演练评估等有更细致的规定，更符合消防部门的检查要求。④两个标准均为推荐性标准（GB/T），不具有强制性。\n【依据】GB/T 29639-2020；GB/T 38315-2019"},{"id":"4-20","title":"是否所有企业都需要编制应急预案并完成备案工作？","consult":"是否所有企业都需要编制应急预案并完成备案工作？我们属于小型服务企业，非生产制造的企业。","reply":"您好！根据应急管理部令第2号修正的《生产安全事故应急预案管理办法》第十二条规定，生产经营单位应当编制相应的应急预案。该《办法》第二十六条对危险性比较大的单位和人员密集场所经营单位的应急预案备案工作进行了具体规定。另，该《办法》第四条第二款规定，县级以上地方各级人民政府应急管理部门负责本行政区域内应急预案的综合协调管理工作。县级以上地方各级人民政府其他负有安全生产监督管理职责的部门按照各自的职责负责有关行业、领域应急预案的管理工作。作为小型服务业企业，应按照《生产安全事故应急预案管理办法》要求，编制相应的应急预案，并结合落实本行业领域管理部门的规定要求，开展预案备案工作。","consultTime":"2024-03-13","replyTime":"2024-03-15","dept":"国家安全生产应急救援中
